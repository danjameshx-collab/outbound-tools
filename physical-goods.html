<title>Physical Goods</title>
<link rel="icon" type="image/png" href="logo.png">
<style id="app-styles">
:root{
  --paper:#FFFFFF; --paper-raised:#FFFFFF; --paper-tab:#FFFFFF;
  --ink:#14181B; --ink-soft:#5B6560; --ink-faint:#757E78;
  --stamp:#1E6B45; --stamp-ink:#FFFFFF;
  --mimeo:#2F8F5B; --mimeo-ink:#E6F4EC;
  --line:#E4E9E6; --line-strong:#CCD5D0;
  --good:#2F8F5B; --warn:#B4691A;
  --tier-mid-bg:#F1EBDC; --tier-mid-ink:#8A6D3B;
  --shadow: 0 1px 0 rgba(20,24,27,.03), 0 8px 20px -12px rgba(20,24,27,.14);
  --shadow-hover: 0 1px 0 rgba(20,24,27,.03), 0 14px 30px -14px rgba(20,24,27,.22);
  --radius: 8px;
  --sidebar-w: 372px;
  --font-display: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Courier New', monospace;
  --ease: cubic-bezier(.2,.7,.3,1);
  --dur-fast: .12s; --dur-base: .18s;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--font-body); font-size:14.5px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column;
}
::selection{background:var(--mimeo); color:var(--mimeo-ink);}
a{color:inherit;}
button{font-family:inherit;}
svg{display:block;}

/* ---------- focus-visible: one consistent keyboard-focus ring app-wide ---------- */
:focus-visible{outline:2px solid var(--stamp); outline-offset:2px; border-radius:4px;}
.quiz-opt:focus-visible, .chip:focus-visible, .size-card:focus-visible, .tpl-card:focus-visible,
.step-item:focus-visible, .msg-card.optional.collapsed:focus-visible, .fe-box:focus-visible{
  outline-offset:2px;
}
.eyebrow{
  font-family:var(--font-display); font-weight:700; text-transform:uppercase;
  letter-spacing:.08em; font-size:11px; color:var(--ink-faint);
}

/* ---------- site topbar: back to Outreach Tools + account ---------- */
.site-topbar-accent{height:4px; background:#231F2E; flex:0 0 auto;}
.site-topbar{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:12px 20px; border-bottom:1px solid var(--line); flex:0 0 auto;
  font-family:var(--font-display);
}
.site-topbar .back-link{
  display:flex; align-items:center; gap:6px;
  color:var(--ink-soft); font-size:13.5px; text-decoration:none; white-space:nowrap;
}
.site-topbar .back-link:hover{color:var(--ink);}
.site-topbar h1{font-size:16px; margin:0; font-weight:700; text-align:center; flex:1 1 auto;}
.site-topbar .who{display:flex; align-items:center; gap:14px; white-space:nowrap;}
.site-topbar .who span{color:var(--ink-soft); font-size:13px; font-family:var(--font-body);}
.site-topbar .signout{
  background:var(--paper); border:1px solid var(--line-strong); border-radius:6px;
  padding:6px 12px; font-size:12.5px; font-weight:600; color:var(--ink); cursor:pointer;
  font-family:var(--font-body);
}
.site-topbar .signout:hover{background:#F7F8F7;}

/* ---------- app shell: full-height sidebar + content ---------- */
#app{
  display:grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  grid-template-areas: "rail main";
  flex:1 1 auto; min-height:0;
  overflow:hidden;
  transition: grid-template-columns .28s var(--ease, ease);
}
#app.rail-collapsed{ grid-template-columns: 0px 1fr; }
#app.rail-collapsed nav#rail{ opacity:0; pointer-events:none; }
@media (max-width: 980px){
  #app{ grid-template-columns: 1fr; grid-template-areas: "main"; }
  #app.rail-collapsed{ grid-template-columns: 1fr; }
  nav#rail{
    position:fixed; inset:0 auto 0 0; width:340px; max-width:88vw; z-index:50;
    transform:translateX(-100%); transition:transform .2s ease;
  }
  nav#rail.open{transform:translateX(0); box-shadow:20px 0 40px -20px rgba(0,0,0,.35);}
  #app.rail-collapsed nav#rail{ opacity:1; pointer-events:auto; }
}

/* ---------- sidebar toggle (burger) ---------- */
.rail-toggle-btn{
  display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  width:34px; height:34px; border-radius:8px; border:1px solid var(--line-strong);
  background:var(--paper); cursor:pointer; padding:0; margin-right:12px;
  transition:border-color .15s ease, background-color .15s ease;
}
.rail-toggle-btn:hover{border-color:var(--stamp); background:#F7F8F7;}
.rail-toggle-btn svg{width:18px; height:18px; color:var(--ink); display:block;}
.rail-toggle-btn .burger-line{transition:transform .25s var(--ease, ease), opacity .2s ease; transform-origin:center;}
.rail-toggle-btn.is-collapsed .burger-line1{transform:translateY(6px) rotate(45deg);}
.rail-toggle-btn.is-collapsed .burger-line2{opacity:0;}
.rail-toggle-btn.is-collapsed .burger-line3{transform:translateY(-6px) rotate(-45deg);}

/* ---------- sidebar ---------- */
nav#rail{
  grid-area:rail; background:var(--paper-tab); border-right:1px solid var(--line);
  display:flex; flex-direction:column; overflow:hidden; min-height:0;
}
.sidebar-logo{display:flex; align-items:center; gap:10px; padding:18px 18px 4px;}
.logo-mark{
  display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  width:28px; height:28px; border-radius:7px; background:var(--stamp); color:var(--stamp-ink);
  font-family:var(--font-display); font-weight:800; font-size:11.5px;
}
.logo-text{line-height:1.25;}
.logo-name{font-family:var(--font-display); font-weight:800; font-size:15px; color:var(--ink); letter-spacing:-.01em;}
.logo-sub{font-family:var(--font-display); font-size:11.5px; color:var(--ink-faint);}
.rail-close-mobile{display:none;}
@media (max-width:980px){.rail-close-mobile{display:flex; margin-left:auto;}}
.sidebar-progress{padding:12px 18px 6px;}
.sidebar-progress .pp-label{
  display:flex; justify-content:space-between; font-family:var(--font-display);
  font-size:11px; color:var(--ink-faint); margin-bottom:5px;
}
.progress-bar{height:6px; background:var(--paper); border:1px solid var(--line); border-radius:3px; overflow:hidden; margin:0 0 4px;}
.progress-bar .fill{height:100%; background:var(--good); width:0%; transition:width .2s;}

/* rail-scroll holds the nav steps + Goods Plan tracker as one continuous, independently scrolling column */
.rail-scroll{flex:1 1 auto; min-height:0; overflow-y:auto;}
.nav-groups{padding:12px 10px 4px;}
.nav-group-label{
  font-family:var(--font-display); font-weight:700; text-transform:uppercase; letter-spacing:.08em;
  font-size:10.5px; color:var(--ink-faint); padding:6px 8px 6px;
}
.step-item{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:9px 8px; border:none; background:transparent; color:var(--ink-soft);
  font-family:var(--font-body); font-size:13.5px; cursor:pointer; border-radius:7px; margin-bottom:2px;
  transition:background-color .15s ease, color .15s ease, box-shadow .15s ease;
}
.step-item:hover{background:var(--paper);}
.step-item.active{background:var(--mimeo-ink); color:var(--stamp); font-weight:600; box-shadow:inset 3px 0 0 var(--stamp);}
.step-num{
  flex:0 0 auto; width:20px; height:20px; border-radius:50%; border:1.5px solid var(--line-strong);
  display:flex; align-items:center; justify-content:center; font-family:var(--font-display);
  font-size:10.5px; font-weight:700; color:var(--ink-faint);
  transition:border-color .15s ease, background-color .15s ease, color .15s ease;
}
.step-item.progress .step-num{border-color:var(--good); color:var(--good);}
.step-item.done .step-num{background:var(--stamp); border-color:var(--stamp); color:var(--stamp-ink);}
.step-item.active .step-num{border-color:var(--stamp);}
.step-label{flex:1 1 auto;}
.step-status{font-size:12px; color:var(--good); flex:0 0 auto;}

/* ---------- rail divider: clear break between Builder steps and Goods Plan tracker ---------- */
.rail-divider{
  position:relative; display:flex; align-items:center; justify-content:space-between; gap:10px;
  margin:14px 14px 10px; padding-top:18px; border-top:1.5px solid var(--line-strong);
}
.rail-divider::before{
  content:''; position:absolute; top:-1.5px; left:0; width:38px; height:1.5px; background:var(--stamp);
}
.rail-divider .eyebrow{color:var(--stamp); font-size:11px;}
.rail-divider .rd-clear{
  font-family:var(--font-display); font-weight:700; font-size:10.5px; color:var(--ink-faint);
  background:transparent; border:1px solid var(--line-strong); border-radius:999px; padding:4px 11px; cursor:pointer;
  transition:border-color .15s ease, color .15s ease;
}
.rail-divider .rd-clear:hover{border-color:var(--warn); color:var(--warn);}

.sidebar-footer{flex:0 0 auto; border-top:1px solid var(--line); padding:12px 14px; background:var(--paper-tab);}
.sidebar-footer .btn{width:100%;}
.mobile-topbar{display:none;}
.mobile-topbar-title{display:flex; flex-direction:column; gap:0; min-width:0;}
.mobile-topbar-step{
  font-family:var(--font-display); font-weight:700; text-transform:uppercase; letter-spacing:.06em;
  font-size:10px; color:var(--stamp);
}
.mobile-topbar-name{font-family:var(--font-display); font-weight:700; font-size:14px; color:var(--ink);}
@media (max-width:980px){
  .mobile-topbar{
    display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line);
    background:var(--paper-raised);
  }
}
.iconbtn{border:1px solid var(--line); background:var(--paper); border-radius:7px; padding:6px 10px; font-size:12px; cursor:pointer;}

/* ---------- main content + page header ---------- */
main#content-col{grid-area:main; display:flex; flex-direction:column; overflow:hidden; min-width:0; min-height:0; height:100%;}
#content{
  flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden;
  padding:0 30px 60px; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
}
@media (max-width:640px){
  #content{padding:0 16px 50px;}
  .page-header{padding:18px 16px 14px; margin:0 -16px 16px;}
}
@keyframes stepFadeIn{ from{opacity:0; transform:translateY(5px);} to{opacity:1; transform:translateY(0);} }
.page-header{
  position:sticky; top:0; z-index:5; background:var(--paper); padding:26px 30px 16px; margin:0 -30px 20px;
  border-bottom:1px solid var(--line);
}
.page-header.step-enter{animation:stepFadeIn .22s var(--ease);}
@media (prefers-reduced-motion: reduce){ .page-header.step-enter{animation:none;} }
.page-header .ph-top{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap;}
.page-header .ph-eyebrow{font-family:var(--font-display); font-weight:700; text-transform:uppercase; letter-spacing:.06em; font-size:10.5px; color:var(--stamp); margin:0 0 4px;}
.page-header h1{
  font-family:var(--font-display); font-weight:800; letter-spacing:-.01em;
  font-size:23px; margin:0 0 4px; color:var(--ink); text-wrap:balance;
}
.page-header .ph-sub{margin:0; color:var(--ink-soft); font-size:13.5px; max-width:64ch;}

.chiprow{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px;}
.chip{
  font-family:var(--font-display); font-size:12.5px; font-weight:700;
  letter-spacing:.02em; padding:8px 16px; border-radius:999px; border:1.5px solid var(--line);
  background:var(--paper-raised); color:var(--ink-soft); cursor:pointer;
  text-align:center; box-shadow:var(--shadow);
  transition:border-color .15s ease, background-color .15s ease, color .15s ease, transform .12s ease, box-shadow .15s ease;
}
.chip:hover{border-color:var(--mimeo); box-shadow:var(--shadow-hover); transform:translateY(-1px);}
.chip:active{transform:translateY(0);}
.chip.active:hover{transform:none; box-shadow:var(--shadow);}
.chip.active{background:var(--mimeo); color:var(--mimeo-ink); border-color:var(--mimeo);}

.group-title{
  font-family:var(--font-display); font-weight:700; text-transform:uppercase; letter-spacing:.05em;
  font-size:12px; color:var(--stamp); margin:26px 0 10px; padding-top:14px; border-top:1px solid var(--line);
}
.group-title:first-of-type{border-top:none; margin-top:0; padding-top:0;}

/* ---------- cards ---------- */
.card{
  background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); margin-bottom:10px; padding:14px 16px;
  transition:box-shadow .15s ease, border-color .15s ease;
}
.card:hover{border-color:var(--line-strong); box-shadow:var(--shadow-hover);}
.card h3{margin:0 0 4px; font-family:var(--font-display); font-weight:700; font-size:14px; color:var(--ink);}
.card p{margin:0; font-size:13px; color:var(--ink-soft); line-height:1.55;}

/* ---------- research: where to look ---------- */
.source-tip{margin:-4px 0 14px; font-size:12.5px; color:var(--ink-faint); font-style:italic; line-height:1.5; max-width:70ch;}
.source-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; margin-bottom:22px;}

/* ---------- doctrine hero (sourcing tip) ---------- */
.doctrine-hero{
  position:relative; overflow:hidden; border-radius:20px; margin-bottom:28px;
  padding:36px 40px; background:linear-gradient(155deg, #143d28, var(--stamp) 55%, #0e2c1c);
  box-shadow:0 2px 4px rgba(20,24,27,.06), 0 28px 50px -22px rgba(14,44,28,.55);
  color:#fff;
}
.doctrine-hero::before{
  content:''; position:absolute; top:-90px; right:-90px; width:280px; height:280px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.14), transparent 70%); pointer-events:none;
}
.doctrine-hero::after{
  content:''; position:absolute; bottom:-110px; left:-60px; width:220px; height:220px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.08), transparent 70%); pointer-events:none;
}
.doctrine-badge{
  display:inline-flex; align-items:center; gap:7px; font-family:var(--font-display); font-weight:800;
  font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:#fff; background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.3); border-radius:999px; padding:5px 14px; margin-bottom:16px; position:relative;
}
.doctrine-badge::before{content:''; width:6px; height:6px; border-radius:50%; background:#fff;}
.doctrine-headline{
  position:relative; font-family:var(--font-display); font-weight:800; font-size:32px; letter-spacing:-.015em;
  margin:0 0 12px; line-height:1.12; text-wrap:balance;
}
.doctrine-body{position:relative; margin:0 0 22px; font-size:14.5px; line-height:1.6; color:rgba(255,255,255,.86); max-width:none;}
.doctrine-principle{
  position:relative; display:flex; align-items:flex-start; gap:16px; background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.18); border-radius:14px; padding:16px 20px;
  backdrop-filter:blur(6px);
}
.doctrine-principle .dp-label{
  flex:0 0 auto; font-family:var(--font-display); font-weight:800; font-size:11px; text-transform:uppercase;
  letter-spacing:.06em; color:#fff; background:rgba(255,255,255,.16); border-radius:8px; padding:6px 11px;
  white-space:nowrap;
}
.doctrine-principle p{margin:0; font-size:13.5px; line-height:1.55; color:rgba(255,255,255,.92);}
@media (max-width:640px){
  .doctrine-hero{padding:26px 22px;}
  .doctrine-headline{font-size:25px;}
  .doctrine-principle{flex-direction:column; gap:8px;}
}
.source-card{
  border:1px solid var(--line); border-radius:var(--radius); background:var(--paper-raised);
  box-shadow:var(--shadow); padding:14px 16px;
}
.source-card h4{
  margin:0 0 10px; font-family:var(--font-display); font-weight:700; text-transform:uppercase;
  letter-spacing:.04em; font-size:11px; color:var(--stamp);
}
.source-chips{display:flex; flex-wrap:wrap; gap:6px;}
.source-chip{
  font-size:12px; padding:4px 10px; border-radius:999px; background:var(--paper);
  border:1px solid var(--line); color:var(--ink-soft); white-space:nowrap;
}

/* ---------- goods catalog table (inside modal) ---------- */
.tier-badge{
  font-family:var(--font-mono); font-size:10.5px; font-weight:700; white-space:nowrap;
  padding:2.5px 9px; border-radius:999px; text-transform:uppercase; letter-spacing:.03em;
  display:inline-block; margin-top:4px;
}
.tier-badge.tier-low{background:var(--mimeo-ink); color:var(--stamp);}
.tier-badge.tier-mid{background:var(--tier-mid-bg); color:var(--tier-mid-ink);}
.tier-badge.tier-high{background:#FBEEE0; color:var(--warn);}
.table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:8px; margin-bottom:22px;}
table.goods-table{width:100%; min-width:640px; border-collapse:collapse; font-size:13px;}
table.goods-table th{
  text-align:left; font-family:var(--font-display); text-transform:uppercase; font-size:10.5px;
  letter-spacing:.04em; color:var(--ink-faint); border-bottom:1px solid var(--line-strong);
  padding:11px 16px; background:var(--paper);
}
table.goods-table td{padding:16px; border-bottom:1px solid var(--line); vertical-align:top; transition:background-color .12s ease;}
table.goods-table tr:last-child td{border-bottom:none;}
table.goods-table tbody tr:not(.selected):not(.editing-row):hover td{background:#FAFBFA;}
table.goods-table tr.selected td{background:var(--mimeo-ink,#E6F4EC);}
table.goods-table .col-name{width:210px;}
table.goods-table .good-name{font-family:var(--font-display); font-weight:700; font-size:14.5px; color:var(--ink);}
table.goods-table .col-cost{width:150px; font-family:var(--font-mono); font-size:12px; color:var(--ink-faint); white-space:nowrap;}
table.goods-table .col-cost .cost-block{display:flex; flex-direction:column; align-items:flex-start; gap:6px;}
table.goods-table .col-cost .tier-badge{margin-top:0;}
table.goods-table .good-category{color:var(--ink-soft); font-family:var(--font-body); font-size:12.5px;}
table.goods-table .col-desc{font-size:13px; color:var(--ink-soft); line-height:1.55; min-width:280px;}
table.goods-table .col-desc .when{margin-top:8px; font-style:italic; color:var(--ink-faint); font-size:12px;}
table.goods-table .col-desc .examples{margin:8px 0 0; padding-left:16px; font-size:12px;}
table.goods-table .col-desc .examples li{margin:2px 0;}
table.goods-table .col-action{width:120px;}
table.goods-table .col-action .action-btns{display:flex; flex-direction:column; align-items:stretch; gap:6px;}
table.goods-table .col-action .btn{white-space:nowrap; width:100%; text-align:center;}

/* ---------- goods catalog: size picker ---------- */
.size-grid{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:28px;
  margin-bottom:8px; align-items:stretch;
}
.size-card{
  text-align:left; border:1px solid var(--line); border-radius:16px; background:var(--paper-raised);
  box-shadow:var(--shadow); padding:38px 34px; cursor:pointer; display:flex; flex-direction:column; gap:16px;
  min-height:260px; transition:border-color .15s ease, box-shadow .15s ease, transform .15s ease;
}
.size-card:hover{border-color:var(--stamp); box-shadow:var(--shadow-hover); transform:translateY(-2px);}
.size-card:active{transform:translateY(0);}
.size-card-count{
  align-self:flex-start; font-family:var(--font-mono); font-size:12.5px; color:var(--stamp);
  background:var(--mimeo-ink,#E6F4EC); border-radius:999px; padding:4px 14px;
}
.size-card-title{font-family:var(--font-display); font-weight:800; font-size:26px; color:var(--ink); margin-top:4px;}
.size-card-desc{font-size:14.5px; color:var(--ink-soft); line-height:1.6; max-width:40ch;}

/* ---------- modal ---------- */
.modal-overlay{
  display:none; position:fixed; inset:0; background:rgba(20,24,27,.45); z-index:200;
  align-items:center; justify-content:center; padding:26px;
}
@keyframes modalOverlayIn{ from{opacity:0;} to{opacity:1;} }
@keyframes modalBoxIn{ from{opacity:0; transform:translateY(10px) scale(.97);} to{opacity:1; transform:translateY(0) scale(1);} }
.modal-overlay.open{display:flex; animation:modalOverlayIn .18s var(--ease);}
.modal-overlay.open .modal-box{animation:modalBoxIn .22s var(--ease);}
@media (prefers-reduced-motion: reduce){
  .modal-overlay.open, .modal-overlay.open .modal-box{animation:none;}
}
.modal-box{
  background:var(--paper-raised); border-radius:12px; width:100%; max-width:1180px; max-height:85vh;
  display:flex; flex-direction:column; overflow:hidden; box-shadow:0 24px 60px -20px rgba(0,0,0,.4);
  transition:max-width .18s var(--ease), max-height .18s var(--ease), border-radius .18s var(--ease);
}
.modal-box.fullscreen{
  width:100vw; height:100vh; max-width:100vw; max-height:100vh; border-radius:0;
}
.modal-overlay.fullscreen{padding:0;}
.modal-head{
  display:flex; align-items:flex-start; justify-content:space-between; gap:16px;
  padding:20px 24px 14px; border-bottom:1px solid var(--line); flex:0 0 auto;
}
.modal-head-right{display:flex; align-items:center; gap:10px; flex:0 0 auto;}
.modal-fullscreen-btn{
  flex:0 0 auto; width:28px; height:28px; border-radius:50%; border:1px solid var(--line-strong);
  background:var(--paper-raised); color:var(--ink-soft); cursor:pointer; padding:0;
  display:flex; align-items:center; justify-content:center;
  transition:background-color .15s ease, color .15s ease, border-color .15s ease;
}
.modal-fullscreen-btn:hover{background:var(--ink); color:#fff; border-color:var(--ink);}
.modal-fullscreen-btn svg{width:14px; height:14px;}
.modal-eyebrow{font-family:var(--font-display); font-weight:700; text-transform:uppercase; letter-spacing:.06em; font-size:10.5px; color:var(--ink-faint);}
.modal-head h2{font-family:var(--font-display); font-weight:800; font-size:20px; margin:2px 0 0; color:var(--ink);}
.modal-scroll{flex:1 1 auto; min-height:0; overflow-y:auto; padding:0 24px 24px;}
.modal-scroll .group-title:first-of-type{margin-top:0;}
@media (max-width:720px){
  .modal-overlay{padding:0;}
  .modal-box{max-width:none; max-height:none; height:100%; border-radius:0;}
}

/* ---------- confirm dialog: replaces native confirm() ---------- */
.confirm-overlay{
  display:none; position:fixed; inset:0; background:rgba(20,24,27,.5); z-index:300;
  align-items:center; justify-content:center; padding:20px;
}
.confirm-overlay.open{display:flex; animation:modalOverlayIn .15s var(--ease);}
.confirm-overlay.open .confirm-box{animation:modalBoxIn .18s var(--ease);}
@media (prefers-reduced-motion: reduce){
  .confirm-overlay.open, .confirm-overlay.open .confirm-box{animation:none;}
}
.confirm-box{
  background:var(--paper-raised); border-radius:14px; width:100%; max-width:380px;
  box-shadow:0 24px 60px -20px rgba(0,0,0,.4); padding:24px 24px 20px;
}
.confirm-icon{
  width:36px; height:36px; border-radius:50%; background:#FBEEE0; color:var(--warn);
  display:flex; align-items:center; justify-content:center; font-family:var(--font-display);
  font-weight:800; font-size:16px; margin-bottom:14px;
}
.confirm-title{font-family:var(--font-display); font-weight:800; font-size:16px; color:var(--ink); margin:0 0 6px;}
.confirm-message{font-size:13.5px; color:var(--ink-soft); line-height:1.5; margin:0 0 20px;}
.confirm-actions{display:flex; justify-content:flex-end; gap:8px;}
.btn.primary.danger{background:var(--warn); border-color:var(--warn);}
.btn.primary.danger:hover{background:var(--warn); filter:brightness(1.08); transform:translateY(-1px);}

/* ---------- messaging: template bank trigger + modal ---------- */
.tpl-trigger{
  width:100%; display:flex; align-items:center; gap:12px; text-align:left; cursor:pointer;
  border:1.5px dashed var(--line-strong); border-radius:9px; background:var(--paper);
  padding:11px 14px; margin-bottom:14px; font-family:inherit; transition:border-color .15s ease, background-color .15s ease, transform .12s ease;
}
.tpl-trigger:hover{border-color:var(--stamp); border-style:solid; background:var(--mimeo-ink); transform:translateY(-1px);}
.tpl-trigger-icon{
  flex:0 0 auto; width:30px; height:30px; border-radius:8px; background:var(--stamp); color:var(--stamp-ink);
  display:flex; align-items:center; justify-content:center; font-size:14px;
}
.tpl-trigger-text{flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:1px;}
.tpl-trigger-title{font-family:var(--font-display); font-weight:700; font-size:13px; color:var(--ink);}
.tpl-trigger-sub{font-size:11.5px; color:var(--ink-faint);}
.tpl-trigger-arrow{flex:0 0 auto; color:var(--stamp); font-size:15px;}

.tpl-modal-box{max-width:980px;}
.tpl-modal-head{
  display:flex; align-items:flex-start; justify-content:space-between; gap:16px;
  padding:22px 26px 16px; border-bottom:1px solid var(--line); flex:0 0 auto;
}
.tpl-modal-head-actions{display:flex; align-items:center; gap:8px; flex:0 0 auto;}
.tpl-modal-sub{margin:6px 0 0; font-size:13px; color:var(--ink-soft); max-width:64ch; line-height:1.5;}
.tpl-modal-controls{
  flex:0 0 auto; padding:16px 26px; border-bottom:1px solid var(--line); background:var(--paper);
  display:flex; flex-direction:column; gap:12px;
}
.tpl-search{
  width:100%; box-sizing:border-box; border:1px solid var(--line-strong); border-radius:9px;
  background:var(--paper-raised); color:var(--ink); font-family:var(--font-body); font-size:13.5px;
  padding:10px 14px;
}
.tpl-search:focus{outline:2px solid var(--mimeo); outline-offset:1px;}
.tpl-cat-chips{display:flex; flex-wrap:wrap; gap:7px;}
.chip.small{padding:5px 12px; font-size:11.5px;}
.tpl-chip-count{opacity:.65; font-weight:600; margin-left:2px;}
.tpl-cat-manage-toggle{margin-left:auto;}
.tpl-cat-manage{
  border:1px solid var(--line); border-radius:9px; background:var(--paper-raised);
  padding:12px 14px; display:flex; flex-direction:column; gap:8px;
}
.tpl-cat-manage-row{display:flex; align-items:center; gap:8px; padding:4px 0;}
.tpl-cat-manage-name{flex:1 1 auto; font-family:var(--font-display); font-weight:700; font-size:12.5px; color:var(--ink);}
.tpl-cat-manage-row-editing{align-items:center;}
.tpl-cat-rename-input, .tpl-cat-new-input{
  flex:1 1 auto; box-sizing:border-box; border:1px solid var(--line-strong); border-radius:7px;
  background:var(--paper); color:var(--ink); font-family:var(--font-body); font-size:12.5px; padding:7px 10px;
}
.tpl-cat-rename-input:focus, .tpl-cat-new-input:focus{outline:2px solid var(--mimeo); outline-offset:1px;}
.tpl-cat-manage-add{display:flex; gap:8px; padding-top:6px; border-top:1px dashed var(--line);}
.tpl-modal-body{flex:1 1 auto; min-height:0; overflow-y:auto; padding:20px 26px 26px;}
.tpl-group{margin-bottom:22px;}
.tpl-group:last-child{margin-bottom:0;}
.tpl-group-label{
  font-family:var(--font-display); font-weight:700; text-transform:uppercase; letter-spacing:.05em;
  font-size:11px; color:var(--stamp); margin-bottom:10px;
}
.tpl-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px;}
.tpl-card{
  display:flex; flex-direction:column; gap:9px; border:1px solid var(--line); border-radius:10px;
  background:var(--paper-raised); box-shadow:var(--shadow); padding:14px 15px;
  transition:box-shadow .15s ease, border-color .15s ease;
}
.tpl-card:hover{box-shadow:var(--shadow-hover); border-color:var(--line-strong);}
.tpl-card-top-row{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
.tpl-card-top-actions{display:flex; align-items:center; gap:6px; flex:0 0 auto;}
.tpl-card-add, .tpl-card-edit, .tpl-card-delete{
  flex:0 0 auto; width:24px; height:24px; border-radius:50%; border:1px solid var(--stamp);
  background:var(--mimeo-ink); color:var(--stamp); font-family:var(--font-display); font-weight:800;
  font-size:15px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;
  padding:0; transition:background-color .15s ease, transform .12s ease;
}
.tpl-card-edit{font-size:11px; border-color:var(--line-strong); color:var(--ink-soft);}
.tpl-card-delete{border-color:var(--warn); color:var(--warn); font-size:16px;}
.tpl-card-add:hover{background:var(--stamp); color:var(--stamp-ink); transform:scale(1.08);}
.tpl-card-edit:hover{background:var(--ink); color:#fff; border-color:var(--ink); transform:scale(1.08);}
.tpl-card-delete:hover{background:var(--warn); color:#fff; transform:scale(1.08);}
.tpl-card-title{font-family:var(--font-display); font-weight:700; font-size:12.5px; color:var(--ink);}
.tpl-card-subject{font-family:var(--font-display); font-weight:700; font-size:12px; color:var(--stamp);}

.tpl-card-editing{gap:9px;}
.tpl-edit-title, .tpl-edit-subject, .tpl-edit-cat{
  width:100%; box-sizing:border-box; border:1px solid var(--line); border-radius:7px;
  background:var(--paper); color:var(--ink); font-family:var(--font-body); font-size:12.5px; padding:8px 10px;
}
.tpl-edit-title{font-family:var(--font-display); font-weight:700;}
.tpl-edit-cat{font-family:var(--font-display); font-weight:700; color:var(--stamp); cursor:pointer;}
.tpl-edit-title:focus, .tpl-edit-subject:focus, .tpl-edit-text:focus, .tpl-edit-cat:focus{outline:2px solid var(--mimeo); outline-offset:1px;}
.tpl-edit-text{
  width:100%; box-sizing:border-box; border:1px solid var(--line); border-radius:7px;
  background:var(--paper); color:var(--ink); font-family:var(--font-body); font-size:12.5px;
  padding:8px 10px; min-height:120px; resize:vertical; line-height:1.5;
}
.tpl-edit-actions{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.tpl-edit-actions-right{display:flex; gap:8px;}
.tpl-edit-delete{
  border:1px solid var(--warn); color:var(--warn); background:transparent; border-radius:999px;
  font-family:var(--font-display); font-weight:700; font-size:11px; padding:5px 10px; cursor:pointer;
}
.tpl-edit-delete:hover{background:var(--warn); color:#fff;}
.tpl-card-text{
  font-size:12.5px; color:var(--ink-soft); line-height:1.5; white-space:pre-wrap;
  max-height:150px; overflow-y:auto; flex:1 1 auto;
}
.tpl-empty{
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  gap:6px; padding:50px 20px; color:var(--ink-soft);
}
.tpl-empty-icon{
  width:44px; height:44px; border-radius:50%; background:var(--mimeo-ink); color:var(--stamp);
  display:flex; align-items:center; justify-content:center; font-size:18px; margin-bottom:6px;
}
.tpl-empty h3{margin:0; font-family:var(--font-display); font-weight:800; font-size:15px; color:var(--ink);}
.tpl-empty p{margin:0; font-size:13px; max-width:44ch; line-height:1.5;}

.btn{
  font-family:var(--font-display); font-weight:700; letter-spacing:0;
  font-size:12.5px; padding:8px 14px; border-radius:999px; cursor:pointer; border:1px solid var(--line);
  background:var(--paper-raised); color:var(--ink);
}
.btn{transition:background-color .15s ease, border-color .15s ease, color .15s ease, filter .15s ease, transform .12s ease, box-shadow .15s ease;}
.btn:hover{border-color:var(--line-strong); background:#F7F8F7;}
.btn:active{transform:translateY(0); filter:brightness(.97);}
.btn:disabled{opacity:.5; cursor:not-allowed; filter:none; transform:none;}
.btn.primary{background:var(--stamp); color:var(--stamp-ink); border-color:var(--stamp);}
.btn.primary:hover{filter:brightness(1.1); transform:translateY(-1px); background:var(--stamp);}
.btn.primary:disabled{opacity:.5; cursor:not-allowed; filter:none;}
.btn.ghost{background:transparent;}
.btn.ghost:hover{background:var(--ink); color:#fff; border-color:var(--ink); transform:translateY(-1px);}
.btn.ghost.danger:hover{background:var(--warn); color:#fff; border-color:var(--warn);}
.btn.small{padding:5px 10px; font-size:11px;}
.btn.full{width:100%; text-align:center;}

/* ---------- quiz ---------- */
.quiz-q{margin-bottom:22px;}
.quiz-q .qtext{font-family:var(--font-display); font-weight:700; font-size:14px; margin-bottom:9px;}
.quiz-opts{display:flex; flex-direction:column; gap:7px;}
.quiz-opts.row{flex-direction:row;}
.quiz-opts.row .quiz-opt{flex:1 1 0; justify-content:center; text-align:center;}
.qsub{font-size:12px; color:var(--ink-faint); margin:-4px 0 9px;}
.quiz-text{width:100%; box-sizing:border-box; border:1px solid var(--line); border-radius:8px; padding:9px 11px; font:inherit; font-size:13px; background:var(--paper-raised); resize:vertical;}
.quiz-opt{
  display:flex; align-items:center; gap:9px; border:1px solid var(--line); border-radius:8px;
  padding:10px 12px; cursor:pointer; background:var(--paper-raised);
  transition:border-color .15s ease, background-color .15s ease, box-shadow .15s ease;
}
.quiz-opt:hover{border-color:var(--line-strong); box-shadow:var(--shadow);}
.quiz-opt.picked{border-color:var(--stamp); background:var(--mimeo-ink);}
.quiz-opt .dot{
  flex:0 0 auto; width:15px; height:15px; border-radius:50%; border:2px solid var(--line-strong);
  transition:border-color .15s ease, background-color .15s ease;
}
.quiz-opt.picked .dot{border-color:var(--stamp); background:var(--stamp);}
.quiz-opt .otext{font-size:13.2px;}
.quiz-result{
  border:1.5px solid var(--stamp); border-radius:var(--radius); background:var(--mimeo-ink);
  padding:18px 20px; margin-top:8px;
}
.quiz-result .qr-eyebrow{font-family:var(--font-display); font-weight:700; text-transform:uppercase; letter-spacing:.05em; font-size:10.5px; color:var(--stamp); margin-bottom:4px;}
.quiz-result h3{margin:0 0 6px; font-family:var(--font-display); font-weight:800; font-size:18px;}
.quiz-result p{margin:0 0 12px; font-size:13.2px; color:var(--ink);}

.field-group{margin-top:18px;}
.field-group label{
  display:block; font-family:var(--font-display); font-weight:700; font-size:11.5px;
  text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); margin-bottom:6px;
}
.field-group textarea{
  width:100%; border:1px solid var(--line); border-radius:8px; background:var(--paper-raised);
  color:var(--ink); font-family:var(--font-body); font-size:13.5px; padding:10px 12px;
  min-height:80px; resize:vertical;
}
.field-group textarea:focus{outline:2px solid var(--mimeo); outline-offset:1px;}

/* ---------- add-a-good inline form ---------- */
.add-good-form{
  border:1px dashed var(--line-strong); border-radius:8px; padding:16px;
  margin:8px 0 26px; background:var(--paper);
}
.add-good-form .row{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;}
@media (max-width:640px){.add-good-form .row{grid-template-columns:1fr;}}
.add-good-form .field{margin-bottom:12px;}
.add-good-form .field:last-of-type{margin-bottom:0;}
.add-good-form label{
  display:block; font-family:var(--font-display); font-weight:700; font-size:10.5px;
  text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); margin-bottom:5px;
}
.add-good-form input[type=text], .add-good-form textarea, .add-good-form select{
  width:100%; box-sizing:border-box; border:1px solid var(--line); border-radius:6px;
  background:var(--paper-raised); color:var(--ink); font-family:var(--font-body);
  font-size:13px; padding:8px 10px;
}
.add-good-form textarea{min-height:80px; resize:vertical;}
.add-good-form input[type=text]:focus, .add-good-form textarea:focus, .add-good-form select:focus{outline:2px solid var(--mimeo); outline-offset:1px;}
.rowbtns{display:flex; gap:8px; margin-top:14px;}
.btn.danger{color:var(--warn); border-color:var(--warn);}
.btn.danger:hover{background:var(--warn); color:#fff; transform:translateY(-1px);}

/* ---------- checklist ---------- */
.check-item{
  display:flex; gap:10px; align-items:flex-start; padding:11px 10px; margin:0 -10px;
  border-bottom:1px solid var(--line); border-radius:7px; transition:background-color .15s ease;
}
.check-item:hover{background:var(--paper);}
.check-item:last-child{border-bottom:none;}
.check-item input[type=checkbox]{
  appearance:none; -webkit-appearance:none; margin-top:2px; flex:0 0 auto;
  width:18px; height:18px; border-radius:5px; border:2px solid var(--line-strong);
  background:var(--paper-raised); cursor:pointer; position:relative;
  transition:background-color .15s ease, border-color .15s ease;
}
.check-item input[type=checkbox]:hover{border-color:var(--good);}
.check-item input[type=checkbox]:checked{background:var(--good); border-color:var(--good);}
.check-item input[type=checkbox]:checked::after{
  content:''; position:absolute; left:5px; top:1px; width:5px; height:9px;
  border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg);
}
.check-item label{font-size:13.5px; flex:1; cursor:pointer;}
.check-item label b{display:block; font-weight:700; margin-bottom:2px; transition:color .15s ease;}
.check-item.done label b{color:var(--ink-faint); text-decoration:line-through;}
.check-item.done label span{color:var(--ink-faint);}
.check-bullets{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:2px;}
.check-item.done label .check-bullets{color:var(--ink-faint);}

/* ---------- send methods ---------- */
.send-methods{display:flex; flex-wrap:wrap; gap:8px; margin:16px 0 28px;}

/* ---------- messaging: before / inside / follow-up ---------- */
.msg-sections{display:flex; flex-direction:column; gap:22px; margin-bottom:28px;}
.msg-card{
  position:relative; background:var(--paper-raised); border:1px solid var(--line); border-radius:14px;
  box-shadow:var(--shadow); padding:24px 26px 20px; overflow:hidden;
  transition:box-shadow .18s ease, transform .18s ease;
}
.msg-card:hover{box-shadow:0 10px 28px -12px rgba(0,0,0,.22); transform:translateY(-1px);}
.msg-card::before{
  content:''; position:absolute; top:0; left:0; right:0; height:3px;
  background:linear-gradient(90deg, var(--stamp), var(--mimeo));
}
.msg-card-top{display:flex; align-items:flex-start; gap:14px; margin-bottom:16px;}
.msg-num{
  flex:0 0 auto; width:34px; height:34px; border-radius:9px; background:var(--mimeo-ink);
  color:var(--stamp); display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:800; font-size:13px;
}
.msg-heading{flex:1 1 auto; min-width:0;}
.msg-title-row{display:flex; align-items:center; gap:9px; flex-wrap:wrap;}
.msg-title-row h3{margin:0; font-family:var(--font-display); font-weight:800; font-size:15.5px; color:var(--ink);}
.msg-tag{
  font-family:var(--font-display); font-weight:700; text-transform:uppercase; letter-spacing:.05em;
  font-size:10px; color:var(--stamp); background:var(--mimeo-ink); border-radius:999px; padding:3px 9px;
}
.msg-desc{margin:4px 0 0; font-size:12.5px; color:var(--ink-soft); line-height:1.5; max-width:70ch;}
.msg-subject{
  width:100%; box-sizing:border-box; border:1px solid var(--line); border-radius:8px;
  background:var(--paper); color:var(--ink); font-family:var(--font-body); font-size:13.5px;
  padding:11px 14px; margin-bottom:12px; transition:border-color .15s ease;
}
.msg-subject:focus{outline:2px solid var(--mimeo); outline-offset:1px; background:var(--paper-raised);}
.msg-textarea{
  width:100%; box-sizing:border-box; border:1px solid var(--line); border-radius:8px;
  background:var(--paper); color:var(--ink); font-family:var(--font-body); font-size:13.5px;
  padding:13px 14px; min-height:120px; resize:vertical; line-height:1.6; transition:border-color .15s ease;
}
.msg-textarea:focus{outline:2px solid var(--mimeo); outline-offset:1px; background:var(--paper-raised);}
.msg-foot{display:flex; justify-content:space-between; align-items:center; margin-top:14px;}
.msg-count{font-family:var(--font-mono); font-size:11px; color:var(--ink-faint);}

/* ---------- messaging: flow diagram (before/inside/public/follow-up overview) ---------- */
.msg-flow{
  position:relative; overflow:hidden;
  background:
    radial-gradient(140% 160% at 102% -10%, rgba(47,143,91,.08), transparent 55%),
    var(--paper-raised);
  border:1px solid var(--line); border-radius:16px;
  padding:24px 28px 28px; margin-bottom:28px;
  box-shadow:var(--shadow);
}
.msg-flow::before{
  content:''; position:absolute; top:0; left:0; right:0; height:3px;
  background:linear-gradient(90deg, var(--stamp), var(--mimeo) 55%, var(--warn));
}
.msg-flow-eyebrow{
  display:flex; align-items:center; gap:7px;
  font-family:var(--font-display); font-weight:700; text-transform:uppercase; letter-spacing:.08em;
  font-size:10.5px; color:var(--stamp); margin:0 0 6px;
}
.msg-flow-eyebrow::before{content:''; width:14px; height:1.5px; border-radius:2px; background:var(--stamp);}
.msg-flow-title{
  font-family:var(--font-display); font-weight:800; font-size:17px; letter-spacing:-.01em;
  color:var(--ink); margin:0 0 26px;
}
.msg-flow-track{display:flex; align-items:flex-start;}
.msg-flow-step{
  flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; text-align:center;
  transition:transform .18s var(--ease);
}
.msg-flow-step:hover{transform:translateY(-3px);}
.msg-flow-step:hover .msg-flow-label{color:var(--stamp);}
.msg-flow-step.optional:hover .msg-flow-label{color:var(--warn);}
.msg-flow-node{
  flex:0 0 auto; width:46px; height:46px; border-radius:50%; margin-bottom:12px;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:800; font-size:14.5px;
  background:linear-gradient(155deg, var(--mimeo), var(--stamp)); color:var(--stamp-ink);
  border:2px solid var(--stamp); position:relative; z-index:2;
  box-shadow:0 4px 14px -5px rgba(30,107,69,.45), inset 0 0 0 3px rgba(255,255,255,.16);
  transition:box-shadow .18s ease, transform .18s ease;
}
.msg-flow-step:hover .msg-flow-node{transform:scale(1.06); box-shadow:0 8px 20px -6px rgba(30,107,69,.55), inset 0 0 0 3px rgba(255,255,255,.16);}
.msg-flow-step.optional .msg-flow-node{
  background:var(--paper-raised); color:var(--warn); border:2px dashed #E0A868;
  box-shadow:0 2px 10px -5px rgba(180,105,26,.3);
}
.msg-flow-step.optional:hover .msg-flow-node{box-shadow:0 8px 18px -6px rgba(180,105,26,.4), inset 0 0 0 3px rgba(255,255,255,.16);}
.msg-flow-label-wrap{display:flex; flex-direction:column; align-items:center; gap:6px;}
.msg-flow-tag{
  font-family:var(--font-display); font-weight:700; text-transform:uppercase; letter-spacing:.06em;
  font-size:9.5px; color:var(--stamp-ink); background:var(--stamp); border-radius:999px; padding:3px 10px;
  white-space:nowrap;
}
.msg-flow-step.optional .msg-flow-tag{color:var(--warn); background:#FBEEE0;}
.msg-flow-label{
  font-family:var(--font-display); font-weight:700; font-size:12.5px; color:var(--ink); line-height:1.3;
  transition:color .15s ease;
}
.msg-flow-connector{
  flex:1 1 32px; height:2px; margin-top:22px; position:relative; min-width:14px; align-self:flex-start;
  background:linear-gradient(90deg, var(--stamp), var(--mimeo) 55%, var(--warn));
  opacity:.3;
}
.msg-flow-connector::after{
  content:'\2192'; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  color:var(--ink-faint); font-size:11px; line-height:1; background:var(--paper-raised);
  border:1px solid var(--line); box-shadow:var(--shadow); opacity:1;
}
@media (max-width:720px){
  .msg-flow-track{flex-direction:column; align-items:stretch;}
  .msg-flow-step{flex-direction:row; text-align:left; align-items:center; gap:14px;}
  .msg-flow-step:hover{transform:translateX(3px);}
  .msg-flow-node{margin-bottom:0;}
  .msg-flow-label-wrap{align-items:flex-start;}
  .msg-flow-connector{flex:0 0 auto; width:2px; height:22px; margin:0 0 0 22px; align-self:auto;}
  .msg-flow-connector::after{content:'\2193';}
}

/* ---------- messaging: optional sections (collapsed by default) ---------- */
.msg-card.optional::before{background:linear-gradient(90deg, var(--warn), #E0A868);}
.msg-card.optional .msg-num{background:#FBEEE0; color:var(--warn);}
.msg-card.optional .msg-tag{background:#FBEEE0; color:var(--warn);}
.msg-card-toggle{
  flex:0 0 auto; font-family:var(--font-display); font-weight:700; font-size:11.5px;
  color:var(--warn); background:transparent; border:1px solid var(--warn); border-radius:999px;
  padding:5px 12px; cursor:pointer; white-space:nowrap;
  transition:background-color .15s ease, color .15s ease;
}
.msg-card-toggle:hover{background:var(--warn); color:#fff;}
.msg-card.optional.collapsed{
  cursor:pointer; border-style:dashed; border-color:#E0A868; background:var(--paper);
  box-shadow:none; padding:16px 18px;
}
.msg-card.optional.collapsed::before{display:none;}
.msg-card.optional.collapsed:hover{border-color:var(--warn); background:#FFFCF7;}
.msg-card.optional.collapsed .msg-card-top{margin-bottom:0;}
.msg-card.optional.collapsed .msg-num{background:transparent; border:1.5px dashed #E0A868; color:var(--warn);}
.msg-collapsed-hint{margin:10px 0 0 48px; font-size:12px; color:var(--ink-faint); font-style:italic;}
.msg-collapsed-hint.filled{color:var(--warn); font-style:normal; font-weight:600;}

.fe-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-top:4px;}
@media (max-width:640px){.fe-grid{grid-template-columns:1fr;}}
.fe-box{
  display:flex; flex-direction:column; gap:7px; text-align:left; cursor:pointer;
  border:1.5px dashed var(--line-strong); border-radius:10px; background:var(--paper);
  padding:16px 17px; font-family:inherit; transition:border-color .15s ease, background-color .15s ease, transform .12s ease;
}
.fe-box:hover{border-color:var(--stamp); background:var(--mimeo-ink); transform:translateY(-1px);}
.fe-box.filled{border-style:solid; border-color:var(--line);}
.fe-box-label{
  font-family:var(--font-display); font-weight:700; text-transform:uppercase; letter-spacing:.05em;
  font-size:10px; color:var(--stamp);
}
.fe-box-subject{font-family:var(--font-display); font-weight:700; font-size:13px; color:var(--ink);}
.fe-box-body{
  font-size:12px; color:var(--ink-soft); line-height:1.5; max-height:54px; overflow:hidden;
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;
}
.fe-modal-body{min-height:200px;}

/* ---------- step nav ---------- */
.step-nav{display:flex; justify-content:space-between; gap:10px; margin:32px 0 10px; padding-top:18px; border-top:1px solid var(--line);}

/* ---------- goods plan tracker (lives in the rail, beneath the Builder steps) ---------- */
.pp-body{padding:2px 14px 16px;}

.plan-section{
  border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px; background:var(--paper);
  transition:border-color .15s ease, box-shadow .15s ease;
}
.plan-section:hover{border-color:var(--line-strong); box-shadow:var(--shadow);}
.plan-section .ps-label{
  font-family:var(--font-display); font-weight:700; text-transform:uppercase; letter-spacing:.04em;
  font-size:10.5px; color:var(--stamp); margin-bottom:4px; display:flex; justify-content:space-between; align-items:center;
}
.plan-section .ps-label a{font-size:10.5px; color:var(--ink-faint); text-decoration:underline; text-transform:none; letter-spacing:0; font-weight:600; cursor:pointer;}
.plan-section .ps-label a:hover{color:var(--stamp);}
.plan-section .ps-value{font-size:13px; color:var(--ink); line-height:1.45; word-break:break-word;}
.ps-empty{font-size:12.5px; color:var(--ink-faint); font-style:italic;}
.plan-section .ps-sub{font-size:12px; color:var(--ink-soft); margin-top:3px;}
.plan-followup{
  width:100%; border:1px solid var(--line); border-radius:6px; background:var(--paper-raised);
  color:var(--ink); font-family:var(--font-body); box-sizing:border-box;
  padding:8px 9px; font-size:12.5px; line-height:1.55; min-height:110px; resize:vertical;
}
.plan-followup:focus{outline:2px solid var(--mimeo); outline-offset:1px;}

.toast{
  position:fixed; bottom:18px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:var(--paper); font-family:var(--font-display); font-weight:700;
  font-size:12px; letter-spacing:.02em; padding:9px 16px; border-radius:8px;
  opacity:0; pointer-events:none; transition:all .2s ease; z-index:100;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:var(--line-strong); border-radius:5px;}
::-webkit-scrollbar-track{background:transparent;}

<script>
/* ============================================================
 DATA — placeholder / seed content. Replace and expand freely.
 ============================================================ */
const STEPS = [
  {id:'research',  num:1, label:'Research Fit'},
  {id:'cost',      num:2, label:'Cost Fit'},
  {id:'catalog',   num:3, label:'Goods Catalog'},

  {id:'send',      num:5, label:'How to Send'},
  {id:'followup',  num:6, label:'Messaging'},
];

const COST_TIERS = [
  {id:'low',  name:'Low-Cost / Mass',        range:'$1 - $15',   tableLabel:'Low Cost',  principle:'Cheap enough to send to hundreds without a second thought - used to open a lot of doors at once.'},
  {id:'mid',  name:'Mid-Tier / Targeted',    range:'$15 - $50',  tableLabel:'Mid Cost',  principle:'Reserved for accounts that have shown some signal - a named shortlist, not a mass blast.'},
  {id:'high', name:'High-Touch / Strategic', range:'$50+',       tableLabel:'High Cost', principle:'Only for accounts worth real 1:1 effort - big deal size or a champion you need to win over.'},
];

const SIZES = [
  {id:'small',  name:'Small',  desc:'Fits in an envelope or a small padded mailer - postcards, cards, and other flat or pocket-sized items.'},
  {id:'medium', name:'Medium', desc:'Ships in a standard box - mugs, books, boxed gadgets, and similar single-item sends.'},
  {id:'large',  name:'Large',  desc:'Bulkier sends - hampers, multi-item bundles, and anything that needs a bigger box.'},
];

const SEED_GOODS = [
  {id:'postcard', name:'Bespoke Postcard', size:'small', tier:'low', costRange:'$1 flat', category:'Opener / Mass', desc:'A custom-designed postcard, printed and mailed for $1 per person - cheap enough to send at real volume while still feeling personal.', whenToUse:'', examples:[]},
  {id:'burner-phone', name:'Prepaid Disposable Phone', size:'small', tier:'mid', costRange:'Under $30', category:'Timed / High-Impact', desc:'Ship a cheap prepaid phone with a note ("I\'ll call you at 10am") and call it the moment it\'s delivered - control the timing precisely by hand-delivering via FedEx yourself.', whenToUse:'', examples:[]},
  {id:'rubiks-cube', name:"Rubik's Cube", size:'small', tier:'low', costRange:'$8 - $15', category:'Puzzle / Curiosity', desc:'A classic Rubik\'s Cube, sent solved with a handwritten note tucked inside the box explaining the connection - something like: "Every [problem] looks like an unsolvable puzzle from the outside. I promise it\'s simpler than it looks - got 15 minutes to talk it through?" The puzzle sits on their desk as a reason to keep thinking about you.', whenToUse:'', examples:[]},
  {id:'candle', name:'Candle', size:'small', tier:'mid', costRange:'$20 - $35', category:'Relationship / Warm-up', desc:'A quality scented candle, sent with a short handwritten card explaining the gesture - something like: "Thought you could use a moment to breathe amid the [X] chaos - lit one for you. Hope it buys you a few minutes to hear me out." Works well as a warm-up send once there\'s already some signal, not a cold opener.', whenToUse:'', examples:[]},
  {id:'ship-in-bottle', name:'Ship in a Bottle', size:'medium', tier:'low', costRange:'$15 - $30', category:'Novelty / Craft', desc:'A miniature ship-in-a-bottle model, shipped boxed with a handwritten note tying the craft to the pitch - something like: "Built this to remind you - getting [outcome] right takes patience and the right hands. Would love 15 minutes to show you how we do it." The obvious care that goes into it is the point.', whenToUse:'', examples:[]},
  {id:'compass', name:'Compass', size:'small', tier:'low', costRange:'$10 - $18', category:'Direction / Metaphor', desc:'A small brass or pocket compass, sent with a handwritten note built around a "finding direction" angle - something like: "Figured you could use one more thing pointing you in the right direction this quarter. Got 15 minutes for me to show you where we\'d point yours?" A desk-drawer keepsake that keeps your name attached to a simple, positive idea.', whenToUse:'', examples:[]},
  {id:'mini-safe', name:'Mini Safe', size:'small', tier:'mid', costRange:'$25 - $45', category:'Security / Intrigue', desc:'A small combination lockbox or mini safe, sent locked with a handwritten note explaining the gimmick - something like: "Didn\'t want to just hand this over, so I locked it. Reply and I\'ll send the combination - it\'s worth the 15 minutes, I promise." Great when you want to add real intrigue to a shortlist send; pair with a small item or gift card inside as the payoff.', whenToUse:'', examples:[]},
  {id:'yo-yo', name:'Yo-Yo', size:'small', tier:'low', costRange:'$6 - $12', category:'Playful / Curiosity', desc:'A branded or novelty yo-yo, sent with a light, self-aware note - something like: "Sales can feel like this thing - up, down, up, down. Figured I\'d send something to fidget with while you read this. 15 minutes to talk about flattening the curve?" Cheap, memorable, and easy to send at real volume to a broader list.', whenToUse:'', examples:[]},
  {id:'chess-piece', name:'Chess Piece', size:'small', tier:'low', costRange:'$8 - $15', category:'Strategy / Metaphor', desc:'A single, weighty chess piece (often a knight or king), sent alone with a handwritten note built around a strategy angle - something like: "Every good move starts with seeing a few steps ahead. Wanted to send you this one piece as an opener - happy to bring the rest of the board to a quick call." Works especially well as a first touch to a strategic, senior-level contact.', whenToUse:'', examples:[]},
  {id:'magnifying-glass', name:'Magnifying Glass', size:'small', tier:'low', costRange:'$7 - $14', category:'Insight / Metaphor', desc:'A classic magnifying glass, sent with a handwritten note built around a "closer look" angle - something like: "Took a closer look at [Company] before reaching out - here\'s what stood out. Worth 15 minutes to see what else we found?" A simple prop that doubles as proof you actually did your research.', whenToUse:'', examples:[]},
  {id:'lego-kit', name:'Small Lego Kit', size:'medium', tier:'low', costRange:'$15 - $30', category:'Playful / Build Together', desc:'A small, self-contained Lego set, sent with a handwritten note built around a "building something" angle - something like: "Figured we could build something together - starting small. Got 15 minutes to talk through what we\'d build for [Company]?" Playful enough to stand out, and cheap enough to send to a real shortlist rather than just one account.', whenToUse:'', examples:[]},
  {id:'mini-cactus', name:'Mini Cactus', size:'small', tier:'low', costRange:'$8 - $16', category:'Low-Maintenance / Warm-up', desc:'A small potted cactus, sent with a handwritten note built around a "low-maintenance" angle - something like: "Low-maintenance, like this ask: just 15 minutes, no watering required. Figured this could sit on your desk while you think it over." Hard to throw away and sits in view for weeks, giving you a natural reason to check back in on how it\'s doing.', whenToUse:'', examples:[]},
  {id:'ai-portrait', name:'Framed AI Portrait', size:'medium', tier:'mid', costRange:'$30 - $50', category:'Personalized / Flattery', desc:'An AI-generated portrait of the recipient (built from a public headshot, styled to reflect something specific about them - their industry, a hobby, or an achievement), printed and framed, sent with a handwritten note explaining it - something like: "Had this made for you based on [specific detail] - hope it\'s a good likeness. Would love 15 minutes to explain why I went to the trouble." A highly personalized, hard-to-ignore piece that proves real research went into the send.', whenToUse:'', examples:[]},
  {id:'ai-tshirt', name:'Printed T-Shirt with AI Photo', size:'medium', tier:'low', costRange:'$15 - $28', category:'Personalized / Playful', desc:'A t-shirt printed with an AI-generated image of the recipient (styled around something specific to them - their industry, a hobby, or an in-joke from their own LinkedIn posts), sent with a handwritten note explaining it - something like: "Made you a shirt - figured you should have official merch for [specific detail]. Wear it well, and give me 15 minutes to explain myself." Cheaper and more playful than a framed portrait, and easy to send to a wider shortlist.', whenToUse:'', examples:[]},
  {id:'handwritten-note', name:'Handwritten Note', size:'small', tier:'low', costRange:'$1 - $5', category:'Opener / No-Gift', desc:'Just a genuinely handwritten note, no object attached - sent to explain plainly why you\'re reaching out, something like: "No gift here, just wanted to write this by hand so you know a real person is behind it. Noticed [specific detail about them or their company] and wanted 15 minutes to explain why I thought of you." The cheapest possible send in the whole catalog, and still one of the highest-signal - almost nobody gets real handwritten mail anymore.', whenToUse:'', examples:[]},
  {id:'flowers', name:'Flowers', size:'medium', tier:'mid', costRange:'$35 - $60', category:'Relationship / Classic', desc:'A flower arrangement delivered to their office, with a card explaining why it\'s showing up - something like: "Saw [specific reason - a win, an anniversary, a tough week] and wanted to send something to mark it. Would love 15 minutes when you have a moment." A classic, low-risk gesture that reads as thoughtful rather than salesy, especially well-timed around a trigger event.', whenToUse:'', examples:[]},
  {id:'logo-rug', name:'Custom Logo Rug', size:'medium', tier:'mid', costRange:'$40 - $70', category:'Bold / Office Presence', desc:'A custom rug printed or woven with their own company logo, shipped directly to their HQ. Send a card separately with a photo of the rug in place and a note explaining it - something like: "Figured your office could use a little more [Company] in it - sent this over for the entryway. Would love 15 minutes to tell you why." Bold enough to get talked about around the office, and the photo card means you don\'t have to wait to find out if it landed.', whenToUse:'', examples:[]},
  {id:'hamper', name:'Hamper', size:'large', tier:'mid', costRange:'$50 - $90', category:'Shared / Team', desc:'A curated hamper (snacks, drinks, or a themed mix) shipped to their office for the whole team to share, with a card explaining the gesture - something like: "This one\'s for the team, not just you - figured a hard week deserved something to share. Would still love 15 minutes of your time when things calm down." Built to be opened and passed around, so your name ends up mentioned to more people than just the recipient.', whenToUse:'', examples:[]},
  {id:'branded-merch', name:'Branded Merchandise', size:'medium', tier:'mid', costRange:'$25 - $45', category:'Bundle / Introduction', desc:'A small bundle of your own company\'s branded merch (e.g. a hoodie, water bottle, or notebook set), sent with a card explaining why - something like: "Wanted you to have a little [Your Company] gear before we\'ve even had a proper conversation. Would love 15 minutes to make it worth wearing." Doubles as quiet brand exposure every time they use it, and works well once you\'ve got some signal but haven\'t met yet.', whenToUse:'', examples:[]},
  {id:'rubber-duck', name:'Rubber Duck', size:'small', tier:'low', costRange:'£5 - £10', category:'Playful / Icebreaker', desc:'A simple rubber duck, sent with a light, self-aware note explaining it - something like: "Getting a straight answer out of [industry/problem] can feel like herding these things. Sent you one to keep on your desk - 15 minutes to talk through the real answer?" Cheap, silly, and disarming enough to get a reply even from a genuinely cold contact.', whenToUse:'', examples:[]},
  {id:'bobblehead', name:'Bobblehead', size:'medium', tier:'mid', costRange:'£40 - £70', category:'Personalization', desc:'A custom bobblehead made to look like the recipient, sent with a handwritten note explaining it - something like: "Had this made to look like you - hope it\'s a fair likeness. Would love 15 minutes to explain what prompted it." Unmistakably personal and impossible to mix up with generic swag, which makes it hard to ignore and easy to remember.', whenToUse:'', examples:[]},
  {id:'neon-sign', name:'Neon Sign', size:'large', tier:'mid', costRange:'$55+', category:'Bold / Office Statement', desc:'A custom LED neon-style sign (their name, company, or a short line tied to your pitch), shipped to their office with a note explaining it - something like: "Figured [Company] deserved something that lights up the room - literally. Would love 15 minutes to tell you why I sent it." Big, bold, and genuinely display-worthy, so it tends to stay up and keep getting noticed long after it arrives.', whenToUse:'', examples:[]},
  {id:'office-flag', name:'Custom Office Flag', size:'large', tier:'high', costRange:'£100 - £200', category:'Company Branding', desc:'A custom flag printed with their own company logo/colors, sized for an office flagpole or lobby stand, shipped with a note explaining the gesture - something like: "Wanted [Company] to have a flag worth flying - hope it earns a spot in the lobby. Would love 15 minutes to tell you why I went to the trouble." A high-effort, high-visibility send reserved for accounts worth the investment - the scale and permanence of it signal how seriously you take the relationship.', whenToUse:'', examples:[]},
  {id:'caricature', name:'Caricature', size:'medium', tier:'mid', costRange:'£35 - £60', category:'Personalization / Humor', desc:'A custom drawn (or AI-generated) caricature of the recipient, framed or printed, sent with a handwritten note explaining it - something like: "Had an artist take a crack at you - hope you can laugh at it as much as I did. Would love 15 minutes to make up for it." Playful rather than flattering, which makes it a good pick for lightening up a relationship that\'s felt a bit too formal.', whenToUse:'', examples:[]},
  {id:'vinyl-record', name:'Vinyl Record', size:'medium', tier:'mid', costRange:'$25 - $45', category:'Personalized / Flattery', desc:'A vinyl record curated to match their taste (sourced from a music mention in their bio, posts, or a podcast appearance), sent with a handwritten note explaining it - something like: "Saw you mentioned [artist/album] - figured you\'d want this on wax. Would love 15 minutes to talk shop once you\'ve given it a spin." A well-chosen record shows real research went into the send and tends to stay on display rather than get filed away.', whenToUse:'', examples:[]},
  {id:'branded-company-bags', name:'Branded Company Bags', size:'large', tier:'high', costRange:'$100+', category:'Bulk / Branding', desc:'Send a ton of branded bags their custom logo on the bags with a note attached', whenToUse:'', examples:[]},
];

const COST_QUESTIONS = [
  {id:'q1', type:'text', optional:true, prompt:'How has the prospect responded to the other forms of outreach? (if applicable)', placeholder:'e.g. opened every email but hasn’t replied yet...'},
  {id:'q2', row:true, prompt:'How large of an account do you believe this can be?', options:[

  {id:'q3', sub:'Does the founder seem very narrow, or are they a company that would likely appreciate a grand gesture? Research should give an accurate ‘vibe’ of the company as a whole.', prompt:'What is the general vibe of the company?', options:[

const RESEARCH_PROMPTS = [
  {id:'priorities6to12',  lens:'strategic', key:'priorities6to12',  label:'What are they obviously trying to accomplish in the next 6-12 months?', placeholder:'e.g. stated goal to expand into enterprise, mentioned in a recent interview...'},
  {id:'recentLaunches',   lens:'strategic', key:'recentLaunches',   label:'What have they recently launched, or are visibly doubling down on?', placeholder:'e.g. shipped a new pricing tier last month, posting about it weekly...'},

(function ensureTemplateIds(){
  Object.keys(TEMPLATE_BANK).forEach(sectionId=>{
    (TEMPLATE_BANK[sectionId]||[]).forEach(g=>{
      g.items.forEach((it,idx)=>{
        if(!it.id) it.id = sectionId + '__' + g.cat.replace(/\s+/g,'_') + '__' + idx;
      });
    });
  });
})();
function getAllTemplateItems(sectionId){
  const edits = customTemplateEdits[sectionId] || {};
  const deletes = customTemplateDeletes[sectionId] || [];
  const items = [];
  (TEMPLATE_BANK[sectionId]||[]).forEach(g=> g.items.forEach(it=>{
    if(deletes.indexOf(it.id)!==-1) return;
    const eff = Object.assign({cat:g.cat}, it, edits[it.id]||{});
    items.push(eff);
  }));
  (customTemplateAdds[sectionId]||[]).forEach(it=>{
    if(deletes.indexOf(it.id)!==-1) return;
    const eff = Object.assign({cat:'General'}, it, edits[it.id]||{}, {custom:true});
    items.push(eff);
  });
  return items;
}
function getCategoryList(sectionId){
  const set = new Set();
  getAllTemplateItems(sectionId).forEach(it=> set.add(it.cat||'General'));
  (customCategories[sectionId]||[]).forEach(c=> set.add(c));
  if(!set.size) set.add('General');
  return Array.from(set);
}
function getTemplateGroups(sectionId){
  const items = getAllTemplateItems(sectionId);
  return getCategoryList(sectionId).map(cat=> ({
    cat,
    items: items.filter(it=> (it.cat||'General')===cat),
  }));
}
function renameCategory(sectionId, oldName, newName){
  newName = (newName||'').trim();
  if(!newName || newName===oldName) return false;
  if(getCategoryList(sectionId).indexOf(newName)!==-1){ toast('That category already exists'); return false; }
  if(!customTemplateEdits[sectionId]) customTemplateEdits[sectionId] = {};
  (TEMPLATE_BANK[sectionId]||[]).forEach(g=> g.items.forEach(it=>{
    const effCat = (customTemplateEdits[sectionId][it.id] && customTemplateEdits[sectionId][it.id].cat) || g.cat;
    if(effCat===oldName){
      customTemplateEdits[sectionId][it.id] = Object.assign({}, customTemplateEdits[sectionId][it.id], {cat:newName});
    }
  }));
  (customTemplateAdds[sectionId]||[]).forEach(it=>{
    const effCat = (customTemplateEdits[sectionId][it.id] && customTemplateEdits[sectionId][it.id].cat) || it.cat || 'General';
    if(effCat===oldName) it.cat = newName;
  });
  customCategories[sectionId] = (customCategories[sectionId]||[]).map(c=> c===oldName?newName:c);
  persistCustomTemplateEdits(); persistCustomTemplateAdds(); persistCustomCategories();
  return true;
}
function deleteCategory(sectionId, name){
  if(name==='General'){ toast('General is the default category and can\'t be deleted'); return false; }
  if(!customTemplateEdits[sectionId]) customTemplateEdits[sectionId] = {};
  (TEMPLATE_BANK[sectionId]||[]).forEach(g=> g.items.forEach(it=>{
    const effCat = (customTemplateEdits[sectionId][it.id] && customTemplateEdits[sectionId][it.id].cat) || g.cat;
    if(effCat===name){
      customTemplateEdits[sectionId][it.id] = Object.assign({}, customTemplateEdits[sectionId][it.id], {cat:'General'});
    }
  }));
  (customTemplateAdds[sectionId]||[]).forEach(it=>{
    const effCat = (customTemplateEdits[sectionId][it.id] && customTemplateEdits[sectionId][it.id].cat) || it.cat || 'General';
    if(effCat===name) it.cat = 'General';
  });
  customCategories[sectionId] = (customCategories[sectionId]||[]).filter(c=> c!==name);
  persistCustomTemplateEdits(); persistCustomTemplateAdds(); persistCustomCategories();
  return true;
}
function addCategory(sectionId, name){
  name = (name||'').trim();
  if(!name){ toast('Give the category a name first'); return false; }
  if(getCategoryList(sectionId).indexOf(name)!==-1){ toast('That category already exists'); return false; }
  if(!customCategories[sectionId]) customCategories[sectionId] = [];
  customCategories[sectionId].push(name);
  persistCustomCategories();
  return true;
}

function loadPlan(){
  try{
    const p = JSON.parse(localStorage.getItem('physicalgoods_plan'));
    if(p && typeof p==='object'){
      delete p.researchAngle; delete p.researchAnswers; delete p.researchNotes;
      const merged = Object.assign(defaultPlan(), p);
      const emails = Array.isArray(merged.followupEmails) ? merged.followupEmails.slice(0,4) : [];
      while(emails.length < 4) emails.push({subject:'', body:''});
      merged.followupEmails = emails.map(em=> ({subject: (em&&em.subject)||'', body:(em&&em.body)||''}));
      return merged;
    }
  }catch(e){}
  return defaultPlan();
}
function persistPlan(){ localStorage.setItem('physicalgoods_plan', JSON.stringify(plan)); }

function loadCustomGoods(){
  try{
    const c = JSON.parse(localStorage.getItem('physicalgoods_custom_goods'));
    if(c && typeof c==='object') return {
      added: Array.isArray(c.added)?c.added:[],
      removed: Array.isArray(c.removed)?c.removed:[],
      edited: (c.edited && typeof c.edited==='object') ? c.edited : {},
    };
  }catch(e){}
  return {added:[], removed:[], edited:{}};
}
function persistCustomGoods(){ localStorage.setItem('physicalgoods_custom_goods', JSON.stringify(customGoods)); }
function getGoods(){
  return SEED_GOODS.filter(g=> customGoods.removed.indexOf(g.id)===-1).concat(customGoods.added)
    .map(g=> customGoods.edited[g.id] ? Object.assign({}, g, customGoods.edited[g.id]) : g);
}
function addGood(g){ customGoods.added.push(g); persistCustomGoods(); }
function deleteGood(id){
  if(SEED_GOODS.some(g=> g.id===id)){
    if(customGoods.removed.indexOf(id)===-1) customGoods.removed.push(id);
  } else {
    customGoods.added = customGoods.added.filter(g=> g.id!==id);
  }
  delete customGoods.edited[id];
  if(plan.good && plan.good.id===id){ plan.good = null; persistPlan(); }
  persistCustomGoods();
}
function editGood(id, updates){
  const addedIdx = customGoods.added.findIndex(g=> g.id===id);
  if(addedIdx !== -1){
    customGoods.added[addedIdx] = Object.assign({}, customGoods.added[addedIdx], updates);
  } else {
    customGoods.edited[id] = Object.assign({}, customGoods.edited[id], updates);
  }
  persistCustomGoods();
  if(plan.good && plan.good.id===id){
    plan.good = Object.assign({}, plan.good, {name: updates.name, tier: updates.tier, costRange: updates.costRange});
    persistPlan();
  }
}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 1600);
}
let _confirmResolve = null;
function showConfirm({title='Are you sure?', message='', confirmLabel='Confirm', cancelLabel='Cancel'} = {}){
  return new Promise((resolve)=>{
    _confirmResolve = resolve;
    document.getElementById('confirmTitle').textContent = title;
    document.getElementById('confirmMessage').textContent = message;
    document.getElementById('confirmOkBtn').textContent = confirmLabel;
    document.getElementById('confirmCancelBtn').textContent = cancelLabel;
    document.getElementById('confirmOverlay').classList.add('open');
    document.getElementById('confirmOkBtn').focus();
  });
}
function closeConfirm(result){
  const overlay = document.getElementById('confirmOverlay');
  if(!overlay.classList.contains('open')) return;
  overlay.classList.remove('open');
  if(_confirmResolve){ _confirmResolve(result); _confirmResolve = null; }
}

function stepStatus(id){
  if(id==='catalog')   return plan.good ? 'done' : 'pending';
  if(id==='cost')      return plan.costTier ? 'done' : 'pending';
  if(id==='research'){
    return findingsCount()>0 ? 'done' : 'pending';
  }
  if(id==='checklist'){
    const n = Object.values(plan.checklist).filter(Boolean).length;
    if(n===0) return 'pending';
    return n>=PACKAGE_CHECKLIST.length ? 'done' : 'progress';
  }
  if(id==='send')      return plan.sendMethod ? 'done' : 'pending';
  if(id==='followup'){
    const total = MESSAGE_SECTIONS.filter(s=> s.id!=='followup').length + 1;
    let filled = MESSAGE_SECTIONS.filter(s=> s.id!=='followup' && (plan[s.id]||'').trim()).length;
    if(plan.followupEmails.some(em=> em.subject.trim() || em.body.trim())) filled++;
    if(filled===0) return 'pending';
    return filled>=total ? 'done' : 'progress';
  }
  return 'pending';
}
function doneStepCount(){ return STEPS.filter(s=>stepStatus(s.id)==='done').length; }

function renderNav(){
  const html = `<div class="nav-group">
    <div class="nav-group-label">Builder</div>
    ${STEPS.map(s=>{
      const status = stepStatus(s.id);
      const mark = status==='done' ? '✓' : '';
      return `<button class="step-item ${status} ${s.id===activeStep?'active':''}" data-step="${s.id}">
        <span class="step-num">${mark || s.num}</span>
        <span class="step-label">${esc(s.label)}</span>
      </button>`;
    }).join('')}
  </div>`;
  document.getElementById('navGroups').innerHTML = html;
  document.querySelectorAll('.step-item').forEach(b=> b.addEventListener('click', ()=> setActiveStep(b.dataset.step)));
}
function renderProgress(){
  const n = doneStepCount();
  document.getElementById('progressLabel').textContent = n + '/' + STEPS.length;
  document.getElementById('progressFill').style.width = (n/STEPS.length*100) + '%';
}

/* ============================================================
 GENERIC QUIZ ENGINE (used by Cost Fit + Research Fit)
 ============================================================ */
function scoreQuiz(questions, answers){
  const scores = {};
  questions.forEach(q=>{
    if(q.type==='text') return;
    const picked = answers[q.id];
    if(picked==null) return;
    const opt = q.options[picked];
    Object.entries(opt.points||{}).forEach(([k,v])=>{ scores[k] = (scores[k]||0) + v; });
  });
  return scores;
}
function topScoreId(scores, orderedIds){
  let best = null, bestScore = -1;
  orderedIds.forEach(id=>{
    const s = scores[id] || 0;
    if(s > bestScore){ best = id; bestScore = s; }
  });
  return best;
}

function quizQuestionsHtml(questions, answers){

      return `<div class="quiz-q">

      </div>`;
    }
    return `
    <div class="quiz-q">
      <div class="qtext">${esc(q.prompt)}</div>
      ${sub}
      <div class="quiz-opts ${q.row?'row':''}" role="radiogroup">
        ${q.options.map((o,i)=>`
          <div class="quiz-opt ${answers[q.id]===i?'picked':''}" data-q="${escAttr(q.id)}" data-opt="${i}"

            <span class="dot"></span><span class="otext">${esc(o.label)}</span>
          </div>`).join('')}
      </div>
    </div>`;
  }).join('');
}
function wireQuizOptions(questions, answers, rerenderFn){
  const pick = (el)=>{
    answers[el.dataset.q] = parseInt(el.dataset.opt, 10);
    persistPlan();
    rerenderFn();
  };
  document.querySelectorAll('.quiz-opt').forEach(el=>{
    el.addEventListener('click', ()=> pick(el));
    el.addEventListener('keydown', (e)=>{
      if(e.key==='Enter' || e.key===' '){ e.preventDefault(); pick(el); }
    });
  });
  document.querySelectorAll('.quiz-text').forEach(el=> el.addEventListener('input', ()=>{
    answers[el.dataset.q] = el.value;
    persistPlan();
  }));
}

function renderFollowupStep(){
  let html = pageHeaderHtml('Step 6 of 6', 'Messaging', 'The three moments of contact around the send - before it lands, inside the box, and after it lands.');

  html += renderMsgFlowHtml();

  html += `<div class="msg-sections">` + MESSAGE_SECTIONS.filter(s=> s.id!=='followup' && s.id!=='publicPosting').map(msgCardHtml).join('') + `</div>`;

  html += `<div class="msg-sections">` + msgCardHtml(MESSAGE_SECTIONS.find(s=> s.id==='publicPosting')) + `</div>`;

  html += `<div class="msg-sections">` + renderFollowupEmailsHtml() + `</div>`;

  html += stepNavHtml();

  document.getElementById('content').innerHTML = html;
  wireStepNav(document);
  document.querySelectorAll('[data-tpl-open]').forEach(b=> b.addEventListener('click', ()=> openTemplateModal(b.dataset.tplOpen)));
  document.querySelectorAll('[data-followup-open]').forEach(b=> b.addEventListener('click', ()=> openFollowupEmailModal(parseInt(b.dataset.followupOpen,10))));
  document.querySelectorAll('[data-optional-toggle]').forEach(b=>{
    const toggle = (e)=>{
      e.stopPropagation();
      const id = b.dataset.optionalToggle;
      optionalExpanded[id] = !optionalExpanded[id];
      renderFollowupStep();
    };
    b.addEventListener('click', toggle);
    if(b.getAttribute('role')==='button'){
      b.addEventListener('keydown', (e)=>{
        if(e.key==='Enter' || e.key===' '){ e.preventDefault(); toggle(e); }
      });
    }
  });
  MESSAGE_SECTIONS.filter(s=> s.id!=='followup').forEach(s=>{
    const el = document.getElementById(`msg-${s.id}`);
    if(!el) return;
    el.addEventListener('input', ()=>{
      plan[s.id] = el.value;
      persistPlan();
      document.getElementById(`msgCount-${s.id}`).textContent = el.value.length + ' character' + (el.value.length===1?'':'s');
      renderNav(); renderProgress(); renderPlanPanel();
    });
    if(s.hasSubject){
      const subjEl = document.getElementById(`msgSubject-${s.id}`);
      subjEl.addEventListener('input', ()=>{
        plan[s.id + 'Subject'] = subjEl.value;
        persistPlan();
      });
    }
  });
  document.querySelectorAll('[data-msg-save]').forEach(b=> b.addEventListener('click', ()=>{
    const id = b.dataset.msgSave;
    const section = MESSAGE_SECTIONS.find(s=> s.id===id);
    if(section.hasSubject) plan[id + 'Subject'] = document.getElementById(`msgSubject-${id}`).value;
    plan[id] = document.getElementById(`msg-${id}`).value;
    persistPlan();
    toast('Email saved');
    renderNav(); renderProgress(); renderPlanPanel();
  }));
}
