<title>Cold Email Bank</title>
<link rel="icon" type="image/png" href="logo.png">
<style id="app-styles">
:root{
  --paper:#FFFFFF; --paper-raised:#FFFFFF; --paper-tab:#FFFFFF;
  --ink:#14181B; --ink-soft:#5B6560; --ink-faint:#8A938D;
  --stamp:#1E6B45; --stamp-ink:#FFFFFF;
  --mimeo:#2F8F5B; --mimeo-ink:#E6F4EC;
  --line:#E4E9E6; --line-strong:#CCD5D0;
  --good:#2F8F5B; --warn:#B4691A;
  --shadow: 0 1px 0 rgba(20,24,27,.03), 0 8px 20px -12px rgba(20,24,27,.14);
  --radius: 8px;
  --sidebar-w: 380px;
  --font-display: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Courier New', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--font-body); font-size:14.5px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

/* ---------- site topbar: back to Outreach Tools + account ---------- */
.site-topbar-accent{height:4px; background:#231F2E; flex:0 0 auto;}
.site-topbar{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:12px 20px; border-bottom:1px solid var(--line); flex:0 0 auto;
  font-family:var(--font-display);
}
.site-topbar .back-link{
  display:flex; align-items:center; gap:6px;
  color:var(--ink-soft); font-size:13.5px; text-decoration:none; white-space:nowrap;
}
.site-topbar .back-link:hover{color:var(--ink);}
.site-topbar h1{font-size:16px; margin:0; font-weight:700; text-align:center; flex:1 1 auto;}
.site-topbar .who{display:flex; align-items:center; gap:14px; white-space:nowrap;}
.site-topbar .who span{color:var(--ink-soft); font-size:13px; font-family:var(--font-body);}
.site-topbar .signout{
  background:var(--paper); border:1px solid var(--line-strong); border-radius:6px;
  padding:6px 12px; font-size:12.5px; font-weight:600; color:var(--ink); cursor:pointer;
  font-family:var(--font-body);
}
.site-topbar .signout:hover{background:#F7F8F7;}
body{display:flex; flex-direction:column;}
::selection{background:var(--mimeo); color:var(--mimeo-ink);}
a{color:inherit;}
button{font-family:inherit;}
svg{display:block;}
.eyebrow{
  font-family:var(--font-display); font-weight:700; text-transform:uppercase;
  letter-spacing:.08em; font-size:11px; color:var(--ink-faint);
}

/* ---------- app shell: full-height sidebar + content ---------- */
#app{
  display:grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  grid-template-areas: "rail main";
  flex:1 1 auto; min-height:0;
  overflow:hidden;
}
@media (max-width: 980px){
  #app{
    grid-template-columns: 1fr;
    grid-template-areas: "main";
  }
  nav#rail{
    position:fixed; inset:0 auto 0 0; width:340px; max-width:88vw; z-index:50;
    transform:translateX(-100%); transition:transform .2s ease; box-shadow:0 0 0 rgba(0,0,0,0);
  }
  nav#rail.open{transform:translateX(0); box-shadow:20px 0 40px -20px rgba(0,0,0,.35);}
}

/* ---------- sidebar ---------- */
nav#rail{
  grid-area:rail; background:var(--paper-tab); border-right:1px solid var(--line);
  display:flex; flex-direction:column; overflow:hidden; min-height:0;
}
.sidebar-logo{display:flex; align-items:center; gap:10px; padding:20px 18px 16px;}
.logo-mark{
  display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  width:28px; height:28px; border-radius:7px; background:var(--stamp); color:var(--stamp-ink);
  font-family:var(--font-display); font-weight:800; font-size:11.5px;
}
.logo-text{line-height:1.25;}
.logo-name{font-family:var(--font-display); font-weight:800; font-size:15px; color:var(--ink); letter-spacing:-.01em;}
.logo-sub{font-family:var(--font-display); font-size:11.5px; color:var(--ink-faint);}
.sidebar-search{padding:0 14px 14px;}
.sidebar-search .box{
  display:flex; align-items:center; gap:8px; background:var(--paper); border:1px solid var(--line);
  border-radius:var(--radius); padding:8px 10px;
}
.sidebar-search .box svg{color:var(--ink-faint); flex:0 0 auto;}
.sidebar-search input{
  border:none; background:transparent; outline:none; color:var(--ink); width:100%;
  font-family:var(--font-body); font-size:13px;
}
/* rail-scroll holds the section nav + Draft Sheet as one continuous, independently scrolling column */
.rail-scroll{flex:1 1 auto; min-height:0; overflow-y:auto;}
.nav-groups{padding:6px 10px 4px;}
.nav-group{margin-bottom:16px;}
.nav-group-label{
  font-family:var(--font-display); font-weight:700; text-transform:uppercase; letter-spacing:.08em;
  font-size:10.5px; color:var(--ink-faint); padding:6px 8px 4px;
}
.nav-item{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:8px 8px; border:none; background:transparent; color:var(--ink-soft);
  font-family:var(--font-body); font-size:13.5px; cursor:pointer; border-radius:7px; margin-bottom:1px;
  transition:background-color .12s ease;
}
.nav-item svg{flex:0 0 auto; color:var(--ink-faint);}
.nav-item:hover{background:var(--paper);}
.nav-item.active{background:var(--mimeo-ink); color:var(--stamp); font-weight:600;}
.nav-item.active svg{color:var(--stamp);}
.nav-item .count{
  margin-left:auto; font-family:var(--font-display); font-size:11px; color:var(--ink-faint);
}
.nav-item.active .count{color:var(--stamp);}

/* ---------- rail divider: clear break between section nav and the Draft Sheet ---------- */
.rail-divider{
  position:relative; display:flex; align-items:center; justify-content:space-between; gap:10px;
  margin:14px 14px 10px; padding-top:18px; border-top:1.5px solid var(--line-strong);
}
.rail-divider::before{
  content:''; position:absolute; top:-1.5px; left:0; width:38px; height:1.5px; background:var(--stamp);
}
.rail-divider .eyebrow{color:var(--stamp); font-size:11px;}
.rail-divider .rd-clear{
  font-family:var(--font-display); font-weight:700; font-size:10.5px; color:var(--ink-faint);
  background:transparent; border:1px solid var(--line-strong); border-radius:999px; padding:4px 11px; cursor:pointer;
  transition:border-color .15s ease, color .15s ease;
}
.rail-divider .rd-clear:hover{border-color:var(--warn); color:var(--warn);}

.sidebar-footer{
  flex:0 0 auto; border-top:1px solid var(--line); padding:11px 14px;
  display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--paper-tab);
}
.rail-close-mobile{display:none;}
@media (max-width:980px){
  .rail-close-mobile{display:flex; margin-left:auto;}
}
.mobile-topbar{display:none;}
@media (max-width:980px){
  .mobile-topbar{
    display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line);
    background:var(--paper-raised);
  }
}

/* ---------- main content + page header ---------- */
main#content-col{grid-area:main; display:flex; flex-direction:column; overflow:hidden; min-width:0; min-height:0; height:100%;}
#content{
  flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden;
  padding:0 30px 60px; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
}
@media (max-width:640px){
  #content{padding:0 16px 50px;}
  .page-header{padding:18px 16px 14px; margin:0 -16px 16px;}
  .page-header h1{font-size:20px;}
}
.page-header{
  position:sticky; top:0; z-index:5; background:var(--paper); padding:26px 30px 16px; margin:0 -30px 18px;
  border-bottom:1px solid var(--line);
}
.page-header .ph-top{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap;}
.page-header h1{
  font-family:var(--font-display); font-weight:800; letter-spacing:-.01em;
  font-size:24px; margin:0 0 4px; color:var(--ink); text-wrap:balance;
}
.page-header .ph-sub{margin:0; color:var(--ink-soft); font-size:13.5px; max-width:64ch;}
.ph-actions{display:flex; gap:8px; flex:0 0 auto;}
.frank-brothers-heading{
  font-family:var(--font-display); font-weight:800; letter-spacing:-.01em;
  font-size:24px; margin:8px 0 18px; color:var(--ink); text-wrap:balance;
}
.page-header .searchbar{margin:16px 0 0;}

.searchbar{
  display:flex; align-items:center; gap:8px;
  background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius);
  padding:9px 12px; max-width:420px;
}
.searchbar svg{color:var(--ink-faint); flex:0 0 auto;}
.searchbar input{
  border:none; background:transparent; outline:none; color:var(--ink);
  font-family:var(--font-body); font-size:13.5px; width:100%;
}
.searchbar .count{font-family:var(--font-display); font-size:11px; color:var(--ink-faint); white-space:nowrap;}

.chiprow{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px;}
.chip{
  font-family:var(--font-display); font-size:12.5px; font-weight:700; text-transform:uppercase;
  letter-spacing:.03em; padding:9px 16px; border-radius:999px; border:1px solid var(--line);
  background:var(--paper-raised); color:var(--ink-soft); cursor:pointer;
  text-align:center; transition:border-color .15s ease, background .15s ease, color .15s ease;
}
.chip:hover{border-color:var(--accent, var(--mimeo)); color:var(--ink);}
.chip.active{background:var(--accent, var(--mimeo)); color:#fff; border-color:var(--accent, var(--mimeo));}
.chip-dot{display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; vertical-align:middle;}

.section-cards{display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:12px; margin-bottom:20px;}
.section-card{
  position:relative; text-align:left; cursor:pointer; border-radius:14px; border:1.5px solid var(--line);
  background:var(--paper-raised); padding:16px 18px; transition:border-color .15s ease, background .15s ease, transform .1s ease, box-shadow .15s ease;
}
.section-card:hover{border-color:var(--accent, var(--mimeo)); transform:translateY(-1px); box-shadow:0 3px 10px rgba(0,0,0,.06);}
.section-card .sc-title{
  display:flex; align-items:center; gap:8px; font-family:var(--font-display); font-weight:700;
  font-size:14.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink); margin-bottom:5px;
}
.section-card .sc-check{
  width:18px; height:18px; border-radius:50%; border:1.5px solid var(--line); flex:0 0 auto;
  display:flex; align-items:center; justify-content:center; transition:background .15s ease, border-color .15s ease;
}
.section-card .sc-check svg{width:11px; height:11px; opacity:0; transition:opacity .15s ease;}
.section-card .sc-desc{font-size:12.5px; line-height:1.45; color:var(--ink-soft); font-weight:400; text-transform:none; letter-spacing:normal;}
.section-card.active{border-color:var(--accent, var(--mimeo)); background:var(--accent-tint, var(--mimeo-ink)); box-shadow:0 3px 10px rgba(0,0,0,.05);}
.section-card.active .sc-title{color:var(--accent, var(--mimeo));}
.section-card.active .sc-check{background:var(--accent, var(--mimeo)); border-color:var(--accent, var(--mimeo));}
.section-card.active .sc-check svg{opacity:1;}

.group-title{
  font-family:var(--font-display); font-weight:700; text-transform:uppercase; letter-spacing:.05em;
  font-size:12px; color:var(--stamp); margin:26px 0 10px; padding-top:14px; border-top:1px solid var(--line);
}
.group-title:first-of-type{border-top:none; margin-top:0; padding-top:0;}

/* ---------- cards ---------- */
.card{
  background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); margin-bottom:10px; overflow:hidden;
  transition:border-color .15s ease, box-shadow .15s ease;
}
.card:hover{border-color:var(--accent, var(--stamp));}
.card.open{border-color:var(--accent, var(--stamp));}
.card .card-head{
  display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
  padding:14px 16px; cursor:pointer;
}
.card .card-head h3{
  margin:0 0 3px; font-family:var(--font-display); font-weight:700; font-size:14px;
  letter-spacing:0; color:var(--ink);
}
.card .card-head .desc{margin:0; font-size:12.5px; color:var(--ink-soft);}
.card .card-body{padding:0 16px 16px; display:none;}
.card.open .card-body{display:block;}
.card .caret{
  font-family:var(--font-mono); color:var(--ink-faint); font-size:14px; line-height:1;
  flex:0 0 auto; width:24px; height:24px; border-radius:50%; border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; margin-top:1px;
  transition:transform .2s ease, border-color .15s ease, color .15s ease;
}
.card:hover .caret{border-color:var(--accent, var(--stamp)); color:var(--accent, var(--stamp));}
.card.open .caret{transform:rotate(45deg); border-color:var(--accent, var(--stamp)); color:var(--accent, var(--stamp));}

.tpl-block{margin:10px 0;}
.tpl-block .label{
  font-family:var(--font-display); font-weight:700; text-transform:uppercase; font-size:10.5px;
  letter-spacing:.06em; color:var(--ink-faint); margin-bottom:5px;
}
.tpl-text{
  font-family:var(--font-mono); font-size:12.4px; line-height:1.55; white-space:pre-wrap;
  background:var(--paper); border:1px solid var(--line); border-left:3px solid var(--mimeo);
  padding:10px 12px; border-radius:6px;
}
.tpl-text mark{background:transparent; color:var(--stamp); font-weight:700;}
ul.bullets{margin:4px 0; padding-left:18px;}
ul.bullets li{margin:3px 0; font-size:13px; color:var(--ink);}
.tip{
  font-size:12.8px; background:var(--mimeo-ink); border:1px solid var(--line);
  border-radius:6px; padding:8px 10px; margin-top:8px;
}
.tip b{color:var(--mimeo);}
.prompt-box{
  font-family:var(--font-mono); font-size:11.6px; color:var(--ink-soft); white-space:pre-wrap;
  background:var(--paper); border:1px dashed var(--line-strong); padding:9px 10px; border-radius:6px;
}
.rowbtns{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
.btn{
  font-family:var(--font-display); font-weight:700; letter-spacing:0;
  font-size:12.5px; padding:8px 14px; border-radius:999px; cursor:pointer; border:1px solid var(--line);
  background:var(--paper-raised); color:var(--ink);
}
.btn:hover{border-color:var(--line-strong);}
.btn.primary{background:var(--stamp); color:var(--stamp-ink); border-color:var(--stamp);}
.btn.primary:hover{filter:brightness(1.06);}
.btn.danger{background:var(--warn); color:#fff; border-color:var(--warn);}
.btn.danger:hover{filter:brightness(1.06);}
.btn.ghost{background:transparent;}
.btn.small{padding:5px 10px; font-size:11px;}

.field-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:10px 0;}
@media (max-width:640px){.field-grid{grid-template-columns:1fr;}}
.field label{
  display:block; font-family:var(--font-mono); font-size:11px; color:var(--mimeo); margin-bottom:3px;
}
.field input{
  width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:6px;
  background:var(--paper); color:var(--ink); font-family:var(--font-mono); font-size:12.5px;
}
.field input:focus{outline:2px solid var(--mimeo); outline-offset:1px;}
.live-fill{background:var(--paper); border:1px solid var(--line); border-left:3px solid var(--stamp); border-radius:6px; padding:10px 12px; margin-top:10px;}
.live-fill .label{color:var(--stamp);}

/* ---------- snippet list (email bank / word banks) ---------- */
.snip-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:8px;}
.snip{
  background:var(--paper-raised); border:1px solid var(--line); border-radius:8px;
  padding:9px 10px; display:flex; align-items:flex-start; justify-content:space-between; gap:8px;
  transition:border-color .15s ease, box-shadow .15s ease;
}
.snip:hover{border-color:var(--accent, var(--mimeo)); box-shadow:0 2px 10px -6px rgba(20,24,27,.25);}
.snip .txt{font-size:13px; line-height:1.4;}
.snip .txt small{display:block; font-family:var(--font-mono); font-size:10px; color:var(--ink-faint); margin-top:2px;}
.snip .avoid-flag{color:var(--warn); font-weight:800; margin-right:4px;}
.snip button.add, table.ref-table button.add{
  flex:0 0 auto; width:24px; height:24px; border-radius:50%; border:1px solid var(--accent, var(--mimeo));
  background:transparent; color:var(--accent, var(--mimeo)); cursor:pointer; font-size:14px; line-height:1;
  transition:background .15s ease, color .15s ease;
}
.snip button.add:hover, table.ref-table button.add:hover{background:var(--accent, var(--mimeo)); color:#fff;}
table.ref-table th:last-child, table.ref-table td:last-child{width:36px; padding-left:4px; padding-right:8px;}
.word-chip{
  display:inline-flex; align-items:center; gap:5px; background:var(--paper-raised);
  border:1px solid var(--line); border-radius:999px; padding:4px 6px 4px 12px; margin:3px 4px 3px 0;
  cursor:pointer; font-size:13px;
}
.word-chip:hover{border-color:var(--accent, var(--mimeo));}
.word-chip .w{font-weight:700;}
.word-chip .m{color:var(--ink-faint); font-size:11px;}
.word-chip button.add{
  flex:0 0 auto; width:20px; height:20px; border-radius:50%; border:1px solid var(--accent, var(--mimeo));
  background:transparent; color:var(--accent, var(--mimeo)); cursor:pointer; font-size:13px; line-height:1; padding:0;
  transition:background .15s ease, color .15s ease;
}
.word-chip button.add:hover{background:var(--accent, var(--mimeo)); color:#fff;}
.avoid-chip{
  display:inline-flex; align-items:center; gap:4px; background:transparent;
  border:1px solid var(--line); border-radius:999px; padding:4px 10px; margin:3px 4px 3px 0;
  font-size:12.5px; color:var(--ink-soft);
}
.avoid-chip::before{content:"X"; color:var(--warn); font-weight:800; font-size:10px;}

table.ref-table{width:100%; border-collapse:collapse; font-size:12.8px; margin:8px 0;}
table.ref-table th{
  text-align:left; font-family:var(--font-display); text-transform:uppercase; font-size:10.5px;
  letter-spacing:.04em; color:var(--ink-faint); border-bottom:1px solid var(--line-strong); padding:8px;
}
table.ref-table td{border-bottom:1px solid var(--line); padding:8px; vertical-align:top;}
.table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:8px;}

/* ---------- rules & principles ---------- */
.person-subhead{
  --accent: var(--stamp); --accent-tint: var(--mimeo-ink);
  display:flex; align-items:center; gap:8px;
  font-family:var(--font-display); font-weight:800; font-size:13.5px; color:var(--accent);
  margin:24px 0 8px; padding-top:16px; border-top:1px solid var(--line);
}
.person-subhead:first-child{margin-top:0; padding-top:0; border-top:none;}
.person-subhead .mini-avatar{
  flex:0 0 auto; width:21px; height:21px; border-radius:50%; background:var(--accent-tint); color:var(--accent);
  display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:800;
}
.rule-card{
  padding:16px 18px; margin:0 0 10px; border:1px solid var(--line); border-radius:10px;
  background:var(--paper); max-width:680px;
}
.rule-card:last-child{margin-bottom:0;}
.rule-card .rule-title{
  font-family:var(--font-display); font-weight:700; font-size:14.5px; line-height:1.35; color:var(--ink);
  margin-bottom:5px;
}
.rule-card .rule-source{
  display:block; font-family:var(--font-mono); font-weight:400; font-size:10.5px; color:var(--ink-faint);
  margin:2px 0 0; text-transform:none; letter-spacing:.01em;
}
.rule-card .rule-body{font-size:14px; line-height:1.7; color:var(--ink-soft);}
.rule-card .rule-example{
  font-family:var(--font-mono); font-size:12.5px; line-height:1.55; color:var(--stamp);
  background:var(--mimeo-ink); padding:8px 11px; border-radius:6px; margin-top:10px;
}
.modal-box.fullscreen .rule-card{max-width:720px;}

/* ---------- checklist ---------- */
.check-item{
  display:flex; gap:11px; align-items:flex-start; padding:10px 12px; border-radius:8px;
  margin:0 0 3px; transition:background .12s ease;
}
.check-item:hover{background:var(--paper);}
.check-item.done{background:var(--mimeo-ink);}
.check-item input[type=checkbox]{
  margin-top:2px; width:18px; height:18px; accent-color:var(--good); cursor:pointer; flex:0 0 auto;
}
.check-item label{font-size:13.5px; flex:1; cursor:pointer;}
.check-item.done label{color:var(--ink-faint); text-decoration:line-through;}
.check-item.chips{flex-wrap:wrap;}
.check-item.chips label{flex:0 1 auto;}
.check-chips{flex:1 1 100%; margin-left:29px;}
.check-item.chips.done .check-chips{opacity:.5;}
.progress-bar-row{display:flex; align-items:center; gap:10px; margin:8px 0 18px;}
.progress-bar{flex:1 1 auto; height:8px; background:var(--paper); border:1px solid var(--line); border-radius:999px; overflow:hidden;}
.progress-bar .fill{height:100%; background:var(--good); width:0%; transition:width .2s; border-radius:999px;}
.progress-bar-label{flex:0 0 auto; font-family:var(--font-display); font-weight:700; font-size:11px; color:var(--ink-faint); white-space:nowrap;}

/* ---------- draft sheet (lives in the rail, beneath the section nav) ---------- */
.dp-body{padding:2px 14px 16px;}
.wc{font-family:var(--font-display); font-size:11px; color:var(--ink-faint); white-space:nowrap;}

.email-slot{
  border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:12px;

.es-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:7px;}

  font-size:10.5px; color:var(--stamp);
}
.es-remove{
  border:none; background:none; color:var(--ink-faint); font-family:var(--font-display);
  font-size:10.5px; cursor:pointer; text-decoration:underline;
}
.es-remove:hover{color:var(--warn);}
.es-subject, .es-body{
  width:100%; border:1px solid var(--line); border-radius:6px; background:var(--paper-raised);
  color:var(--ink); font-family:var(--font-mono); box-sizing:border-box;
}
.es-subject{padding:7px 9px; font-size:12px; margin-bottom:7px;}
.es-body{padding:8px 9px; font-size:12.5px; line-height:1.55; min-height:130px; resize:vertical;}
.es-subject:focus, .es-body:focus{outline:2px solid var(--mimeo); outline-offset:1px;}
.dp-body .rowbtns{margin:2px 0 16px;}
.saved-seq-block{border-top:1px solid var(--line); margin-top:4px; padding-top:14px;}
.saved-seq-item{
  border:1px solid var(--line); border-radius:8px; padding:9px 10px; margin-bottom:8px; background:var(--paper);
}
.saved-seq-item .ss-title{font-family:var(--font-display); font-weight:700; font-size:12.5px; color:var(--ink);}
.saved-seq-item .ss-meta{font-family:var(--font-display); font-size:10.5px; color:var(--ink-faint); margin:2px 0 6px;}
.saved-seq-item .ss-subjects{font-size:11.5px; color:var(--ink-soft); margin-bottom:8px;}
.saved-seq-item .ss-subjects div{margin:1px 0;}
.saved-seq-item .rowbtns{margin:0;}
.toast{
  position:fixed; bottom:18px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:var(--paper); font-family:var(--font-display); font-weight:700;
  font-size:12px; letter-spacing:.02em; padding:9px 16px; border-radius:8px;
  opacity:0; pointer-events:none; transition:all .2s ease; z-index:100;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:var(--line-strong); border-radius:5px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- category grid (Cold Email Bank landing) ---------- */
.cat-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; margin-top:8px;}
.cat-card{
  position:relative; text-align:left; border:1px solid var(--line); border-radius:var(--radius); background:var(--paper-raised);
  box-shadow:var(--shadow); padding:18px; cursor:pointer; display:flex; flex-direction:column; gap:6px;
}
.cat-card:hover{border-color:var(--stamp);}
a.cat-card, a.cat-card:visited{text-decoration:none; color:inherit;}
.cat-card-count{
  align-self:flex-start; font-family:var(--font-mono); font-size:11px; color:var(--mimeo);
  background:var(--mimeo-ink); border-radius:999px; padding:2px 10px;
}
.cat-card-title{font-family:var(--font-display); font-weight:800; font-size:16px; color:var(--ink);}
.cat-card-desc{font-size:12.5px; color:var(--ink-soft); line-height:1.4;}
.cat-card-icon{
  position:absolute; top:16px; right:16px; width:26px; height:26px; border-radius:7px;
  display:flex; align-items:center; justify-content:center; color:var(--stamp); background:var(--mimeo-ink);
}

/* ---------- source blocks (Cold Email Bank: per-person/brand grouping) ---------- */
.source-block{
  --accent: var(--stamp); --accent-tint: var(--mimeo-ink);
  border:1px solid var(--line); border-radius:12px; background:var(--paper-raised);
  padding:18px 20px 22px; margin:0 0 22px; border-left:4px solid var(--accent);
}
.source-block-head{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
.source-avatar{
  flex:0 0 auto; width:36px; height:36px; border-radius:50%; background:var(--accent-tint); color:var(--accent);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:800; font-size:12.5px; letter-spacing:.02em;
}
.source-block-name{font-family:var(--font-display); font-weight:800; font-size:17px; letter-spacing:-.01em; color:var(--ink);}
.source-block-meta{font-family:var(--font-display); font-size:11px; color:var(--ink-faint); margin-top:1px;}
.source-block .cat-grid{margin-top:0;}
.source-pill{
  display:inline-flex; align-items:center; gap:5px; font-family:var(--font-display); font-weight:700;
  font-size:10px; text-transform:uppercase; letter-spacing:.04em; padding:2px 9px 2px 7px; border-radius:999px;
  color:var(--accent, var(--stamp)); background:var(--accent-tint, var(--mimeo-ink));
}
.source-pill .dot{width:6px; height:6px; border-radius:50%; background:currentColor; flex:0 0 auto;}
.type-title{display:flex; align-items:center; gap:8px;}
.type-title .type-icon{color:var(--ink-faint); flex:0 0 auto;}

/* ---------- resources tab ---------- */
.resource-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:10px; margin:0 0 8px;}
.resource-card{
  display:flex; align-items:center; gap:12px; text-decoration:none; color:inherit;
  background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius);
  padding:12px 14px; box-shadow:var(--shadow);
  transition:border-color .15s ease, transform .15s ease, box-shadow .15s ease;
}
.resource-card:hover{border-color:var(--stamp); transform:translateY(-1px); box-shadow:0 4px 14px -8px rgba(20,24,27,.25);}
.resource-card:hover .resource-card-arrow{color:var(--stamp); transform:translate(1px,-1px);}
.resource-card-icon{
  flex:0 0 auto; width:38px; height:38px; border-radius:9px;
  display:flex; align-items:center; justify-content:center;
}
.resource-card-icon.doc{background:var(--mimeo-ink); color:var(--stamp);}
.resource-card-icon.yt{background:#FBE4E4; color:#C6362F;}
.resource-card-body{flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:2px;}
.resource-card-title{
  font-family:var(--font-display); font-weight:700; font-size:13.5px; color:var(--ink); line-height:1.3;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.resource-card-meta{
  font-family:var(--font-display); font-size:10.5px; font-weight:700; text-transform:uppercase;
  letter-spacing:.05em; color:var(--ink-faint);
}
.resource-card-arrow{flex:0 0 auto; color:var(--ink-faint); transition:color .15s ease, transform .15s ease;}

/* ---------- modal ---------- */
.modal-overlay{
  display:none; position:fixed; inset:0; background:rgba(20,24,27,.5); z-index:200;
  align-items:center; justify-content:center; padding:26px; backdrop-filter:blur(1px);
}
.modal-overlay.open{display:flex;}
.modal-overlay.fullscreen{padding:0;}
.modal-box{
  --accent: var(--stamp); --accent-tint: var(--mimeo-ink);
  background:var(--paper-raised); border-radius:14px; width:100%; max-width:920px; max-height:85vh;
  display:flex; flex-direction:column; overflow:hidden; box-shadow:0 24px 60px -20px rgba(0,0,0,.45);
  border-top:4px solid var(--accent);
}
.modal-head{
  display:flex; align-items:flex-start; justify-content:space-between; gap:16px;
  padding:20px 24px 16px; border-bottom:1px solid var(--line); flex:0 0 auto;
}
.modal-head-left{display:flex; align-items:flex-start; gap:12px; min-width:0;}
.modal-hero-icon{
  flex:0 0 auto; width:36px; height:36px; border-radius:10px; margin-top:1px;
  background:var(--accent-tint); color:var(--accent);
  display:flex; align-items:center; justify-content:center;
}
.modal-eyebrow{
  display:flex; align-items:center; font-family:var(--font-display); font-weight:700; text-transform:uppercase;
  letter-spacing:.06em; font-size:10.5px; color:var(--ink-faint);
}
.modal-accent-dot{flex:0 0 auto; display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--accent); margin-right:7px;}
.modal-head h2{font-family:var(--font-display); font-weight:800; font-size:20px; margin:2px 0 0; color:var(--ink); text-wrap:balance;}
.modal-head-actions{flex:0 0 auto; display:flex; align-items:center; gap:8px;}
.modal-close-btn{
  flex:0 0 auto; width:30px; height:30px; border-radius:50%; border:1px solid var(--line); background:var(--paper);
  color:var(--ink-soft); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;
  transition:background .15s ease, color .15s ease, border-color .15s ease;
}
.modal-close-btn:hover{background:#F7F8F7; color:var(--ink); border-color:var(--line-strong);}
.modal-scroll{flex:1 1 auto; min-height:0; overflow-y:auto; padding:0 24px 24px;}
.modal-scroll .searchbar{max-width:none;}
.modal-scroll .group-title:first-of-type{margin-top:0;}
.modal-box.fullscreen{
  max-width:none; max-height:none; width:100%; height:100%; border-radius:0;
}
.modal-box.fullscreen .modal-scroll{
  padding:0 max(24px, calc(50% - 420px)) 40px;
}
.modal-box.fullscreen .modal-head{
  padding:22px max(24px, calc(50% - 420px)) 18px;
}
@media (max-width:720px){
  .modal-overlay{padding:0;}
  .modal-box{max-width:none; max-height:none; height:100%; border-radius:0;}
  .modal-box.fullscreen .modal-scroll, .modal-box.fullscreen .modal-head{padding-left:24px; padding-right:24px;}
}

/* ---------- confirm dialog (replaces native confirm()) ---------- */
.confirm-overlay{
  display:none; position:fixed; inset:0; background:rgba(20,24,27,.5); z-index:300;
  align-items:center; justify-content:center; padding:26px;
}
.confirm-overlay.open{display:flex;}
.confirm-box{
  --accent: var(--warn);
  background:var(--paper-raised); border-radius:14px; width:100%; max-width:400px;
  box-shadow:0 24px 60px -20px rgba(0,0,0,.45); border-top:4px solid var(--accent);
  padding:22px 24px 20px; animation:confirmIn .15s ease;
}
@keyframes confirmIn{ from{opacity:0; transform:translateY(6px) scale(.98);} to{opacity:1; transform:none;} }
.confirm-icon{
  width:38px; height:38px; border-radius:10px; margin-bottom:12px;
  background:#FBEEE1; color:var(--accent); display:flex; align-items:center; justify-content:center;
}
.confirm-title{font-family:var(--font-display); font-weight:800; font-size:16.5px; color:var(--ink); margin:0 0 6px;}
.confirm-detail{font-size:13px; line-height:1.5; color:var(--ink-soft); margin:0;}
.confirm-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:20px;}
</style>

<script>
/* ============================================================
 DATA - filled in by subsequent edits (placeholders below)
 ============================================================ */
const TEMPLATES = [
{id:'poke-bear',group:'The $1M Templates',name:'Poke the Bear',desc:'A single, powerful question that forces a prospect to confront a hidden problem.',
template:`{{FirstName}} - ever considered the impact of {{specific problem}} from {{current solution/situation}} causing {{negative outcome}}?`,
example:`Penn - ever considered the impact of all the leads you might be missing from Smartlead failing to tag them?`,
theory:[`Triggers discomfort - forces acknowledgment of a problem they're ignoring.`,`FOMO - makes them feel they could be losing money/time.`,`Curiosity gap - hints at a problem without revealing all the detail.`,`Pattern disruptor - most outreach focuses on benefits; this focuses strictly on pain.`,`Observation, not accusation - neutral tone avoids defensiveness.`],
when:[`Heavily regulated industries (healthcare, finance) where oversights cause big headaches.`,`Consumer-facing brands (eCommerce, hospitality, fashion) where "wow moments" resonate.`,`Stagnant, traditional markets needing innovation.`],
tip:`A/B test adding a line that subtly infers pain: "I could be wrong, but what this could mean is {{insert assumed pain}}."`,
prompt:`I need help crafting a poke-the-bear question for cold outreach - a one-liner that makes the prospect realise they might be ignoring a critical problem, without being pushy. It should reference a specific tool/process they use, hint at a negative impact, stay curious not accusatory, and be under 15 words.
My business is: {{describe your business}} / My target customers are: {{describe your ideal customers}} / Their typical tools/processes include: {{list relevant tools/processes}} / The biggest issue they face is: {{describe the key problem they might be ignoring}}`},

{id:'storytelling',group:'The $1M Templates',name:'Storytelling',desc:'Paint a vivid, emotive picture of what could be.',
template:`{{FirstName}}, picture this... {{Set the scene with specific details}} {{Normal day starts}} But something's different. {{Build through series of wins}} {{Team/colleague reactions}} {{Industry impact}} {{Peak moment of success}} (Okay, maybe got carried away there) But that's exactly what we do for {{their industry}} through {{your solution}}. {{Ultra-soft CTA}}`,
example:`John, picture this... It's a crisp London morning. You're waiting for your coffee in Pret, scrolling through social media. New Naturecan campaign just went live. But something's different. Engagement is through the roof. Genevieve (your sales director) can't believe it. Your CBD products are flying off the shelf. Word's got out to Charlotte's Web and CBDistillery...they missed a trick. You'll think about this moment every time someone asks: how the hell did you build the most trusted organic wellness brand in not just the CBD space but across the entire natural health industry? (Okay, maybe a tad exaggerated). But that's the kinda mornings I create for awesome brands in London, through outreach campaigns that make your customers actually feel something, for once. When the time's right, I'd love Naturecan to be our next dance partner.`,
theory:[`Narrative transportation bias - mental barriers drop when delivered as a story.`,`Ego - prospect positioned as the hero.`,`Emotional excitement - vivid, specific details make the vision feel real.`,`Disarms with humour - the bracketed disclaimer builds trust and relatability.`,`Pattern disruptor - no CTA, which drops defensiveness while creating intrigue.`],
when:[`High-competition markets needing to emphasise a dramatic difference.`,`Visionary leaders at scale-ups (50-500 employees) itching for a breakout moment.`],
tip:`It's a long message - use short, snappy sentences at the start, and sensory details ("crisp morning," "blowing up with notifications") to make it vivid.`,
prompt:`Help craft a storytelling-style cold outreach message that paints a vivid picture of future success, using specific details about the prospect's business to make them the hero. Set a specific scene, use real team member names, reference actual competitors, build through multiple wins, create genuine excitement, end with a soft casual CTA, include a playful disclaimer.
My business is: {{describe your business}} / Target customer: {{describe ideal customer}} / Their team members: {{list key people}} / Their competitors: {{list main competitors}} / Their typical goals: {{list key objectives}} / Their location/office: {{describe where they work}}`},

{id:'cryptic-idea',group:'The $1M Templates',name:'Cryptic Idea',desc:"Drop a teaser that's too good to ignore.",
template:`Hi {{FirstName}}, I've got something for you. I gather {{company}} {{what they do/offer}}. {{Genuine observation}}. This morning, my Co-Founder and I came up with a {{adjective}} idea to help you {{achieve specific goal}} that'll {{benefit}}. Would it be alright if I forward the idea to you? Thanks, P.S {{Context about your company with social proof}}`,
example:`Hi John, I've got something for you. I gather Nike's doubling down on DTC sales (always exciting when brands take control of their destiny, nice work with the SNKRS app). This morning, my Co-Founder and I came up with a wacky idea to help you attract more sneakerheads looking for exclusive drops. Would it be alright if I forward the idea to you? Thanks, P.S. (For context, we help brands like Adidas and OnRunning generate leads through cold outreach campaigns that actually make people feel something).`,
theory:[`Curiosity gap - hints at a "wacky"/"clever" idea without revealing specifics.`,`Relevance - specific company references signal it isn't a mass send.`,`Immediacy bias - "this morning" makes it feel fresh.`,`Social proof - referencing relevant case studies increases perceived value.`,`Reciprocity - the message presents the idea as a gift.`],
when:[`eCommerce & retail brands where "exclusive" angles drive wins.`,`Managers/directors in growth mode wary of generic pitches.`],
tip:`Avoid overpromising or sounding gimmicky - the more natural it feels, the higher the response rate. Avoid words like "groundbreaking."`,
prompt:`Craft a cryptic-style cold outreach message that teases an idea without revealing too much upfront - sparking curiosity and making the recipient feel uniquely targeted. Reference something specific about their company/strategy, hint at a valuable idea, feel fresh and time-sensitive ("this morning"), use casual language, close with a soft CTA.
My business is: {{describe your business}} / Target customers: {{describe your ideal customers}} / Their company focus: {{describe current focus/strategy}} / The angle to tease: {{describe idea or insight}}`},

{id:'creative-idea',group:'The $1M Templates',name:'Creative Idea',desc:'Position yourself as a strategic partner by offering fresh ideas.',
template:`Hey {{first_name}} - just scanned your site & LinkedIn page. I gather you help {{AI generated mission}} and I had some ideas for you. Given much thought to this kinda stuff? {{Idea 1}} {{Idea 2}} {{Idea 3}} The reason I ask is because we help companies {{insert how you help}}. Would it be useful to discuss executing any of these ideas?`,
example:`Hey Alex - just scanned your site & LinkedIn page. I gather you help SMEs build up their data pipeline, so I cobbled together some ideas for you: Scraping job posts to identify companies ramping up their data teams (warmest ICP signals). Targeting buyers that follow your competitors on LinkedIn, like Mixpanel. Automating the process of mapping out existing data teams for key accounts. We help consultancies like yours build out all this kind of AI-powered stuff to drive their outbound process. Would it be useful to share how you can execute on these ideas?`,
theory:[`Authority bias - multiple relevant "ideas" positions you as an expert.`,`Relevance - acknowledging their mission & ICP signals a targeted message.`,`Reciprocity - three hyper-specific ideas show real research.`,`Casual tone - "cobbled together" and "stuff" feel natural, non-salesy.`,`Simplicity bias - the question makes engagement easy.`],
when:[`Broadly applicable when you've skimmed their site/LinkedIn but lack deep data.`,`Seed & Series A founders open to agile, outside-the-box thinking.`],
tip:`Make sure the ideas are genuinely valuable - generic-sounding advice loses impact. Ask: would I find these ideas useful?`,
prompt:`Create a cold outreach message that positions me as a strategic partner offering fresh, tailored ideas. Mention reviewing their website/LinkedIn, state an observation about their approach, present three innovative ideas, close with a soft CTA asking to discuss them. Placeholders: {{FirstName}}, {{your observation}}, {{Idea 1}}, {{Idea 2}}, {{Idea 3}}, {{your solution}}. Casual yet professional tone.
My business is: {{describe your business}} / Target customers: {{describe your ideal customers}} / Their company focus: {{describe focus/strategy}} / Angle to tease: {{describe idea or insight}}`},

{id:'classic-twist',group:'The $1M Templates',name:'Classic Twist',desc:"Take what works, ditch what doesn't, add some spice.",
template:`Hi {{FirstName}}, just checked out your {{specific data point}} - noticed {{observation with disclaimer}}. I'm tentatively assuming {{pain point tied to strategic goal}}? I work with {{similar companies}} to {{clear value prop}}. In fact, we recently helped {{relevant company}} {{specific result}} without {{trade-off}}. {{Low-friction CTA}}?`,
example:`Hi John, just checked out your org chart - noticed you're lacking SDRs (LinkedIn data, grain of salt). I'm tentatively assuming, therefore, you're juggling prospecting, running demos and closing deals all on your own - might be tough to manage as you scale across Europe? I work with early-stage companies like Vertibox to deliver the impact of 5 SDRs for the cost of 1. In fact, we recently helped Personifics (another HR platform) increase monthly meetings by 34% without adding headcount. With your permission, could I share some more info?`,
theory:[`Research - noting an org-chart gap builds credibility; an underused personalisation point.`,`Loss aversion - highlights risk of a missed opportunity if ignored.`,`Relevant social proof - keeps credibility high without boasting.`,`Simplicity - lean structure: observation, assumption, value prop, quick proof.`,`Tone - "tentatively assuming" hedges; brackets add an off-the-cuff feel.`],
when:[`Heavily competitive sectors where naming a competitor's success sparks FOMO.`,`Consultants/agencies who consistently solve a narrow problem for one vertical.`],
tip:`Hedge observations ("grain of salt," "tentatively assuming") - these are called humbling disclaimers.`,
prompt:`Craft a cold outreach message using the Classic Twist framework: open with a research-based observation, hedge it ("tentatively assuming"), tie the pain point to a strategic goal, provide social proof without boasting, close with a low-friction CTA.
My business is: {{describe your business}} / Target customers: {{describe your ideal customers}} / Common challenges: {{list key pain points}} / Research insight I can use: {{describe observation}} / Strong social proof: {{describe a similar client success}}`},

{id:'classic-twist-mini',group:'The $1M Templates',name:'Classic Twist Mini',desc:'A slimmed-down version of the Classic Twist.',
template:`Hi {{FirstName}}, {{quick recognition of achievement/situation}}. I just {{research action}} on your {{specific area}} and noticed {{number}} things that could help you {{achieve goal}}. I shot a personal video for you - is this the best place to drop it? P.S. This same strategy helped {{competitor}} {{specific result}}.`,
example:`Hi Austin, crushing it in the sportswear space. I just reviewed your email infra (nike.com) and noticed 3 things that could help you drive reply rates. I shot a personal video for you - is this the best place to drop it? P.S. This same strategy helped Adidas increase replies by 24%.`,
theory:[`Ego - light flattery makes the recipient receptive.`,`Authority - a quick, specific observation signals this isn't a mass send.`,`Reciprocity - offers concrete value (a personal video).`,`Social proof - tying to a competitor builds credibility.`,`Cognitive ease - short sentences, effortless to process.`],
when:[`Companies celebrating recent wins (growth-mindset moment).`,`When video is a key part of your outreach strategy.`],
tip:`Keep it snappy - the magic is its brevity. Too long and it loses impact.`,
prompt:`Craft a cold outreach message that condenses personalisation, value, and social proof into three lines. Start with a quick recognition of achievement, reference a research point, mention "N things," offer a personal video, close with a relevant social proof example.
My business is: {{describe your business}} / Target customers: {{describe your ideal customers}} / Their key challenges: {{list key pain points}} / Research insight: {{describe observation}} / Social proof: {{describe a similar client success}}`},

{id:'abc-cta-value',group:'The $1M Templates',name:'ABC CTA - Value Bomb',desc:'Give them options, gamify it, and get insane engagement.',
template:`{{FirstName}} - {{context about their situation}}. Take your pick: A) {{High-value resource 1}} B) {{High-value resource 2}} C) {{High-value resource 3}} Just reply with the letter.`,
example:`John - as you're just 3 months into the role as VP, I'm here to help you out. Take your pick: A) 500 verified leads for your ICP (CTO/VP of tech at SaaS) B) 3 juicy strategies to identify who's in market for HR software C) A killer, high-converting outreach template specifically for Syncflow. Just reply with the letter.`,
theory:[`Pattern disruptor - no hook, value proof or social proof, just 3 CTAs.`,`Autonomy bias - multiple options to engage, including one to ignore.`,`Curiosity - encourages a response.`,`Casual, engaging tone.`],
when:[`Multiple valuable resources you want to A/B test.`,`Early-stage startups more receptive to disruptive messaging.`,`Traditional industries dismissive of cold outreach - lead with value.`],
tip:`Relentlessly test different options to see what drives the most responses.`,
prompt:`Craft a value-bomb style cold outreach offering three valuable resources with an easy reply-with-a-letter CTA. Each option should be genuinely useful and relevant; stay concise while signalling deep industry knowledge.
My business is: {{describe your business}} / Target customers: {{describe your ideal customers}} / Common pain points: {{list pain points}} / We typically help with: {{list key value props}}`},

{id:'abc-cta-qual',group:'The $1M Templates',name:'ABC CTA - Qualification',desc:'A choose-your-adventure qualification message.',
template:`{{FirstName}} - choose your adventure: If you're happy with {{current situation}} -> Delete this email. If you want to know {{compelling result}} -> Keep reading. If {{other person}} might be better positioned to handle this -> Would really appreciate if you could forward this. If you've made it here -> Reply {{word}} for a surprise.`,
example:`John - choose your adventure: If you're happy with your sales pipeline -> Delete this message. If you want to know how we boosted Rumble's lead volume by 72% -> Keep reading. If Simon might be better positioned to handle this -> Would really appreciate if you could forward this. If you've made it here -> Reply "adventure" for a surprise.`,
theory:[`Pattern disruptor - no hook or social proof, just 3-4 CTAs.`,`Autonomy bias - multiple options, including one to ignore.`,`Curiosity - the "surprise" element encourages responses.`],
when:[`Early-stage startups receptive to disruptive messaging.`,`Traditional industries dismissive of cold outreach.`],
tip:`Relentlessly test different options to see what drives the most responses.`,
prompt:`Create a choose-your-adventure qualification message that makes it feel fun and interactive while letting prospects self-select interest. Start with an easy opt-out, offer a compelling result to keep reading, include a forwarding option, end with a fun curiosity-driven CTA.
My business is: {{describe your business}} / Key results: {{list major wins}} / Target decision makers: {{list roles}} / Alternative contacts: {{list other relevant roles}}`},

{id:'unhinged',group:'The $1M Templates',name:'Unhinged',desc:'Time to break every rule in the professional playbook.',
template:`{{FirstName}}, {{specific observation about their wins/achievements}}. Give me a shout if you're looking to {{achieve similar outcome}} - we're using some {{casual description of approach}} that are {{bold claim}} for {{social proof}}. Best, {{Your name}}, A.K.A. {{outrageous but partially credible claim}} ({{specific credential to back it up}})`,
example:`Emily, pretty sweet case studies you've secured with Electronic Arts, NatWest Group and The LEGO Group. Give me a shout if you're looking to land similar logos - we're using some nifty tactics that are securing a sh*t ton of meetings for a couple of similar SaaS businesses also selling to Employer Brand teams. Best, Penn, A.K.A. The best cold outbound-er in the world (1 of just 4 people globally to be a certified Clay and Smartlead expert).`,
theory:[`Pattern disruption - audacious tone disrupts the usual polite, formal style.`,`Ego - a direct compliment elevates their sense of achievement.`,`Confidence signals competence - bold claims backed by real credentials read as believable.`,`Social proof - major brands build credibility and FOMO.`,`Tone - radically human, slang, casual language.`],
when:[`Prospects who appreciate bold, no-BS communication.`,`When you have seriously impressive credentials to back claims.`,`Late in a sequence, when conventional messages haven't worked.`],
tip:`The key is tone - speak like a human who backs themself. Too far and it's obnoxious; too held back and it loses its edge.`,
prompt:`Create an "unhinged" cold outreach message that breaks conventional norms while staying credible. Open with a specific observation about their achievements, use casual/shocking language, make a bold claim, back it with concrete credentials, close with a playfully arrogant sign-off.
My business is: {{describe your business}} / My credentials: {{list achievements}} / Target customers: {{describe ideal customers}} / Recent client wins: {{list impressive results}}`},

{id:'direct-report',group:'The $1M Templates',name:'Direct Report',desc:'Target the team, win the leader.',
template:`Subject: For {{direct reports name #1}} and {{direct reports name #2}}. {{name}} - thought they might find this helpful given {{they're new to the company...}}. Typically, {{direct reports title}} experience {{problem you solve}} because {{flaw with the status quo}}. We fix this by {{solution}}. Used by teams like {{social proof}}. Does this resonate?`,
example:`Subject Line: For Sarah Chen and Tom Martinez. John - thought they might find this helpful given they're new to the sales team. Typically, SDRs experience low response rates because they're using the same templated outreach as everyone else. We fix this by providing personalised, pattern-breaking cold outreach frameworks. Used by teams like Gong and Salesforce. Mind if I share how I'd target your buyers?`,
theory:[`Ego - focusing on the team's needs appeals to the leader's desire to be the hero.`,`Subtle authority play - shows deep understanding of the team's role.`,`Social proof - known companies build credibility.`,`Indirect approach - avoids triggering sales defenses, drives reciprocity.`],
when:[`Mid-to-large enterprises (200+ employees) with defined departmental structure.`,`Targeting new hires or teams in transition.`],
tip:`Make the subject line count - naming direct reports gets it opened more often.`,
prompt:`Craft a Direct Report cold outreach message that targets a leader by addressing their team's needs. Mention two direct reports by name in the subject, reference their situation, identify a common pain point, offer a solution, use social proof, close with a simple CTA.
My business is: {{describe your business}} / Target leaders: {{describe decision makers}} / Their direct reports: {{describe team members}} / Common team challenges: {{list pain points}} / Our solution: {{describe value prop}} / Similar teams using us: {{list social proof}}`},

{id:'short-sweet',group:'The $1M Templates',name:'Short but Sweet',desc:'Brevity that sparks curiosity and engagement.',
template:`Hey {{FirstName}} - shortest message you'll receive all day. If someone could help {{insert how you help}}, would that be useful?`,
example:`Hey John - shortest message you'll receive all day. If someone could help you identify CTOs/VPs in tech that are actually in-market buyers (for HR software), and don't lose them to competitors (like Personio & Letterbee), would that be useful?`,
theory:[`Pattern disruption - a two-sentence opener stands out.`,`Curiosity gap - brevity leaves an information gap.`,`Urgency & FOMO - referencing competitors winning if no action taken.`,`Cognitive ease - zero thinking fatigue.`,`Autonomy bias - "would that be useful?" gives them the power.`,`Frictionless CTA - a simple yes/no.`],
when:[`Simple, high-level solutions summarised in one line.`,`Demand-capture solutions like recruitment or offline services.`],
tip:`Success depends on the strength of the offer - if the value isn't obvious, they won't reply.`,
prompt:`Craft a hyper-concise cold outreach using "Short but Sweet." Open with a direct line about message length, pose a simple curiosity-driven question, make it effortless to respond, stay under 15 words (excluding name/greeting).
My business is: {{describe your business}} / Target customers: {{describe ideal customers}} / I typically help with: {{list key problems solved}}`},

{id:'lead-magnet-tpl',group:'The $1M Templates',name:'Lead Magnet',desc:'Lead with value, then ask for engagement.',
template:`Hey {{FirstName}} - saw {{something relevant to your message}}. We help companies {{achieve results}}. But I'd never expect you to take my word for it. So I made you {{resource}} - if it's useful, let me know and maybe we chat?`,
example:`Hey John - any luck with the SDR roles? We help you ramp reps a hell of a lot faster than the usual and book 22% more meetings in their first 60 days. But I'd never expect you to take my word for it. So I made you a 3-step onboarding framework specifically for SDRs - if it's useful, let me know and maybe we chat?`,
theory:[`Social proof - mentioning results builds credibility.`,`Reciprocity - giving value first inclines them to engage.`,`Frictionless commitment - casual, low-pressure CTA.`,`Pattern disruption - offers value first instead of pitching first.`],
when:[`Early-stage startups without established logos but with valuable frameworks.`,`Skeptical markets where a no-strings resource opens doors.`],
tip:`Personalise the lead magnet - something built exclusively for the buyer always beats a generic ebook.`,
prompt:`Craft a give-first cold outreach using the "Lead Magnet" framework - start with a relevant observation, casually introduce how you help, offer a resource as proof-first, close with a soft no-pressure CTA.
My business is: {{describe your business}} / Target customers: {{describe ideal customers}} / I typically help with: {{list key problems solved}} / I can offer: {{describe a resource, insight, or tool}}`},

{id:'genius-terrible',group:'The $1M Templates',name:'Genius or Terrible',desc:'A bold, curiosity-driven message that categorises prospects with a minimalist CTA.',
template:`Subject: This is either genius or terrible. {{first name}}, There are 2 types of people: 1) Those who handle {{pain point}} at {{company}} 2) Those who don't. If you're #2, sorry for the inbox clutter - perhaps more relevant for {{colleague}}? If you're #1, check this out: {{competitor}} -> Used our solution / {{competitor}} -> +65% {{key metric}} / {{competitor}} -> 30 days / You -> Reading this message / You -> Curious (probably) / You -> Next? Send a thumbs-up if you want the details.`,
example:`Subject: This is either genius or terrible. John, There are 2 types of sales leaders: 1) Those who actively optimise their outbound pipeline. 2) Those who don't. If you're #2, sorry for the inbox clutter. If you're #1, check this out: Acme Corp -> Used our playbook / Beta Inc -> +65% cold outreach reply rates / Delta Co -> 30 days / You -> Reading this message / You -> Curious (probably) / You -> Next? Send a "thumbs-up" if you want the details.`,
theory:[`Pattern disruptor - bold subject line and binary framing hook and engage.`,`Social proof - recognisable competitors reinforce credibility.`,`Minimalist CTA - a single symbol reply reduces friction.`,`Autonomy bias - a simple reply puts them in control.`],
when:[`Competitor-rich industries (SaaS, FinTech, eCommerce).`,`Fast-swap solutions that can quickly show tangible metric lifts.`],
tip:`Pair with a highly relevant competitor example, or frame around a recognisable industry benchmark.`,
prompt:`Craft "The Genius or Terrible" message: bold curiosity-driven subject, categorise into two groups, highlight competitor results minimalistically, close with a frictionless one-character CTA.
My business is: {{describe your business}} / Target customers: {{describe ideal customers}} / Key pain point: {{describe the main problem}} / Competitor success examples: {{list similar company wins}} / Key metric improvement: {{describe the main KPI lifted}}`},

{id:'internal-nudge',group:'The $1M Templates',name:'The Internal Nudge',desc:'Leverage internal dynamics to drive urgency.',
template:`Hey {{FirstName}}, have you and {{Senior Colleague}} touched base about {{Things you help them do}}? We're partnering with companies like {{Company Name}} to secure {{Outcome}} in just {{Timeframe}} - all without {{USP}}. Is this something {{Company Name}} is focusing on?`,
example:`Hey Jake - any convos internally between you and Sarah (your RevOps lead) re: reducing SDR ramp time? We're helping teams like Gong ramp new hires 40% faster in 60 days without burning managers' time on manual coaching. Is this even a concern over at Acme?`,
theory:[`Triggers internal dialogue - mentioning a colleague makes them visualise the conversation.`,`Social proof & authority bias - name-dropping a notable brand.`,`Autonomy bias - subtly lets them decide if it's a priority.`,`Cognitive ease - simple structure, effortless to read.`],
when:[`RevOps leaders, sales managers, marketing directors, ops execs.`,`Companies with 100+ headcount where decision-making is shared.`],
tip:`Where possible, reference a likely real conversation (LinkedIn updates, job posts) framed as a hedged assumption.`,
prompt:`Craft an "Internal Nudge" cold outreach that leverages internal dynamics to spark urgency while staying natural and non-pushy. Mention a likely conversation with a colleague, state the outcome and pain point removed, use a well-known company for credibility, end with a soft priority-checking CTA.
My business is: {{describe your business}} / Target customers: {{describe ideal customers}} / Internal decision-makers: {{list key roles}} / Outcome we deliver: {{describe results in a timeframe}} / Pain point removed: {{describe a common challenge}}`},

{id:'subject-line-msg',group:'The $1M Templates',name:'Subject Line Message',desc:'Let the subject line do the work.',
template:`Subject: Would you like to chat re: {{outcome}}. Hey {{FirstName}} - question in the subject line. Let me know if you'd like to connect.`,
example:`Subject: Are your reps Dan & Josie struggling with email reply rates? Hey Jake - popped the question in the subject line. Let me know if you'd like to connect.`,
theory:[`Pattern disruption - the subject line IS the message.`,`Cognitive ease - a single-line message is effortless to process.`,`Frictionless CTA - only asks for a quick response.`],
when:[`Limited deliverability situations (short, zero-sales-language message).`,`Quick re-engagement for prospects who've gone cold.`],
tip:`Add an analogy as a P.S. conveying how the message is "unique just like their {{USP}}."`,
prompt:`Craft a subject-line-driven cold message using "Subject Line Hook" - the subject asks directly if they want to chat about a key outcome, the body confirms it ultra-minimally, closes with a low-friction CTA.
My business is: {{describe your business}} / Target customers: {{describe ideal customers}} / The outcome I help achieve: {{describe a clear, compelling result}}`},

{id:'problem-potion',group:'The $1M Templates',name:'Problem Potion',desc:'Multiple, specific pain points side by side.',
template:`Hi {{FirstName}}, been speaking to a handful of {{job title}} recently. {{Line linking the problems}} - {{Problem 1}} - {{Problem 2}} - {{Problem 3}} Any of these concerns atm?`,
example:`Hi John, I've been speaking to a handful of VPs recently. Seems a lot of them are juggling similar headaches - wondering if any of these ring a bell for you... - Your SDRs, Dan & Jake, are suffering from low reply rates. - CEO Simon's on your case to implement more AI into your sales process. - You've heard about Clay but have no idea where to start. Any of these concerns atm?`,
theory:[`Light social proof - shows you're tapped into industry chatter.`,`Multi-issue approach - three possible problems increase the chance one resonates.`,`Relevance - shows you've engaged with others in the exact same role.`,`Light CTA - low-pressure rather than a hard sell.`,`Pattern disruptor - inviting them to pick their own pain point lowers their guard.`],
when:[`Early-stage founders dealing with a cluster of problems.`,`VP of Sales/Marketing roles with pain from multiple directions.`],
tip:`Keep each bullet crisp and ultra-specific - generic bullets get skimmed past.`,
prompt:`Create a Problem Potion-style message: brief intro referencing other people in the same role, one linking line, three specific pain-point bullets, low-pressure CTA like "Any of these concerns atm?" Friendly but direct tone.
My business: {{describe your business}} / Target role: {{describe who they are and typical challenges}} / Common issues: {{list 2-3 pain points}}`},

{id:'direct-pitch',group:'The $1M Templates',name:'Direct Pitch',desc:'A short, bold outreach that cuts straight to the chase.',
template:`Hi {{FirstName}}, any need for {{yourSolutionOrService}} at the moment? {{IndustryTrendOrOpportunity}} is evolving so fast - nearly impossible for a {{prospectRole}} to keep tabs on everything. Up for a quick chat on how other {{similarProspects}} are staying ahead? No worries if you're all set.`,
example:`Hi John, any need for outbound support at the moment? New sales tools like Clay and advanced AI models are popping up every other week. Almost impossible for VPs like you to keep up. Fancy a quick chat on how others are staying ahead? No worries if you're all good.`,
theory:[`Straight to the point - front-loaded offer.`,`FOMO - a changing landscape drives urgency.`,`Low-friction CTA - "a quick chat" is easy to say yes or no to.`,`Friendly exit - respects their time and choice.`],
when:[`Hot prospects with strong triggers, uncertain if in-market right now.`,`PMF testing new segments/markets to gauge immediate interest.`],
tip:`Front-load the most important question - if they skim only the first line, they'll know why you're reaching out.`,
prompt:`Craft a direct-pitch cold outreach: greet by name and ask if they need my solution/service, reference a rapidly evolving industry trend, mention why it's hard to keep track, end with a quick low-pressure CTA and an easy out.
Placeholders: {{First Name}}, {{your Solution Or Service}}, {{Industry Trend Or Opportunity}}, {{prospect Role}}. Tone: straightforward, friendly, concise.`},

{id:'magic-trick',group:'The $1M Templates',name:'Mind-Benders - The Magic Trick',desc:'Tease a surprising insight that makes them curious.',
template:`Hey {{FirstName}}, We discovered something odd. Turns out {{specific insight about their business/industry}} actually {{contrary to common belief}}. Wanna see the trick behind it?`,
example:`Hey John, We discovered something odd. Turns out the most effective outreach in 2025 breaks the rules: no CTA, no social proof, no ROI metrics. (after sending over 500k emails per month, we have concrete data on this). Wanna see the trick behind it?`,
theory:[`Curiosity - surprising/contradictory openers leverage the Zeigarnik effect.`,`Pattern interrupt - flips the predictable formula most cold messages follow.`,`FOMO - hints at intel they might be missing.`,`Clarity/effortlessness - hyper-concise, minimal friction.`],
when:[`Data or insight-heavy solutions with real numbers that contradict popular beliefs.`,`Traditional industries accustomed to "the old way."`],
tip:`Keep it razor-sharp - the moment you add disclaimers or lengthy proof, you dull the mind-bending effect.`,
prompt:`Craft a Magic Trick-style message revealing a surprising industry insight: greet by name, introduce a surprising fact, contrast it with a popular misconception, close asking if they want to see the "trick" behind it.
Placeholders: {{FirstName}}, {{specific insight about their business/industry}}, {{contrary to common belief}}. Keep it short, curious, intriguing.`},

{id:'the-conspiracy',group:'The $1M Templates',name:'Mind-Benders - The Conspiracy',desc:'Playfully frame an industry truth as a conspiracy.',
template:`Hey {{FirstName}}, Most {{industry role}} think {{common assumption}}. But the numbers say they're wrong. Want proof?`,
example:`Hey John, Most SaaS Sales leaders think outbound is dead. But with the right tools, the data tells a different story. Mind if I share some insights? (we send 500k+ cold outreach messages/month across 15+ industries)`,
theory:[`Curiosity - the Zeigarnik effect via a withheld "why."`,`Pattern interrupt.`,`FOMO/loss aversion - subtle fear of missing intel.`,`Clarity/effortlessness.`],
when:[`Data-heavy solutions with real contradicting numbers.`,`Sophisticated buyers used to "the old way."`],
tip:`Keep it razor-sharp - don't dull the effect with disclaimers.`,
prompt:`Craft a Conspiracy-style message that playfully challenges a common industry belief with contradicting data. Quick greeting, statement of the common belief, a line revealing the data contradicts it, close: "Want proof?"
Placeholders: {{FirstName}}, {{industry role}}, {{common assumption}}. Bold yet lighthearted.`},

{id:'one-sentence-bomb',group:'The $1M Templates',name:'Mind-Benders - One Sentence Bomb',desc:'Explode a belief they have in a single line.',
template:`Hey {{FirstName}}, Most {{industry Practice Or Strategy}} fail because they {{core Reason Or Assumption}}. Top 3 triggers that indicate {{target Persona}} might be in-market/in-need for {{your Service Or Solution}}: 1) {{Trigger1}} 2) {{Trigger2}} 3) {{Trigger3}} Leveraging any of these in your {{process Or Campaign}}, or want to see how?`,
example:`Hey John. Most cold messages fail because they hit the wrong people at the wrong time. Top 3 triggers to indicate founders might be in-market/in-need for data consultancy: 1) No data team 2) Following Mixpanel, Segment etc 3) Hiring Head of Data. Leveraging any of these in your outbound or wanna see how?`,
theory:[`Curiosity - the Zeigarnik effect.`,`Pattern interrupt.`,`FOMO/loss aversion.`,`Clarity/effortlessness - hyper-concise.`],
when:[`Data-heavy solutions with real numbers.`,`Sophisticated, skeptical buyers.`],
tip:`Keep it razor-sharp - no disclaimers or lengthy proof.`,
prompt:`Craft a "One Sentence Bomb" message: a single bold statement about why a practice fails, three triggers signalling readiness for the solution, close asking if they want to see how.
Placeholders: {{FirstName}}, {{industry Practice Or Strategy}}, {{core Reason Or Assumption}}, {{Trigger1/2/3}}, {{target Persona}}, {{your Service Or Solution}}, {{process Or Campaign}}. Short, direct, a bit provocative.`},

{id:'permission-based',group:'The $1M Templates',name:'Permission-Based',desc:"Ask for explicit permission to pitch, then vanish if they don't respond.",
template:`Hi {{FirstName}} - permission to pitch and disappear forever if I don't hear back? (Guaranteed to be the most {{superlative}} pitch ever).`,
example:`John - permission to pitch and vanish if I don't hear back? (Guaranteed to be the most personalised pitch you'll see all week).`,
theory:[`Curiosity - a direct ask for permission isn't the standard opener.`,`Autonomy bias - full control given, lowering resistance.`,`Pattern interrupt - casual address plus promising to vanish.`,`Skepticism - asking outright sidesteps typical skepticism.`],
when:[`Hail-mary outreach when standard approaches haven't worked.`,`Tough industries (recruitment, cybersecurity) especially wary of cold outreach.`],
tip:`Include a little context on what you bring to the table, so you attract real prospects instead of tire-kickers.`,
prompt:`Craft a Permission to Disappear message: ask outright to pitch and disappear if no interest, emphasise the pitch will be hyper-personalised, casual playful tone, short and easy to reply to. Placeholders: {{FirstName}}, mention of how "personalised" the pitch is.`},

{id:'industry-insight',group:'The $1M Templates',name:'Industry Insight',desc:'Real-world data to establish credibility, then offer a tailored resource.',
template:`Hi {{FirstName}}, We {{what You Do In Big Volume Or Across Industries}} - {{credibility Statement}}. Here are {{number}} insights on what's working in {{year Or Focus Area}}: 1) {{Insight1}} 2) {{Insight2}} 3) {{Insight3}}... {{number}}) {{InsightN}}. Curious if you'd like a {{valuable Resource}} that digs deeper into these findings for {{their Industry}}?`,
example:`Hi John, We send out half a million emails per month, targeting 15+ industries. Here's 10 insights on what's working in 2025: 1) One-sentence cold outreach messages with just one poke-the-bear question. 2) Short, single sentence paragraphs. Ultra digestible formatting. 3) Radically human tone. 4) Zero ROI metrics. 5) Subject lines that seem like an internal message i.e. "John, this morning". 6) Value-driven CTAs. 7) Personalised P.S statements. 8) Curiosity statements like "I bet you haven't considered this". 9) Curiosity-driven adjectives like "wacky". 10) Humbling disclaimers like "I'm tentatively assuming". Happy to share a killer outreach template, based on these principles, tailored to coaching companies like Phoenix?`,
theory:[`Authority bias - large-scale data demonstrates expertise and social proof.`,`Pattern interrupt - quick bullet points feel fresh, not fluffy.`,`Curiosity & reciprocity - offering a data-based template compels a reply.`],
when:[`Market-wide insights from a broad sample.`,`Thought-leadership plays to establish expertise.`,`Challenging/skeptical audiences (cybersecurity, finance).`],
tip:`Tailor bullets to the prospect's world - link each insight to a known pain or opportunity in their space.`,
prompt:`Craft an Industry Insight message: open with a credible scope statement, list several short punchy insights on what's working today, close offering a deeper resource relevant to their sector, direct and data-driven without overselling.
Placeholders: {{FirstName}}, {{their industry}}, {{Insight 1/2/...}}.`},

{id:'calibration-test',group:'The $1M Templates',name:'Calibration Test',desc:'Gauge where a prospect stands without triggering resistance.',
template:`{{FirstName}} - 3 reasons why you shouldn't engage with this message: 1) {{Hyper-specific success metric relevant to their team}}. 2) {{Social proof or direct praise from a credible source}}. 3) {{Demonstration of tech adoption or best practice they're already executing}}. If 10 = highly accurate and 0 = million miles off, where are you sitting?`,
example:`John - 3 reasons why you shouldn't engage with this message: 1) Your SDRs (Tom, Ella & Carla) are getting insane reply rates from your outreach campaigns (>10%). 2) CTOs & VPs of Tech reply to your outreach campaigns with "This is the best outreach ever." 3) You're embedding badass AI tools into your CRM (HubSpot) like Clay. If 10 = highly accurate and 0 = million miles off, where are you sitting?`,
theory:[`Pattern disruptor - a bold reversal that argues against engagement.`,`Autonomy bias - full control given, inviting self-reflection.`,`Cognitive ease - numbered list and rating system are easy to scan and reply to.`],
when:[`Experienced operators who pride themselves on staying ahead of trends.`,`Accounts already using cutting-edge solutions who need a subtle differentiation nudge.`],
tip:`A/B test the CTA phrasing - e.g. "whilst I know this is a little exaggerated, I assume you've got all this stuff covered?"`,
prompt:`Craft a Calibration Test message: "3 reasons why you shouldn't engage with this message," three highly specific compelling reasons (metrics/social proof/best practices), close with a 0-10 rating scale. Confident but playful tone.
My business is: {{describe your business}} / Target customers: {{describe ideal customers}} / Top three proof points: {{list three key success metrics or insights}}`},

{id:'acceptance-speech',group:'The $1M Templates',name:'Acceptance Speech',desc:'Casts the prospect as the future winner of an industry accolade.',
template:`"I want to start by saying thanks to our leadership team. {{Executive 1}}, {{Executive 2}}, and {{Executive 3}}. I also want to thank all our amazing clients. {{Client 1}}, {{Client 2}}, and {{Client 3}}. And of course, our wonderful investors. {{Investor 1}} and {{Investor 2}}." {{FirstName}} - this is how your end-of-year acceptance speech will start, after you've just been awarded {{Industry Award}}, thanks to the insanely powerful growth strategies you used to scale the hell out of {{Company}}. Wanna hear the sauce?`,
example:`"I want to start by saying thanks to our leadership team. Simon, Ella, and Nick. I also want to thank all our amazing clients. Alibo, Paddler, and CoreTech. And of course, our wonderful investors. Index Ventures and Accel." John - this is how your end-of-year acceptance speech will start, after you've just been awarded HealthTech Platform of the Year, thanks to the insanely powerful growth strategies you used to scale the hell out of Syncflow. Wanna hear the sauce?`,
theory:[`Ego & visionary thinking - plays into the prospect's ambitions.`,`Pattern disruptor - a vivid, future-facing narrative, similar to Storytelling.`,`Relevance - investors/execs/clients subtly increase credibility.`,`Curiosity gap - "Wanna hear the sauce?" creates intrigue without a hard sell.`],
when:[`High-growth startups, founders, or ambitious operators motivated by recognition.`,`Early-stage senders lacking social proof who need disruptive, curiosity-driven copy.`],
tip:`A/B test award types by industry - SaaS: "Fastest Growing B2B SaaS of the Year"; eCommerce: "Top 100 DTC Brands"; AI: "AI Innovator of the Year."`,
prompt:`Craft an Acceptance Speech message: open with a fictional acceptance speech thanking execs, clients, investors; transition into positioning the recipient as the award-winning leader; end with "Wanna hear the sauce?" Confident, aspirational, engaging tone.
My business is: {{describe your business}} / Target customers: {{describe ideal customers}} / A relevant award: {{describe a prestigious industry award}} / Key names to reference: {{list relevant names for authenticity}}`},

{id:'intelligence-play',group:'The $1M Templates',name:'The Intelligence Play',desc:"Leverage the prospect's education and career achievements to nudge engagement.",
template:`Hey {{FirstName}}, I've got {{fun wager or challenge}} riding on this. From studying at {{prestigious university}} to leading {{company or industry accolade}}, I told {{co-founder/colleague's name}} you'd be smart enough to at least hear this out - they think you'll ignore me. Prove me right?`,
example:`Hey John, I've got $50 riding on this. From studying at Harvard to leading one of the sexiest HealthTech platforms, I told my co-founder Felix you'd be smart enough to at least hear this out. He thinks you'll ignore me. Wanna roll the dice and hear me out?`,
theory:[`Ego play - acknowledging elite education/leadership makes them feel seen.`,`Social proof - calling out a prestigious background adds credibility.`,`Pattern disruptor - a personal wager feels refreshingly different.`,`Curiosity gap - the challenge naturally piques interest.`,`Autonomy bias - the prospect gets a choice, framed as proving the sender right.`],
when:[`CEOs, COOs, SVPs, Managing Directors across corporates, 500+ employees, mid-market to enterprise.`],
tip:`Adjust the currency to the recipient's country.`,
prompt:`Craft an Intelligence Play message leveraging education/career success into a lighthearted wager. Open with a fun bet/challenge, reference their education or leadership achievements, playfully position the sender as believing they'll engage, end with "Prove me right?"
Placeholders: {{FirstName}}, {{education/career milestone/accolade}}, {{describe the internal debate or wager}}.`},

{id:'assumption-play',group:'The $1M Templates',name:'The Assumption Play',desc:'Make an educated guess about how the company handles a problem, forcing a confirm or correct.',
template:`Hey {{FirstName}}, Assume your team is handling {{specific challenge}} like this: {{description of how they're likely tackling the problem you solve}}. Hit the mark, or am I totally off base here?`,
example:`Hey Richard, Assume your SDRs, James & Sarah, are writing cold outreach like this: "Hey Richard, Notice you're the VP of Sales at MetalWorks. We help manufacturers improve lead flow - just worked with SteelCore to increase pipeline efficiency by 24%. Let me know if it's worth a chat." Hit the mark, or am I totally off base here?`,
theory:[`Forces a response - correct or incorrect, either creates engagement.`,`Pattern disruption - reads like an internal critique, not a sales message.`,`Plays into ego - leaders like proving they know their business.`],
when:[`Departments where you can access information on how they're likely tackling the problem you fix.`],
tip:`Make the assumption highly specific - reference actual team members, terminology, or recent industry shifts.`,
prompt:`Craft an "Assumption Play" message: a direct assumption about how the team currently tackles the problem, a realistic example of their current process, close with a low-friction confirm/correct CTA.
My business is: {{describe your business}} / Target customers: {{describe ideal customers}} / The challenge I solve: {{describe the problem}} / Their typical (ineffective) approach: {{describe common methods}} / A competitor who does it better: {{name a relevant company}}`},

{id:'bonus-template',group:'The $1M Templates',name:'Bonus Template',desc:'A highly personalised, pattern-disrupting message.',
template:`Subject: Cutting through the noise on your {{role/initiative search}}. Hey {{FirstName}}, Figured that your {{inbox, DMs, calendly etc}} would be flooded after announcing your search for {{position/service needed}}... Probably with the same stuff: "Dear {{FirstName}}, I'm {{X}} and have {{X years}} of experience." I wanted to tell you the nitty-gritty bits that will actually help you find the right fit for {{Company}}. So I used {{prospecting tool 1}} and {{prospecting tool 2}} to find your message and validated it with {{validation tool}} in {{automation tool}}. What you need to know: I worked for {{previous relevant company}}, crafting {{X type of deliverables/results}}... Since then, I've built a team producing {{specific type of work/results}} - working with {{niche or industry focus}}. Most people try to sell you {{inferior solution}}, but really give you {{even worse alternative}}. We provide a no-fee test project including {{services included}} to try us out. Let me know if you're keen. Best, {{Your Name}}, {{Your Role}} @ {{Your Company}}. P.S. I've been following {{Company}} for a while - actually really helped me {{specific way they influenced you}} (would love to repay the favor).`,
