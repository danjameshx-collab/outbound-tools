{p:'Frank Brothers', cat:'Objection Handling & Replies', src:'The Secret to Close Outbound Sales Opportunities', t:'Answer every objection with more proof, not more pressure', b:`The overarching philosophy is to respond to objections with evidence tailored to the specific worry rather than pushing harder or arguing - the goal is to reduce the buyer's perceived risk, not overcome their resistance through pressure. Four common objections and their prescribed responses: "price is too high" - share a case study demonstrating ROI that clearly outweighs the price, or offer a micro-service so the buyer sees real value before committing financially. "Bad timing" - offer to set everything up now and go live after the buyer's key date has passed, paired with a short plan showing a gentle, low-disruption start. "Vendor fatigue" - share a small set of ultra-positive replies praising quality and tone, and offer a direct introduction to an existing client for an unfiltered account. "Fear of risk to brand" - show the quality-control steps documented in the strategy doc and share concrete examples of past work where brand tone was protected.`},
{p:'Frank Brothers', cat:'Objection Handling & Replies', src:'24 Business Learnings in 24 Months / Ultimate Guide to Clay', t:'Send a holding message fast, and use AI to triage replies at scale', b:`If a full answer isn't ready yet, sending a short message that acknowledges the question and confirms you're on it prevents the silence itself from damaging trust - people mainly want to feel seen, even before there's a complete answer. At scale, running AI over inbound cold-email responses to automatically tag them by sentiment or objection type lets a team route and prioritize replies (separating "not now" from genuine objections from hot leads) without manually reading every response first.`},
{p:'Frank Brothers', cat:'Objection Handling & Replies', src:'How to Get a Meeting with Anyone', t:'Treat gatekeepers as allies to win over, not obstacles to route around', b:`Executive assistants and screeners are the first real audience and an early signal of whether the approach is working - if they consistently shut a message down, that's direct feedback that it reads as a generic pitch rather than something of genuine relevance. Small, genuine gestures of appreciation toward the gatekeeper, rather than attempts to bypass them, tend to keep the door open and can influence whether the message ever reaches the actual decision-maker.`},

// ============ SALES CALLS & CLOSING ============

{p:'Matt Lucero', cat:'Sales Calls & Closing', src:'START HERE / How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'The goal after interest is booking the call, not closing over email', b:`Email or a quick text exchange isn't the place to close an expensive or complex sale - the prospect is still a stranger and will have too many questions. Selling over email is much harder than selling live, since you can't handle objections in real time or dig into someone's actual root pain point async - every interested reply should be steered toward a call rather than continuing an extended email negotiation. A strong free-sample CTA doubles as a closing tool here too: a well-executed free deliverable (a sample video or design) improves close rates on the eventual call, since the prospect has already seen tangible proof of quality before the sales conversation even starts.`},
{p:'Matt Lucero', cat:'Sales Calls & Closing', src:'Video 1 (batch 3)', t:'Cold-email deals need more trust-building than referral deals, often a two-call close', b:`Referral leads typically already trust you and have a validated pain point from someone they trust; cold-email leads don't know who you are yet, even after getting interested and booking a call - the sales process has to compensate with more trust-building and nurture than founders used to referral business expect, often requiring a minimum of two sales calls to get a cold lead comfortable enough to buy. Since cold leads usually haven't researched you before the call, run a real discovery process: actively get the prospect to articulate their own problem in their own words, walk them through expected ROI/results, and supply case studies/proof - whether that happens via pre-call nurture, on the call itself, or after.`},

{p:'Frank Brothers', cat:'Sales Calls & Closing', src:'Frank Collective Outbound Lessons Doc', t:'Phone connect-rate infrastructure', b:`Two supporting tactics for phone-based follow-through: parallel dialing tools that call multiple numbers simultaneously to multiply live connects (claimed up to 5x call volume), and phone-number validation services that filter to numbers likely to actually pick up (claimed to lift rep connect rates above 30%). Both are connect-rate infrastructure, not scripting or closing technique.`},
{p:'Frank Brothers', cat:'Sales Calls & Closing', src:'The Secret to Close Outbound Sales Opportunities', t:'The five-step close system, and the psychology behind why proof works', b:`The overall system run for nearly every deal: (1) build and maintain a large social proof library, (2) build fast, light applied proof for each serious prospect, (3) share that proof in a smart order across channels, (4) run a tight meeting process to preserve momentum, and (5) follow up with value until reaching a clear yes or no. Five psychological drivers explain why this works: social proof (people copy what others like them do); authority (consistently publishing useful content makes you read as an expert); loss aversion (proof lowers perceived risk of loss more than it emphasizes upside); commitment and consistency (a small early commitment, like reviewing a bespoke deck, makes a bigger commitment more likely later); and mere exposure (being seen repeatedly across email and LinkedIn builds familiarity, which itself reads as safety).`},
{p:'Frank Brothers', cat:'Sales Calls & Closing', src:'The Secret to Close Outbound Sales Opportunities', t:'The proof asset library: case studies, reply screenshots, and a public presence', b:`Maintain a case study library with one page per case (client, ICP, problem, strategy, results, timeline, reply screenshots, a quote or short video) - shared as a full library link early on, then narrowed to the 1-3 most relevant pages once the prospect's situation is clearer. Keep a library of 40-60 screenshots of positive replies specifically from well-known brands (to establish credibility fast) and a separate library of 50+ screenshots praising the email copy itself (to demonstrate writing quality and genuine interest). Maintain a public LinkedIn presence - daily insight posts, visible engagement, clean profiles - as an ongoing proof asset showing the market listens, and keep a growing library of practical ebooks/guides to link to one at a time for added value without overloading the buyer. Keep a shortlist of existing clients willing to do a quick reference-intro call, offered specifically when a deal is close but the buyer still shows signs of residual risk - a final trust-closer, not an early-stage asset.`},
{p:'Frank Brothers', cat:'Sales Calls & Closing', src:'The Secret to Close Outbound Sales Opportunities', t:'The strategy doc and a live data table as standalone proof assets', b:`The bespoke strategy doc (objectives, ICP/data plan, messaging plan, sending plan, measurement, risks and mitigations) functions as a proof asset in its own right, demonstrating a clear, concrete plan the buyer can picture - generally shared just before the first call. Building an actual live data-enrichment table with 10-15 real columns for the prospect's business, shared as a view-only link and walked through live on the call, proves the operational setup is real and ready to run rather than theoretical.`},
{p:'Frank Brothers', cat:'Sales Calls & Closing', src:'The Secret to Close Outbound Sales Opportunities', t:'The call playbook: prep, structure, and follow-through', b:`Before the call, send the agenda along with links to the deck, strategy doc, and data table in advance, and proactively invite any additional decision-makers who should be present rather than waiting for the prospect to loop them in. The call itself follows five steps in order: set the frame (state the purpose and desired outcome up front), learn their goals and risks through short clear questions, show applied proof (walk through the tailored deck and data table), confirm the plan (who does what and by when), and close for a specific next step (contract review or micro-service start) - booked live on the call, not chased afterward. After the call: send a written summary within two hours and share any assets promised during the conversation, while momentum and memory are still fresh.`},
{p:'Frank Brothers', cat:'Sales Calls & Closing', src:'14 Lessons to $1m ARR', t:'Mastery beats charisma on sales calls', b:`Watching a co-founder run sales calls, the standout quality wasn't smooth persuasion technique - it was depth of knowledge of the product, the market, and the buyer's specific situation, which let him guide the conversation with confidence. Spend less energy on closing scripts and more on becoming a genuine expert in what you sell and who you sell it to.`},


// ============ TOOLS & AI ============

{p:'Eric Nowoslawski', cat:'Tools & AI', src:'I Tested 500,000 Cold Email, This Is The Best Campaign', t:'Constrain AI to your real, actual capabilities', b:`When generating personalized "idea" bullet points, explicitly constrain each one to a specific, real feature or service you can actually deliver. A rollout to a software client where the AI was left too open-ended resulted in it inventing plausible-sounding features the client couldn't actually build - the campaign got great reply rates on promises that couldn't be fulfilled. A one-sentence description of your own business isn't enough for the system prompt either - it needs substantial detail about what your product actually does and the different ways it helps different customer types.`},
{p:'Eric Nowoslawski', cat:'Tools & AI', src:'I Tested 500,000 Cold Email, This Is The Best Campaign', t:'Hand-write few-shot examples, and structure prompts for cached-input pricing', b:`Manually write 3-4 strong example outputs against roughly 10 real prospect companies and include them in the prompt as few-shot examples, so the AI learns your tone, length, and reasoning - when output quality isn't right, add more hand-written examples rather than rewriting the instruction text. Structure the system prompt as fixed instructions plus two contrasting fixed few-shot examples (one B2C, one B2B) so it never changes between prospects, keeping the per-prospect user prompt to just the company description - this lets a campaign take advantage of cached-input pricing discounts on the repeated system prompt. For model choice at this kind of scale, a cheap-but-capable model (e.g. GPT-5 nano, or GPT-4o mini as a solid cheaper alternative) is the preferred balance of cost and quality.`},
{p:'Eric Nowoslawski', cat:'Tools & AI', src:'Cold Email First Principles Thinking', t:'Automate deliverability analytics, and narrate your process to build prompts', b:`Instead of manually crunching CSV exports in spreadsheets, pull data via the sending platform's API using a coding tool, dump it into a database, and have AI analyze which domains/inboxes should be cancelled and which insurance domains rotated in - with a human doing a final approval step before changes are made. For high-volume niche-fit checks (confirming a self-reported "financial services" company is actually a business-loan company), a cheap open-source model is fast and inexpensive enough to run at list-building scale. To turn a manual research/qualification habit into an automated system, screen-record yourself doing it while talking out loud about what you're checking for and why - that narration becomes the basis for a prompt an AI tool can use to replicate the process at scale.`},
{p:'Eric Nowoslawski', cat:'Tools & AI', src:"I sent 10,000,000 cold emails, here's what works in 2025", t:'A scraping tool stack for different data situations', b:`Clay agent handles unstructured, inconsistent website content (like an "about us" page located somewhere different on every site) that traditional structured-field scrapers can't - expect the next stage of this to be agents that click buttons and navigate multi-step flows for even harder-to-reach data. Zenrows handles proxy rotation and anti-bot bypass for scraping protected/programmatic pages. Instant Data Scraper (a Chrome extension) is the "gateway drug" to web scraping - a simple, no-code entry-level tool every salesperson should have installed. For sources with no off-the-shelf tool, have an AI tool generate a custom Python script (e.g. to scrape local business listings off Yelp at scale).`},

{p:'Matt Lucero', cat:'Tools & AI', src:'START HERE / Video 2 (batch 3)', t:'Use an AI agent to QA lead-list accuracy at scale', b:`Beyond validating that email addresses exist, use an AI research agent (e.g. Clay's "Claygent") to check whether leads actually match your targeting criteria - prompting it to visit each company's website and output true/false on whether the company is actually, say, a dentist, then running that check across a batch of leads. This catches the common problem of a purchased "niche list" only being a fraction correctly categorized - a scalable version of the manual "would these 10 people respond" gut check.`},
{p:'Matt Lucero', cat:'Tools & AI', src:"i sent 600,000 cold emails and learned this", t:'Build a custom reply classifier to compare platforms fairly', b:`To avoid trusting each tool's own self-reported reply categorization, pull every reply from all platforms via their APIs into a single spreadsheet, then have AI coding tools build a custom sentiment/categorization pass so every reply across every platform is scored by the same consistent logic rather than each platform's differing internal rules.`},
{p:'Matt Lucero', cat:'Tools & AI', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'Apollo for prospecting, Clay for enrichment - and bring your own API key', b:`Apollo (220M+ contact records) is the primary tool for search and list-building specifically, even when preferring other tools for sequencing, calling, and CRM tracking - treat it as a best-in-class data source, not an all-in-one platform. Clay lets you stitch together dozens of data providers and AI models inside one spreadsheet-like canvas, running scraping/enrichment/cleanup column by column before exporting to a sending tool - on paid plans, using your own third-party API keys (your own Apollo, email-finder, or OpenAI key) instead of Clay's marked-up credits is the single biggest lever for cutting cost at scale, turning what would be thousands of dollars of credits into a small fraction of that.`},
{p:'Matt Lucero', cat:'Tools & AI', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'Waterfall enrichment, lookalike scraping, and open-ended research agents', b:`A waterfall enrichment passes each contact through a prioritized sequence of data providers, moving only unresolved rows on to the next - in one demonstrated example this found 100% of both emails and phone numbers by cascading through six-plus providers, versus a much lower hit-rate from any single provider alone. A tool like Clay's "Ocean" finds companies similar to a seed domain, with filters for excluded domains, states/countries, and result count - a fast way to build an initial company list from one known-good example. An open-ended AI research agent (like Clay Agent) can be prompted with instructions like "visit this company's website and find their mission statement; if you can't find it there, search Google" - a general-purpose researcher for any fact without a dedicated built-in enrichment. When a lookup applies at the company level, save results into a separate table rather than the original per-contact one, so multi-person-per-company results don't awkwardly collapse into single cells.`},
{p:'Matt Lucero', cat:'Tools & AI', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'The rest of the tool stack: validation, sending, and multi-channel follow-up', b:`Million Verifier, NeverBounce, ZeroBounce, and ListKit/list.io validate scraped emails before uploading a list to a sending tool - required to avoid bounces damaging sender reputation. SmartLead and Instantly are the top sending-tool recommendations: both support rotating-inbox sending, spintax, built-in warm-up, reply autocategorization, and can help purchase/configure domains and DNS records directly. HeyReach connects a LinkedIn account and can auto-send a connection request the instant a lead replies positively to a cold email. A dedicated power dialer (e.g. Salesfinity) handles the calling channel at scale, including the "double dial" technique.`},
{p:'Matt Lucero', cat:'Tools & AI', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'A reusable AI prompt for bulk domain-name generation, and matching model cost to task', b:`A saved AI prompt (a reusable Claude "project," works in ChatGPT too) takes a root brand domain and generates dozens of lookalike domain-name variations in one pass, removing manual brainstorming before bulk-purchasing from a registrar. For simple classification/cleanup tasks (tagging B2B vs. B2C, shortening a company name), a cheap model is usually sufficient and dramatically cheaper at scale; switch to a stronger model only for more nuanced tasks, balancing quality against cost multiplied across thousands of rows.`},
{p:'Matt Lucero', cat:'Tools & AI', src:'Video 2 (batch 3)', t:'Matt’s core recommended tool stack', b:`His literal go-to bookmarks: Smartlead (sending), Clay (data enrichment and workflow automation - core value is automating multi-tool workflows plus AI steps), Airtable (data housing - a "good addition" but not mandatory unless running an agency), Make/Zapier (automation glue), and Slack for internal client communication and reporting.`},

{p:'Frank Brothers', cat:'Tools & AI', src:'Frank Collective Outbound Lessons Doc', t:'Don’t force AI into rigid fill-in-the-blank templates', b:`Rather than prompting AI to follow a fixed template with placeholder slots swapped per prospect, have it generate uniquely-structured phrasing and wording for each individual prospect. A rigid template with swapped variables is exactly what makes AI-assisted outreach read as templated and mass-sent.`},
{p:'Frank Brothers', cat:'Tools & AI', src:'Frank Collective Outbound Lessons Doc / Ultimate Guide to Clay', t:'Waterfall multiple data providers instead of relying on one', b:`Rather than trusting a single contact-data provider, stack seven or more mobile/email data providers inside a tool like Clay so that if one fails to find a match, the next is automatically tried - maximizing overall data coverage per lead without paying a premium source for every record.`},
{p:'Frank Brothers', cat:'Tools & AI', src:'Frank Collective Outbound Lessons Doc', t:'Bypass export limits, automate ICP qualification, and check tech stack before pitching', b:`Standard tools like Apollo and LinkedIn Sales Navigator cap how many records you can export at once - dedicated scraping tools exist specifically to pull full data sets past those limits. Rather than manually reviewing each account, prompt an AI agent to research every account in a list and score or flag whether it matches your ICP before it's allowed into a sequence, filtering poor-fit accounts before any human or email touches them. And use a tech-detection tool to see whether a target account already runs a competing or complementary product, before you ever write the email - this tells you whether to pitch a replacement or an integration story.`},
{p:'Frank Brothers', cat:'Tools & AI', src:'1M Frank eBook', t:'Ready-made AI prompts per template, and naming your tool stack as a credibility signal', b:`Every message template in the book ships with a companion prompt using the same fill-in-the-blank placeholders as the template itself, so the format can be regenerated quickly for a new business or vertical. Separately, being transparent about the exact prospecting/verification tool chain used to find a contact (naming the actual tools inside the message copy) is itself used as a differentiator, alongside using AI to generate a one-line mission summary from a site scrape as the seed for a personalized opener.`},
{p:'Frank Brothers', cat:'Tools & AI', src:'Inbox Engineering', t:'A two-column Clay workflow for genuine email variation', b:`Run two AI passes per lead: Column A has AI generate a complete, personalized email for that lead from scratch; Column B takes that output and runs a second AI pass that rewrites the wording while preserving the same structure and offer. Using outputs from both columns across a send batch spreads linguistic variety and reduces template fingerprinting.`},
{p:'Frank Brothers', cat:'Tools & AI', src:'Inbox Engineering / Inbox or Bust', t:'The deliverability tooling stack: tracking, resellers, and diagnostics', b:`Log domain/DNS setup, inbox assignments, and warm-up timelines centrally in Airtable or Notion - this record-keeping is what makes scaling and troubleshooting meaningfully easier, and can be pushed into a sending tool via automation (e.g. adjusting an "Active inboxes target" number to globally raise or lower sending volume in one move). Named vendor recommendations by inbox type: PremiumInboxes for warmed Google inboxes, ScaledMail for Outlook, MailReef or MailDoso for SMTP (needing careful management to avoid blacklists). For diagnostics: GlockApps (inbox placement testing), Google Postmaster Tools (Gmail's own rating of your domain, including spam complaints and IP reputation), MX Toolbox (blacklist checks), and a sending platform's own internal health-scoring feature. For ongoing operation: a dedicated monitoring tool plus the sending platform's automated inbox rotation, so failing inboxes get surfaced and cycled out without manual checking.`},
{p:'Frank Brothers', cat:'Tools & AI', src:'Making Cold Outreach Funny', t:'Use AI to source safe, joke-able hooks at scale - with a mandatory human review step', b:`Have AI pull recent, relevant, low-risk hooks for the target company - product updates, conference talks, partner news, hiring signals - then plug those hooks into short joke templates, so humor stays personalized even at volume rather than reusing one generic joke on everyone. Before any AI-assisted joke goes out, a human must check it against a short safety filter: would I say this in a room with this company's team; does the joke make fun of me and not them; is it tied to a true, verifiable fact; and is it under about 15 words. AI can draft the joke, but a person has to sign off on the risk.`},
{p:'Frank Brothers', cat:'Tools & AI', src:'The Ultimate 3-Step Cold Email Sequence', t:'A reusable structured prompt framework, constrained against hallucination', b:`AI prompts for mass-generating a sequence follow a consistent shape: Task and Context, Email Structure Requirements (numbered line-by-line instructions), an Example Email, General Guidelines, and a list of Variables to merge in - a repeatable template for turning one hand-written example into an infinitely personalized, on-brand sequence. Critically, the prompts instruct the model to strictly base output only on the given structure, example, guidelines, and variables, and never hallucinate beyond what's provided - including a direct ban on fabricating ROI metrics or case studies that weren't supplied.`},
{p:'Frank Brothers', cat:'Tools & AI', src:'14 Lessons to $1m ARR / 24 Business Learnings in 24 Months', t:'Automate your own learning pipeline, and build internal tools first', b:`Rather than manually tracking industry news, automatically pull YouTube transcripts and industry RSS feeds, feed that raw content into an AI tool to distill key takeaways, and push the resulting insights into a shared doc or Slack channel - turning a firehose of information into a searchable, growing internal knowledge base. Separately, invest in tools for your own team before building client-facing ones - solid internal tooling is the foundation client-facing systems get built on top of, not an afterthought; a concrete example is using AI to pre-populate client onboarding forms so less manual data entry falls on the client.`},
{p:'Frank Brothers', cat:'Tools & AI', src:'Ultimate Guide to Clay', t:'What Clay does, and why prompting is now the highest-leverage skill', b:`Clay is the connective tissue between your data and your outreach: it imports a list, enriches each record with context pulled from other tools/APIs, and pushes the enriched data back out to a CRM, sequencer, or elsewhere - combining enrichment, real-time trigger tracking, and workflow automation in one place, with enriched, qualified leads able to flow straight into a sequencer with no manual handoff. Because AI is embedded throughout Clay's workflows, the ability to write clear, focused prompts - not just knowing which integrations to connect - is what separates users getting major leverage (replacing whole team functions) from those who don't; treat prompting as a learnable, practice-based skill.`},
{p:'Frank Brothers', cat:'Tools & AI', src:'Ultimate Guide to Clay', t:'Prompting discipline: one task at a time, five power features, and common mistakes', b:`Asking a single prompt to do several things at once degrades output quality - split multi-step asks into sequential, single-purpose prompts instead, since small errors compound as they get passed across chained columns (the app's Pre-Send Checks tab has the fuller PORT framework for structuring a single prompt). Five concrete add-ons that measurably improve output: adapting prompt logic to the specific business type being analyzed; asking AI to only return answers it's fully confident in (reduces hallucination); simulating multiple fictional expert perspectives debating an answer before committing to one; adding artificial personal stakes to the request (anecdotally improves effort and quality); and restricting the AI to only the provided domain rather than the open web. Common mistakes to avoid: asking one prompt to do too much, vague instructions instead of concrete specifics, not specifying the exact output format needed downstream, defaulting to expensive models when a cheaper one works fine, and failing to define fallback behavior for edge cases. Treat prompt-writing like briefing a capable but literal colleague - specific, one task per prompt, an explicit role, a defined output structure, and iterate with small tweaks rather than assuming the first version is final.`},
{p:'Frank Brothers', cat:'Tools & AI', src:'How to Get a Meeting with Anyone', t:'Use AI to scale research and creative production, but keep the emotional core human', b:`Treat AI primarily as a research and production accelerant - for identifying and prioritizing the right contacts, surfacing timely trigger events, and generating personalized creative assets (images, voice, video) faster than a human could alone. But the actual message and gesture still need to feel authentically human, since generic AI-written outreach is exactly the noise that a genuinely personal touch is meant to cut through.`},

// ============ HUMOR & TONE ============

{p:'Eric Nowoslawski', cat:'Humor & Tone', src:'Past Mistakes We Made w/ Email Personalizations', t:'The elite-school joke that backfired', b:`Using LinkedIn education data, a follow-up joked that the recipient didn't attend a top-tier school "to worry about" some mundane operational problem - it worked well with actual elite-school alumni, who found it funny and responded positively. But the same joke aimed at people who attended community colleges or state schools landed as classist and insulting, generating real complaints; the modest lift from one segment wasn't worth the backlash from the other, and the campaign was pulled. Any personalization angle that flatters one segment by implicitly ranking or mocking another carries real reputational risk that can outweigh its upside.`},

{p:'Matt Lucero', cat:'Humor & Tone', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'Target the register of walking up to someone, not reading them an ad', b:`Write the way you would if you walked up to a stranger at an event or knocked on their door, not the way a TV commercial or infomercial talks - contrast this against a real spam-flagged sample that reads as an impersonal ad to see exactly what tone to avoid. For an extra edge on opens, phrase a subject line so it could plausibly be an internal message from a colleague rather than an outside sender.`, ex:`"IT ticket?" for an IT company`},
{p:'Matt Lucero', cat:'Humor & Tone', src:'Video 2 (batch 3)', t:'Read your email back as if you were the stranger receiving it', b:`Repeated advice for sounding human instead of robotic: send yourself a test email, read it on your phone as if you were a random recipient scrolling between family time, and notice what sounds "weird." It's easy to lose this perspective when you're the founder staring at your own dashboard convinced your copy is great - but the same person instantly spots red flags in a cold email landing in their own inbox.`},

{p:'Frank Brothers', cat:'Humor & Tone', src:'Frank Collective Outbound Lessons Doc / 55 Cold Email Copywriting Cheat Codes', t:'Keep a neutral tone - skip compliments and flattery entirely', b:`Praising a stranger you've never spoken to lowers your own status and reads as insincere flattery rather than genuine research, and signals AI-generated or templated outreach. Stick to neutral, matter-of-fact observations that simply demonstrate you looked something up - and never use the words "impressive" or "congrats."`, ex:`"Saw you've opened the Brisbane office and just rolled out the advisory stream. Big couple of months."`},
{p:'Frank Brothers', cat:'Humor & Tone', src:'1M Frank eBook', t:'"Radically human" tone, self-deprecating asides, and humbling disclaimers', b:`Casual contractions, mild slang, and occasional profanity are used intentionally to make messages read like a real person dashing off a note, not a marketing department - a core differentiator against the corporate speak filling most inboxes. After a high-energy or exaggerated moment, a short, self-aware bracketed aside acknowledging the over-the-top delivery resets the tone and builds trust. Hedging phrases like "tentatively assuming" or "grain of salt" let you assert a confident, researched observation while protecting against being wrong, keeping assumption-heavy templates from reading as presumptuous.`, ex:`"Okay, maybe got carried away there"`},
{p:'Frank Brothers', cat:'Humor & Tone', src:'1M Frank eBook', t:'Calibrating boldness is a dial, not a binary', b:`The Unhinged template's own guidance warns that swagger has a narrow effective band: pushed too far it reads as obnoxious, held back too much it loses the pattern-disrupting edge that makes the format work at all. Tone needs deliberate calibration per audience rather than a fixed setting.`},
{p:'Frank Brothers', cat:'Humor & Tone', src:'1M Frank eBook', t:'Vocabulary toolkits: power-word swaps, a phrase-bank, and a phrases-to-avoid blacklist', b:`A bank of roughly 150 informal word substitutions (many British-colloquial) replaces flat corporate words with more textured alternatives - "effective" to "nifty," "strategy" to "secret-sauce," "increasing" to "skyrocketing." A separate bank of roughly 110 ready-made phrases (casual openers, softening disclaimers, transitions, casual closes, engagement hooks) keeps language conversational regardless of which template is used. And a blacklist of roughly 75 phrases to actively cut, grouped by failure mode - generic openers ("just checking in"), overused adjectives ("innovative," "game-changing"), tired jargon ("leverage," "circle back"), desperate follow-up language, clichéd social proof ("trusted by," "Fortune 500"), pushy scarcity ("act now"), vague inflated claims, and generic meeting asks ("hop on a call") - since anything this common has stopped registering as language and become inbox wallpaper. (The app's own Power Words and Phrases banks in the Cold Email Bank tab cover this same ground for quick reference.)`},
{p:'Frank Brothers', cat:'Humor & Tone', src:'55 Cold Email Copywriting Cheat Codes / The Cold Outreach Phrasebook', t:'De-polish deliberately, and use one disarming aside - not several', b:`AI-written cold email tends to sound too smooth (perfectly even flow, rhythmic triads like "clear, concise, compelling") and that polish is itself a trust-killer, since it reads as written to impress rather than to connect - break the rhythm on purpose: list two things instead of three, start with "And" or "But," drop a rough bracketed aside, use casual imprecise words ("basically," "kinda"), skip exclamation marks entirely, and occasionally de-capitalize a title or company name. A short, self-aware disclaimer up front can take the edge off a message that might feel presumptuous - but pick only one or two of these per email, since stacking several diminishes your status enough to actually hurt trust rather than help it.`, ex:`"(and yep, I know this is random)" / "I know I'm just a random name in your inbox..."`},
{p:'Frank Brothers', cat:'Humor & Tone', src:'Making Cold Outreach Funny', t:'The core formula and 5 safety rules', b:`Humour + Relevance + Respect = Replies: humor breaks the pattern of skim-and-delete, but only converts into replies when it's tied to something relevant and delivered respectfully - treat it like salt in a dish, a little lifts the whole message, too much ruins it. Five safety rules: be kind, not cruel (punch up at your own expense, never theirs); keep it clean (no politics, personal jokes, or sensitive topics); tie the joke to something true and verifiable about them; keep it short (one line is enough, don't stack jokes); and give them an easy, explicit out (signaling it's fine to ignore the email counterintuitively boosts trust). Never use memes or GIFs - they read as automation or gimmickry and kill credibility fast in B2B. (The app's Pre-Send Checks tab has the condensed checklist version of this.)`},
{p:'Frank Brothers', cat:'Humor & Tone', src:'Making Cold Outreach Funny', t:'Seven named humor moves, with worked examples', b:`Self-deprecation - make yourself the butt of the joke, since it can't offend anyone but the sender ("If this is the worst email you see today, your day is going well"). Hyper-earnest honesty - state the obvious, slightly awkward truth out loud ("I am pretending this is a warm intro. We both know it is not"). Exaggeration - stretch a small true detail into an absurd claim ("I trained three AI models and a pot of coffee to write this for you"). Playful non-threat - set up an expectation and subvert it with something trivial ("I promise not to send you banana bread recipes"). Brand reference - respectfully borrow the recipient's own tone or slogan (for Nike: "Just did it. Hit send"). Oddly specific numbers - a very precise, slightly absurd figure reads as more real and funnier than a round one ("I spent 7 minutes and 43 seconds crafting this"). And matching humor to the industry's own insider language makes a joke land as insider-aware rather than generic (a fintech or cybersecurity in-joke, for instance). Tune any of these to the recipient's specific brand voice rather than leaving them generic, and don't force a joke where the brand reads as formal, use sarcasm where tone could be misread, or ever make the reader's pain points or people the target.`},
{p:'Frank Brothers', cat:'Humor & Tone', src:'Unlocking Enterprise', t:'Own your tone: cut deferential language, speak like a peer', b:`Phrases that signal low status - "I know you're busy," "just wanted to quickly reach out" - implicitly tell the reader the sender doesn't believe the message is worth their attention. Enterprise buyers respond better to confident, peer-level tone than to apologetic framing, since tone itself communicates the sender's perceived value.`},
{p:'Frank Brothers', cat:'Humor & Tone', src:'Whatsapp Outreach / How to Get a Meeting with Anyone', t:'Self-aware humor re-opens gone-cold conversations, and builds instant rapport', b:`A "ghost follow-up" for silence should acknowledge it directly and lightly rather than pretending nothing happened or guilt-tripping the prospect, then immediately offer a low-friction alternative instead of pushing for a call - the self-deprecating tone removes pressure and makes it easy to re-engage without feeling caught out. More broadly, humor that reflects a recognizable truth about the recipient's situation - the kind that gets an immediate "that's so true" reaction - works as a fast trust-building device because it gets the recipient agreeing with the sender's underlying point before any ask is made.`},


// ============ CHANNEL-SPECIFIC ============

{p:'Eric Nowoslawski', cat:'Channel-Specific', src:'How to Increase Meetings Booked Per Positive Response', t:'Multi-thread after a positive reply', b:`Once someone responds positively by email, don't rely on email alone to close the scheduling loop - also reach out via LinkedIn and, where possible, by phone, to increase the overall chance of getting the meeting on the calendar.`},

{p:'Matt Lucero', cat:'Channel-Specific', src:'START HERE / How To Generate Leads With Cold Email in 2026 (FULL COURSE) / Video 1 (batch 3)', t:'The multi-channel cycle for non-responders and interested leads', b:`For prospects who haven't responded, the ideal cycle is: call, leave a voicemail if no pickup, then email, then a LinkedIn connection request, repeating until they show a sign of life or ask you to stop. Once a lead replies positively over email, layering LinkedIn and phone on top of the email thread can push interested-reply-to-meeting conversion from roughly 20-30% (email-only) up toward 50% - "aggressive nurture" for cold leads means calling, texting, and LinkedIn-messaging too, using every channel available to get back in front of a stranger enough times that they start to trust and eventually buy. Once someone has shown any interest at all, this multi-channel pursuit is no longer "chasing a stranger" - you have more license to keep pushing.`},
{p:'Matt Lucero', cat:'Channel-Specific', src:'START HERE: How to Run Cold Email for Any Business', t:'Calling beats email for reactivating warm leads, at a cost - and swap channels for older audiences', b:`For warm inbound leads (e.g. 600 webinar sign-ups), having someone call them directly tends to produce a notably higher response rate than emailing alone - the trade-off is cost, since it requires a dedicated, paid caller who can only make a couple hundred dials a day, so it's best reserved for smaller, higher-value warm batches rather than blanket cold volume. Rather than pitching a Zoom meeting to an audience that won't take video calls (older or blue-collar audiences), shift the ask to a plain phone call - sometimes skipping the formal pitch entirely and simply asking if they're interested, letting them supply a phone number to call.`},
{p:'Matt Lucero', cat:'Channel-Specific', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'Automate the LinkedIn touch, and enable calling with a phone-number waterfall', b:`Rather than manually sending connection requests, an automated workflow can trigger a LinkedIn connection request the instant a lead is marked interested from an email reply, ensuring the multi-channel follow-up happens consistently without added manual work. The same waterfall-enrichment approach used for emails can be applied to mobile phone numbers (passing a LinkedIn profile through multiple data providers), giving you the contact data needed to add cold/warm calling as a channel alongside email.`},
{p:'Matt Lucero', cat:'Channel-Specific', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'Match the CTA’s channel to the audience’s actual habits', b:`A quick-phone-call CTA outperforms a Zoom-meeting CTA specifically with less digitally-native, non-desk-bound audiences (contractors, home-service businesses) who aren't sitting at a computer managing a calendar app all day - channel choice in the CTA itself should reflect how the target audience actually operates day to day.`},

{p:'Frank Brothers', cat:'Channel-Specific', src:'1M Frank eBook', t:'WhatsApp-style copy works beyond WhatsApp, and a blended multi-channel motion is the norm', b:`Short, punchy, low-formality copy that mimics a casual DM performs well even sent by email - one of the explicit "break the rules" tactics, since the format doesn't need to stay confined to the channel it originated on. Running outreach across email, LinkedIn, and WhatsApp simultaneously, rather than as separate siloed campaigns, reflects the underlying assumption that a real prospect touch sequence should move across channels rather than stay confined to one - the Executive Engagement scenario is built specifically for LinkedIn re-engagement, since a message from a well-established, thought-leader profile carries more authority and gets a warmer reception than the same note from an unknown rep.`},
{p:'Frank Brothers', cat:'Channel-Specific', src:'Frank Collective Outbound Lessons Doc', t:'LinkedIn as the research layer feeding email, not the send channel', b:`Nearly every targeting and personalization tactic pulls from LinkedIn - Sales Navigator for list-building, and scraping tools for post engagers, event attendees, job changes, and competitor SDR activity - even though the actual outbound send channel is email. LinkedIn functions as the signal-and-research infrastructure that feeds personalized email copy, rather than a channel messages are sent through directly. Separately, a dedicated visitor-identification tool can reveal which specific people (not just companies) are visiting your website, letting you route these as high-intent, warm leads into outbound rather than treating all outbound targets as equally cold.`},
{p:'Frank Brothers', cat:'Channel-Specific', src:'The Secret to Close Outbound Sales Opportunities', t:'Blend email, LinkedIn, and phone as one standing cadence', b:`At first contact, alongside the initial proof-link email, send LinkedIn connection requests from both founders with a friendly note - running email and LinkedIn as parallel first touches rather than sequencing one after the other. Beyond direct touches, maintain LinkedIn continuously as a standing authority channel (daily or near-daily insight posts, visible engagement/follower proof) so that by the time a prospect checks a profile mid-sales-process, it already reads as credible and active. The standard follow-up cadence then runs a 9-email sequence, light LinkedIn touches, and intermittent short phone calls together as one motion, since being visible across more than one channel improves the odds of eventually getting a clear answer.`},
{p:'Frank Brothers', cat:'Channel-Specific', src:'Whatsapp Outreach', t:'Use WhatsApp for nurturing, never for cold prospecting', b:`The core rule: WhatsApp should not be used for lead generation or first-touch outreach - it's strictly a nurture and follow-up channel for high-value prospects and pipeline accounts you've already earned some relationship with, since messaging someone's personal phone before that access is earned reads as intrusive. Real trade-offs to weigh: open rates above roughly 90%, real-time replies that build pipeline momentum, and a more human, less-automated feel that's especially strong for staying top-of-mind - against real risk of the number getting banned if used for spam, phone numbers being harder and pricier to source than emails, a hard ceiling on volume (built for hand-picked high-intent leads, not blasting), and feeling intrusive if deployed too early.`},
{p:'Frank Brothers', cat:'Channel-Specific', src:'Whatsapp Outreach', t:'Specific moments to deploy WhatsApp, and five matching template types', b:`Concrete trigger moments for switching to WhatsApp: right after a lead replies positively to a cold email, once a meeting is booked or about to start, immediately after a great sales call, when you've been referred to a new contact, and when a previously-interested prospect goes quiet - in every case WhatsApp is the "second act," used only after email, a call, or an introduction has already opened the door. Five matching template types: a post-email-reply message to keep momentum, a pre-meeting reminder sent 15-30 minutes before a call to reduce no-shows, a post-meeting follow-up referencing something specific from the conversation, a light multi-threading message for a newly-introduced stakeholder, and a self-aware ghost-follow-up for someone who went quiet after initially replying.`},
{p:'Frank Brothers', cat:'Channel-Specific', src:'Whatsapp Outreach', t:'Build the phone-enrichment-to-send workflow end-to-end, and treat it as a scalpel', b:`Chain an ICP-filtered lead list through a waterfall of enrichment providers to find mobile numbers (formatted with country code, no plus sign), generate the message text dynamically with an AI block referencing name, company, and context, and send it by connecting an enrichment workflow to a WhatsApp API wrapper tied to a real WhatsApp number - so the whole find-number, write-message, send sequence runs as one automated pipeline. The closing principle: WhatsApp only stays effective if used sparingly and precisely, for meaningful nudges and soft follow-ups on already-warm leads - that restraint is exactly what keeps you from being muted the way mass-messaging senders eventually are.`},

{p:'Frank Brothers', cat:'Mindset & Strategy', src:'StackOptimise Newsletter Vol 13', t:'The 10 traits of a GTM Engineer', b:`Doesn't stop A/B testing a winning template, stays hyper efficient with tooling, prioritises high-intent leads over high reply rates, spots campaign fatigue before it happens, only scales proven templates, is diligent about zero AI hallucination in copy, builds redundancy into workflows so campaigns don't break, uses AI to solve roadblocks independently, ensures every message in a sequence adds fresh value, and stays current on tools and strategy.`},
{p:'Frank Brothers', cat:'Copywriting & Message Structure', src:'StackOptimise Newsletter Vol 14', t:'Push people away to pull them in', b:`Frame a genuine buyer signal with humility or self-disqualification instead of confidence - assume you're already too late or that the prospect has it handled. The perceived lack of a sales agenda makes the message easier to engage with.`, ex:`"Should've reached out 2 weeks ago when I saw your Series A hit Crunchbase, guessing I've missed the bus here." / "Saw you just hired a growth lead, so I'm assuming you're looking to keep things in house."`},
{p:'Frank Brothers', cat:'Follow-Up Strategy', src:'StackOptimise Newsletter Vol 16', t:'Treat cold email as the opener, not the whole conversation', b:`Cold email performs better paired with a second channel rather than run alone. Pair it with a LinkedIn content strategy, and have reps, founders, and marketers all connect with and engage the leads who reply - let LinkedIn carry the conversation forward.`},
{p:'Frank Brothers', cat:'Copywriting & Message Structure', src:'StackOptimise Newsletter Vol 17', t:'Stop triggering the default defence response', b:`Small word swaps stop a sentence from reading as a mass-sent assumption. Change "usually" to "sometimes." Change "do you want me to send it over?" to "would it be okay if...". Replace "my founder asked me to reach out" with an actual buyer signal. Avoid flattery outright, or bury it subtly instead of stating it directly.`},
{p:'Frank Brothers', cat:'Personalization & Research', src:'StackOptimise Newsletter Vol 21', t:'Go beyond the obvious personalization points', b:`Most senders stop at company/role. Reach for less-common personalizations instead: colleagues, competitors, ex-employers, mission statements, or founder stories - these are far less templated and signal deeper research.`},
{p:'Frank Brothers', cat:'Tools & AI', src:'StackOptimise Newsletter Vol 21', t:'QA your AI output with AI too', b:`Don't just use AI to generate the message - run a second AI pass purely to QA the first draft for formatting, typos, and tone before it goes out.`},
{p:'Frank Brothers', cat:'Offers & Positioning', src:'StackOptimise Newsletter Vol 23', t:'Align your case study and say so explicitly', b:`A case study only builds credibility if the prospect can immediately see why it applies to them - state the connection out loud rather than assuming they'll infer it. Match case studies to prospects in priority order: industry, then customer base, then problem solved, then business model, then general market forces.`},
{p:'Frank Brothers', cat:'Personalization & Research', src:'StackOptimise Newsletter Vol 24', t:'Normalise company names before dropping them into outreach', b:`Reading a full legal company name out loud in an email ("VP at SentiTech Holdings Group LLC") is one of the fastest tells that a message was automated. Strip suffixes like "Inc," "Group," and "Holdings," use acronyms only if they're natural, and never use full stops.`, ex:`"Bernstein Private Wealth Management" -> "Bernstein" / "JP Morgan Chase & Co." -> "JPM"`},
{p:'Frank Brothers', cat:'Mindset & Strategy', src:'StackOptimise Newsletter Vol 25', t:'Cold email myths worth debunking', b:`You can talk about yourself if it builds credibility. You won't burn your TAM - most people never notice your email. You can hit the same TAM once every 4-8 weeks. You can generate plenty of positive replies with zero social proof. Long emails can work. Long sequences can work too, as long as every step is richly personalised.`},
{p:'Frank Brothers', cat:'Subject Lines', src:'StackOptimise Newsletter Vol 27', t:'Six pattern-breaking cold email openers', b:`A grab-bag of openers built purely to disrupt the "another sales email" pattern before the pitch even starts.`, ex:`"I paid $0.78 to send this email." / "This is one of those emails where I know the chances of you replying are practically nil." / "15-second read." / "I'm about to make a bolder claim than any crypto founder in 2021." / "I'm just a small-town boy, sending DMs in a lonely world."`},
{p:'Frank Brothers', cat:'Tools & AI', src:'StackOptimise Newsletter Vol 28', t:'Use AI translation blocks to go multilingual without changing your stack', b:`Combining AI translation blocks with an existing email-generation workflow in Clay lets you instantly translate, localise, and rewrite outreach for any market - scaling across borders and languages without touching the underlying system.`},
{p:'Frank Brothers', cat:'Tools & AI', src:'StackOptimise Newsletter Vol 29', t:'Match the AI model to the job, not one model for everything', b:`Different models are cheaper, faster, or better suited to different steps of an outbound workflow: a strong model for copywriting that needs to sound human, a research-focused model for live/fresh data, a lightweight model for simple cleanup tasks, and a fast, cheap model for bulk operations.`},
{p:'Frank Brothers', cat:'Targeting & List Building', src:'StackOptimise Newsletter Vol 30', t:'The smaller the list, the stronger the message', b:`Run two parallel tracks: macro-campaigns (broad targeting, high volume, scalable but lower reply rates) and micro-campaigns (niche targeting, low volume, higher intent and reply rates) - filtered by things like one city, a niche industry, event attendees, or followers of a specific company. When relevance is nailed, micro consistently beats macro.`},
{p:'Frank Brothers', cat:'Calls to Action (CTA)', src:'StackOptimise Newsletter Vol 31', t:'Distance creates desire', b:`Rather than asking directly for a call off a trigger, acknowledge the trigger but use it to suggest the prospect is probably too busy - then offer something low-effort instead of a meeting.`, ex:`"I see you've been running operations at Nike for almost four years now. You've probably got your processes dialled in... so I'm not asking for a call - just consent to send a quick video."`},
{p:'Frank Brothers', cat:'Volume, Testing & Metrics', src:'StackOptimise Newsletter Vol 32', t:'Cold email is also a brand-awareness channel', b:`Relevant, valuable, well-written cold emails prompt recipients to check out the sender's domain even when they don't reply. Scaling volume can lift web traffic measurably alongside lead generation - one campaign scaling from 20k to 150k emails saw a 157% increase in monthly web traffic.`},
{p:'Frank Brothers', cat:'Follow-Up Strategy', src:'StackOptimise Newsletter Vol 34', t:'Five rules for the breakup email', b:`Signal explicitly that it's the last message. Add a genuinely fresh insight. Layer in new social proof. Reiterate the value prop in different words. End on a no-pressure close. The last email is often your best shot - if you treat it like the first, not an afterthought.`},
{p:'Frank Brothers', cat:'Personalization & Research', src:'StackOptimise Newsletter Vol 35', t:'Automate research extraction with an AI web-scraper', b:`Tools like Claygent inside Clay can automatically extract product launches, eco initiatives, competitor mentions, interviews, campaigns, and awards per prospect - turning what used to be manual research into a scalable personalization input.`},
{p:'Frank Brothers', cat:'Volume, Testing & Metrics', src:'StackOptimise Newsletter Vol 39', t:'Most people quit outbound too early', b:`Treat outbound as a game of relentless experimentation, not a one-shot test. One campaign only found its winning angle on its eighth attempt (147 leads, 3.8% reply rate) after seven prior campaigns produced minimal results - you're often one test away from a repeatable lead engine.`},
{p:'Frank Brothers', cat:'Sales Calls & Closing', src:'StackOptimise Newsletter Vol 41', t:'Your best sales asset is a folder of screenshots', b:`Screenshot every positive reply as it comes in, keep the timestamp visible, don't edit or polish them, organise by campaign or client type, and drop the folder link into sales calls as unstaged proof.`},
{p:'Frank Brothers', cat:'Copywriting & Message Structure', src:'StackOptimise Newsletter Vol 42', t:'A simple line-by-line structure for the email body', b:`Lines 1-2: prove you know their world. Lines 3-4: name a problem they actually have. Lines 5-6: hint at how you help, in the context of that need. Line 7: a low-friction CTA to share more info or something valuable. More context doesn't always mean more credibility - keep each beat tight.`},
{p:'Frank Brothers', cat:'Subject Lines', src:'StackOptimise Newsletter Vol 43', t:'Mimic a platform notification in the subject line', b:`A subject line phrased like a LinkedIn or Slack notification creates the same curiosity and urgency as a real platform alert, while still feeling personal rather than automated.`, ex:`"{Firstname}, Penn sent you a direct message"`},
{p:'Frank Brothers', cat:'Targeting & List Building', src:'StackOptimise Newsletter Vol 45', t:'Your list is probably the problem, not your copy', b:`You can't write one email that's genuinely relevant to a broad, heterogeneous list, so you end up with something safe and generic that doesn't get replies. Add filters that make the audience more homogeneous (e.g. founded in the last 2 years, no finance hire on LinkedIn, first-time founder) and the copy gets specific almost automatically.`},
{p:'Frank Brothers', cat:'Tools & AI', src:'StackOptimise Newsletter Vol 46', t:'Give your AI a project file to stop inconsistent output', b:`If an AI model keeps giving inconsistent outputs, the fix is usually a missing context file. Store the ICP, the messaging framework, the sequence structure, and a few example emails you actually like in a claude.md so every generation starts from the same grounding.`},
{p:'Frank Brothers', cat:'Offers & Positioning', src:'StackOptimise Newsletter Vol 47', t:'A lead magnet asks for nothing - and converts better', b:`Most cold email CTAs ask for too much (a call, a meeting). A lead magnet CTA asks for nothing and gives something concrete instead.`, ex:`ROI calculator, free mini service, custom research/data, free strategy session (not a sales call), free benchmark report, free template/swipe file, free competitive analysis, free audit, free teardown, free score/grader.`},
{p:'Frank Brothers', cat:'Follow-Up Strategy', src:'StackOptimise Newsletter Vol 48', t:'Break the follow-up pattern with humour instead of a nudge', b:`"Any thoughts?" follow-ups get ignored because they add nothing. Replace the polite nudge with something unexpected that still signals persistence.`, ex:`"I'm starting to think you're testing my persistence" / "Did my emails go to spam or are you just not that into me?"`},
{p:'Frank Brothers', cat:'Copywriting & Message Structure', src:'StackOptimise Newsletter Vol 49', t:'One idea per email, no exceptions', b:`Stacking multiple selling points in one message - price per lead, resolution rates, feature breakdowns, case studies all at once - is a common way cold emails fail. Pick the single strongest idea and build the whole message around it.`},
{p:'Frank Brothers', cat:'Mindset & Strategy', src:'StackOptimise Newsletter Vol 50', t:'Three requirements for outbound to still work', b:`A truly differentiated offer, outstanding social proof, and a creative lead magnet strategy. Without at least one of these, a cold email is just another message in the inbox.`},
{p:'Frank Brothers', cat:'Copywriting & Message Structure', src:'StackOptimise Newsletter Vol 51', t:'Ten rules for a cold email that reads fast', b:`Every word counts. Keep the subject line to 1-3 words. Don't let it scream "sales." Load the first line with research. Write at a 3rd-5th grade reading level. Use an F-shaped structure with shorter sentences. State a clear reason why you contacted them. Make what's in it for the prospect stand out. Make sure it can be read on a phone without scrolling. Include social proof showing how you helped a similar company.`},
{p:'Frank Brothers', cat:'Objection Handling & Replies', src:'StackOptimise Newsletter Vol 54', t:'Pre-empt the objection your offer creates', b:`Most cold emails fail because they create an objection they never address. If your offer implies a conflict the prospect will silently object to (e.g. "we already have an agency"), name and remove it in the same message rather than waiting for the reply to raise it.`, ex:`"We help companies scale outbound" + "Most of our clients already had an agency - we work alongside them."`},
{p:'Frank Brothers', cat:'Volume, Testing & Metrics', src:'StackOptimise Newsletter Vol 56', t:'When a campaign breaks, isolate one variable', b:`Don't change everything at once when a campaign underperforms. Test one inbox provider at a time, tighten targeting parameters, and increase testing velocity on new angles and offers - find the single broken element instead of adding complexity on top of an unknown fault.`},
{p:'Frank Brothers', cat:'Targeting & List Building', src:'StackOptimise Newsletter Vol 57', t:'Work down the intent ladder before going fully cold', b:`Prioritise outreach in order of existing intent: first, people already responding to your emails, ads, or inbound forms; then identified website visitors; then people engaging with your customers; then your competitors' audience; only then fully cold prospects.`},
{p:'Frank Brothers', cat:'Volume, Testing & Metrics', src:'StackOptimise Newsletter Vol 58', t:'A lower inbox rate can still mean more replies', b:`Personalised visuals (a screenshot, a simple graphic) can lower inbox placement slightly while lifting the reply rate enough to still win on total replies - always compare the full math, not just the inbox-rate metric in isolation.`, ex:`80% inbox rate x 1% reply rate = 80 replies. 70% inbox rate x 1.8% reply rate = 126 replies - 57% more responses from the second campaign.`},
{p:'Frank Brothers', cat:'Copywriting & Message Structure', src:'StackOptimise Newsletter Vol 59', t:'Five copywriting rules for a cold email', b:`Each line connects logically to the next. It must be confusion-free. It must be polished, with no sloppy grammar. It must sound human - avoid AI-default phrases. It must be unique - either the offer carries the email, or the copy does.`},
{p:'Frank Brothers', cat:'Tools & AI', src:'StackOptimise Newsletter Vol 61', t:'Seven phrases that scream "AI wrote my copy"', b:`Em dashes everywhere, the rule of three, corporate speak, present-tense stacking, fake personalisation, cringe transitions, and contrast framing ("it's not just X, it's Y") are the most common AI tells. If a draft hits more than two of these, give it another pass.`},
{p:'Frank Brothers', cat:'Offers & Positioning', src:'StackOptimise Newsletter Vol 62', t:'Lead magnets can power an entire GTM motion', b:`Don't treat a lead magnet as a one-off CTA - create as many as possible and distribute them everywhere: cold email, LinkedIn, your website, and follow-up sequences, so the same asset compounds across every touchpoint.`},
{p:'Frank Brothers', cat:'Mindset & Strategy', src:'StackOptimise Newsletter Vol 63', t:'A 6-step self-schooling loop for staying sharp on outbound', b:`Follow top sales voices on LinkedIn, engage with their content to refine your feed, save the posts that resonate, schedule a weekly review of saved posts, extract the insights into a doc, then implement one new tip per week to continually upgrade your skillset.`},
{p:'Frank Brothers', cat:'Copywriting & Message Structure', src:'StackOptimise Newsletter Vol 64', t:'A few typos can outperform a perfectly polished email', b:`A message with the odd typo reads like a busy human typed it in a hurry, and busy humans get replies. The exception: never misspell the person's name, their company, or your own product - those still have to be right.`},

{p:'Christian Bonnier', cat:'Mindset & Strategy', src:'The $1M Cold Email Template', t:'The best sequences are stupidly simple', b:`After writing more than 10,000 cold outreach messages, his consistent finding is that the best-performing cold email sequences of all time are very, very stupidly simple - a snappy opener, one secondary value statement, and a single CTA. Complexity in a script is usually a sign it needs to be cut down, not proof that more thought went into it.`},
{p:'Christian Bonnier', cat:'Mindset & Strategy', src:'Nuance > Rules (Nuance video)', t:'Follow nuance, not arbitrary rules you read on Twitter', b:`People get stuck following rules they read online - "pitch benefits, not features" - even when it's not working for their specific offer. The benefits-over-features rule is generally right, but it's not set in stone: a hot, trending offer (his example: TikTok content in a saturated agency market) can outperform by leading with the feature itself, while an oversaturated offer (Facebook ads) needs to hide the mechanism and lead with the benefit instead. There are no fixed rules in cold email or marketing - test what you believe, using judgment about how saturated or novel the offer is, and only double down once something is proven, never before.`},
{p:'Christian Bonnier', cat:'Mindset & Strategy', src:'Cold Email Teardown Series', t:'Shorter always outperforms longer', b:`Across multiple teardowns of submitted emails, the pattern holds: cutting a 100-168 word email down to 40-90 words doesn't just look better, it converts better. If a reader needs 10 seconds to figure out what's being sold, you've already lost - a cold email prospect gives an email about 3-5 seconds to make its case.`},
{p:'Christian Bonnier', cat:'Targeting & List Building', src:'Cold Email Masterclass Presentation', t:'Define your ideal client precisely, or your list and copy both suffer', b:`When asked "who do you work with," most business owners squirm and answer vaguely ("Med spas, law firms, real estate, really anybody"). A real ICP definition names the industry, the job title, company size, the tools/technology they use, and their single biggest pain point - e.g. "CEOs at SaaS companies with 10-50 employees who use MailChimp and don't get enough sales from their email list." Without that specificity, list-building tools can't target well and copy has nothing concrete to reference.`},
{p:'Christian Bonnier', cat:'Targeting & List Building', src:'Cold Email Masterclass Presentation / $1M template', t:'Start small to prove the campaign, then scale the list', b:`Rather than building a massive list on day one, prove out a new offer or angle on roughly 1,000 leads first, capping list-building tools to just 1-3 contacts per company so you're not wasting credits on redundant contacts at the same business. Once an angle is validated with real replies, scale the list size up.`},
{p:'Christian Bonnier', cat:'Personalization & Research', src:'The Trojan Horse Strategy', t:"Pose as a customer, not a vendor, to get behind the reader's guard", b:`The Trojan Horse opener frames you as someone who already interacted with the business as a consumer - "I was checking out your website," "I opted into your email list," "I got hit with one of your paid ads" - rather than as a vendor cold-pitching them. Reverse-engineer your own offer into a plausible consumer touchpoint (a security firm: "noticed a few things likely to cause a cyber attack on your site"; an SEO agency: "couldn't find you on Google"). If a reply comes back and the prospect turns out to already be excellent at the thing you critiqued, let it go and move to the next lead rather than forcing a fabricated critique.`},
{p:'Christian Bonnier', cat:'Personalization & Research', src:'Two-Sentence Cold Email Scripts', t:'Personalize with a level-deeper problem, not the generic service category', b:`Instead of referencing "leads" or "jobs" in general, dig one level into the prospect's actual site or case studies to name the specific sub-problem that matters most - e.g. "bed bug and termite jobs" for a pest control company rather than "pest control leads," or naming the exact case study result already published on their site. This level of specificity is what makes a two-sentence email still feel personally researched.`},
{p:'Christian Bonnier', cat:'Personalization & Research', src:'Cold Email Masterclass Presentation', t:'Personalize by role at scale instead of manual research on every prospect', b:`Rather than manual, per-lead personalization or AI-generated first lines, a role-based line written once for the whole segment can work at scale - e.g. "always enjoy connecting with fellow agency owners, keep crushing it with {{company}}" sent to every agency-owner prospect. It reads as personal because it's true of the whole segment, without requiring individual research time per lead.`},
{p:'Christian Bonnier', cat:'Subject Lines', src:'The $1M Cold Email Template / Full Course', t:'"Quick question" still works, and stating the guarantee in the subject line is a strong test', b:`"Quick question" remains a usable subject line specifically because prospects are preconditioned to expect a pitch - if the script itself is good, they'll open it anyway just to see. A stronger test-worthy alternative is stating the guarantee directly in the subject, e.g. "15 qualified calls per month guaranteed," or simply "{{company name}} X {{your company}}," which reads more like a proposal than spam.`},
{p:'Christian Bonnier', cat:'Copywriting & Message Structure', src:'The Two-to-One Rule', t:'Say "you" twice for every time you say "I"', b:`Count the "I" and "you" references in a draft - for every mention of yourself, there should be at least two mentions of the prospect. The most common violation he sees is "I would love to show you..." as a CTA; reframing it to "Would you be open to..." both removes an "I" and adds a "you," while also reading as less presumptuous.`},
{p:'Christian Bonnier', cat:'Copywriting & Message Structure', src:'Two-Sentence Cold Email Scripts', t:'The entire email can be two sentences: an observation and a video CTA', b:`His simplest repeatable structure is one sentence naming a specific observation about the business, followed by one sentence offering a video ("I recorded a video explaining how we can get you set up... mind if I share it here?"). Nothing else is needed to get a qualified prospect to say yes to seeing more - the full pitch happens after they've already opted in by watching the video.`},
{p:'Christian Bonnier', cat:'Copywriting & Message Structure', src:'Cold Email Teardown Series', t:'Cut every email in half before sending', b:`Repeatedly, his rewrite of a submitted email runs at roughly half the word count of the original and reads more clearly, not less. If a reader can't tell what's being sold within the first couple of lines, the email is too long - remove the preamble, the "why me" justification, and any sentence that doesn't directly build toward the CTA.`},
{p:'Christian Bonnier', cat:'Copywriting & Message Structure', src:'One-Two Punch Strategy', t:'Keep the messaging identical across every follow-up in the sequence', b:`Prospects who don't reply are usually not seeing the email, seeing it and forgetting, or seeing it and forgetting to reply - not rejecting the specific offer. Because of that, follow-ups should reiterate the same hook and the same offer rather than switching angles, since changing the pitch mid-sequence just confuses a prospect who's now seen two different claims from the same sender.`},
{p:'Christian Bonnier', cat:'Offers & Positioning', src:'Tangible Lead Magnets ($0 to $100K in 90 Days)', t:'Make your lead magnet tangible and clearly valuable to the prospect, not to you', b:`A prospect needs to be able to visualize exactly what they're about to receive - "50 free sample leads in a spreadsheet" is tangible; "a case study one-pager" is not, because no cold prospect cares about your best case studies. Good tangible lead magnets: a Loom video, an audit of existing marketing assets, a portfolio of past creative work, or a small sample of the actual deliverable (a rewritten email flow, a blog outline, a list of leads) - something the reader can picture landing in their inbox.`},
{p:'Christian Bonnier', cat:'Offers & Positioning', src:'The $1M Cold Email Template / Full Course', t:'A no-brainer offer = a tangible benefit stated in business terms, plus a guarantee', b:`Frame outcomes in terms business owners can visualize and value directly - sales, revenue, booked calls, new clients, conversions - never abstract marketing metrics like ROAS, CPC, or CAC, which most prospects can't translate into value. Then stack a guarantee on top ("...or your money back," "...or we work for free until you do") - the combination of a tangible, quantifiable benefit and a real guarantee is what makes an offer close to impossible to say no to.`},
{p:'Christian Bonnier', cat:'Offers & Positioning', src:'Nuance video', t:'Get specific inside a generic service instead of pitching the whole stack', b:`When an offer is generic ("full-service marketing," "email marketing," "bookkeeping"), map every individual service you deliver, then ask existing clients which single piece they find most valuable - or test each piece as its own angle in parallel. Whichever angle actually books calls becomes the new front door into the same backend offer; the delivery doesn't change, only what gets pitched first.`},
{p:'Christian Bonnier', cat:'Offers & Positioning', src:'Two-Sentence Cold Email Scripts', t:'Go one level deeper than the obvious result to separate from a crowded inbox', b:`When everyone else pitching the same category is saying "leads" or "quotes," go one step further down the value chain - promise "booked estimates" instead of "leads" for a plumber, since an estimate is one step closer to a signed job than a lead is. Going a level deeper than competitors' claims in the same inbox is a low-cost way to stand out without changing the underlying service.`},
{p:'Christian Bonnier', cat:'Calls to Action (CTA)', src:'Best CTA of 2025', t:'Pitch a lead magnet before a call, not a call in email one', b:`For roughly 99% of offers, pitching a sales call directly in the first email no longer converts - across several running client campaigns (a merchandise brand, an AI script tool, a real estate lead source, ListKit itself), the highest-performing angle in every case offered a tangible piece of value first: a video over a catalog, a free trial, a sample list of leads, a rewritten email flow. The moral across every campaign: insert a concrete step - video, portfolio, sample, list - between the first email and the ask for a call, whatever that step looks like for your specific offer.`},
{p:'Christian Bonnier', cat:'Calls to Action (CTA)', src:'The $1M Cold Email Template / Full Course', t:'Give value in the CTA instead of only asking for something', b:`Rather than "are you open to a call?" or "want more info?", the strongest CTA offers something to the reader: "Mind if I share a video going over some campaign strategies I came up with for you?" This flips the psychology from the prospect being asked for their time to the prospect being offered something for free, which raises the odds they say yes before ever getting on a call.`},
{p:'Christian Bonnier', cat:'Calls to Action (CTA)', src:'Cold Email Masterclass Presentation', t:'The Loom video pitch structure: observation, then a two-sentence CTA', b:`Open the video by restating the specific observation from the email, then walk through 2-3 concrete, numbered points of value ("here's three things you can change..."), and close with a clear, specific next step ("let's hop on a call - how does tomorrow or Monday at 1pm Eastern look?"). Calling out the exact ideal-client profile in the first few seconds of the video (naming firm size, use case, and pain point) acts as a vetting filter - prospects who don't match tend to stop watching, while the right prospects watch to the end because they recognize themselves.`},
{p:'Christian Bonnier', cat:'Follow-Up Strategy', src:'The One-Two Punch Cold Email Strategy', t:'Throw a soft jab in email one, save the hard pitch for the right hook in email two', b:`Most people front-load every detail - the hard CTA, case studies, guarantees - into their very first email, which shows the prospect your whole hand before you've earned a reply. Instead, make email one short, vague, and conversational (a single-sentence question with light personalization), and save the full pitch - case study, guarantee, hard CTA - for email two, framed as "the reason for my email the other day was...". This gives you a chance at a reply from the soft jab before you ever have to spend your best ammunition.`},
{p:'Christian Bonnier', cat:'Follow-Up Strategy', src:'Cold Email Masterclass Presentation - Inbox Management', t:'Follow up relentlessly, every three to five days, until you get an answer', b:`Real booked calls in his examples took three to four weeks and five-plus follow-up touches to land, moving through multiple contacts at the same company (an assistant, then a marketing manager, then the CEO) before finally landing a scheduled call. The lesson: a lack of an immediate reply is not a no - keep following up on a regular cadence until you get an actual answer, one way or the other.`},
{p:'Christian Bonnier', cat:'Objection Handling & Replies', src:'Cold Email Masterclass Presentation - Inbox Management', t:'Never send pricing over email - always pivot to a call', b:`As soon as a prospect reads a price in an email, they either think you're too cheap (and disqualify you) or too expensive (and negotiate down) - there's no version of stating price over email that works out well. Instead of quoting a number, respond with something like "instead of going back and forth over email to discuss pricing and wasting both of our time, I'd be happy to discuss our flexible pricing options on a quick call - how does tomorrow or Friday at 2pm Eastern work?"`},
{p:'Christian Bonnier', cat:'Objection Handling & Replies', src:'Cold Email Masterclass Presentation - Inbox Management', t:"Propose specific times in the prospect's own time zone, never just a calendar link", b:`Rather than dropping a generic calendar link, propose exact times converted into the prospect's local time zone - "how does 10am Pacific work?" or "5pm UK time?" - which removes an extra decision-making step and makes booking feel frictionless. Whatever question a reply actually asks, answer it directly, then use that answer as the bridge into proposing a specific time.`},
{p:'Christian Bonnier', cat:'Sales Calls & Closing', src:'Cold Email Masterclass Presentation', t:'Use the Loom video itself as a vetting mechanism before the call', b:`One of his clients discovered that explicitly naming the ideal client profile in the first seconds of a pitch video - firm size, transaction volume, specific traits - causes almost 100% of viewers who match to watch the whole thing, since it reads as proof the video was made specifically for them. That same specificity also self-filters out poor-fit viewers before they ever reach a call, saving sales time for genuinely qualified prospects.`},
{p:'Christian Bonnier', cat:'Deliverability & Sending Infrastructure', src:'Cold Email Masterclass Presentation / $1M Full Course', t:'Never send from your main business domain - use disposable burner domains', b:`Sending cold volume from your primary business domain risks that domain (and every email tied to your real business) landing in spam if flagged. Instead, buy multiple look-alike domains (e.g. "usecompany.com," "getcompany.com," "gocompany.com") purely for sending, treat them as disposable, and set each one up with proper DMARC/DKIM records before use - roughly 10 domains sending about 40 emails per domain per day gives meaningful volume without risking the core domain.`},
{p:'Christian Bonnier', cat:'Deliverability & Sending Infrastructure', src:'Cold Email Masterclass Presentation', t:'Cap volume per inbox and scale horizontally, not vertically', b:`Sending everything from one or two inboxes at high volume is the single biggest cause of landing in spam. Limit each individual inbox to around 20 emails per day, and scale total volume by adding more domains and inboxes rather than pushing more through fewer of them - to send 10,000 emails a month you need roughly 50 domains at 20/day each, not one domain blasting all day.`},
{p:'Christian Bonnier', cat:'Deliverability & Sending Infrastructure', src:'Cold Email Masterclass Presentation', t:'Plain text only - no links, images, or HTML in cold sends', b:`Links, images, and HTML formatting are common spam triggers for cold volume, on top of properly-configured domains and a multi-week warm-up period before a domain starts sending real campaign volume. Even with all the technical deliverability steps done correctly, copy that reads as spammy will still eventually get flagged and dragged down with it - deliverability and copy quality aren't separate problems.`},
