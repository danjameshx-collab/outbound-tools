example:`Subject: Cutting through the noise on your web designer search. Hey Felix, Figured that your LinkedIn DMs & Calendly would be flooded after announcing your search for a web designer... Probably with the same sh*t: "Dear Felix, I'm X and have X years experience." The "blah, blah who cares" stuff. I wanted to tell you the nitty-gritty, needle-moving bits that will actually help you find the right fit for StackOptimise. So I used Prospeo and Wiza to hunt out your message and then validated it with NeverBounce in Clay. What you need to know: I worked for Australia's best direct response agency (King Kong), crafting 100s of high-converting LPs and funnels... Since then I've built a team producing some of the best LPs/funnels on the planet - working D2C and with top agencies... Everything from agency funnels to 8-figure course funnels and even some of the biggest launches in ClickFunnels history. Cause most people try to sell you Coke but really give you Pepsi... We provide a no-fee test project including strategy, copy, design, and dev to try us out. Let me know if you're keen to hear more. Best, Tyce, Landing Page Lead @ Landing Page Labs. P.S. I've been following StackOptimise for a while - actually really helped me set up my outbound motion (would love to repay the favor).`,
theory:[`Pattern disruptor - calls out the overwhelming volume of generic outreach.`,`Curiosity - mentions the specific tools used to find the prospect.`,`Authority/social proof - references known agencies/platforms.`,`FOMO & simplicity - the no-fee test project removes friction.`,`Personalised close - the P.S. adds a relationship-building touch.`,`Radically human - casual, digestible, speaks in the recipient's own voice.`],
when:[`Digital marketing, SaaS and growth agencies where differentiation is critical.`],
tip:`91% of recipients read the P.S. line first - make it specific and personalised to pull them into the rest of the (relatively long) email.`,
prompt:`Craft a highly personalised cold outreach that breaks through inbox clutter: bold pattern-disruptor opener, deep personalisation, a transparent breakdown of how the outreach was crafted, compelling social proof, a low-friction high-value CTA (no-fee test project), and a relationship-building P.S.
My business is: {{describe your business}} / Target customers: {{describe ideal customers}} / Key pain point: {{describe the main problem}} / Relevant prospect activity: {{describe trigger}} / Competitor success examples: {{list similar company wins}} / Key metric improvement: {{describe the main KPI lifted}} / Unique value offering: {{describe offer}}`},
{id:'handling-rejection',group:'Scenario Templates',name:'Handling Rejection',desc:'When someone gives you a firm no, go for the referral.',
template:`Hey {{FirstName}}, totally understand - pushing my luck, but do you think {{Previous Company}} might be a good fit? Not your job to help out salespeople, so no worries either way.`,
example:`Hey Jake, totally understand - pushing my luck, but do you think Acme Corp might be a good fit? Not your job to help out salespeople, so no worries either way.`,
theory:[`Cognitive ease - short, informal, easy to process and reply to.`,`Autonomy bias - "no worries either way" reinforces they're in control.`],
when:[`A prospect has clearly rejected your offer but may have relevant connections elsewhere.`,`Your service applies across multiple organisations in the same sector.`],
tip:`Works best when the suggested company is a similar industry or size - a mismatch feels random and desperate.`,
prompt:`Craft a handling-rejection message that makes it easy for the recipient to suggest an alternative contact while staying light and pressure-free. Acknowledge the rejection warmly, suggest an alternative company, keep the ask low-pressure, casual language.
My business is: {{describe your business}} / Target customers: {{describe ideal customers}} / Their previous company: {{describe relevant past employer}} / Value we provide: {{describe core solution and benefit}}`},

{id:'ooo-email',group:'Scenario Templates',name:'OOO Email',desc:'Leverage absence to create a warm entry point.',
template:`Subject: Quick question while {{Prospect's Name}} is away. Hey {{FirstName}}, hoping you can point me in the right direction while {{Prospect's Name}} is OOO. I came across {{Trigger}} and thought {{Your Solution}} might be relevant for them. Would they be open to a chat, or would it make more sense to speak with you first?`,
example:`Subject: Quick question while Sarah is away. Hey Jake, hoping you can point me in the right direction while Sarah is OOO. I came across Gong's latest hiring spree and thought our SDR ramping solution might be relevant for them. Reckon they'll be open to a chat when back next week, or would it make more sense to speak with you first?`,
theory:[`Urgency bias - temporary absence adds time sensitivity.`,`Social proof & relevance - a recent trigger event shows awareness.`,`Cognitive ease - effortless to reply to.`,`Autonomy bias - gives them the choice in the CTA.`,`Pattern disruption - keeps momentum going instead of assuming the conversation stops.`],
when:[`A key decision-maker is temporarily unavailable.`,`Multi-threading is suitable, or an indirect way to engage a secondary stakeholder is needed.`],
tip:`Referencing the date the buyer is back is a subtle but effective personalisation.`,
prompt:`Craft an OOO-style cold outreach that leverages a decision-maker's temporary absence to engage an alternative contact. Mention the absent person by name, reference a relevant trigger, present the solution naturally, give the recipient the option to redirect or engage.
My business is: {{describe your business}} / Target customers: {{describe ideal customers}} / Absent decision-maker: {{name of the OOO contact}} / Recent trigger event: {{describe relevant event}} / Value we provide: {{describe core solution and benefit}}`},

{id:'exec-engagement',group:'Scenario Templates',name:'Executive Engagement',desc:'Leverage leadership to increase response rates.',
template:`Hey {{FirstName}} - {{Your_Executive}} mentioned you connected on email. Thought I'd drop you a line here. Keep crushing it in the wonderful world of {{Industry}}!`,
example:`Hey John - Felix mentioned you connected on email. Thought I'd drop you a line here. Keep crushing it in the wonderful world of healthtech!`,
theory:[`Authority bias - a message from a senior leader carries more weight.`,`Familiarity principle - referencing a previous interaction builds continuity.`,`Social proof - a warm handoff signals credibility and validation.`,`Positive reinforcement - feels personal, not transactional.`,`Cognitive ease - short, direct, easy to reply to.`],
when:[`A conversation has started via cold outreach but hasn't progressed.`,`Targeting high-level decision-makers more likely to respond to peers.`],
tip:`Works best when the executive sending it has a well-optimised LinkedIn profile and regularly shares thought leadership content.`,
prompt:`Craft an executive engagement message leveraging leadership presence to increase response rates. Reference a previous conversation for continuity, use an executive's name for authority, friendly positive tone, short and easy to reply to.
My business is: {{describe your business}} / Target customers: {{describe ideal customers}} / Executive reaching out: {{name and role}} / Previous conversation topic: {{briefly describe}} / Industry: {{describe industry}}`},

{id:'wa-post-reply',group:'WhatsApp Nurture',name:'Post-Email Reply - Keep Momentum Alive',desc:'Use after a positive cold email reply (warm contacts only).',
template:`Hey {{FirstName}} - just saw your reply land in my inbox. Thought I'd drop you a quick note here too. Hope it's not too intrusive. Already scoping out {{TargetCompanyName}}. Epic job on {{TargetCompanyUSP}}. Keep your eyes peeled for an email from me.`,
example:`Hey John - just saw your reply land in my inbox. Thought I'd drop you a quick note here too. Hope it's not too intrusive. Already scoping out Acme Corp. Epic job on the recent product launch. Keep your eyes peeled for an email from me.`,
theory:[],when:[`A lead replies to your cold email.`],tip:`WhatsApp is for nurturing warm contacts only, never cold lead generation.`},

{id:'wa-pre-meeting',group:'WhatsApp Nurture',name:'Pre-Meeting Reminder - Smooth and Helpful',desc:'Send 15-30 minutes before the call.',
template:`Hey {{FirstName}} - just a quick note that I'll be hopping into Zoom in about 20 mins. No prep needed on your end - I've spent quite a bit of time digging into {{industry}} and how we can really support {{companyname}}, to ensure we make the most of our time.`,
example:`Hey John - just a quick note that I'll be hopping into Zoom in about 20 mins. No prep needed on your end - I've spent quite a bit of time digging into fintech and how we can really support Acme, to ensure we make the most of our time.`,
theory:[],when:[`You've booked or are about to run a meeting.`],tip:`Keep it short and reassuring - the goal is to lower pre-call anxiety, not add to their to-do list.`},

{id:'wa-post-meeting',group:'WhatsApp Nurture',name:'Post-Meeting Follow-Up - Warm Relationship Builder',desc:'Send after a great sales conversation.',
template:`Hey {{FirstName}}, really enjoyed that chat earlier. Good energy. Got me thinking about a couple ways we could go about this - will package some thoughts and ping over. {{PersonalisedNoteBasedOnMeetingSummary}}. Speak soon.`,
example:`Hey John, really enjoyed that chat earlier. Good energy. Got me thinking about a couple ways we could go about this - will package some thoughts and ping over. Loved what you said about scaling the SDR team in Q2. Speak soon.`,
theory:[],when:[`You've just finished a great call and want to follow up.`],tip:`Reference something specific from the call - generic warmth reads as templated even on WhatsApp.`},

{id:'wa-multithread',group:'WhatsApp Nurture',name:'Multi-Threading / Intro Follow-Up - Light & Polite',desc:'Use when passed to a new stakeholder.',
template:`Hey {{FirstName}}, heard your name pop up re: {{Project/Challenge}} - hope it's cool I reached out here. Sounds like there might be a few ways to help - let me know if it's worth diving in?`,
example:`Hey Sarah, heard your name pop up re: the new outbound system - hope it's cool I reached out here. Sounds like there might be a few ways to help - let me know if it's worth diving in?`,
theory:[],when:[`You've been referred to someone new.`],tip:`Keep the tone light and low-commitment - this is a first touch, even on a warm channel.`},

{id:'wa-ghost',group:'WhatsApp Nurture',name:'Ghost Follow-Up - Self-Aware Nudge',desc:'Use when someone goes cold after replying once.',
template:`Hey {{FirstName}}, reckon this might've slipped into the void (or maybe I fumbled it). All good either way - happy to lob across a quick teardown if that's more useful than hopping on a call.`,
example:`Hey John, reckon this might've slipped into the void (or maybe I fumbled it). All good either way - happy to lob across a quick teardown if that's more useful than hopping on a call.`,
theory:[],when:[`A prospect ghosted after showing interest.`],tip:`Self-deprecation ("maybe I fumbled it") removes blame and makes it easy for them to re-engage without awkwardness.`},
];
const REAL_EXAMPLES = [
{id:'seq-email1',group:'3-Step Sequence - Email 1',name:'Storytelling Open',why:`Storytelling hook, personal tie-in (CEO named), subtle humour, quick pivot to value prop, light "back pocket" CTA.`,
body:[`David - picture this...`,`It's Monday morning at Marel's office in Groenlo. You walk in. Your CEO, Arni, is beaming.`,`Over the weekend, something clicked: the new Seafood Expo Global 2025 campaign? Engaging and buzzing. The VC-i vent cutter spotlight? Drawing industry-wide excitement. SmartBase dashboard updates? Highlighted and trending.`,`How? Specialist freelancers - marketers with real experience in tech and automation - jumped in and made it happen.`,`Okay, maybe a little dramatic. But it's exactly what we do: scale marketing output fast by plugging in vetted freelancer talent within days. Just like we helped Conagra Brands (another leader in food processing innovation).`,`No call needed - can I just put together a video explaining how we helped them and other similar brands, just so you've got it in your back pocket for when capacity gets tight?`]},
{id:'seq-email2',group:'3-Step Sequence - Email 2',name:'Continuity + Expanded Proof',why:`Acknowledges the previous email, expands social proof, stays in the same vertical, restates the value prop with variation.`,
body:[`Ah David, thought you might have appreciated the creativity given your role as Sales and Marketing Director.`,`Either way - worth mentioning we not only helped Conagra Brands (another leader in food processing innovation) but also PepsiCo and AB InBev, who also operate in the food and beverage space.`,`They all jumped on the same approach: vetted marketing freelancers who could cover skills gaps and get projects moving without the usual hiring delays or agency overhead.`,`Want me to send over a quick video showing how teams like yours are making this switch work in 2025?`]},
{id:'seq-email3',group:'3-Step Sequence - Email 3',name:'Low-Pressure Close',why:`Exit framing respects the inbox, authority reinforcement via enterprise brands, competitive-advantage angle, plants the thought instead of demanding a reply.`,
body:[`David - last note from me.`,`If you or your CEO Arni ever want to explore how you can seriously boost your marketing capacity without the usual agency headaches or lengthy hiring processes, that's precisely what we've delivered for Conagra Brands, PepsiCo and AB InBev (all navigating similar challenges in food processing and innovation).`,`Helps ensure the usual suspects like Meyn and Buhler aren't hogging all the industry spotlight.`,`Just leaving that thought there in case it ever becomes relevant.`]},
{id:'ent-disney',group:'Enterprise - Disney',name:'Disney',why:`Curiosity in the opener, exclusivity via "invite-only," social proof without excessive name-dropping, personal tie-in to their exact role, low-friction CTA.`,
body:[`Jimmy - got something for you.`,`We host invite-only events for Boston's best marketing minds. Casual vibe, great networking, and always some heavy-hitters in the marketing world.`,`As the Dir. of Promotions at Disney, you'd fit right in with our crowd - entertainment leaders swing by regularly.`,`Worth sharing more info?`]},
{id:'ent-apple',group:'Enterprise - Apple',name:'Apple',why:`Timely real trigger (regulatory announcement), personal touch (their specific credential), clear "zero cost" benefit, scarcity via a funding-cut deadline, low-friction CTA.`,
body:[`Hi Sam,`,`I reached out a few months back about CIPD qualifications at no cost via the government apprenticeship scheme.`,`Can see from your LinkedIn you already have Assoc CIPD - (props on that!)`,`Wanted to let you know that the government recently announced that funding for higher level apprenticeships (like Level 7) will be cut from 01/2026.`,`However, there's still time for any of the HR team at Apple to enrol at zero cost before the changes come into effect.`,`If there's interest, I can walk you through the steps?`]},
{id:'ent-google',group:'Enterprise - Google',name:'Google',why:`Personalisation via a specific past achievement/award, authority transfer via a named colleague invite, exclusivity (8-10 person dinner), casual CTA.`,
body:[`Dear Virginia,`,`Henry (our Marketing Lead) asked me to reach out with a personal invite to our next exclusive Marketing Leaders Dinner in Washington DC.`,`We'd love to have you join the table, given your Head of Brand and Product Marketing role at ACM and your achievement in leading Google Cloud India's marketing, earning the Global "Jammies" Award.`,`The dinners are intimate, featuring 8-10 senior marketers from top brands, and we often welcome peers from the tech industry. There are no talks or panels, just great food (on us) and relaxed conversation with like-minded senior marketers.`,`If this sounds of interest, I'll happily share more details.`]},
{id:'ent-monzo',group:'Enterprise - Monzo',name:'Monzo',why:`Clear pain point, simple value prop, dramatic cost contrast (EUR 20k vs EUR 2k), tailored relevance, extra credibility via the P.S.`,
body:[`Hi James,`,`Leading public policy for a digital bank like Monzo, I'm guessing you need to stay current on fast-moving EU financial services files - but those traditional monitoring tools can easily run EUR 20k+ annually.`,`We built Lanzcape to fix that.`,`One mobile app to track EU policy updates in real time. Quick, responsive, built for the pace of fintech regulation - just like your digital-first approach at Monzo.`,`All for under EUR 2k/year. There's a free version if you want to see how it works. Let me know if you want the link.`,`P.S. With your FCA background, you probably know better than most how quickly regulatory landscapes shift - especially in digital banking.`]},
{id:'ent-virgin',group:'Enterprise - Virgin Media',name:'Virgin Media',why:`Respectful personalisation, disarming honesty (the offer may not even apply to them), the network effect (asking about colleagues), clear "completely free" value.`,
body:[`Hi Vladislav,`,`I can see you're already BCS certified and have completed the Level 4 Information Systems Business Analyst qualification - great stuff!`,`I work with Just IT, helping analysts get BCS certified through government-funded training. While this might not be relevant for you given your credentials, I wondered if you have any colleagues at Virgin Media O2 who might benefit from getting BCS certified? It's completely free and typically leads to faster career progression.`,`Happy to share more details if you know anyone who'd be interested.`]},
{id:'ent-stripe',group:'Enterprise - Stripe',name:'Stripe',why:`Credibility upfront (founder, YC background), specific competitive research, strong concrete value prop (3-8x conversion), low-barrier CTA (a video, not a call).`,
body:[`Hey Peter,`,`I'm Sam, founder of Writesonic (YC S21).`,`I looked into how Stripe appears when customers ask ChatGPT for payment solutions suggestions - notable findings compared to PayPal and Square.`,`We just rolled out AI visibility tracking that shows exactly where you rank across ChatGPT, Claude, Google AI, and more. Brands ranking well here are seeing 3 to 8x higher conversion rates.`,`Would love to share a quick Loom video audit showing Stripe's AI visibility - it includes clear steps to improve your presence. Want me to send it over?`]},
{id:'ent-jet2',group:'Enterprise - Jet2',name:'Jet2',why:`Differentiation ("no other provider offers"), social proof via named peer airlines, authority via a well-known funding round, value-first framing, soft CTA.`,
body:[`Hello Anthony,`,`Ditto created a technology that no other provider offers, and it's rapidly being adopted by your counterparts at airlines like Delta, Alaska and Lufthansa: Peer-to-peer device connectivity without internet.`,`We raised one of the largest Series A rounds in 2023 ($45 million), to accelerate its development.`,`The use cases in the airline industry are pretty extraordinary.`,`At present, we're simply focused on sharing practical content, so we've compiled a resource on the top 4 ways airline flight operations teams are leveraging peer-to-peer sync - thought it might be useful given your role.`,`Would it be ok if I shared it with you?`]},
{id:'ent-vodafone',group:'Enterprise - Vodafone',name:'Vodafone',why:`Storytelling with named, vivid characters; ties the company's own slogan to the pitch; problem framing that removes blame; social proof from peer companies; positions the recipient as the catalyst.`,
body:[`Hey Yogesh,`,`Some days, it must feel like you're the only one in your busy Paddington office who truly sees it.`,`Daniel in Sales, still at his desk late-stressing over another urgent proposal. Ornella in Delivery, taking more breaks, just trying to reset after tough calls. Pamela in Finance, triple-checking numbers at 9 PM before a deadline.`,`You push for better mental health support because "We connect for a better future" isn't just about connectivity-it's about people. But engagement stays low. Not because they don't need it-because asking for help still feels big.`,`At NatWest, Nationwide, and BUPA, real change started with one person-someone who saw the problem and did something different. Someone like yourself-immersed in this world, who truly gets what's at stake.`,`Would love to share the one thing they did that finally got people talking? (2-min video)`]},
{id:'ent-spotify',group:'Enterprise - Spotify',name:'Spotify',why:`Authority transfer via a named colleague, targeted personalisation (specific past roles), exclusivity, social proof from recognisable past guests, casual CTA.`,
body:[`Dear Bridget,`,`Henry (our Head of Marketing) asked me to reach out with a personal invite to one of our upcoming private Marketing Leaders Breakfasts in New York.`,`We'd love to have you join given your Global Director role at Spotify and your previous leadership at Instagram and Amazon Fashion.`,`The gatherings are small, usually 8-10 senior marketers from top-tier companies (recent guests include leaders from Gucci, Google, Pfizer, and Citi), and we regularly welcome peers from the tech and media space.`,`There are no talks or panels, just excellent food (on us) and genuine conversation with like-minded senior marketers.`,`If this sounds of interest, I'd be happy to share more details.`]},
{id:'ent-huawei',group:'Enterprise - Huawei',name:'Huawei',why:`Personalisation to both the individual credential and the company's specific footprint, genuine regulatory urgency, strategic framing tied to a bigger business challenge, a helpful guide-like CTA.`,
body:[`Hi Elizabeth,`,`I reached out a while back about CIPD qualifications at no cost via the government apprenticeship scheme.`,`I noticed you've already completed CIPD Level 5. With Huawei's UK workforce spread across R&D in Cambridge, customer-facing teams in Reading, and the wider London HQ presence, there's often a need to equip senior HR leaders with deeper strategic expertise.`,`From January 2026, funding for higher-level apprenticeships like CIPD Level 7 will be cut. There's still time for your UK workforce to enrol now at zero cost before that happens.`,`Given the scale of your operations and the ongoing challenge of developing leadership talent in a fast-moving tech sector, this could be a cost-efficient way to strengthen the pipeline of senior HR leaders across the UK offices.`,`Would it be helpful if I mapped out exactly how Huawei UK could access this before the window closes?`]},
{id:'humor-t1',group:'Humor Templates',name:'Product Launch Tie-In',why:`Self-deprecation lowers pressure; brand tie-in shows relevance; short and clear beats clever and long.`,
body:[`Subject: Quick idea for HubSpot`,`Hi John - I saw the latest Sales Hub AI updates. Bold move. If this email flops, I will blame HubSpot for raising my standards.`,`We help platform teams turn first touches into booked meetings using clean, relevant outbound across email and LinkedIn. I wrote 5 tiny email ideas that sound like HubSpot and speak to enterprise RevOps leaders in North America.`,`Happy to send them over, or vanish quietly. Your call.`]},
{id:'humor-t2',group:'Humor Templates',name:'Self-Deprecating Honesty',why:`Hyper-earnest honesty says the quiet part out loud; keeps stakes low while still pitching real value.`,
body:[`Subject: I tried to make this funny`,`Hi John - I know the odds of a cold email working are slim. So I brought a ladder.`,`Short pitch: we help product-led companies like HubSpot turn more first touches into qualified meetings for the enterprise and ecosystem teams. If helpful, I can send a 1-page plan showing the exact Clay setup and 3 sample emails written in HubSpot's tone.`,`Worth a peek, or shall I retire from comedy today?`]},
{id:'humor-t3',group:'Humor Templates',name:'Oddly Specific Promise',why:`Oddly specific numbers feel real and funny; a playful wager creates a low-stakes, memorable ask.`,
body:[`Subject: A 9-minute experiment`,`Hi John - give me 9 minutes and I will send 3 draft emails that sound like HubSpot and get replies from CMOs at PE-backed SaaS firms. If they are bad, I owe you a coffee next time I am in Cambridge.`,`Deal, or no deal?`]},
{id:'nl-13',group:'Newsletter Templates',name:'Vol 13 - Dream-Then-Engine (Kuga Solar)',why:`Paints the prospect's ideal future in vivid narrative, pulls back to reveal it's a case study, then closes with a no-call, no-pressure video offer.`,
body:[`John - picture this... It's Monday morning at Kuga's office in Keysborough. You walk in. Your team is buzzing.`,`Over the weekend, something shifted: That commercial solar case study series? Published and driving leads. New battery storage landing page tests? Live and converting prospects. EV charger awareness campaign for Queensland? Rolling out strong.`,`How? Specialist freelancers - marketers who get clean energy - stepped in and delivered...`,`Alright, maybe I'm getting ahead of myself. But that's exactly what we do: boost marketing capacity fast by connecting you with vetted freelance talent within days. Just like we did for Vaisala (another climate action company).`,`No call needed - can I just put together a video showing how we helped them and other sustainability companies, so you've got it ready for when your team needs backup?`]},
{id:'nl-14',group:'Newsletter Templates',name:'Vol 14 - AI Search Discoverability (Nike)',why:`Opens with a hypothetical ChatGPT search result to make an abstract AI-visibility problem concrete, then closes with a casual, local-connection soft ask.`,
body:[`Hey Ollie - quick one: if someone in Australia asked ChatGPT for 'mens sports trainers' would Nike show up?`,`We help sportswear brands stay discoverable as search shifts to AI.`,`Worth sharing the kind of strategies working in 2025?`,`I'm also Sydney-based (assuming your LinkedIn's up to date!), always up for meeting fellow marketing leaders in person.`]},
{id:'nl-15',group:'Newsletter Templates',name:'Vol 15 - Review-Triggered Empathy (Botleigh Grange)',why:`Opens on a specific, minor negative review to show real research and empathy before pivoting to competitive positioning against named local rivals.`,
body:[`Daniel - I've just seen Roy's review from 2 months ago about breakfast being a bit off the mark.`,`Having been in hospitality myself, I know these comments can really sting - especially for a property like Botleigh Grange, where you've clearly got so much going for you (elegant country house, fishing lake etc).`,`I know this was just a one-off, but would you be open to hearing how we could help you create smoother guest experiences and ensure you keep your edge over the Hilton and Harbour Hotel next door?`]},
{id:'nl-16',group:'Newsletter Templates',name:'Vol 16 - Problem-List Opener (Rosegate Manor)',why:`Opens with a short list of guest-facing pain lines instead of a company pitch, then closes with a permission-based ask naming the prospect directly.`,
body:[`"I lost my keycard." "My key stopped working - can I get another?" "Guests keep locking themselves out."`,`Rosegate Manor in Henley knows this well - boutique, family-run, high-volume weekends.`,`Let me know if it is worth sharing how it could work for [Prospect Name]?`]},
{id:'nl-17',group:'Newsletter Templates',name:'Vol 17 - Stacked Triggers (VouchHavens Legal)',why:`Stacks several company triggers (new office, new advisory stream) into one line to justify the message, uses peer social proof without status-lowering praise, and withholds the mechanism to maximise curiosity.`,
body:[`Hey Liam - saw you opened a new Brisbane office and just launched the new advisory stream.`,`Moves like that sometimes lead to lease reviews, updated scopes, new supplier terms - and trying to get all your legals done without waiting weeks or watching the clock.`,`VouchHavens (also in property and multi-site) went through something similar, but sidestepped the usual legal friction entirely.`,`Mind me sharing how they approached it and how we could do something similar for you?`]},
{id:'nl-18',group:'Newsletter Templates',name:'Vol 18 - Three Outbound Plays (HubSpot)',why:`Positions the sender as a peer strategist by handing over three specific, execution-ready outbound plays instead of a pitch, signalling deep tech fluency before ever asking for anything.`,
body:[`Hey John - put together a few outbound ideas we'd be running in your shoes:`,`Salesforce Follower Scrape: pull their LinkedIn followers, qualify, and target revenue leaders + VC-backed founders.`,`Dharmesh Piggybacking: scrape everyone engaging with your founder's posts. Qualify and re-target with context.`,`Flip the Cold Emailers: scrape your own inbox. Find the reps hitting you, then target their sales leaders - but with actual relevance.`,`Mind if I share more info on what this would look like for HubSpot?`]},
{id:'nl-19',group:'Newsletter Templates',name:'Vol 19 - Role-Anticipation Opener (Cellovex)',why:`Guesses at the unglamorous parts of the prospect's actual job (not their title) to build instant relevance, then closes with a low-friction one-pager offer and a local-connection P.S.`,
body:[`Simon - guessing you didn't take the finance seat at Cellovex to wrangle GMP compliance clauses, chase suppliers over indemnities in clinical trial contracts, or decode clawback terms in lab equipment leases.`,`Unless your dream was to win in-house counsel of the year.`,`We built a way to make all of the legal friction vanish (just like we did for other pharma companies like Liber Pharmaceuticals).`,`Mind if I send over a one-pager outlining the model?`,`John`,`P.S. Also based in Sydney, if you're the rare 1 in 100 who still enjoys in-person catchups.`]},
{id:'nl-21',group:'Newsletter Templates',name:'Vol 21 - Role-Relevant Challenge List (SCC)',why:`Lists ultra-specific, role-relevant challenges instead of a generic pain point, grounds social proof in the founder's own lived experience rather than name-dropping, and closes on a zero-risk free-version offer.`,
body:[`I understand that, as Policy Officer at SCC, these challenges may be relevant to you: Tracking EU regulatory changes affecting property law and urban development; Monitoring housing and regeneration directives that influence Sheffield's growth strategy; Manually scanning Brussels developments for new compliance risks.`,`We've built a tool to streamline this - surfacing only the most relevant updates, with clear, sector-specific context. It's something I developed after 30 years in public policy, specifically to make this part of the job easier.`,`There's a free version available if you'd like to try it. Worth a look?`]},
{id:'nl-22',group:'Newsletter Templates',name:'Vol 22 - Peer-Tone Pain List (Beauty Retail CEO)',why:`Opens by stating the role directly, then mirrors the CEO's likely internal view of the business in her own probable language, closing with a peer-level, no-flattery offer.`,
body:[`Hi Francesca - as CEO at a global beauty and nutrition retailer, I'm guessing your world looks a little like this:`,`Inventory turns wildly different across Lookfantastic vs Myprotein. Brand performance buried in endless SKU data. Supply chain costs impossible to track cleanly.`,`If any of that sounds vaguely familiar, happy to show you how we pull it all into one clean, live view - for retailers like Sephora.`]},
{id:'nl-23',group:'Newsletter Templates',name:'Vol 23 - New-Hire Trigger (SDR Hire)',why:`Uses a fresh new-hire trigger as the sole reason for reaching out, then reframes the offer as making this the prospect's last SDR hire for a year - a bold, memorable value prop.`,
body:[`I spotted Brendan Sawyer just joined your team, and I wanted to reach out for one reason: I'd love for this to be the last SDR hire you need to make for the next 12 months.`,`I know how much time gets eaten by manual grunt work - finding leads, building lists, updating CRMs.`,`[We help] offload every repetitive GTM task to AI agents so your reps can focus purely on conversations.`,`If that sounds helpful, happy to show you some examples of the type of agents the team could benefit from?`]},
{id:'nl-24',group:'Newsletter Templates',name:'Vol 24 - Incident Empathy (Monzo Engineering)',why:`Opens on a real, recent technical incident with genuine empathy rather than a gotcha, then reframes the pain (pulling core engineers off roadmap) into a named "stability squad" solution.`,
body:[`John, I saw Monzo had to ship an emergency patch after that WebSocket auth issue last quarter - must've been a seriously tough week, hope you've come through in the crunch!`,`At your scale, these things can happen, as you know better than most. But pulling core engineers off the roadmap always stings.`,`Some teams are now spinning up external "stability squads" - built to handle fires fast, so your core team can stay focused on the mission: building the most intelligent, human banking experience.`,`Mind if I share more info on how this could work for you?`]},
{id:'nl-25',group:'Newsletter Templates',name:'Vol 25 - Breakup Email (DebtStream)',why:`The final email in a sequence turns the research effort itself into the proof of relevance, listing everything dug up about the prospect before pivoting to what that same effort could do for their customers.`,
body:[`Brett - this is it, the final email before I wave the white flag. I'm trying to sell you cold email services. And yes, this is the sixth message I've sent you.`,`Throughout this sequence I've dug up details about your role, years in role, company, CEO, target market, industry trends, competitors, industry, business type, sales experience, and outreach strategies.`,`Now picture that same detective work aimed at businesses drowning in debt who need DebtStream's digital recovery solutions. Cold emails that actually convert prospects into customers.`,`Want me to prove it by creating a few DebtStream-specific templates before I disappear? Just reply 'yes'. Otherwise, keep those collections flowing!`]},
{id:'nl-26',group:'Newsletter Templates',name:'Vol 26 - Selective Exclusivity (SharkNinja)',why:`Offers a limited trial to a "select group," naming one known peer already in it, which triggers curiosity and FOMO before the recipient even understands the product.`,
body:[`Hi Cameron, I'm offering a 3-month trial to a select group of top hardware design teams. SharkNinja is one of them.`,`Imagine reviewing vacuum cleaner designs, air fryers, and coffee makers in one shared 3D workspace, capturing feedback exactly where the design lives.`,`From your upright and robot vacuums to outdoor grills, the level of cross-team coordination your products require is exactly what this tool was built for.`,`Worth saving you a spot?`]},
{id:'nl-27',group:'Newsletter Templates',name:'Vol 27 - Free-Trial Risk Reversal (Microsoft Partner)',why:`Builds authority by naming the specific technical work the prospect's team likely wants to do, then removes all risk with a fully free, time-boxed trial offer.`,
body:[`Hi Roland - you're building the future of digital workplace collaboration through Microsoft technologies. I imagine there's always more innovation you want to deliver, but client demands and project timelines can stretch your team thin.`,`Things like custom Microsoft Copilot integrations or advanced SharePoint automation workflows that really set clients apart.`,`We have a group of Microsoft-focused engineers who've built enterprise solutions at scale. They don't just deliver code - they bring fresh ideas on what makes digital workplaces truly transformative.`,`Here's what I'm thinking: let me send a small team to work with E-office for 1 month, completely free. Zero risk, zero commitment. Quick integration with your processes. Real deliverables. All upside for you.`,`Interested in hearing more details?`]},
{id:'nl-28',group:'Newsletter Templates',name:'Vol 28 - Audacious Identity Mirror (Confluent)',why:`Speaks directly to the recipient's own identity as a bold, technical Clay user, using swearing and confidence to signal the copy itself is proof of the offer.`,
body:[`If you really want to get the most out of Clay, you have to start being audacious. I'm talking pattern-disrupting, hyper-personalised, ultra-humanised, outreach copy.`,`The kind that makes a CTO at a billion-dollar tech company stop mid-scroll and say: "F*** me, that's a good email."`,`Hit me back a "yes" and I'll send over 10 wildly creative outreach templates built specifically for Confluent.`]},
{id:'nl-29',group:'Newsletter Templates',name:'Vol 29 - AI Search Discoverability (Fragrance, Localised)',why:`Same ChatGPT-visibility hook as the Nike version, localised to a Saudi market and a specific named brand to keep the trigger geographically relevant.`,
body:[`Hey Abdel - quick one: if someone from Saudi Arabia asked ChatGPT for 'luxury Arabic perfumes,' would Mohammed Alkhuraiji show up?`,`We help personal care and fragrance brands stay discoverable as search shifts to AI.`,`Worth sharing the kind of strategies working in 2025?`]},
{id:'nl-30',group:'Newsletter Templates',name:'Vol 30 - Social Validation Opener (Hudson River Trading)',why:`Opens with a specific, flattering number (open roles) instead of a generic compliment, then mirrors the prospect's likely internal doubts before offering a no-call video.`,
body:[`I spotted the 115 open roles at Hudson River Trading. Love the ambition.`,`Are we losing great candidates to the Jane Streets and Two Sigmas of the world? And are the people we do hire actually driving our mission...`,`[We built an] AI Hiring Intelligence platform that turns feedback from every corner of the hiring process into clear, AI-driven actions.`,`Can I just fire over a 2-minute video showing how it could play out specifically for Hudson River Trading? No call needed.`]},
{id:'nl-31',group:'Newsletter Templates',name:'Vol 31 - Contextual Dovetailing (Hudson River Trading)',why:`Takes a company-level trigger unrelated to the recipient's actual role, and elegantly bridges it into their world before pitching - "contextual dovetailing."`,
body:[`John - I saw Hudson River Trading partnered with Google Cloud for AI-powered trading algorithms. I get it, that's not really your world as an Employee Experience Manager... so let's flip it and look at how AI can do the same for your department.`,`If you could see exactly why quant researchers drop out mid-application, how onboarding satisfaction scores for traders stack up after 3 months, or which hiring managers consistently identify top performers in your fast-paced trading environment, would that be useful?`,`That's what we've built - an AI hiring intelligence platform designed for tech-driven companies and already trusted by firms like Twilio to scale DEI tracking and turn feedback into actionable insights.`,`I know you're likely focused on year-end performance reviews and 2026 talent planning, so no pressure - I can just send more details across if you're vaguely interested.`]},
{id:'nl-32',group:'Newsletter Templates',name:'Vol 32 - Tenure + Trigger Consent Ask (Verisure)',why:`Combines a tenure observation with a live company trigger (IPO), then swaps the call request for a lower-commitment "consent to send a video" ask.`,
body:[`Tom - you've been at Verisure for over seven years now as Marketing Director. I'm guessing you're settled with how things run, whilst probably juggling the IPO announcement and all that investor engagement work.`,`So I'm not asking for a call - just consent to send you a video: a quick 60-second video showing how we've built a way for teams like yours to crank out way more marketing without extra headcount.`]},
{id:'nl-33',group:'Newsletter Templates',name:'Vol 33 - Three-Point Problem Stack (Clearlink HR)',why:`Uses tenure/role research to open, then stacks three specific, role-relevant problems in a row before naming a peer enterprise client as proof.`,
body:[`I noticed you're a people leader at Clearlink. Almost a decade in HR and 3 years in your current role.`,`Hard to measure quality-of-hire for performance marketing specialists. Candidate experience feedback scattered across different service lines. Difficulty pinpointing why senior sales team candidates drop off.`,`[Here's] how other enterprise companies like JYSK are using our AI platform to consolidate fragmented hiring. Just let me know!`]},
{id:'nl-34',group:'Newsletter Templates',name:'Vol 34 - Tenure + Consent Video (Fast Casual Ops)',why:`Same tenure-plus-trigger-plus-consent-video structure as the Verisure template, adapted to an operations audience with a role-specific wish list instead of a generic pitch.`,
body:[`Noticed you've been with Cypress Five Star for a while now - solid work there.`,`I'm guessing you're pretty settled with current processes, while juggling the new 86 Repairs partnership rollout. So I'm not asking for a call - just consent to send you a video.`,`It's a 60-second walkthrough showing how we help fast casual chains streamline operations, reduce waste, and improve margins without adding to headcount.`,`Tracking food waste in real time across all 23 locations without daily manual reports. Automatically syncing inventory counts with supplier orders. Running menu cost analysis based on actual usage data.`,`Let me know if I can send the video - it'll show exactly what that could look like for Cypress Five Star.`]},
{id:'nl-35',group:'Newsletter Templates',name:'Vol 35 - Assumed-Content Soft Close (Founder-to-Founder)',why:`Assumes the prospect is already happy and drops the pitch entirely, using founder-to-founder rapport and a single, credible case study to plant authority without asking for anything.`,
body:[`Darven - seems like you got everything under control.`,`Should you ever wish to consider how we can give CEOs a cleaner view of operations, costs, and performance across every location - just like we've done for one of the biggest sandwich chains in the world (Pret A Manger) - I'd be happy to share more info.`,`Either way, thanks for the consideration - having run a 10-store coffee chain, it's always good to connect with other operators. Keep up the customer-centric dining experiences!`]},
{id:'nl-36',group:'Newsletter Templates',name:'Vol 36 - Simulated Internal Questions (Veterinary Pharma)',why:`Simulates the exact questions the prospect's team probably asks internally, then positions the product as the tool that already answers them on demand.`,
body:[`Quick follow-up. As the Marketing Director at Med-Vet, do you ever hear things like: "How can we quickly communicate the benefits of Dectomax-CA1 to our customer base?" "Which equine health topics are gaining the most interest among horse owners right now?" "Why does it take our team so long to create marketing materials for each product launch?"`,`Those are exactly the kinds of questions PIP AI answers on demand - pulling from your stack and surfacing data in seconds instead of days.`,`Would it be helpful if I sent a quick video tailored for veterinary pharmaceuticals, showing how your team could spend more time on effective customer education and outreach?`]},
{id:'nl-37',group:'Newsletter Templates',name:'Vol 37 - Classic Twist Mini (Instagram Coaching)',why:`A slimmed-down classic-twist structure - quick praise, a specific "N things" research claim, a personal video offer, and a competitor-style social proof P.S.`,
body:[`Hi John, crushing it in the coaching space.`,`I popped on your IG and noticed 3 things that could help you get more views to attract more members to your program.`,`I shot a personal video for you - is this the best place to drop it?`,`P.S. This same strategy helped John, a business coach, get 1M views last week.`]},
{id:'nl-38',group:'Newsletter Templates',name:'Vol 38 - Career-Bridge Opener (Kubero DevOps)',why:`Opens with genuine product research, bridges into the prospect's own career background to ask a real question, then names the shared trade-off before offering proof.`,
body:[`I was reading through Kubero's platform overview earlier - the focus on keeping Kubernetes visibility simple for engineers really stood out.`,`Given your time at AWS and how you've scaled developer tooling before, I'm curious how you're keeping the "move fast" culture intact while strengthening the security guardrails around those clusters.`,`Most teams we speak with say the hard part isn't locking things down - it's doing it without breaking flow.`,`We've been working with a few engineering-led SaaS companies facing the same trade-off, helping them bake zero-trust principles directly into their delivery pipelines.`,`Would it be okay if I sent over a short video showing how they handled that shift without adding red tape?`]},
{id:'nl-39',group:'Newsletter Templates',name:'Vol 39 - Funding-Trigger Infrastructure Read (Series B SaaS)',why:`Combines a funding trigger with a specific technical infrastructure signal (job postings) to blend curiosity, authority, and empathy in one open.`,
body:[`Hey Dan, saw Alexis just closed a Series B, congrats. That kind of growth usually brings a different kind of challenge: keeping the engineering velocity while tightening compliance and security processes.`,`From the outside, it looks like your team's expanding its Kubernetes footprint - the new roles around DevSecOps and SRE hint at it.`,`I'm curious how you're approaching the "more developers, same security benchmarks" equation as the platform scales.`,`We've seen funded SaaS teams tackle that by automating identity and policy controls early, so security scales with their infra, not after it.`,`Would it be useful if I sent over a short video showing how they did it post-Series B without slowing delivery?`]},
{id:'nl-40',group:'Newsletter Templates',name:'Vol 40 - Friendly Curious Check-In (Edtech Marketing)',why:`Reads as a genuinely curious peer check-in rather than a pitch - opens with a real question, compliments specific site details, then offers to share what's working elsewhere.`,
body:[`Hey Pablo, I was halfway through my third coffee this morning when I started pondering something... How can an edtech brand like yours make prospective students stop scrolling and actually lean in to BrightPath?`,`I like how you've woven student stories into your site, and the way your team uses LinkedIn to spotlight faculty feels fresh and engaging. Not a surprise, since you've been steering the marketing ship for almost 3 years now!`,`Naturally, I'd love to help build on what you're already doing by sharing what's resonating in 2025, especially around messaging, content, and marketing campaigns. We've actually partnered with quite a lot of education brands like PerfectQuote and In Tandem.`,`Would it be okay if I sent over a quick 2-minute video with a couple of ideas for BrightPath? Thanks and hope the academic year's off to a smooth start.`]},
{id:'nl-41',group:'Newsletter Templates',name:'Vol 41 - Named-Team-Member Pattern Match (Series B Sales Tools)',why:`Weaponises social proof through specificity - naming actual team members and the CEO by role to trigger a "how do they know this?" response that beats any generic pain-point list.`,
body:[`Hi John, I've been speaking to a handful of VPs at Series B sales tools companies recently. Seems a lot of them are juggling similar headaches - wondering if any of these ring a bell for you...`,`Your SDRs, Dan & Jake, are suffering from low reply rates despite solid activity metrics. CEO Simon's pushing hard to implement more AI into your sales process, but the team's buried in quota. You've heard about Clay from three different people but have no idea where to start without breaking current workflows.`,`Any of these concerns atm? Best, Penn`]},
{id:'nl-42',group:'Newsletter Templates',name:'Vol 42 - Asymmetric Insight FOMO (AI Search Visibility)',why:`Makes an invisible problem concrete with a hypothetical scenario, creates FOMO without pressure by implying competitors are already ahead, then closes with a completely free, no-strings report.`,
body:[`Jodi, imagine this: A lead wants knowledge sharing solutions. They ask Gemini for top options. AI search platform answers with side-by-side breakdowns - even cost estimates.`,`The thought that should make you pause: Is Quora in that answer? Most Q&A platform teams aren't tracking this. They're monitoring everything but not the channel that's actively reshaping how prospects make decisions.`,`Meanwhile, forward-thinking teams are already dialing in their AI visibility. The point is knowing where you rank in these AI searches.`,`We'll give a complimentary AI visibility report for Quora - showing exactly how you show up across Claude, ChatGPT, and Google's AI results. Want me to send it over - no strings attached?`]},
{id:'nl-43',group:'Newsletter Templates',name:'Vol 43 - Deliberately Boring Pattern Break (Marketplace Legal)',why:`Breaks pattern by openly admitting the topic is boring instead of hyping it, which reads as honest rather than salesy before naming the specific, unglamorous risk it solves.`,
body:[`Good day Ellie! Brace yourself for the most thrilling topic imaginable. Legals.`,`I know it's boring as anything but clearly matters when you're managing liability for specialist work quality and handling scope creep disputes that could affect platform guarantees.`,`Once marketplace platforms reach proper scale - with vetted specialists, client matching systems and service guarantees - certain legal considerations tend to surface that aren't always visible upfront.`,`Do you mind if I share how other marketplaces structure this so legal work becomes invisible background noise and you never have to think about it again?`]},
{id:'nl-44',group:'Newsletter Templates',name:'Vol 44 - Memorable-Event Pattern Interrupt (Experiential Marketing)',why:`Opens with a genuinely memorable, visual local event as a pattern interrupt disguised as a casual question, then backs it with a concrete PR coverage number.`,
body:[`Did you see the big elephant in central London last year?`,`We recently partnered with WPR Agency to carry out their "Elephant In The Room" campaign for Co-op Group, which achieved 56 pieces of coverage including 27 national hits.`,`Just shoot back a YES and I'll ping through some experiential marketing campaigns we've come across in the entertainment and gaming space.`]},
{id:'nl-45',group:'Newsletter Templates',name:'Vol 45 - First-Time-Founder Filter (Early-Stage SaaS)',why:`Targets a tightly filtered segment (recently founded, no finance hire, first-time founder) so the same message reads as genuinely specific to everyone on the list.`,
body:[`Hi Sarah, saw that Norva Systems was founded fairly recently - congrats on getting it off the ground. First time running a business like this?`,`Asking because we work with a lot of first-time founders who are basically doing the finance stuff themselves at this stage. We help small teams close their books within 5 days at month-end without getting stuck in reconciliation.`,`We just started doing this for Callum at Bridgeway - another early-stage SaaS business, similar setup to yours.`,`Worth a chat, or happy to send a bit more detail on how it works?`]},
{id:'nl-46',group:'Newsletter Templates',name:'Vol 46 - Proximity + Social Proof (Local Hospitality)',why:`Uses shared physical location as the opening trigger, then closes the loop with a nearby, named customer in the P.S. to make the outreach feel local rather than random.`,
body:[`Hi James, noticed you're in the Shoreditch area, so thought I'd reach out.`,`We work with hospitality and venue businesses nearby - helping them get a handle on staff scheduling and floor ops across multiple sites without the usual spreadsheet chaos.`,`For The Boundary Group's next busy period, would it be worth a quick look at how we could help?`,`PS - A lot of teams use it for their pre-season ramp-up. Clerkenwell Social, just down the road from you, just finished their third onboarding with us.`]},
{id:'nl-47',group:'Newsletter Templates',name:'Vol 47 - Free Audit as the Opener (Website Conversion)',why:`Leads with a piece of genuinely completed work (a 7-point audit) instead of an ask, so the email reads as "showing up with value already done" rather than pitching.`,
body:[`Hi Sarah, just took a look at TechFlow's website. Ran it through our tool and put together a quick audit showing 7 specific areas where you could likely increase form submissions - things like above-the-fold messaging and CTA placement.`,`No pitch, just some actionable feedback you can actually use. Want me to send it over?`,`PS - Takes about 2 weeks to implement and most companies we work with see around a 35% lift in conversions.`]},
{id:'nl-48',group:'Newsletter Templates',name:'Vol 48 - Public-Document Research (Payroll Expansion)',why:`Pulls a specific detail from a public annual report to prove real research, names the operational headache that detail implies, then closes with a named competitor result.`,
body:[`Hi John, was reading through Meridian's FY24 annual report and saw you're expanding into the US from the UK next year. With that comes multi-country payroll - curious how you're planning to handle it?`,`Most companies going through a similar move end up either overpaying a PEO or spending months getting a local entity set up before they can hire anyone.`,`We help teams like yours run UK and US payroll from a single platform without needing a separate legal entity on day one. Rippling did something similar when they scaled into Europe and cut their payroll ops time by around 40%.`,`Worth a quick chat, or happy to send over how it typically works for companies at your stage?`]},
{id:'nl-49',group:'Newsletter Templates',name:'Vol 49 - Bold Offer, No Filler (GetSales.io)',why:`Leads entirely with the offer itself - no feature list, no social proof paragraph, no "we help companies like yours" filler - explained in two lines and closed with one simple question.`,
body:[`Hi James, GetSales.io builds and launches your first 3 outbound sequences for free - we set up the steps, write the copy, and get them running in your existing tool.`,`After that it's a flat monthly fee. No contract, cancel anytime.`,`Want me to send a quick video of how it works?`]},
{id:'nl-50',group:'Newsletter Templates',name:'Vol 50 - Shared-Event Authority (Conference Follow-Up)',why:`Uses shared event attendance to build rapport, positions the sender as an authority by referencing their own session rather than bragging, and offers the insights as the ask-free value.`,
body:[`Hey Joelle, how's your week going? I noticed you were also at the CauseVox summit recently. I ran a session there about turning social media followers into donors.`,`It looks like you might not have made that one - I know how busy these events can be!`,`Happy to send over the insights and tactics we're seeing work right now so you didn't miss out.`]},
{id:'nl-51',group:'Newsletter Templates',name:'Vol 51 - Engagement-to-Leads Gap (LinkedIn Content)',why:`Compliments a specific, measurable win (a viral post) before immediately naming the gap between that engagement and actual leads, then proves the fix with a concrete client number.`,
body:[`Hey Helen, that post hit 500+ likes. But couldn't spot how you convert all that demand into leads.`,`One client added a 1-1-1 strategy + soft CTA and it got him 23 demos in 11 days.`,`Tried something like this before?`]},
{id:'nl-52',group:'Newsletter Templates',name:'Vol 52 - Hiring-Trigger Cost Framing (SDR Ramp Time)',why:`Follows a Trigger -> Problem -> Cost -> Proof -> Outcome logic flow, translating a hiring trigger into a hard cost (paid headcount not producing) before closing on a specific proof point.`,
body:[`Hi James, saw you're hiring two SDRs this quarter. Thought you could be looking into how to ramp them faster without burning through your lead lists.`,`Typically new reps take 3-4 months before they're booking consistently - and in the meantime, they're sending volume that's not converting.`,`Meaning you're paying for headcount that isn't producing, and potentially damaging domain reputation in the process.`,`We helped a Series A fintech get their new hires booking 15+ meetings per month within 6 weeks using a structured outbound system and pre-built sequences.`,`If we could help you hit that kind of ramp time, would that be worth a chat?`]},
{id:'nl-53',group:'Newsletter Templates',name:'Vol 53 - Exclusive Dinner Invite (Finance Leaders)',why:`Flips the usual outreach dynamic - instead of asking for something, it offers access to something exclusive, framed as a peer invitation rather than a sales ask.`,
body:[`Hi Ziyu, we're hosting a small, invite-only dinner on the 24th of March at The Henry in Phoenix, and I thought of you.`,`It'll be an intimate gathering of local finance leaders, exchanging insights on AI's impact over dinner. Given your role as Finance Director at UserGems and your experience with AI-driven systems, you'd be a valuable addition to the discussion.`,`Would you be open to an invitation?`]},
{id:'nl-54',group:'Newsletter Templates',name:'Vol 54 - Selected-Not-Sold Partnership (Nonprofit Partner Invite)',why:`Positions the recipient as someone being selected for a small group rather than sold to, leads with a compliment, shows research, then makes the value obvious with a concrete ratio.`,
body:[`Hi Sarah, we'd like to invite Midwest Community Health Alliance to join as an official nonprofit partner for Summit Run 2026.`,`We're selecting a small group of nonprofits whose work connects people to positive change - and your comprehensive healthcare services across the Midwest felt closely aligned.`,`Summit Run has over 1 million global participants with events across North America each year. If Midwest Community Health Alliance came onboard, your organization would appear directly in the registration flow - meaning anyone signing up could choose to fundraise for you instantly. Most partners see 10-50x more fundraisers than tickets purchased.`,`Does a 15-minute call make sense to talk through this?`]},
{id:'nl-55',group:'Newsletter Templates',name:'Vol 55 - Anonymous-Visitor Challenge (Website De-Anonymisation)',why:`Opens with a specific traffic observation, challenges the prospect's assumption that anonymous visitors are a lost cause, then removes friction with a free-tier, no-contract offer.`,
body:[`Hey Sarah, I noticed Meridian's been pushing traffic to the new pricing page - looks like you're gearing up for a Q2 push based on the LinkedIn hiring activity around demand gen.`,`Here's something that might be useful: most of that traffic leaves without filling out a form. And you probably never hear from them again.`,`We've built something that identifies those anonymous visitors and gives you their email addresses - people who were actually on your site, checking pricing, reading case studies. Not scraped lists. Not intent signals. Actual visitors.`,`First 10,000 emails are free. After that it's 10p per email. No contract, cancel whenever.`,`Want me to send over a quick video showing how it works?`]},
{id:'nl-56',group:'Newsletter Templates',name:'Vol 56 - Hidden-Pain Lead (Public Sector Tenders)',why:`Leads with the hidden, unglamorous pain (hours qualifying bad-fit tenders) rather than the product's features, then names the product only after the pain is fully established.`,
body:[`Hi Rachel, navigating the volume of public sector contracts takes considerable effort - and the subtle inefficiency isn't just about identifying tenders, it's the hours your bid teams invest qualifying opportunities that don't quite fit, drawing focus from genuinely strong prospects.`,`Our AI, Prism Analytics, directly addresses this. It reads each tender description in seconds: summarising contract scope and key deliverables, helping to qualify relevance, and surfacing critical information.`,`Might a brief demonstration of Prism's capabilities be valuable for your team?`]},
{id:'nl-57',group:'Newsletter Templates',name:'Vol 57 - Assumed-Sorted Market Check (Shipping/Fulfilment)',why:`Assumes the prospect is already happy with their current setup, then gently suggests the market has moved on - framing the ask as a no-cost benchmark rather than a pitch to switch.`,
body:[`Hi Laura, I hope everything with your current operations partner is going well, as we often find that businesses are surprised by the other options available today.`,`For most brands, the primary source of unhappy customers has little to do with the products or the website's ease of use. It's the post-purchase experience with shipping and delivery that tends to be the problem.`,`I would guess that you already have a partner you're working with and aren't actively looking to make a change.`,`That said, the market has become incredibly competitive, and many businesses are taken aback by what's now on offer. Think of this as a no-cost way to check your current setup against the market.`,`We analyse our network of over 200 vetted partners to find the three that are the best fit for your specific brand, sales volume, and product type.`,`Would it be okay for me to send your top three matches over?`]},
{id:'nl-58',group:'Newsletter Templates',name:'Vol 58 - Seed of Doubt (CRO Audit)',why:`Doesn't claim anything is broken - just plants the idea that an internal team might be too close to their own flow to see friction, then offers a free analysis to prove or disprove it.`,
body:[`Hi Sophie, I had a look at your site, observing your main conversion journey. Have you had an independent outside evaluation of that journey recently?`,`It's common for internal teams to be so close to their core flows that small friction points become less obvious.`,`I'd be happy to send a quick CRO analysis of your core conversion process if that would be helpful.`]},
{id:'nl-59',group:'Newsletter Templates',name:'Vol 59 - Research-Backed Flattery (Founder Background)',why:`Combines a specific public mention (a press feature) with deeper research into the founder's career history, turning flattery into something that reads as genuinely researched rather than generic.`,
body:[`Hi Kari, came across you in a Data Center Dynamics feature on Detroit's first independent carrier hotel. That got me curious about your background - particularly your time at CIM Group managing billions in real estate deals and how you've built Raeden's marketplace with thousands of retrofit locations.`,`It strikes me there's probably a much larger audience for your ideas around transforming underutilised real estate into digital infrastructure, especially as AI and advanced manufacturing keep demanding more last-mile connectivity across the country.`,`Would it make sense to chat about how your expertise could become a real tool for growth in 2025?`]},
{id:'nl-60',group:'Newsletter Templates',name:'Vol 60 - Long-Tail Product Neglect (CPG/Beverage)',why:`Names a subtle, easy-to-miss pattern (top products crowding out the long tail) as the hook, then deliberately leaves the CTA vague to lower resistance.`,
body:[`For a non-alcoholic beverage company like Real American Beer, it's common to notice: as marketing systems gather more data, they naturally concentrate resources on a select few top-performing products.`,`Eventually, much of the broader product inventory can quietly stop getting adequate exposure. New beverage introductions often struggle to build momentum, and older, less active items aren't thoroughly tested.`,`Would you be interested in learning more about this process?`]},
{id:'nl-61',group:'Newsletter Templates',name:'Vol 61 - No-Preamble Direct Offer (Custom Parts Manufacturing)',why:`Skips all personalisation preamble entirely - just the name, a one-line intro, and a direct, specific offer (a 24-hour quote), backed by a hard credibility number in the P.S.`,
body:[`Hey Prangshu, I'm [Name], founder of [Company].`,`We help event technology teams acquire custom parts manufactured quickly and reliably across CNC, injection moulding, and sheet metal.`,`If you have a component you need pricing for, we can provide a quote within 24 hours. Would that be useful?`,`P.S. We've maintained 100% five-star ratings for over a decade and were recognised in The Manufacturer Top 100 - yet to have an unsolved customer problem.`]},
{id:'nl-62',group:'Newsletter Templates',name:'Vol 62 - Pain-as-Question Opener (Sports Web Platform)',why:`Disguises the pain point as a specific, concrete question about a real workflow, then proves the fix with a hard percentage from a named customer switch.`,
body:[`Hey Ryan, is your team still copying event info from Ticketmaster onto the website every time a new show goes up, like the Allstate Sugar Bowl New Year's Parade?`,`We built a web platform specifically for sports organisations like yours, and we're rolling out a direct sync with Ticketmaster. When shows go live, on-brand event pages and What's On listings build themselves. No embeds, no copy-paste.`,`Sleeping Village made the switch and cut 75% of their web admin time.`,`Mind if I fire over a quick video showing how it'd work for Allstate Sugar Bowl?`]},
{id:'nl-63',group:'Newsletter Templates',name:'Vol 63 - Deliberately Boring Pattern Break v2 (IT Services Legal)',why:`Same deliberately-boring pattern-interrupt opener as the Vol 43 marketplace-legal template, adapted for IT services with a governance-risk angle in the middle.`,
body:[`Brace yourself for a sexy topic. Legals. I know it's dull as hell, but obviously quite important...`,`Fixed-fee, on-demand legal support for scaling tech and IT services companies.`,`Most companies your size have someone in ops or finance reviewing legal stuff without proper legal sign-off, which gets risky fast.`,`Do you mind if I just share how other IT services companies set this up so legal work basically becomes frictionless and hassle-free?`]},
{id:'nl-64',group:'Newsletter Templates',name:'Vol 64 - Platform-Shift News Hook (Nonprofit Messaging)',why:`Uses a genuine platform news update as the trigger, backs the pitch with a hard reactivation stat, and closes with a webinar invite instead of a 1:1 call.`,
body:[`Meta just updated its platform to seriously compete with text messaging, allowing non-profits to match supporter contact information and send direct messages.`,`Initial campaigns show that almost 1 in 5 lapsed supporters are reactivated, costing only $0.36 per reactivated supporter.`,`Your supporters haven't stopped caring about your cause. Their attention has just moved to different platforms.`,`Would you be interested in an invite to our 30-minute webinar next week?`]},
]; // /*INSERT:REAL_EXAMPLES*/

const FRAMEWORKS = [
{id:'fw1',name:'1. Curiosity Before the Pitch',structure:`Notice a trigger/observation -> ask if it leads to a problem -> introduce product as the fix -> P.S. personalization reason.`},
{id:'fw2',name:'2. Essential Cold Outreach Sequence',structure:`Email 1 "New Ideas for {{Company}}": relevance opener -> what you've been working on -> AI line on how it helps -> soft ask -> P.S. analogy. Email 2 "A Quick Fix, No Call Needed": empathise with a past-company pain -> introduce the fix -> offer a video, not a call -> permission-to-decline P.S. Email 3 "Which Contact Is Best?": ask who the right contact is -> list three ideas -> ask if any resonate.`},
{id:'fw3',name:'3. Value-First Outreach',structure:`Notice something relevant -> state the general results you help companies see -> offer a free resource upfront, no strings -> invite a chat only afterward if useful.`},
{id:'fw4',name:'4. Third-Party Insight Outreach',structure:`Reference a credible third-party resource -> explain why they specifically should read it -> tie it to their business goals -> optional soft CTA.`,example:`George, have you read Outreach's recent blog? Since you're likely scaling your team, I thought this article might resonate - the VP of Sales at Segment shared how they grew to a $3.2B acquisition. Check it out.`},
{id:'fw5',name:'5. Engaging Follow-Up Sequence',structure:`Meme follow-up: light meme + pivot to a serious question. Short bullet-point follow-up: brief context -> 3 bullet outcomes -> ask if worth connecting. Reference-to-someone-else: ask if them or a named colleague is the right owner.`},
{id:'fw6',name:'6. Data-Driven Outreach Framework',structure:`Trigger with a real number -> quick pitch of measurable impact -> a simple calculation showing potential $ benefit -> direct CTA.`,example:`{{first_name}}, I noticed you have over 50 open roles listed. We help tech companies like yours reduce employee churn from 30% to below 10%. Given a mishire costs ~$30,000, cutting churn from 15 mishires to 5 would save ~$300,000. Would it make sense to explore this further?`},
{id:'fw7',name:'7. Competitive Advantage Outreach',structure:`Competition email: name their closest competitors -> ask if they're differentiating the buying decision -> pitch outcome. Reviews email: reference a specific positive review -> ask if they want to keep that momentum -> pitch outcome.`},
{id:'fw8',name:'8. Insight Validation Outreach Framework',structure:`Share a non-obvious, tailored insight -> ask them to validate/confirm it resonates -> back it with a customer success story.`},
{id:'fw9',name:'9. Challenge-Based Outreach',structure:`Relevant opener -> "poke the bear" question challenging an assumption -> case study proof -> soft CTA.`},
{id:'fw10',name:'10. Sales-Focused Software Pitch',structure:`"If [value prop] is missing, you'll experience [technical pain] -> which leads to [qualitative impact] -> which affects [quantitative business impact] -> how are you handling this today?"`,example:`John, if the KPI monitoring piece is missing, you won't be able to track how your reps are executing in real-time. As a result, you'll only learn about outcomes when the monthly reports come in - a hit-or-miss approach that can cost crucial ARR. What are your thoughts?`},
{id:'fw11',name:'11. Feedback-Driven Outreach',structure:`Option 1: explicitly state you're not selling - you're seeking feedback from someone who'd normally be a prospect; ask what it would take to switch from a named competitor. Option 2: frame as a 2-question market-research ask for a report, responses shared anonymously, no call needed.`},
{id:'fw12',name:'12. Innovation Inquiry Email',structure:`Ask if they're open to new ideas on a topic -> cite a case study achieving a specific impact -> tie to their Q3/Q4 planning -> ask to schedule a call.`},
{id:'fw13',name:'13. Priority Check Outreach',structure:`Ask if there are internal discussions around the thing you help with -> cite a case study outcome -> ask directly if it's a current priority.`},
{id:'fw14',name:'14. Revenue Impact Outreach',structure:`Subject: "Revenue loss." Notice open roles -> connect to budget/margin complexity -> cite a specific result for another client -> ask if worth a chat.`},
{id:'fw15',name:'15. Outcome-Driven Lead Magnet Outreach',structure:`Name the mechanism -> ask if they've tried it -> acknowledge the struggle -> offer a lead magnet designed for the desired outcome -> ask permission to share.`,example:`Lead magnets can boost response rates 5-10x compared to standard cold emails - we built a template that generates 10+ meetings each week. Mind if I share it?`},
{id:'fw16',name:'16. Industry Trends Framework',structure:`Subject ties to an industry trend -> note peers facing a related challenge -> cite how you've helped a named company adapt with a specific outcome -> ask if it's also a focus for them.`},
{id:'fw17',name:'17. Problem-Solution-Outcome Framework',structure:`Subject names the specific pain point -> note the challenge is common at their company size -> state problem -> solution -> quantifiable outcome -> ask to chat.`},
{id:'fw18',name:'18. Quick Win Idea',structure:`Offer a 10-minute idea that could land their next 100 customers -> cite a comparable company nearly tripling MRR -> ask for a short call.`},
{id:'fw19',name:'19. Finding the Right Contact',structure:`Ask if they're the right person for a department; note you've also contacted named alternates -> ask availability, or ask for a referral if they're not the right person.`},
{id:'fw20',name:'20. Solving Pains',structure:`Reference how enterprise clients (including a named competitor) struggle with a specific need -> describe how a partner leveraged the product to fix it -> cite results (% growth) -> offer a 15-minute chat.`},
]; // /*INSERT:FRAMEWORKS*/
