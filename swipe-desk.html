          <label for="${list.id}-${i}"><b>${esc(it.h||'')}</b></label>
          <div class="check-chips">${it.chips.map(c=>`<span class="avoid-chip">${esc(c)}</span>`).join('')}</div>
        </div>`;
      }
      return `<div class="check-item ${listState[i]?'done':''}">
        <input type="checkbox" id="${list.id}-${i}" data-list="${list.id}" data-i="${i}" ${listState[i]?'checked':''}>
        <label for="${list.id}-${i}"><b>${esc(it.h||'')}</b>${it.h?' - ':''}${esc(it.b||it.body||it)}</label>
      </div>`;
    }).join('') + `</div></div>`;
  return html;
}
function wireChecklistCheckboxes(box, afterChange){
  box.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const st = loadChecks();
      st[cb.dataset.list] = st[cb.dataset.list] || {};
      st[cb.dataset.list][cb.dataset.i] = cb.checked;
      saveChecks(st);
      afterChange();
    });
  });
}
function personalizationTableHtml(pitems){
  const sorted = pitems.slice().sort((a,b)=> a.angle.localeCompare(b.angle));
  return `<div class="group-title">Personalisation Angles</div>
    <div class="table-wrap"><table class="ref-table"><thead><tr><th>Angle</th><th>Example Phrase</th><th></th></tr></thead><tbody>` +
    sorted.map(p=>`<tr><td><b>${esc(p.angle)}</b></td><td>${esc(p.phrase)}</td><td><button class="add" data-text="${encodeURIComponent(p.phrase)}">+</button></td></tr>`).join('') +
    `</tbody></table></div>`;
}
function renderChecklist(){
  const term = (searchTerms.checklist||'').trim();
  const totalItems = CHECKLISTS.reduce((a,l)=>a+l.items.length,0);
  let html = pageHeaderHtml('Pre-Send Checks', `${totalItems} checks across ${CHECKLISTS.length} lists and ${CHECKLIST_BUCKETS.length} categories - run the checker below, then work through a category to catch everything else. Ticks are saved on this device.`);
  html += emailCheckerHtml();

  if(term){
    const state = loadChecks();
    let any = false;
    CHECKLISTS.forEach(list=>{ const h = checklistListHtml(list, term, state); if(h){ any=true; html+=h; } });
    if(!any) html += `<p style="color:var(--ink-faint);font-size:13px;">Nothing matches "${esc(term)}".</p>`;
    document.getElementById('content').innerHTML = html;
    wireHeaderCopyBtn(); wireEmailChecker();
    wireChecklistCheckboxes(document, renderChecklist);
    return;
  }

  html += categoryGridHtml(CHECKLIST_BUCKETS.map(b=>({key:b.key, title:b.title, count:`${countBucketItems(b)} checks`, desc:b.desc})));
  document.getElementById('content').innerHTML = html;
  wireHeaderCopyBtn();
  wireEmailChecker();
  wireCategoryGrid(openChecklistModal);
}

function openChecklistModal(key){
  const bucket = CHECKLIST_BUCKETS.find(b=>b.key===key);
  const lists = CHECKLISTS.filter(l=> bucket.match(l));
  openModal({
    eyebrow:'Pre-Send Checks', title:bucket.title, searchPlaceholder:`Search ${bucket.title}...`,
    renderBody: (section, term)=>{
      const state = loadChecks();
      let out=''; let any=false;
      lists.forEach(list=>{ const h = checklistListHtml(list, term, state); if(h){ any=true; out+=h; } });
      if(!any) out = `<p style="color:var(--ink-faint);font-size:13px;">Nothing matches "${esc(term)}".</p>`;
      return out;
    },
    wireBody: (box)=> wireChecklistCheckboxes(box, ()=> renderModal()),
  });
}

const RESOURCE_ICON_YT = '<svg width="18" height="18" viewBox="0 0 16 16"><path d="M6.3 5.4v5.2L10.8 8 6.3 5.4Z" fill="currentColor"/><path d="M1 8c0-1.9.2-3 .5-3.6.2-.5.6-.8 1.1-1C4.2 3 8 3 8 3s3.8 0 5.4.4c.5.2.9.5 1.1 1 .3.6.5 1.7.5 3.6s-.2 3-.5 3.6c-.2.5-.6.8-1.1 1-1.6.4-5.4.4-5.4.4s-3.8 0-5.4-.4a1.7 1.7 0 0 1-1.1-1C1.2 11 1 9.9 1 8Z" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>';
const RESOURCE_ICON_ARROW = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12 12 4M6 4h6v6"/></svg>';

function resourceCardHtml(url, title, meta, iconCls, icon){
  return `<a class="resource-card" href="${escAttr(url)}" target="_blank" rel="noopener noreferrer">
    <span class="resource-card-icon ${iconCls}">${icon}</span>
    <span class="resource-card-body">
      <span class="resource-card-title">${esc(title)}</span>
      <span class="resource-card-meta">${esc(meta)}</span>
    </span>
    <span class="resource-card-arrow">${RESOURCE_ICON_ARROW}</span>
  </a>`;
}

function renderResources(){
  const term = (searchTerms.resources||'').trim();
  const guides = RESOURCES.filter(r=> matches(term, r.title));
  const channels = RESOURCE_CHANNELS.filter(c=> matches(term, c.name, 'YouTube Channel'));
  let html = pageHeaderHtml('Resources', `${RESOURCES.length} guides and ${RESOURCE_CHANNELS.length} YouTube channels - click a card to open it in a new tab.`);

  if(!guides.length && !channels.length){
    html += `<p style="color:var(--ink-faint);font-size:13px;">No resources match "${esc(term)}".</p>`;
  } else {
    if(guides.length){
      html += `<div class="group-title">Guides &amp; Playbooks</div>`;
      html += `<div class="resource-grid">` + guides.map(r=>
        resourceCardHtml(r.url, r.title, 'Google Doc', 'doc', RESOURCE_ICON_DOC)
      ).join('') + `</div>`;
    }
    if(channels.length){
      html += `<div class="group-title">YouTube Channels</div>`;
      html += `<div class="resource-grid">` + channels.map(c=>
        resourceCardHtml(c.url, c.name, 'YouTube Channel', 'yt', RESOURCE_ICON_YT)
      ).join('') + `</div>`;
    }
  }
  document.getElementById('content').innerHTML = html;
  wireHeaderCopyBtn();
}
