{p:'Frank Brothers', cat:'Personalization & Research', src:'1M Frank eBook', t:'Front-load personalization into the opener - it doubles as preview text', b:`Weave specific details - role, tenure, industry, colleagues, tech stack, recent wins - into the very first line so the prospect's brain registers "this was written for me" instantly. This opening line also functions as preview-text optimization, since it's what shows in the inbox before the message is even opened, directly driving open rates.`},
{p:'Frank Brothers', cat:'Personalization & Research', src:'1M Frank eBook / 55 Cold Email Copywriting Cheat Codes', t:'Stack 2-3 signals into one natural sentence rather than one flat fact', b:`Rather than relying on one data point, layer 2-3 relevant facts (role, strategic focus, an inferred daily pressure) into a single natural-sounding sentence instead of a flat statement - a stacked version reads as far more researched without sounding forced than a generic "Noticed you're VP of Sales" opener. The same logic applies to timing triggers: don't stop at the first qualifying trigger you find (a company hiring SDRs) - layer in additional context like recent funding or a product launch, since one signal is a reason to reach out but two or more give the reader a reason to actually respond, because together they tell a coherent "why now" story.`},
{p:'Frank Brothers', cat:'Personalization & Research', src:'1M Frank eBook', t:'Authority through pain articulation', b:`If you can describe a prospect's pain more precisely than they could themselves, they'll assume by extension that you also hold the solution. This requires genuinely specific industry insight rather than generic pain-point language, and should be balanced against overreach - informing confidently, not lecturing.`},
{p:'Frank Brothers', cat:'Personalization & Research', src:'1M Frank eBook', t:'Case-study fallback when there’s no perfect match', b:`If you lack a directly relevant case study, openly acknowledge the mismatch while still drawing a partial parallel (e.g. tying an unrelated logo to the prospect via a shared trait like "both scrappy startups"). With no case studies at all, fall back to awards or certifications as proof - but tuck this into a P.S. rather than the main body, since self-promotion competes with the buyer-first focus the rest of the message should hold.`},
{p:'Frank Brothers', cat:'Personalization & Research', src:'1M Frank eBook', t:'Research the team, not just the recipient', b:`Instead of personalizing only to the named recipient, research and name their direct reports or a specific colleague to demonstrate you understand the team's structure. This both flatters the leader and signals deeper research than a typical one-to-one mail-merge message.`},
{p:'Frank Brothers', cat:'Personalization & Research', src:'1M Frank eBook', t:'Screenshots as a personalization device', b:`Including an actual screenshot of the prospect's website, page, or ad inside the message counts as its own research point, on the logic that visual proof of research is harder to fake or template than a text-based observation.`},
{p:'Frank Brothers', cat:'Personalization & Research', src:'1M Frank eBook / Frank Collective Outbound Lessons Doc', t:'The personalization angle families (full catalogue lives in the Cold Email Bank)', b:`Frank Brothers' running catalogue of 30+ specific research angles clusters into families: role/tenure (time in role, title + mission + duty, new hire, certifications), social/network (mutual connections, LinkedIn posts, "people also viewed," followed companies), company-signal (funding, press, team growth, Google rating, competitor call-outs, on-site case studies), and quirky/local (a public phone number, a local restaurant, a "lookalike" framing against an existing client). Each is phrased as a soft, hedged observation plus a light question rather than a flat assertion - the full angle-by-angle phrase list lives in the Cold Email Bank tab's Personalization table.`},
{p:'Frank Brothers', cat:'Personalization & Research', src:'55 Cold Email Copywriting Cheat Codes', t:'Make case studies explicitly relevant', b:`Only reference a case study or client logo if you can explicitly draw the connection between that company and the target's own situation - same industry, same size, same problem. Naming the commonality out loud does the connecting work for the reader instead of leaving them to infer relevance on their own.`, ex:`"We work with Monzo (also in fintech)."`},
{p:'Frank Brothers', cat:'Personalization & Research', src:'The Cold Outreach Phrasebook', t:'Tag phrases by regional dialect to match the audience', b:`The phrasebook labels every line (British), (American), or (Neutral) so you can deliberately choose phrasing that matches a prospect's cultural register, or intentionally add a bit of cross-cultural flavor. "Sounding human" is partly a localization problem - an idiom that lands with a UK prospect can read oddly to a US one, and vice versa.`},
{p:'Frank Brothers', cat:'Personalization & Research', src:'Inbox Engineering', t:'Modern spam filters score relevance, not just keywords', b:`Mailbox providers now use message-level AI to judge relevance rather than relying purely on spam-keyword lists, so genuinely relevant emails are both safer and more effective. Reference timely triggers (a product launch, a new hire, a tech-stack change) and demonstrate you understand the recipient's role, timing, and constraints - the more relevant the message reads, the higher the reply rate and the safer it is for sender reputation.`},
{p:'Frank Brothers', cat:'Personalization & Research', src:'The Ultimate 3-Step Cold Email Sequence / Unlocking Enterprise', t:'Open with a vivid, company-specific scene tied to the recipient’s exact role', b:`Email 1's opening can paint a recent, specific moment at the prospect's own company and name a real executive, then list 2-3 real recent wins before pivoting to the offer - personalization woven into a mini-narrative rather than dropped in as a single merge field. In enterprise contexts specifically, tie the recipient's exact job title into why the offer is relevant to them (e.g. directly linking a "Director of Promotions" title to an invite-only event), and keep any proof or comparisons inside the recipient's own vertical or an adjacent one (food & beverage brands cited to a food-processing prospect, airlines to an airline prospect) rather than impressive-but-irrelevant logos.`},
{p:'Frank Brothers', cat:'Personalization & Research', src:'Unlocking Enterprise', t:'Reference a specific, researched credential or achievement', b:`Open by naming something found on the prospect's LinkedIn or public record - an existing certification level, a named award, a regulatory background - before pivoting to the offer. This signals real research was done and builds instant credibility for the message that follows.`, ex:`Acknowledging a prospect already holds "Assoc CIPD" before pitching further certification`},
{p:'Frank Brothers', cat:'Personalization & Research', src:'The Secret to Close Outbound Sales Opportunities', t:'"Applied proof" is personalization taken to a deliverable level', b:`Applied proof is built specifically for one buyer, answering "how will this work for me right now" - a short plan, tailored templates, a live demo, or a data table built around their real business. This treats deep personalization as something you build and hand over, not just something you write into an email's opening line.`},
{p:'Frank Brothers', cat:'Personalization & Research', src:'Ultimate Guide to Clay', t:'Protect personalization at scale: confidence filtering, cleanup, and classification', b:`When generating personalization with AI across a large list, instruct the model to only return an answer it's fully confident in and to output a clear default like "N/A" when nothing is found - this prevents hallucinated facts and broken merge fields going out in a live campaign. Before a data point is used, run it through a normalization pass (expand and clean job titles, fix name casing/emojis, strip legal suffixes from company names) so it reads the way someone would say it out loud - skipping this is what makes AI-personalized emails read as obviously automated. AI classification passes (SaaS vs. non-SaaS, B2B vs. B2C, an 8-word LinkedIn post summary) work well as an intermediate enrichment step feeding a more targeted personalization, rather than personalizing directly from raw unstructured data. Scraping a target's live job listings and asking AI to infer what the business is currently investing in also turns a public hiring signal into a specific, current point to reference, rather than guessing generically at priorities.`},
{p:'Frank Brothers', cat:'Personalization & Research', src:'How to Get a Meeting with Anyone', t:'Build a real dossier before the first touch - and make it about them, not you', b:`Before any outreach, thoroughly research the target's business priorities, competitive pressures, and public-facing personal interests (social posts, hobbies, alma mater, causes) so the angle of the message ties to something only that person would recognize as relevant. Critically, the personalized hook must stay focused entirely on a truth about the recipient - inserting the sender's own branding or agenda into the personalized element consistently undercuts its impact.`},


// ============ SUBJECT LINES ============

{p:'Eric Nowoslawski', cat:'Subject Lines', src:'Top 10 Cold Email Tips That Give You an Unfair Advantage', t:'Data-backed subject-line signals from a large test set', b:`Across the dataset, subject lines including the prospect's first name had the highest correlation with above-average and excellent campaign performance - strong enough that first-name subject lines are worth permanently split-testing, even against personal skepticism that it's an overused tactic. The second-strongest signal was mismatched capitalization (first letter capitalized, rest of the whole subject lowercase) combined with a subject under three words - a surprising result against conventional advice. A smaller, less certain positive signal also showed up for including the target company's name, though that one may just reflect this particular dataset.`},
{p:'Eric Nowoslawski', cat:'Subject Lines', src:'Cold Email First Principles Thinking', t:'Preview text matters more than the subject line', b:`Design around the preview text - what the message looks like as a push notification or inbox snippet - rather than the subject line itself, since that's the real "first impression" a phone or webmail client shows. Two viable approaches: make it read like a colleague or customer reaching out with a real question (e.g. "I saw the negative Google review and had a question about it" - reads like a genuine inquiry almost anyone would open), or compress your entire offer into it so the prospect can decide interest before even opening (e.g. "we help companies target their entire addressable market in less than 3 months"). AI-flavored personalized openers ("I saw you help fitness enthusiasts breathe better...") are now so overused they can hurt open rates - a plain, condensed value statement often performs better.`},
{p:'Eric Nowoslawski', cat:'Subject Lines', src:'Outbound Copywriting: Chunking Up and Down', t:'Write subject lines like an insider, not a marketer', b:`A subject line should read like something a colleague or existing customer would casually send - short, lowercase, plain, not styled like marketing copy. Real high-performing subject lines are often just a word or two, far removed from typical hype-driven subject lines.`, ex:`"list" / "more customers like case study"`},

{p:'Matt Lucero', cat:'Subject Lines', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'A subject line has exactly one job: get the email opened', b:`The subject line isn't there to sell, explain the offer, or preview the content - its only function is to create enough intrigue that the recipient opens the email. Everything else (the pitch, the value prop) belongs in the body. Don't spend split-test effort on subject lines specifically - in his experience they have a comparatively small impact on overall campaign performance versus testing higher-leverage elements like list and offer.`},
{p:'Matt Lucero', cat:'Subject Lines', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'Short and vague subject lines outperform descriptive ones', b:`The longer and more detailed a subject line is, the more it reads as a sales/ad email and gets ignored or deleted; a short, ambiguous line reads as a real, personal message worth opening - like a blank envelope in physical mail being more likely to get opened than one covered in "win $10,000" marketing copy. Consistently strong short/vague formats: a first name plus a question mark, "thoughts," and "question for [name]" - all working by the same intrigue mechanism rather than by describing the offer.`, ex:`"quick question" / "John?"`},

{p:'Frank Brothers', cat:'Subject Lines', src:'Frank Collective Outbound Lessons Doc / 55 Cold Email Copywriting Cheat Codes', t:'Two valid strategies: plain/manual, or algorithmically personalized - no in-between', b:`Subject lines should go one of two directions: deliberately plain and lowercase so the email looks like it was manually typed and sent one-to-one, or algorithmically personalized per prospect using an enrichment tool. A subject line that's "trying" to sound clever or marketing-polished undercuts the plain/manual illusion. Lower-casing job titles and even company names reinforces the manually-typed impression (best suited to startup/SME targets, where it's culturally expected, more than large enterprises) - aim for something that mimics an internal reply thread rather than a marketing send.`, ex:`"possible opportunity" / "john & sales team"`},
{p:'Frank Brothers', cat:'Subject Lines', src:'Frank Collective Outbound Lessons Doc', t:'Loss-framed subject lines', b:`Build a subject line around a loss-oriented word tied to a visible operational signal (like open job requisitions) to create a small jolt of concern that pulls the recipient into the body copy, where the connection to their specific situation is then explained.`, ex:`"Revenue loss"`},
{p:'Frank Brothers', cat:'Subject Lines', src:'Frank Collective Outbound Lessons Doc', t:'Anchor the subject to a live industry trend or the prospect’s pain', b:`Tie the subject line directly to a named, currently-relevant industry trend, then use the body to connect that trend to a specific challenge peers are facing. Alternatively, turn the prospect's likely pain point directly into a subject-line question, then resolve it in the body with the problem, the solution, and a quantified outcome.`, ex:`"Keeping up with {{industry trend}}?" / "Struggling with {{specific pain point}}?"`},
{p:'Frank Brothers', cat:'Subject Lines', src:'1M Frank eBook', t:'The "unsexy" vs. "sexy" extremes both beat the safe middle', b:`"Unsexy": make the subject line look like a mundane internal message - a task reminder, a team update - so the recipient opens it on autopilot before their sales-pitch radar activates. "Sexy": the opposite extreme - bold and intriguing, comparing the recipient to an industry leader or a named competitor - so curiosity alone forces the open. Both extremes reportedly outperform the safe, average subject line sitting in the middle.`, ex:`"[FirstName], this morning" / "[FirstName] vs. [Competitor] - who wins?"`},
{p:'Frank Brothers', cat:'Subject Lines', src:'1M Frank eBook', t:'Hyper-personalize the subject line, then disarm it immediately', b:`A very specific, almost personal-feeling detail in the subject line (like referencing the recipient's university) can spike curiosity, but should be explained or defused right away in the opening line or P.S. - explicitly noting you researched that detail specifically to earn the open - so it reads as clever research rather than something invasive. When targeting a leader through their team's problems, naming their actual direct reports in the subject line (not just the body) measurably lifts opens, since it signals the message concerns their team specifically rather than a mass blast.`},
{p:'Frank Brothers', cat:'Subject Lines', src:'1M Frank eBook / Inbox Engineering / The Secret to Close Outbound Sales Opportunities', t:'Universal subject-line rules', b:`Keep it to 6 words or fewer; never sell in the subject line itself (save the pitch for the body, unless deliberately running the "sexy" approach); include the recipient's or company's name; keep tone consistent with the body (no bait-and-switch); never fake a reply/forward thread with "Re:" or "Fwd:" - an instant, unrecoverable trust-killer the moment it's discovered; and keep it short, natural, and non-clickbaity even in higher-stakes tailored materials - simple beats clever.`},
{p:'Frank Brothers', cat:'Subject Lines', src:'1M Frank eBook / How to Get a Meeting with Anyone', t:'Subject-line-as-the-message, for very short emails', b:`For very short emails, put the actual question or hook directly in the subject line and reduce the body to a single line pointing back to it - a strong pattern disruptor and a low-deliverability-risk format, since the body carries almost no salesy language. This is the same instinct behind using extremely short, curiosity-provoking subject or opening lines (as few as one or two words) purely to create intrigue about who is writing and why, rather than previewing the offer - earn the open first, let the value statement do its work once attention is captured.`},
{p:'Frank Brothers', cat:'Subject Lines', src:'55 Cold Email Copywriting Cheat Codes', t:'Write the subject line last, and keep it aligned with the body', b:`Draft the body first, then mine it for your single most interesting angle to use as the subject - don't start with a subject idea, and never lead with your company name. If the subject promises one angle and the body delivers something else, the mismatch destroys trust the moment the reader notices it - treat subject/body alignment as non-negotiable, not a place to get "clicky" at the expense of coherence.`},


// ============ COPYWRITING & MESSAGE STRUCTURE ============

{p:'Eric Nowoslawski', cat:'Copywriting & Message Structure', src:'Top 10 Cold Email Tips That Give You an Unfair Advantage', t:'Sweet spot is 70-90 words, not "as short as possible"', b:`Contrary to the usual "shorter is always better" advice, campaigns in the 70-90 word range were more likely to land in the "excellent" tier than campaigns either longer than 90 words or shorter than 70. Very short emails don't leave room to build credibility or properly explain the value proposition.`},
{p:'Eric Nowoslawski', cat:'Copywriting & Message Structure', src:'Top 10 Cold Email Tips That Give You an Unfair Advantage', t:'Describe outcomes generically instead of naming a specific case study', b:`Naming a specific named case study/client correlated with average or below-average campaigns, while describing an outcome or result you created for "another company" without naming it correlated with above-average and excellent campaigns. If the prospect doesn't recognize the named company, they mentally opt out ("I'm not them, so this doesn't apply to me") - dropping the specific name removes that excuse.`},
{p:'Eric Nowoslawski', cat:'Copywriting & Message Structure', src:'I Tested 500,000 Cold Email, This Is The Best Campaign', t:'The "creative ideas" campaign: 3 bullets, or 1 compressed sentence', b:`For each prospect, AI generates exactly three bullet points, each mapped to one specific, constrained offering or feature of your product, personalized to that prospect's situation - e.g. for Clay.com, bullet 1 is always new-hire signals, bullet 2 always a specific Clay feature, bullet 3 a relevant integration. Even though this produces a comparatively long email, it consistently gets high reply rates because the ideas read as genuinely researched rather than generic filler - multiple recipients have called it "the best email they've ever received." If three bullets feels too long for your audience, compress the same personalization into a single AI-generated sentence instead - this shorter version reportedly tripled the reply rate for one client when first rolled out.`, ex:`"if I were looking at your business, I would help in this way..."`},
{p:'Eric Nowoslawski', cat:'Copywriting & Message Structure', src:"I sent 10,000,000 cold emails, here's what works in 2025", t:'Pain-based reframing (credit: Josh Braun)', b:`Rather than pitching your service directly ("we do taxes and help you save money"), reframe around doubt in the prospect's current solution - e.g. asking whether they're sure their current accountant is using every legal loophole to maximize their refund. This works because it acknowledges they already have a solution while planting a specific, credible worry about it - the same "twist" can be adapted to any offer where the prospect already has some existing vendor or process.`},
{p:'Eric Nowoslawski', cat:'Copywriting & Message Structure', src:'Outbound Copywriting: Chunking Up and Down', t:'The baseline 4-line + P.S. structure to test first', b:`Default template: a lowercase, casual subject line; line 1 gives a relevant, specific reason for reaching out (often derived directly from whatever criterion built the list); line 2 connects that trigger to your value proposition ("poke the bear"); line 3 shares a relevant case study or proof point; line 4 is the CTA; an optional P.S. carries a secondary hook. Test this structure first, before reaching for reframing techniques like chunking.`},
{p:'Eric Nowoslawski', cat:'Copywriting & Message Structure', src:'Outbound Copywriting: Chunking Up and Down', t:'Chunking up: sell the outcome, hide the category', b:`Adapted from Alex Hormozi's framing: strip out any mention of your category or mechanism and talk only about the outcome you deliver, since prospects often don't care how you get there, and naming your category just lumps you in with every generic competitor in it. A home-services staffing client's straight-down-the-middle copy got no responses; chunked up - dropping all mention of "staffing and recruiting," leading purely with extra monthly revenue for HVAC companies, backed by named client proof - performed far better. Same logic for SEO agencies: reframe as consulting for customer growth rather than saying "SEO."`},
{p:'Eric Nowoslawski', cat:'Copywriting & Message Structure', src:'Outbound Copywriting: Chunking Up and Down', t:'Chunking down: get specific to add credibility', b:`The inverse move - get specific about one particular mechanism, policy, or feature - used when the outcome alone sounds too vague or unbelievable without backup. True chunking down surfaces a genuinely differentiating operational detail; not every operational fact works as a hook - a fairly generic capability pitched on its own (e.g. auditing a prospect's cold email deliverability) flopped, so the detail chosen has to be distinctive, not just true.`},
{p:'Eric Nowoslawski', cat:'Copywriting & Message Structure', src:'Focus on Offers Made To Convert Cold Traffic', t:'Reframe "case study" as "repeatable process"', b:`Instead of pitching a "case study," frame the same proof as a repeatable process or framework the prospect could see and use - a case study reads as a one-off past win, while a "process" implies a system they could plug into themselves. This reframe alone can make old proof feel like new value.`, ex:`"we have a repeatable process... would you want to see what this process looks like?"`},
{p:'Eric Nowoslawski', cat:'Copywriting & Message Structure', src:'Focus on Offers Made To Convert Cold Traffic', t:'Keep it under 100 words, human-sounding, and customer-toned', b:`Campaign emails stay under 100 words and use a plain, conversational voice rather than formal marketing language, so the email reads like something an actual person typed in a hurry. One favored technique deliberately keeps it ambiguous whether the sender is an existing customer reaching out or a cold salesperson, on the theory that this lowers the reader's guard - though this is a debated tactic (a well-regarded peer actively dislikes the ambiguity), not a universal rule.`},

{p:'Matt Lucero', cat:'Copywriting & Message Structure', src:'START HERE: How to Run Cold Email for Any Business', t:'The best-performing structure: name, reason, proof, low-friction ask', b:`Open with the first name, state a specific, observed reason you're reaching out (a problem you noticed about them), back it with brief proof ("we've solved this for X other people"), then close with a low-friction, no-brainer ask. This works because it identifies a real problem, builds trust through evidence despite being a stranger, and removes the risk of the ask. The two most common reasons an email flops, spotted before they're even sent: it runs too long so nobody finishes reading it, or it lacks a clear value proposition - it may tell a story but never actually states what's being offered or why the sender is credible. Self-test by sending the draft to yourself (or a friend) and reading it pretending to be the actual recipient, honestly asking whether you'd respond - it's easy to spot flaws in a spam folder full of other people's bad emails but much harder to see the same flaws in your own.`, ex:`"Can I record a free video for you?"`},
{p:'Matt Lucero', cat:'Copywriting & Message Structure', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'The one-to-one principle: write to a person, not a broadcast list', b:`Even though cold email is sent at scale, it's still a one-to-one channel - copy should read as addressed to a single individual rather than generalized ad copy. A real spam-flagged email that talks entirely in generic industry statements and never actually addresses the recipient illustrates the failure mode: that generic tone is what triggers distrust and spam reports. As a concrete rule of thumb, reference the recipient ("you," "your business") far more often than the sender ("I," "we," the company) - emails leaning heavily on "I/we" read as self-promotional broadcasts rather than a direct message to the reader.`},
{p:'Matt Lucero', cat:'Copywriting & Message Structure', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'The four-part cold email framework', b:`Every cold email should contain: (1) personalization - why you're reaching out, ideally referencing something specific about them; (2) the value proposition - plainly what you do; (3) a call to action with a clear next step; (4) objection handling - proactively addressing likely skepticism (most often lack of proof) with a proof point or case study. Aim for roughly one sentence per part, ~4 sentences total. To find the objection to handle, read the draft back as if you were the recipient and ask what objection you'd have (commonly "why should I trust this sender / where's the proof?"), then add a specific layer addressing it directly into the copy.`, ex:`"Hi [name], I recently came across your [detail] - we've helped others like you achieve [result]. Interested in learning more?"`},
{p:'Matt Lucero', cat:'Copywriting & Message Structure', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'Four reliable template shapes to pick from', b:`Standard: greet by first name, state who you help and the result via your mechanism, add a one-line case study, ask if they're interested - avoid paragraphs about company history or mechanism internals, which kill response rates. One-liner: a single sentence just asking if they'd be interested in the core outcome - easy to answer yes/no, doesn't feel automated. Case-study-led: open with a personalized line about their business, state a specific result for a similar company, ask if they'd want the same - the case study does double duty as proof and value prop. Video-strategy: reference a specific pain point noticed on their site, offer to record a short Loom showing exactly how to fix it, and ask permission to send it - "here's the exact problem and I already made you something for it" drives high engagement.`, ex:`"Hey John, we help painting companies get three new jobs per month using our painting accelerator program - we just did this for Jimmy's Painting, who got six new jobs in 19 days. Interested in learning more?"`},
{p:'Matt Lucero', cat:'Copywriting & Message Structure', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'Shorter copy consistently outperforms longer copy', b:`Across every template and principle, the underlying theme is brevity: long blocks of text get skipped because the recipient doesn't know or trust the sender yet and has no reason to invest reading time. Target copy that's skimmable in well under 20 seconds.`},
{p:'Matt Lucero', cat:'Copywriting & Message Structure', src:'Video 2 (batch 3)', t:'Lead with a specific, real reason for reaching out', b:`The first of the core email components is a concrete, relevant reason for contacting this exact person - ideally referencing something you actually noticed about them, or at minimum directly asking if they have the pain your product solves. Vague, could-apply-to-anyone openers underperform because they don't signal you actually looked at the recipient.`, ex:`"hey John, I noticed something wrong with your website"`},
{p:'Matt Lucero', cat:'Copywriting & Message Structure', src:'Video 2 (batch 3)', t:'State your value proposition in one plain, concrete sentence', b:`The biggest complaint after coaching people is that their email is full of text but never actually says what the product does in plain English - ask someone what their tool does and you'll get a clear one-liner verbally, then find that clarity is completely missing from the email itself. Write the value prop exactly as you'd say it out loud, in a single sentence.`, ex:`"an email sending platform that lets you warm up and rotate inboxes and track deliverability, for as little as $37"`},

{p:'Frank Brothers', cat:'Copywriting & Message Structure', src:'Frank Collective Outbound Lessons Doc / 55 Cold Email Copywriting Cheat Codes / 1M Frank eBook', t:'The style rulebook, condensed (full checklist lives in Pre-Send Checks)', b:`The recurring formatting/tone rules across all of Frank Brothers' material: never use the em dash (split into two sentences instead); cap paragraphs at two lines; there's no fixed word-count rule - clarity and relevance matter more than brevity for its own sake; write at a 10-12-year-old's reading level with zero corporate jargon; keep the "fluency effect" (every line connects logically to the next, tone stays consistent across a whole sequence); front-load the most relevant detail into the opening line, since it doubles as inbox preview text; deliberately de-polish AI drafts (list two items instead of three, start a sentence with "And"/"But," one bracketed aside maximum); cut marketing buzzwords ("cutting-edge," "innovative," "enhance") and the word "impressive"; write for forwardability in larger orgs; cap the email at one question mark; delete dead filler openers ("just reaching out," "touch base"); hedge presumptuous claims with "not sure if..."; be concretely specific rather than generic; avoid unverifiable ROI numbers in favor of a short story; and never name your own company. This is the same rule set condensed into the app's Pre-Send Checks tab - see it there for the full checkable list.`},
{p:'Frank Brothers', cat:'Copywriting & Message Structure', src:'Frank Collective Outbound Lessons Doc', t:'Five reusable message-structure templates', b:`Data-Driven Outreach: open with a trigger that includes a real number, state the measurable impact your solution delivers, run a simple back-of-envelope calculation showing the size of the opportunity, close with a direct ask (e.g. "50 open roles" projected to "$300,000" saved by cutting mishire-driven churn). Third-Party Insight: reference a credible outside article to bring neutral value, explain why it's relevant to this recipient, connect it to their situation, optionally close with a soft ask tied to the point. Insight Validation: present a non-obvious insight tailored to their likely situation, ask them to confirm whether it matches reality, back the claim with a customer success story. Causal-Chain: structure the pitch as a chain of consequences - a missing capability leads to a technical pain, which cascades into a business impact, closing with an open question about how they currently handle it. Curiosity-Before-Pitch: open with an observed trigger phrased as a question linking to a likely downstream problem, follow with a plain statement of how you solve that exact problem, close with a P.S. explaining the personalization reasoning to show the outreach wasn't random.`},
{p:'Frank Brothers', cat:'Copywriting & Message Structure', src:'1M Frank eBook', t:'"Poke the Bear" - a single pain-surfacing question', b:`A sub-15-word question that surfaces a hidden problem the prospect probably hasn't consciously registered, phrased as a neutral observation rather than an accusation so it doesn't trigger defensiveness. Combines discomfort, FOMO, and a curiosity gap; suits regulated industries (healthcare/finance), consumer brands chasing "wow moments," or stagnant traditional markets ripe for disruption.`, ex:`"ever considered the impact of all the leads you might be missing from Smartlead failing to tag them?"`},
{p:'Frank Brothers', cat:'Copywriting & Message Structure', src:'1M Frank eBook', t:'Storytelling: the vivid future-success narrative', b:`A longer "picture this..." narrative walks the prospect through an ordinary day escalating into a peak moment of success (colleagues reacting, competitors missing out), casting the prospect as hero, then self-deprecatingly undercuts its own exaggeration before landing an almost-absent, ultra-soft CTA. Best for high-competition markets needing a dramatic point of difference, or scaling founders/CMOs chasing a breakout moment - vivid sensory detail is what makes it land rather than feel generic.`},
{p:'Frank Brothers', cat:'Copywriting & Message Structure', src:'1M Frank eBook', t:'Cryptic Idea: tease, don’t pitch', b:`Reference visible research on the prospect, mention that you and a colleague came up with an unnamed "idea" for them, then simply ask permission to send it over rather than pitching outright. The curiosity gap plus framing the idea as a gift (reciprocity) drives replies; works well in retail/e-commerce or with growth-stage leaders wary of generic pitches - avoid inflated words like "game-changing," which undercuts the casual delivery the format depends on.`},
{p:'Frank Brothers', cat:'Copywriting & Message Structure', src:'1M Frank eBook', t:'Creative Idea: position as strategic partner', b:`Open by referencing that you scanned their site or LinkedIn, present three genuinely specific, tailored ideas, then ask if they'd like help executing any of them. Positions you as a thinking partner rather than a vendor; works especially well with seed/Series A founders open to unconventional input. Quality bar: if you personally wouldn't find the three ideas useful, they need reworking.`},
{p:'Frank Brothers', cat:'Copywriting & Message Structure', src:'1M Frank eBook', t:'Classic Twist: observation, assumption, proof, ask (and its 3-line mini version)', b:`Full version: a specific, hedged research-based observation; an inferred pain point tied to a strategic goal; a value proposition backed by a named similar client; one specific proof point; closing with a low-friction ask for permission to share more. Hedging language like "tentatively assuming" softens what could read as presumptuous; suits competitive verticals (HR tech, MarTech) where naming a rival's win creates useful FOMO. Mini version compresses the same idea to three lines: quick genuine praise, a specific finding framed as a fixed number of insights ("noticed 3 things"), and an offer of a personal video, closed with a P.S. tying the approach to a competitor's result - brevity is the entire point, padding kills it. Best right after a company's public win, and pairs naturally with video-based outreach.`},
{p:'Frank Brothers', cat:'Copywriting & Message Structure', src:'1M Frank eBook', t:'ABC Value-Bomb, and its "Choose Your Adventure" variant', b:`Value-Bomb: skip the hook-proof-CTA structure entirely and offer three valuable resources up front (a lead list, a strategy doc, a custom template), asking the prospect to simply reply with the corresponding letter - dropping the pitch is itself the pattern disruptor; suits situations with several genuinely valuable assets to test, or skeptical verticals (recruitment, cybersecurity) where leading with tangible value lowers guard faster than a pitch. Choose Your Adventure: reframes the letter-reply mechanic as a self-qualification tool - an explicit opt-out ("if you're happy with X, delete this"), a reason to keep reading, a forwarding option for the wrong contact, and a final curiosity-driven prompt. Offering the "ignore me" option deliberately is what makes the remaining respondents high-intent, since anyone who replies has actively opted past three off-ramps.`},
{p:'Frank Brothers', cat:'Copywriting & Message Structure', src:'1M Frank eBook', t:'Unhinged: bold, credentialed swagger', b:`Leads with genuine, specific praise for a real recent win, pivots into deliberately brash, slang-heavy, confident language about your own results, and closes with an outrageous-but-partially-true credential in the sign-off. Works because the confidence is backed by a specific, checkable credential rather than empty bravado - best on prospects who respond to bold, no-BS communication, or later in a sequence after politer messages have failed.`},
{p:'Frank Brothers', cat:'Copywriting & Message Structure', src:'1M Frank eBook', t:'Direct Report: target the team to win the leader', b:`Names and addresses the leader's team problems instead of the leader's own - both in the subject line (naming two actual direct reports) and the body (framing the pain as something "typically" experienced by that junior role). This sidesteps the leader's sales defenses since it doesn't read as a pitch to them personally; suits larger, departmentally structured organizations or teams that just onboarded new hires.`},
{p:'Frank Brothers', cat:'Copywriting & Message Structure', src:'1M Frank eBook', t:'Short but Sweet, and the Subject Line Message format', b:`Short but Sweet opens by explicitly calling out how short the message is, then asks one tight, curiosity-driving question about whether help with a specific outcome would be useful - only works when the core offer is strong and self-evidently valuable, since the format leaves no room to build a case; best for simple, one-line demand-capture offers like recruitment. The Subject Line Message pushes this further: puts the entire question inside the subject line and reduces the body to a single confirming sentence - recommended for low-deliverability situations (near-zero sales language in the body helps inbox placement) or as a lightweight re-engagement nudge on cold threads.`},
{p:'Frank Brothers', cat:'Copywriting & Message Structure', src:'1M Frank eBook', t:'Lead Magnet message: give before you pitch', b:`Opens with a light, relevant observation, states the outcome you help deliver, explicitly disclaims that you don't expect the prospect to just take your word for it, then offers a specific tailored resource (not a generic ebook) before a soft, low-pressure ask. Flips the standard "ask first" sequence into "give first" - particularly useful for early-stage companies without an established client roster, or skeptical verticals where a no-strings resource earns the reply.`},
{p:'Frank Brothers', cat:'Copywriting & Message Structure', src:'1M Frank eBook', t:'Genius or Terrible: binary framing plus symbol reply', b:`Opens with a provocative subject line, splits the audience into "two types of people," gives the non-target group a graceful exit, then hits the target group with a compact side-by-side of competitor names against their results and timeframe, mirrored against the prospect's own inaction - closing with a single-character reply (an arrow). The binary framing plus minimalist symbol reply removes almost all response friction; works well in competitor-rich categories with a fast, quantifiable proof point.`},
{p:'Frank Brothers', cat:'Copywriting & Message Structure', src:'1M Frank eBook', t:'The Internal Nudge: imply an internal conversation', b:`Asks whether the prospect has already discussed a specific initiative with a named senior colleague, implying an internal conversation is already or should be happening, backed by a named client's outcome in a set timeframe. Works on companies large enough (100+ headcount) that cross-functional discussion is plausible, and lands best when the "colleague conversation" is grounded in a real, inferable trigger rather than invented from nothing.`},
{p:'Frank Brothers', cat:'Copywriting & Message Structure', src:'1M Frank eBook', t:'Problem Potion and Direct Pitch: two ways to skip straight to the point', b:`Problem Potion briefly references conversations with other people in the same role, then lists three specific, plausible pain points and simply asks "any of these concerns atm?" - presenting several distinct problems raises the odds one resonates, reframing engagement as the prospect picking their own pain point. Direct Pitch front-loads the actual offer as the very first line ("any need for X at the moment?"), follows with a one-line industry-trend justification for urgency, then a low-commitment "quick chat?" ask with an explicit easy exit - sacrifices build-up for instant qualification, best on hot, trigger-backed prospects or when testing a new segment for basic interest.`},
{p:'Frank Brothers', cat:'Copywriting & Message Structure', src:'1M Frank eBook', t:'Mind-Benders: Magic Trick, Conspiracy, and One-Sentence Bomb', b:`A family of ultra-short formats that open with a surprising, counter-intuitive claim about the prospect's industry before asking if they want the details. The One-Sentence Bomb variant follows the opening jab with three concrete in-market trigger signals as a mini checklist. All three withhold the explanation to force curiosity to do the work - adding hedges or lengthy proof at this stage actively undercuts the format, which only works kept razor short.`},
{p:'Frank Brothers', cat:'Copywriting & Message Structure', src:'1M Frank eBook', t:'Permission-Based: ask outright, promise to vanish', b:`Opens by asking directly for permission to pitch, paired with a promise to disappear entirely if there's no response, with a touch of self-deprecating exaggeration about how personalized the pitch will be. The direct honesty about "vanishing" short-circuits the usual skepticism reflex - good as a last-resort format for wary verticals, or as a final sequence message before giving up on a prospect.`},
{p:'Frank Brothers', cat:'Copywriting & Message Structure', src:'1M Frank eBook', t:'Industry Insight and Calibration Test: lead with expertise, not a pitch', b:`Industry Insight leads with a credibility statement about your scale (volume of messages sent, industries covered), lists a numbered set of short, punchy insights about what's currently working, then offers a deeper resource tailored to the prospect's sector - positioning you as a data-backed thought leader rather than a vendor. Calibration Test playfully lists three specific reasons the prospect "shouldn't" engage, each one actually a flattering proof point about their own team or results, then closes with a 0-10 self-rating scale instead of a yes/no CTA - the reversed framing is a strong pattern disruptor, and the numeric scale invites a low-effort reply from decision-makers who pride themselves on staying ahead of trends.`},
{p:'Frank Brothers', cat:'Copywriting & Message Structure', src:'1M Frank eBook', t:'Acceptance Speech and The Intelligence Play: ego-driven formats', b:`Acceptance Speech opens with a fictionalized "thank you" speech naming the prospect's actual executives, clients, and investors, as if they'd just won a real industry award achieved with your help, then asks if they want to "hear the sauce" - works on ambitious, growth-motivated founders, and is especially useful for early-stage senders who lack real case studies since the mechanism is aspirational narrative rather than proof (vary the fictional award name by industry). The Intelligence Play frames the outreach as a lighthearted internal wager between you and a colleague about whether the (highly educated, accomplished) prospect will even bother reading the message, then asks them to "prove them right" - suited to senior titles at larger corporates; localize the wager amount and currency to the recipient's country.`},
{p:'Frank Brothers', cat:'Copywriting & Message Structure', src:'1M Frank eBook', t:'The Assumption Play, and radical transparency about your own process', b:`The Assumption Play makes a confident, specific guess at exactly how the prospect's team is currently (probably poorly) handling the problem you solve, then asks them to confirm or correct you - this forces a reply either way, since leaders want to correct an outsider who's wrong just as much as confirm one who's right. A separate, longer bonus template acknowledges inbox fatigue from generic outreach up front, explicitly names the actual tools used to find and verify the prospect's contact details, lays out real relevant experience, contrasts your offer against inferior alternatives, and closes with a no-fee trial project plus a personalized P.S. - the transparency about your own prospecting process becomes the credibility signal itself, best suited to agencies/consultancies.`},
{p:'Frank Brothers', cat:'Copywriting & Message Structure', src:'1M Frank eBook', t:'The fuller "Before You Hit Send" precision check', b:`A five-part final filter: (1) strip every word that isn't pulling its weight, favoring clarity over textbook grammar; (2) assume the buyer will skim rather than study, so the message must be scannable at a glance; (3) judge the CTA purely by how effortless saying yes feels, using short 1-2 sentence paragraphs; (4) explicitly compare the draft to "everything else in their inbox" and rewrite if it blends in instead of breaking pattern; (5) run a "self-interest check" - read it as if you were the decision-maker and honestly ask whether you personally would reply. A technically well-written, deeply personalized message can still fail step 5 if it's too long, too technical, or the ask feels like a chore.`},
{p:'Frank Brothers', cat:'Copywriting & Message Structure', src:'1M Frank eBook', t:'The P.S. line is prime real estate', b:`91% of recipients (per the book's own figure) read the P.S. line before anything else in a longer message, so it should never be an afterthought - use it to add a second, distinct case study for extra credibility through repetition, or a softer secondary CTA, especially in longer-format messages where the P.S. may be the reader's actual entry point. Related mentor's rule: "Confuse, you lose" - stuffing a pitch with jargon and impressive vocabulary doesn't wow buyers, it just creates disengagement, even when the underlying offer is sophisticated.`},
{p:'Frank Brothers', cat:'Copywriting & Message Structure', src:'The Ultimate 3-Step Cold Email Sequence', t:'Full 3-email arc: hook, proof-expansion, low-pressure exit', b:`Email 1 hooks with a vivid scene at the prospect's company, 2-3 specific recent wins, a "how did this happen" question, the reveal that freelancers drove it tied to your offer, a single recognizable customer name for social proof, and a soft, no-pressure pitch to send a short video case study. Email 2 acknowledges the silence, name-drops further respected brands in a similar industry, explains what those brands actually did, re-offers the video, and keeps the CTA conversational. Email 3 explicitly flags itself as the last follow-up, makes a respectful low-pressure invitation, reinforces credibility with 2-3 more known brands, adds a light competitive nudge, and closes open-ended, planting an idea rather than pushing for a reply. Generation rules throughout: write at a 12-year-old's comprehension level, cap paragraphs at 2 lines (aiming for 1), and never name the sender's own company anywhere in the body.`},
{p:'Frank Brothers', cat:'Copywriting & Message Structure', src:'Unlocking Enterprise', t:'Enterprise copywriting: forwardable, vague-curious, and blame-free', b:`Write clear, concise, and jargon-free so a message survives being forwarded across stakeholder layers - you can even explicitly suggest who else on their team it might be relevant for. Several winning emails open with an intentionally vague hook ("got something for you") to create curiosity without giving away the pitch. Storytelling technique: humanize a company-wide problem with short, specific vignettes of named (fictionalized) employees quietly struggling, then tie it back to the company's own stated mission or slogan - linking the business's claimed identity to the personal stakes of the ask. Frame the prospect's problem without assigning them blame (low engagement isn't because people don't need help, it's because asking still feels hard), and position the recipient as the hero who drives the change internally, rather than a customer being sold to - making the CTA feel like an invitation to lead.`},
{p:'Frank Brothers', cat:'Copywriting & Message Structure', src:'The Secret to Close Outbound Sales Opportunities', t:'The tailored strategy deck: a 10-template sales-enablement structure', b:`A deck built for each serious prospect follows a fixed order: a title slide with their logo/name, a short "who we are" slide with links, a one-paragraph explainer of what the deck is, ten strategy slides each with a named angle, a one-line reason it fits, and a full sample email, closing with a note that a bonus final template will be written after a live call. Rules for writing the prospect-specific template emails inside it: no placeholders left in the copy, use a realistic but invented ICP example so it reads naturally, keep every email short and human, and keep subject lines simple.`},
{p:'Frank Brothers', cat:'Copywriting & Message Structure', src:'24 Business Learnings in 24 Months', t:'The simplest explanation wins - fixate on outcome, not mechanism', b:`Keeping messaging easy to understand helps people decide faster, since they don't have to work hard to figure out what you mean - complexity itself is friction that slows down a yes. Buyers want results, not a list of tools or process steps, so messaging should describe outcomes in plain terms rather than explaining how the sausage gets made.`},
{p:'Frank Brothers', cat:'Copywriting & Message Structure', src:'Ultimate Guide to Clay', t:'Use AI as a cold-email editor, with a fixed checklist prompt', b:`Explicit instructions to use plain, casual, "a 10-to-12-year-old could understand" language consistently produce more natural, human-sounding AI output than sophisticated business phrasing (e.g. reducing a company description to a casual one-to-three-word phrase like "Nike" to "sports stuff"). A "senior SDR reviewing a colleague's draft" prompt is useful purely to sharpen a drafted message: strip awkward phrasing or repetition, keep tone casual-but-confident, hold length under roughly 120 words unless more context is truly needed, prioritize short readable sentences with no fluff, and confirm the CTA is specific and natural - running every draft through a fixed checklist like this, by AI or manually, catches common failure modes before it goes out.`},
{p:'Frank Brothers', cat:'Copywriting & Message Structure', src:'How to Get a Meeting with Anyone', t:'A tight letter formula: hook, problem, value, single ask', b:`Open with a point of agreement or attention hook, state the recipient's problem in a way that shows real understanding of their situation, deliver a value statement stripped to the fewest possible words, and close with one clear sentence about the next step. A restated, sharpened version of the core offer belongs in a postscript, since readers disproportionately notice the P.S., and a short credibility-building signature block reinforces why the message deserves a reply.`},


// ============ OFFERS & POSITIONING ============

{p:'Eric Nowoslawski', cat:'Offers & Positioning', src:'Top 10 Cold Email Tips That Give You an Unfair Advantage', t:'Test a contrasting second offer in the P.S. line', b:`Adding a second, different value proposition in the P.S. that contrasts with the main body's pitch (body pitches saving time, P.S. pitches saving money instead) produced roughly 5x more responses in one test - effectively "we help with X - P.S., if that's not useful, we also help with Y," doubling up on offers within one email. As a mental checklist for drafting alternates: offers ultimately break down into saving time, saving money, making more money, and (mainly B2C) raising status or improving health - B2B senders mainly need to worry about the first three plus risk reduction.`},
{p:'Eric Nowoslawski', cat:'Offers & Positioning', src:'Top 10 Cold Email Tips That Give You an Unfair Advantage', t:'Offer strength beats CTA tweaking', b:`When outreach pitched hotels to directly "buy a vacuum cleaner right now," positive response rates were poor no matter how the ask was phrased. Repositioning the offer to be easy to say yes to regardless of timing - e.g. positioning to be "the next call" whenever the buyer is ready to purchase, rather than asking for an immediate purchase decision - drove a large jump in positive responses. If your offer is hard to say yes to, no CTA or funnel fix will save the campaign.`},
{p:'Eric Nowoslawski', cat:'Offers & Positioning', src:'Cold Email First Principles Thinking', t:'Lead magnets aren’t always necessary', b:`When the problem you solve is broad, urgent, and universally recognized (e.g. sales-tax compliance for e-commerce companies), a direct, plain "do you have this problem?" message converts well on its own - a "straight down the middle" campaign. Lead magnets and extra differentiation matter most when your offer is common/competitive (generic "we get you leads" messaging everyone already sends), where standing out requires giving away more value up front than competitors will.`},
{p:'Eric Nowoslawski', cat:'Offers & Positioning', src:'Cold Email First Principles Thinking', t:'Match urgency to the buyer’s role', b:`CEOs receive the highest volume of cold email of any role, but they also reply more often because they're constantly on the hook for solving problems. A department-level buyer (e.g. an HR director) is less likely to respond to the same pitch because pushing a new software purchase through the org isn't worth the political effort to them - they just want to do their job and go home. Tailor both targeting and message urgency to how directly the recipient owns the problem you solve.`},
{p:'Eric Nowoslawski', cat:'Offers & Positioning', src:'Cold Email First Principles Thinking', t:'Make the ask specific and clearly worth their time', b:`Generic offers ("want a demo of our procurement platform?") underperform specific, self-interested ones. A Fortune 1000-focused procurement company improved replies by instead asking prospects to share three contracts they suspected they were overpaying on, in exchange for a benchmark against what similar companies pay - a concretely valuable trade for 15-30 minutes rather than an abstract product demo.`},
{p:'Eric Nowoslawski', cat:'Offers & Positioning', src:"I sent 10,000,000 cold emails, here's what works in 2025", t:'A data-based lead magnet that needs no build', b:`For agencies without an obvious downloadable asset, one lead magnet that performs well is a data signal report - e.g. emailing a list of every director-level-or-above new hire in the U.S. from the past month, delivered by having the prospect simply request access to a Google Sheet (which also confirms they engaged with it). More broadly, most businesses sit on some proprietary insight or framework about their market that prospects would find valuable but don't have access to - you don't need a polished gated asset, just offer to share the framework directly and deliver it live on the call.`},
{p:'Eric Nowoslawski', cat:'Offers & Positioning', src:"I sent 10,000,000 cold emails, here's what works in 2025", t:'WIIFM discipline', b:`Before sending any email, explicitly check: if this person says yes, what do they actually get in return? Vague or purely self-serving pitches fail this test - the offer has to make the value exchange for a "yes" obvious.`},
{p:'Eric Nowoslawski', cat:'Offers & Positioning', src:'Focus on Offers Made To Convert Cold Traffic', t:'The offer value ladder: response rate scales with real value given', b:`Three real campaigns to a similar segment showed an escalating offer: (1) a free deliverability insight (a missing DMARC record) - a "solution-unaware" pitch that got only modest replies since most recipients didn't grasp the stakes; (2) a free, ready-made list of newly-hired people in target roles - a bigger, tangible give that produced a much higher reply rate; (3) a fully free, no-obligation trial campaign referencing the prospect's own case study, with resulting leads forwarded straight to their inbox - by far the highest response, despite needing the most setup effort. Response rate scaled directly with how much real value the offer represented, more than any copy or automation trick did - free, no-risk pilots need almost no prep beyond a short setup call but remove all risk for the prospect.`},
{p:'Eric Nowoslawski', cat:'Offers & Positioning', src:'Focus on Offers Made To Convert Cold Traffic', t:'ListKit’s front-end/back-end funnel', b:`ListKit's own go-to-market turns a commoditized offer into a growth engine: sell a low-cost, plug-and-play cold email infrastructure setup (roughly a one-time low-thousands fee) as a front-end offer that covers acquisition cost, then retain the customer long-term by having them run ongoing list-building through ListKit itself - turning a hard-to-switch commodity (contact data) into a sticky recurring relationship built on an inexpensive front-end offer.`},
{p:'Eric Nowoslawski', cat:'Offers & Positioning', src:'Focus on Offers Made To Convert Cold Traffic', t:'Specific quantified proof beats a generic pitch', b:`Rather than a broad claim like offering generic ad services, lead with an offer to jump on a call and look directly at the prospect's account, citing a specific quantified past result (a dollar figure saved in a short call). Concrete numbers tied to a real, recent outcome make the pitch feel like inside expertise rather than a service description.`},
{p:'Eric Nowoslawski', cat:'Offers & Positioning', src:'Outbound Copywriting: Chunking Up and Down', t:'Turn operational details into differentiators', b:`Applying chunking down concretely: not raising prices based on client sending volume (an informal internal policy, contrasted against competitors who cap monthly volume), positioning as a broader "data company" with extra tooling beyond a typical agency, or skipping a full platform pitch in favor of referencing one specific case study already on the prospect's site and offering exactly one matching feature - showing the output as immediate proof rather than describing everything the product can do.`},

{p:'Matt Lucero', cat:'Offers & Positioning', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'A weak offer can’t be rescued by good copywriting', b:`"You can only put so much lipstick on a pig" - no amount of clever subject lines or structure will make people respond if the underlying offer isn't something the market actually wants. Offer quality should be solved before investing in copy optimization; recommended reading specifically for building stronger offers is Alex Hormozi's "$100M Offers," treated as the highest-leverage input to overall campaign performance.`},
{p:'Matt Lucero', cat:'Offers & Positioning', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'Lower the buyer’s risk with guarantees, performance pricing, or speed', b:`Two concrete ways to strengthen an offer: guarantee the result, or structure pricing so you only get paid based on performance - either makes saying yes closer to a "no-brainer" by shifting risk away from the buyer. Adding a concrete time element (guaranteeing delivery in a day instead of two months, or leads in 14 days instead of 30) also measurably increases perceived offer value, even without changing the core deliverable.`},
{p:'Matt Lucero', cat:'Offers & Positioning', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'Market saturation is a positive signal, not a red flag', b:`Push back on the instinct to avoid "crowded" markets - heavy competition in a space is evidence that real demand and willingness to pay already exist. Selling something nobody has ever sold before is riskier because there's no proof of demand at all.`},
{p:'Matt Lucero', cat:'Offers & Positioning', src:'START HERE / Video 1 (batch 3)', t:'The Costco free-sample model: give a real taste before asking for anything', b:`Ending the email with an offer to do something for free (a free sample for a physical product, a free instance of the service) consistently boosts conversion by removing risk/decision friction - the "easiest to implement, biggest impact" lever, the same way food-sample stands at Costco get people to taste a product before buying. The free offer must be genuinely valuable to the prospect, not just easy for you to give (a brochure about chicken nuggets isn't the same as an actual bite) - the closer the free offer is to the real value of your paid service, the more it moves both interest and eventual close rate. Concrete examples: a free ad creative or a week of free ad management for a Meta ads agency, a free sample for physical products, a small free feature or prototype for dev/software services - each designed to get "hands dirty" in the prospect's business and demonstrate competence firsthand. As a side benefit, accepting a small free engagement also pre-qualifies leads by filtering for people willing to commit some effort upfront, and deepens the relationship in a way that makes the eventual close easier.`},
{p:'Matt Lucero', cat:'Offers & Positioning', src:'Video 2 (batch 3)', t:'For consultative/high-trust offers, the email should surface interest, not prove credibility', b:`Using private equity outreach ("do you want to sell your business?") as the example, the email's only job is to find out if the person is even in-market to consider the offer - track record, growth numbers, and case studies belong on the sales call, not the first email. Shorter, interest-only emails have outperformed longer ones that front-load the firm's credentials.`},

{p:'Frank Brothers', cat:'Offers & Positioning', src:'Frank Collective Outbound Lessons Doc / 1M Frank eBook / 55 Cold Email Copywriting Cheat Codes', t:'Case studies must share a real, explicitly-stated commonality', b:`A referenced case study only works if it's genuinely relevant to the prospect, and the commonality should be stated explicitly rather than implied - reference competitors, adjacent-space companies, or at minimum a widely recognizable brand, never an irrelevant or unknown company, since that actively undercuts credibility. A strong but slightly off-niche logo beats a perfectly matched but obscure one.`, ex:`"We work with Monzo (they're also in fintech like you)"`},
{p:'Frank Brothers', cat:'Offers & Positioning', src:'Frank Collective Outbound Lessons Doc / 55 Cold Email Copywriting Cheat Codes', t:'Lead with outcome, not mechanism - and don’t sacrifice clarity for a clever hook', b:`Never open with the name of your service or the mechanism behind it - lead with the outcome the buyer actually cares about (no one wakes up wanting "SEO," they want more traffic and conversions). Naming only the outcome and withholding the "how" also naturally creates curiosity. But the core of what you're offering must still be unmistakably clear by the end of the message - being clever is never worth the reader having to guess what you're actually offering.`},
{p:'Frank Brothers', cat:'Offers & Positioning', src:'Frank Collective Outbound Lessons Doc', t:'Named-competitor social proof', b:`Naming a specific competitor or peer company as an existing client, paired with a quantified percentage result they achieved, builds credible, concrete positioning far more effectively than a vague claim of "great results for clients like you."`},
{p:'Frank Brothers', cat:'Offers & Positioning', src:'Frank Collective Outbound Lessons Doc / 1M Frank eBook', t:'A well-built lead magnet is one of the strongest offer types available', b:`Framing an offer around a named "unique mechanism" and the specific outcome it produces, then offering a related lead magnet as the next step, is claimed to lift reply rates by roughly 5-10x over a standard cold email. The quality bar: build the lead magnet specifically for that buyer - a custom lead list, a bespoke strategy outline, a micro-audit - rather than a generic, one-size-fits-all asset like a standard ebook. The perceived personal effort behind the resource is what triggers reciprocity, not the resource's format. Give value before asking for anything: lead with a genuinely relevant observation, hand over the resource with no immediate ask attached, and only softly suggest a follow-up conversation afterward.`},
{p:'Frank Brothers', cat:'Offers & Positioning', src:'1M Frank eBook / The Secret to Close Outbound Sales Opportunities', t:'A no-fee test project lowers the risk of saying yes to nearly zero', b:`Instead of asking for a meeting outright, offer a small, free trial engagement - a no-fee test project covering strategy, copy, or design; one test email to an agreed sample list; a first 100-row data slice; a short draft sequence - letting the work speak before any commercial commitment is required. Rules for these: keep it to 1-3 hours of effort, make it zero-risk to the prospect's brand, and make sure it's useful even if they ultimately say no.`},
{p:'Frank Brothers', cat:'Offers & Positioning', src:'1M Frank eBook', t:'Aspirational positioning and thinking-partner framing, when you lack case studies', b:`Position your offer as the mechanism behind the buyer's own future recognition or success (as in the "Acceptance Speech" template) rather than describing product features directly - works particularly well when you don't yet have case studies to prove value conventionally. Separately, offering unprompted, genuinely useful strategic ideas before any sales conversation reframes the relationship from "vendor pitching a service" to "peer sharing expertise." Either way, confident or bold claims are only credible - not obnoxious - when immediately backed by a specific, checkable credential.`},
{p:'Frank Brothers', cat:'Offers & Positioning', src:'55 Cold Email Copywriting Cheat Codes', t:'Offer a bounded trio of tailored ideas - and say you CAN help, not that you already HAVE', b:`Instead of a vague "let's chat," offer something concretely valuable and bounded in number, like three campaign angles or three homepage tweaks tailored to their context - a specific, bounded offer is easier to say yes to than an open-ended one. Phrase it as what you'd do if you were in their shoes, not as work you've already done unsolicited - claiming you've "already mapped 3 ideas" for a stranger's business can read as disingenuous if untrue, while honestly framing it as a capability builds more trust than a fabricated head start.`, ex:`"Can share 3 campaign angles we'd actually test for you."`},
{p:'Frank Brothers', cat:'Offers & Positioning', src:'Unlocking Enterprise', t:'Enterprise: lead with goodwill, borrow authority, and use exclusivity', b:`Enterprise buyers have built up resistance to vendors and their inboxes are flooded, so opening with a direct pitch rarely works - the first move should offer something of genuine, no-strings-attached value (an insight, a resource, an invitation), since goodwill disarms resistance. Framing the outreach as coming via a senior colleague's request ("Henry, our Head of Marketing, asked me to reach out") makes a cold invite feel like it carries internal authority and warmth. Framing the ask as access to something scarce - an "invite-only" event, or a dinner capped at 8-10 senior peers from named top-tier companies - makes the invitation feel prestigious rather than a generic marketing touchpoint.`},
{p:'Frank Brothers', cat:'Offers & Positioning', src:'Unlocking Enterprise', t:'Enterprise: stack proof, contrast cost, and name competitors directly', b:`Because the perceived risk of choosing an unproven vendor is higher at enterprise scale (nobody wants to be the one who brought in a bad vendor), stacking similar-brand social proof and case studies is essential to closing the trust gap quickly. Contrasting real costs (e.g. current spend of 20k+/year on a legacy tool versus under 2k/year for the alternative) makes value instantly legible instead of abstract. Leading with a genuine point of differentiation ("no other provider offers this") or comparing directly against named competitors (PayPal, Square) raises the stakes of not acting by making the competitive position concrete.`},
{p:'Frank Brothers', cat:'Offers & Positioning', src:'Unlocking Enterprise', t:'Enterprise: disarming honesty, real deadlines, and a competitive nudge on the close', b:`Openly admitting a direct offer (like free certification) may not apply to this specific, already-qualified recipient, then redirecting the ask toward their colleagues instead, removes the pushy one-size-fits-all feel and turns the recipient into a referral source rather than a lost cause. Build urgency around an actual, factual event (an announced government funding cutoff date) rather than manufactured "limited time" scarcity. In a sequence's final note, implying the prospect's named industry rivals are already ahead frames the offer as a way to keep pace rather than fall behind - a light competitive-pressure close rather than a hard ask.`},
{p:'Frank Brothers', cat:'Offers & Positioning', src:'The Secret to Close Outbound Sales Opportunities', t:'Two types of proof are the actual product being offered during a sales process', b:`Split everything shown to a prospect into "social proof" (has this worked for people like me) and "applied proof" (how will this work for me specifically) - treat these two categories as the deliverables that move a deal forward, not just supporting collateral.`},
{p:'Frank Brothers', cat:'Offers & Positioning', src:'14 Lessons to $1m ARR', t:'Your pricing model determines client quality; differentiate with a unique mechanism', b:`Raising prices was the single change that most improved one agency's business: it attracted clients who genuinely valued the work, dropped churn, improved margins, and reduced stress, removing the need to keep "convincing" people since they arrived already willing to invest - pricing is a client filter, not just a revenue lever. Separately, repositioning a commoditized "cold email" service as an "AI-driven outreach system" / premium GTM-engineering offer made it feel like a category of one without inventing anything new - just repackaging and reframing.`},
{p:'Frank Brothers', cat:'Offers & Positioning', src:'24 Business Learnings in 24 Months', t:'Your most difficult clients are usually your cheapest; results are your best marketing', b:`Low-paying clients tend to consume disproportionate time and energy relative to what they pay - say no to them early to protect focus for higher-value accounts. And proof beats promises: showing real outcomes achieved for past clients is more persuasive in positioning and marketing than any amount of claims about what you can do.`},
{p:'Frank Brothers', cat:'Offers & Positioning', src:'How to Get a Meeting with Anyone', t:'Hold back a meaningful incentive, and establish equal-status credibility first', b:`Rather than giving everything away up front, the strongest campaigns withhold one genuinely desirable, personally relevant item and offer it explicitly as something the recipient receives only by taking the call - a concrete, low-effort reason to say yes alongside the actual business value proposition. Separately, crafting a compact statement of your own credibility and relevant accomplishments (a "VIP statement") to use in the first seconds of contact helps the recipient perceive you as a peer worth a reply rather than an anonymous solicitor - investing in your own visibility and reputation over time compounds this effect for every future cold approach.`},


// ============ CALLS TO ACTION (CTA) ============

{p:'Eric Nowoslawski', cat:'Calls to Action (CTA)', src:'Top 10 Cold Email Tips That Give You an Unfair Advantage', t:'Value-based CTAs beat direct meeting asks', b:`Direct CTAs like "Do you want to book a meeting?" or "Could we talk?" got noticeably fewer replies than a softer, value-based CTA (credited to Jordan Crawford) that invites a lower-commitment yes without asking for calendar time up front. If your funnel isn't converting at the "book a meeting" stage, the fix isn't to push that CTA harder - create something free (a lead magnet, report, or resource) and use the CTA to generate lower-friction hand-raisers instead.`, ex:`"if we could help you with this, would it be useful?"`},
{p:'Eric Nowoslawski', cat:'Calls to Action (CTA)', src:'Cold Email First Principles Thinking', t:'Give a reason for the ask, not just a generic request', b:`On a Google reputation-management campaign, switching the CTA from a generic "would it make sense to chat?" to a specific "could we chat for 15 minutes to see if that review was unwarranted so we can build the case" produced roughly 2.5x the response rate. Explaining specifically why you need the prospect's time, versus a vague ask, makes the request feel earned rather than like a generic sales grab.`},
{p:'Eric Nowoslawski', cat:'Calls to Action (CTA)', src:"I sent 10,000,000 cold emails, here's what works in 2025", t:'Tie the lead magnet directly to the CTA', b:`A chocolate company was getting plenty of replies to a free-sample offer but almost no booked meetings, because their CTA never connected the sample to the call. The fix was rewording the CTA so the call itself became the way to get the sample - e.g. offering to hop on a quick call and send a free chocolate basket as an example during it - booking rates jumped immediately once the free item and the meeting were explicitly linked.`},
{p:'Eric Nowoslawski', cat:'Calls to Action (CTA)', src:"I sent 10,000,000 cold emails, here's what works in 2025", t:'Offer a free test/pilot as the CTA itself', b:`Rather than asking for a generic discovery call ("book a call to hear about our service"), lead engagements with a free trial/test campaign and make the email CTA an offer to run that free test rather than a request to be pitched. This change in the ask itself outperformed even AI-personalization gains, because removing commitment risk from the ask makes saying "yes" close to a no-brainer.`},
{p:'Eric Nowoslawski', cat:'Calls to Action (CTA)', src:'Focus on Offers Made To Convert Cold Traffic', t:'Keep the ask small and curious, proportional to the offer', b:`Across example campaigns, the CTA stays a short, low-friction, curiosity-driven question rather than a hard booking push - asking if they'd want to talk, or want to see what a free test or process would look like. The size of the ask stays proportional to the offer already made rather than overreaching relative to it.`},

{p:'Matt Lucero', cat:'Calls to Action (CTA)', src:'START HERE: How to Run Cold Email for Any Business', t:'Offer two concrete times instead of an open question', b:`Rather than asking a vague "want to hop on a call?", which invites more back-and-forth, give two specific time options so the prospect's only needed reply is a yes - like inviting a friend to eat: "want to go eat?" opens a negotiation, while "want to grab [place] at [time]?" collapses it into a single-word answer.`},
{p:'Matt Lucero', cat:'Calls to Action (CTA)', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'Four traits of an effective CTA - and never leave it implicit', b:`A strong CTA: (1) moves the prospect measurably closer to actually buying (a "check out my website" ask fails this test), (2) is low-risk/low-time-commitment, (3) doesn't sound gimmicky, jargon-heavy, or scammy, and (4) ideally differs from what every other cold email in their inbox is already asking for. A surprisingly common mistake is omitting a clear next step altogether - every cold email should end with an explicit, specific ask, ideally tied to some kind of lead magnet rather than a bare "let's chat."`},
{p:'Matt Lucero', cat:'Calls to Action (CTA)', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'Don’t ask for a big time commitment on the first touch', b:`Asking directly for a 30-minute call in the very first message is too large an ask before any trust has been built - like asking a stranger on the street out for coffee before any conversation. This CTA can still work later in a sequence, just not as the opening move.`},
{p:'Matt Lucero', cat:'Calls to Action (CTA)', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'Avoid "free audit" CTAs - they read as disguised sales pitches', b:`Free-audit offers (e.g. a free SEO audit) tend to be recognized instantly as a sales tactic, and lose more trust if they require backend account access or credentials - both the perceived insincerity and the access friction reduce response rates versus a more transparent CTA.`},
{p:'Matt Lucero', cat:'Calls to Action (CTA)', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'The CTA escalation menu, from lightest to top-recommended', b:`A "quick 5-minute call" (rather than a full 30-minute Zoom) dramatically lowers perceived commitment and works as a triage step, especially well with less digitally-native industries like contractors. A "more info?" soft ask is even lighter and the easiest to implement with no assets needed. A portfolio-viewing CTA pre-answers "is this person actually good?" for visually-demonstrable services (design, photography, video). His top recommendation overall is a free, tangible sample of the actual service (a free video, email, or design) - it beats a Loom/video-audit CTA (which only converts about 5-10% of viewers to a booked call, wasting recording time on mildly-curious prospects) because almost no competitor is willing to do it, it's a genuine no-brainer, and - like a grocery-store food sample - it functions as a mini sales close in its own right.`, ex:`"I can make you a free video showcasing how good our service is - want me to send one over?"`},
