{p:'Frank Brothers', cat:'Calls to Action (CTA)', src:'Frank Collective Outbound Lessons Doc / 55 Cold Email Copywriting Cheat Codes / Unlocking Enterprise / Ultimate Guide to Clay', t:'Keep the CTA low-commitment but specific, not generic', b:`Rather than a vague "let's hop on a call" or "let me know if you'd like to learn more," offer something small, concrete, and easy to say yes to - a short video, a plain "mind if I share more info?" A vague, catch-all ask is weaker than a concrete, low-friction next step tied to what was just said in the message - true across small business and enterprise outreach alike.`, ex:`"Can I share a 2 minute video explaining why hotels specifically are switching over to this strategy in 2025?"`},
{p:'Frank Brothers', cat:'Calls to Action (CTA)', src:'Frank Collective Outbound Lessons Doc', t:'Avoid "should/do you want me to" phrasing', b:`Never phrase a CTA as "should I send it over?" or "do you want me to send it over?" - a cold prospect doesn't want to expose interest or commitment, so language asking them to declare "wanting" something triggers defensiveness. Rephrase as a permission-based ask instead.`, ex:`"Would it be okay if I send it over" or "Mind if I share it with you"`},
{p:'Frank Brothers', cat:'Calls to Action (CTA)', src:'Frank Collective Outbound Lessons Doc', t:'Subtle urgency, a concrete timeframe, and a timing-check frame', b:`A light touch of urgency-suggesting language - implying the prospect might be a little late relative to peers - can nudge a reply, but it has to stay factual and never read as an insult. Giving a specific deadline for delivering a resource creates immediacy a vague "I'll send it over sometime" doesn't. And asking whether something is already an internal discussion or priority reframes the CTA as a low-stakes timing question rather than a sales ask, making it easier and less risky to answer honestly either way.`, ex:`"Others are already switching" / "If you shoot back a 'yes,' I can get the resource over to you by 6pm today."`},
{p:'Frank Brothers', cat:'Calls to Action (CTA)', src:'Frank Collective Outbound Lessons Doc', t:'Bound the ask to a short, specific time commitment', b:`Instead of an open-ended request for "a call," offer a tightly bounded ask (e.g. "10 minutes") paired with one specific, comparable result you've achieved elsewhere - the explicit time cap lowers the perceived cost of saying yes.`},
{p:'Frank Brothers', cat:'Calls to Action (CTA)', src:'1M Frank eBook', t:'The No-Brainer CTA and the Lead Magnet CTA', b:`No-Brainer: the lowest-friction CTA family - ask permission to send something (a one-pager, a teardown, a set of ideas) rather than asking for someone's time. Because it only requires a yes/no rather than a scheduling decision, it suits early-sequence messages where the goal is just a foot in the door. Lead Magnet: flips the sequence by offering something valuable up front and letting the ask follow naturally - works especially well as a last-ditch "value bomb" late in a sequence, or with sophisticated, skeptical buyers who need proof of value before engaging further.`},
{p:'Frank Brothers', cat:'Calls to Action (CTA)', src:'1M Frank eBook', t:'The Choice CTA (A/B/C) and the Disarming Question CTA', b:`Choice: offer three concrete options and ask for a one-letter reply - taps both autonomy bias (feeling in control of what they get) and light gamification; useful with multiple valuable assets to test, or an indecisive prospect who needs a lower-effort way to signal interest. Disarming Question: instead of a binary yes/no, close with an open, self-aware, slightly doubtful question that removes pressure entirely - effective with senior executives who react badly to feeling "sold to," and works best when the doubt is anchored to a specific, real observation rather than left generic.`, ex:`"Am I even barking up the right tree?"`},
{p:'Frank Brothers', cat:'Calls to Action (CTA)', src:'1M Frank eBook', t:'Reply-framing, CTA stacking, and testing no CTA at all', b:`Rephrasing a passive ask ("let me know if any of these interest you") into an active, ultra-specific instruction ("reply with a letter and I'll send it over") measurably reduces the mental effort needed to respond - make this the default wording for any multi-option CTA. Pairing a lighter ask in the body with a separate, softer nudge in the P.S. ("CTA stacking") gives each message two independent chances to land a response. And deliberately testing messages with no call to action at all has produced surprisingly strong results, likely because it relaxes the tone, functions as a pattern disruptor, and may help deliverability since a CTA is one of the most common markers spam filters learn to flag - worth running as a genuine ongoing test variant.`},
{p:'Frank Brothers', cat:'Calls to Action (CTA)', src:'Inbox Engineering', t:'Minimize reply friction with one-tap CTAs', b:`Because more replies build sender reputation, use the smallest possible ask in a first-touch email - ideally something the recipient can answer in one word rather than clicking a link or filling a form. Booking links and forms are discouraged in the opening message specifically because they raise the effort bar and suppress replies.`, ex:`Reply "yes" and I'll send the resource.`},
{p:'Frank Brothers', cat:'Calls to Action (CTA)', src:'The Cold Outreach Phrasebook', t:'Soften the CTA, and phrase it as a playful invitation', b:`A short line right before the CTA signaling you're aware the reader might not be ready or interested takes the pressure off the ask that follows, making it feel optional rather than expected. Phrasing the ask itself with a bit of self-aware humor makes it read as an invitation the reader can easily decline, not a transactional demand.`, ex:`"No pressure if not, just figured I'd ask..." / "Fancy a low-key chat to see if it's worth pursuing?"`},
{p:'Frank Brothers', cat:'Calls to Action (CTA)', src:'Making Cold Outreach Funny', t:'The reverse CTA, and an oddly specific wager', b:`Instead of asking for a next step, explicitly tell the reader how to opt out and commit to respecting it - this removes pressure entirely and, counterintuitively, tends to increase replies because it proves you're not going to be pushy if they do engage. A related move: turn the ask into a small, concrete, humorous bet tied to a specific (slightly absurd) number or stake - memorable, and it lowers the stakes of saying yes because it feels like a fun dare rather than a sales step.`, ex:`"If this is annoying, reply with 'stop' and I will go touch grass."`},
{p:'Frank Brothers', cat:'Calls to Action (CTA)', src:'The Ultimate 3-Step Cold Email Sequence', t:'Sequence-level CTA arc: low-commitment asset first, a planted thought at the end', b:`Email 1's CTA offers a low-commitment asset rather than a meeting - a short video case study "for your back pocket" for whenever capacity gets tight, keeping engagement going without asking for calendar time. The final email in the sequence deliberately avoids pushing for a reply, closing by leaving the idea available "in case it ever becomes relevant" - treating a non-response as an acceptable outcome rather than something to chase.`},
{p:'Frank Brothers', cat:'Calls to Action (CTA)', src:'How to Get a Meeting with Anyone', t:'Ask collaboratively, not with a hard pitch', b:`Described in the book as an "anti-pitch": present the reason for reaching out in small, checked-in increments ("does this seem relevant to you?") and explicitly give the recipient room to opt out at any point, rather than pushing straight through a scripted sales pitch. Paradoxically, this lower-pressure, permission-seeking framing builds more trust and produces fewer defensive reactions than a direct ask.`},


// ============ FOLLOW-UP STRATEGY ============

{p:'Eric Nowoslawski', cat:'Follow-Up Strategy', src:'Cold Email Follow-Up Strategy for 2026 (Data-Backed)', t:'Cap sequences at 2 emails, 3 at most - the data says so', b:`Across every campaign reviewed, email 1 consistently generated the most positive responses, email 2 dropped off somewhat, email 3 dropped off a lot, and a 4th email's reply rate was dramatically lower still. Cut sequences down to 2 emails for most senders, with 3 as an absolute ceiling - for the large majority of senders, pushing to 4-5 emails is far more likely to get you marked as spam and hurt domain reputation than it is to convert a previously unresponsive prospect.`},
{p:'Eric Nowoslawski', cat:'Follow-Up Strategy', src:'Cold Email Follow-Up Strategy for 2026 (Data-Backed)', t:'Size your sequence length to your TAM', b:`Decide follow-up count based on total addressable market size: if TAM is over 1 million contacts, skip follow-ups entirely - send one email to the whole list, then come back later with a fresh insight/angle and resend to everyone. If TAM is 50,000-100,000, use a 2-email sequence. If TAM is under 50,000, use a 3-email sequence. These are rough rules of thumb, not universal rules - if your own data shows email 3 outperforming, keep doing what works for your data.`},
{p:'Eric Nowoslawski', cat:'Follow-Up Strategy', src:'Cold Email Follow-Up Strategy for 2026 (Data-Backed)', t:'Space touches by days, then months - and flip the angle each time', b:`A workable cadence: send email 1, follow up 3-5 days later adding any missing context, then send a final, distinct touch anywhere from 1-3 months later - the exact days between the first two touches matters less than making sure there's a long gap before the final re-engagement, since that gap gives the prospect's business situation time to change. If email 1 leads with one value-prop bucket ("save time"), email 2 should shift to a different bucket ("make more money") rather than repeating the same pitch, giving the prospect a different entry point to relate to the same offer.`},
{p:'Eric Nowoslawski', cat:'Follow-Up Strategy', src:'Cold Email Follow-Up Strategy for 2026 (Data-Backed)', t:'Progressively lower the ask across the sequence', b:`Email 1 should typically go for the higher-commitment ask (booking a meeting - a "sales-qualified" ask). If that doesn't convert, email 2 should lower the friction to a "marketing-qualified" ask, like offering a report or lead magnet, since non-response to email 1 signals the recipient likely doesn't have a burning problem right now - better to collect a lower-commitment hand-raiser than repeat the same high-friction ask.`},
{p:'Eric Nowoslawski', cat:'Follow-Up Strategy', src:'Cold Email Follow-Up Strategy for 2026 (Data-Backed)', t:'"Building it for you" two-step lead magnet (credit: Kyle Rasmussen)', b:`Email 1 tells the prospect you just came across their company, found it interesting, and are going to put together a custom report/list/analysis specifically for them. Email 2, sent the next day, delivers the actual report as the "follow-up" - even though the report can be generated automatically at scale with AI. The manual-feeling pattern interrupt reportedly increases the perceived value of the deliverable.`},
{p:'Eric Nowoslawski', cat:'Follow-Up Strategy', src:'Cold Email Follow-Up Strategy for 2026 (Data-Backed)', t:'Name-drop an adjacent stakeholder in a follow-up', b:`Use a contact-enrichment tool that returns a company's full employee roster with names and titles in one API call, then use AI to pick a more senior or adjacent decision-maker relative to your primary target (e.g. surface the CEO or director of sales when your main target is VP of sales), and name-drop that person in a follow-up asking whether they're the more relevant contact. This reliably generates replies that confirm, redirect, or correct who the right contact actually is - useful for multi-threading into an account.`},
{p:'Eric Nowoslawski', cat:'Follow-Up Strategy', src:'How to Increase Meetings Booked Per Positive Response', t:'Respond fast with both scheduling options, or skip the friction with a direct invite', b:`The moment someone replies positively, respond immediately with two concrete manual time options (e.g. Tuesday 10am or Thursday 2pm) plus a calendar link in the same message - some people hate manual back-and-forth and prefer a link, others are put off by calendar links and want to just pick a time, so offering both covers either preference. As an alternative, place a calendar invite directly on the prospect's calendar at a proposed time marked "free/not busy" so it doesn't block their day and can be moved - framed as pure mutual convenience since they already expressed interest, removing the extra step of a separate booking tool. Skip vague "just checking in" bumps - they don't give the prospect any new reason to act.`},
{p:'Eric Nowoslawski', cat:'Follow-Up Strategy', src:'How to Increase Meetings Booked Per Positive Response', t:'Alternate case-study proof and free-value offers across successive follow-ups', b:`If the first scheduling attempt doesn't convert, do more manual research and reference a specific, comparable case study, explaining concretely why a similar result is achievable for them - rebuilding the case for the meeting instead of just re-asking for time. If that still doesn't land, do a small amount of free work up front (a mini competitor audit, a sample deliverable) as a taste of value tied to the ask, leaning on reciprocity. Cycle between these two approaches across successive follow-ups until the prospect books, rather than repeating the same nudge.`},
{p:'Eric Nowoslawski', cat:'Follow-Up Strategy', src:'How to Increase Meetings Booked Per Positive Response', t:'Status-alignment framing to avoid sounding "hungry" (credit: Oren Klaff)', b:`To avoid sounding like a salesperson chasing a reply, reframe unanswered follow-ups around your own shifting availability rather than their inaction - e.g. mentioning that one of the previously offered time slots got taken by someone else and a new meeting popped up on another day, then offering fresh times. This signals you're a busy, in-demand professional coordinating schedules rather than someone nagging for a "yes."`},
{p:'Eric Nowoslawski', cat:'Follow-Up Strategy', src:'Past Mistakes We Made w/ Email Personalizations', t:'Follow-ups are a place to test a new angle, carefully', b:`A risky personalization tactic (referencing a prospect's alma mater to set up a joke) was deployed as a follow-up variable rather than in the first-touch email, suggesting follow-ups can be a testing ground for a different angle. But any new angle introduced this way still needs to be vetted for how the full range of recipients might take it, since a follow-up reaches people just as tone-sensitive as a first email.`},

{p:'Matt Lucero', cat:'Follow-Up Strategy', src:'START HERE / How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'Cap cold (no-response) sequences at 2-4 emails - expect steep diminishing returns', b:`For high-volume cold sending, don't run more than about 3-4 emails per prospect in a sequence, since reply rates are highest on email one and decline on each subsequent one - the first email typically captures people with the most immediate, "burning" pain, while later follow-ups mostly catch people whose timing simply wasn't right the first time. Since sending capacity is finite, it generally performs better to redirect volume toward reaching new prospects than to pile on a 4th+ follow-up to non-responders. This is distinct from the commonly cited "8-10 touchpoints" stat, which applies once someone has actually responded, not to a cold no-reply sequence. Adjust based on market size and campaign performance: send more to a smaller, well-performing segment; send fewer, to more people, if performance is weaker.`},
{p:'Matt Lucero', cat:'Follow-Up Strategy', src:'START HERE / How To Generate Leads With Cold Email in 2026 (FULL COURSE) / Video 1 (batch 3)', t:'Once someone shows interest, the "stranger" rules no longer apply', b:`The moment a prospect responds with any sign of interest, you now have license to follow up far more persistently - roughly 10 touchpoints spread across multiple channels is a reasonable bar before considering dropping them, and interested leads should be followed up with continuously ("into eternity") until they explicitly decline or book. Because cold-email leads start with less trust than referral or inbound leads, the sales process needs disproportionately more follow-up here - "dozens" of touches, not one or two - so use a CRM specifically so these people don't fall through the cracks between touches. As a rough practical cutoff, after roughly 30 unanswered follow-up attempts it may make sense to redirect that effort elsewhere.`},
{p:'Matt Lucero', cat:'Follow-Up Strategy', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'Hit interested leads on three channels immediately, and speed-to-lead matters', b:`As soon as someone replies positively, follow up fast across LinkedIn (connection request), email (a reply), and phone (a call) simultaneously - this also signals to the prospect that a real human, not a bot, is engaging with them. "Double dial" (calling twice in immediate succession rather than once) gets around iPhones' Do Not Disturb feature, which auto-rejects a first unknown call but lets a second one through. That said, answering fast with a rushed, incomplete answer can kill a lead worse than a short delay with a thorough one - and rotate across only a couple of channels per day rather than hitting a prospect on many channels at once, to avoid feeling spammy.`},
{p:'Matt Lucero', cat:'Follow-Up Strategy', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'Follow up with warm/interested leads every 2-5 days, and prioritize the newest', b:`For interested prospects who went quiet after an initial answer, a follow-up cadence of every 2-5 days (tracked in a CRM or master inbox) works well, since people get busy and need repeated prompting to actually book. As a pipeline of interested leads accumulates, give the most attention to people who most recently expressed interest rather than working strictly in arrival order, since more recent interest is likelier to still be live. Roughly 50-60% of booked meetings originate from follow-up touches rather than the initial send - underscoring why a disciplined, persistent follow-up process matters as much as the first email's copy.`},
{p:'Matt Lucero', cat:'Follow-Up Strategy', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE) / Video 2 (batch 3)', t:'Manual follow-ups convert better but don’t scale - automate once volume is high', b:`Fully manual, custom follow-ups (even just 5-10 minutes of personalized writing per lead) are the single most effective approach and noticeably lift booking rates, but they only make sense at lower volume - once you're getting 50-100+ positive replies a day, automated subsequences become necessary just to keep up. An internal automated workflow (SmartLead + HeyReach + Clay) can auto-send a LinkedIn connection request the moment a lead replies positively over email, layering channels without manual triggering for every lead.`},
{p:'Matt Lucero', cat:'Follow-Up Strategy', src:'Video 2 (batch 3)', t:'Custom assets after a call is booked lift show/close rates', b:`Making a quick custom video for someone who just booked a call (e.g. "here are 5 cold email ideas I had for you") measurably increases how excited and prepared they are to show up - the same custom-asset principle applies to follow-up messages generally, not just pre-call nurture.`},

{p:'Frank Brothers', cat:'Follow-Up Strategy', src:'Frank Collective Outbound Lessons Doc / 1M Frank eBook / 55 Cold Email Copywriting Cheat Codes / The Ultimate 3-Step Cold Email Sequence', t:'Every follow-up must add something new - zero tolerance for "just checking in"', b:`A follow-up is only justified if it brings fresh value: a new insight, new social proof, a new competitive framing, or a new CTA. A pure reminder/bump email has "zero tolerance" in this system - it's an empty touchpoint that adds nothing and can only hurt the sequence. Follow-ups should also read as one continuing story rather than disconnected messages - explicitly reference the point made in an earlier email and build the idea forward.`, ex:`"Last time I mentioned X - thought I'd expand."`},
{p:'Frank Brothers', cat:'Follow-Up Strategy', src:'1M Frank eBook', t:'The 3D Follow-Up Formula: Different, Disarming, Direct', b:`Judge every follow-up against three criteria at once: Different (a genuinely new angle, insight, or piece of information each time, never a repeat of the last message), Disarming (kept light and confident, often with a bit of self-deprecating humor so it reads as likeable rather than annoying), and Direct (stripped of passive or needy language, concise and action-oriented even if that means bending strict grammar rules for punchiness).`},
{p:'Frank Brothers', cat:'Follow-Up Strategy', src:'Frank Collective Outbound Lessons Doc', t:'Ready-made follow-up angles beyond the generic bump', b:`Three reusable patterns: a lighter opener using a meme before pivoting to a serious ask about the underlying problem; a bullet-point recap follow-up restating specific outcomes achieved elsewhere as fresh proof; and a "wrong contact" follow-up that re-opens the thread by asking whether a different named person handles the topic instead. A fuller sequence pattern: touch one is a direct pitch tied to a relevant first line, touch two lowers the commitment by offering an async video instead of a call, touch three widens the net by asking which of two named people is the right contact plus three specific ideas as bullets - pitch, then reduce friction, then multi-thread, with each touch trying a different lever. (The app's separate 9 Creative Follow-Up Angles bank - forgotten lead magnet, timely report, adjacent capability, colleague loop-in, competitive intel, client quote, previous-employer connection, and a direct ask for a phone number - lives in the Cold Email Bank tab.)`},
{p:'Frank Brothers', cat:'Follow-Up Strategy', src:'1M Frank eBook', t:'Follow-up sequence length: 2-3 is the ceiling, flexed by TAM', b:`The sweet spot is 2-3 follow-ups total; going beyond that starts to read as desperate and can damage domain/sending reputation. Sequence length should flex with market size - a small TAM justifies a longer, more patient sequence since each account is precious, while a large TAM favors a lean 1-2 follow-ups before moving to fresher prospects. Each follow-up should still build on the last, forming one continuous, escalating narrative ("sequence momentum") - even if any single message only lands a moderate impact alone, the accumulated weight of several connected, thoughtful messages is what drives the eventual reply.`},
{p:'Frank Brothers', cat:'Follow-Up Strategy', src:'1M Frank eBook', t:'OOO replies and executive re-engagement as momentum-savers', b:`When a target contact is away, message a secondary stakeholder referencing both the absence and a specific, relevant trigger event, then let them choose whether to loop in the original contact or engage directly - keeping momentum alive during otherwise-dead time and doubling as a natural multi-threading entry point. Separately, when a cold thread has stalled, having a senior person at your company send a short, casual note referencing the earlier conversation can re-warm it without repitching - a senior sender lends authority and a warm, low-stakes tone makes it easy to re-engage, though it works best when that executive has a credible, active presence to back the "senior" framing.`},
{p:'Frank Brothers', cat:'Follow-Up Strategy', src:'Inbox Engineering', t:'Follow-ups should be shorter than the opener', b:`A structural rule on the practical copy checklist: every follow-up email in a sequence should be shorter than the original opening email, not longer or equal in length.`},
{p:'Frank Brothers', cat:'Follow-Up Strategy', src:'The Cold Outreach Phrasebook', t:'Vary the mid-sequence opener, and make the final email feel genuinely final', b:`A mid-sequence email needs its own non-repetitive opener that keeps the conversation going without sounding desperate or like a scripted bump - gentle callbacks to the previous note work better than a flat "just following up." The last email in a sequence should instead read as visibly final - an honestly-framed "this is genuinely my last try" tone tends to jolt a reader who's been ignoring the thread more than another gentle bump would.`, ex:`"Quick second pass at this, in case my last note got buried..." / "One last shot at this, then I'll go quiet..."`},
{p:'Frank Brothers', cat:'Follow-Up Strategy', src:'The Ultimate 3-Step Cold Email Sequence / Unlocking Enterprise', t:'Expand the social-proof roster with each touch, and escalate seniority on later ones', b:`Named customer examples should grow across the sequence - a single brand in Email 1, two more added by Email 2, all reinforced again in Email 3 - compounding credibility instead of repeating the same proof point verbatim. Separately, once initial interest is sparked, a crisp, direct follow-up from the sender's own CEO or a senior leader (not a junior rep) signals that an enterprise buyer is being taken seriously at their level - matching seniority to seniority is one of the simplest ways to raise reply rates on a second touch.`},
{p:'Frank Brothers', cat:'Follow-Up Strategy', src:'The Secret to Close Outbound Sales Opportunities', t:'A five-stage proof "drip" plan, and a 9-email cadence that stops only on reply', b:`Proof is staged rather than sent all at once: Stage 1 (first contact) sends one proof link plus LinkedIn connection requests; Stage 2 (after interest) sends the tailored template deck and a positive-replies folder; Stage 3 (before the first call) sends the strategy doc, a data table link, and a possible micro-service offer; Stage 4 (after the call) summarizes decisions and offers a client intro if needed; Stage 5 (final mile) shares one or two highly relevant case studies and confirms the start date. Alongside this, the default cadence is a nine-touch email sequence that continues until the prospect actually replies, paired with light LinkedIn touches and occasional short phone calls - three governing rules: persistent (continue until a clear yes or no), visible (show up across more than one channel), and always valuable (never a bare "just checking in").`},
{p:'Frank Brothers', cat:'Follow-Up Strategy', src:'Ultimate Guide to Clay', t:'Automate follow-up cadences off trigger events, not a fixed schedule', b:`Rather than following up on an arbitrary day-count, follow-up tasks and reminders can be scheduled off specific trigger events (a lead revisits the site, a target company raises funding, a job change happens), so outreach cadence responds to real buying-signal timing instead of a generic clock.`},
{p:'Frank Brothers', cat:'Follow-Up Strategy', src:'How to Get a Meeting with Anyone', t:'Plan a fixed multi-touch cadence with a second wave, and track progression stage', b:`Combine a set number of calls and emails over a defined window (e.g. several touches across one to two weeks), followed by a distinct second wave weeks later for anyone who didn't respond - treating non-response as a normal stage to plan for, not a dead end. A second-touch message can shift tone slightly (more direct, more playful) to break the pattern of being ignored. Rank every prospect on a simple ladder - unaware/indifferent, intrigued, committed, active advocate - and choose the next action based on that specific stage rather than repeating the same generic follow-up for everyone; a contact who's shown interest but stalled needs a different nudge than one who hasn't responded at all.`},


// ============ DELIVERABILITY & SENDING INFRASTRUCTURE ============

{p:'Eric Nowoslawski', cat:'Deliverability & Sending Infrastructure', src:'Top 10 Cold Email Tips That Give You an Unfair Advantage', t:'Avoid weekend sends; Tuesday-Thursday is strongest', b:`For B2B offers, Saturday/Sunday sends clearly underperform. Monday-Thursday is the best window overall, with Tuesday-Thursday performing even better - for a very small list, restrict to Tuesday/Wednesday/Thursday only. There's also a move toward cutting off sends after roughly 1pm on Fridays based on anecdotally declining lead flow late in the week.`},
{p:'Eric Nowoslawski', cat:'Deliverability & Sending Infrastructure', src:'Top 10 Cold Email Tips That Give You an Unfair Advantage', t:'Don’t overdo spintax copy variation', b:`Heavy spintax use (over 15 different variable variations) correlated with worse campaign performance in one dataset, while excellent/above-average campaigns used a lighter touch of around 5 copy-stream variations. Caveat: increasing spintax is still a standard fix when inbox placement starts degrading, so this shouldn't be read too literally as "avoid spintax" - it's about not overdoing it by default.`},
{p:'Eric Nowoslawski', cat:'Deliverability & Sending Infrastructure', src:'Cold Email First Principles Thinking', t:'Hot-swappable insurance infrastructure - kill dead inboxes, don’t rehab them', b:`Keep a parallel set of "insurance" inboxes warming up in the background so any burned inbox in your active pool can be swapped out immediately rather than repaired - ideal ratio is 1:1 (as many warming as active), with a minimum of roughly half as the fallback for high-volume senders. Disagree with the advice to let a burned inbox rest and recover - dead inboxes essentially don't come back in the current, much harsher spam-filtering environment. Kill the burned inbox immediately, promote an already-warmed insurance inbox into active rotation, and order a fresh domain to replace the insurance slot, keeping the same total monthly spend rather than paying to "wait and see."`},
{p:'Eric Nowoslawski', cat:'Deliverability & Sending Infrastructure', src:'Cold Email First Principles Thinking', t:'Domain age matters, and Outlook needs its own playbook', b:`Older domains consistently land better in the primary inbox than newly registered ones - one of the core levers for deliverability. For Outlook recipients specifically (where spam filtering has been unusually aggressive), noticeably shorter emails than the standard version produce better results. Most sending platforms let you restrict sends to Google inboxes only - leave this off by default to also hit Outlook/Proofpoint/Mimecast, and only turn it on for an established campaign showing deliverability problems or a brand-new campaign without momentum yet, turning it back off once relevant domains reach roughly 4-6 weeks of warm-up (since more aged domains get better Outlook responses too).`},
{p:'Eric Nowoslawski', cat:'Deliverability & Sending Infrastructure', src:"I sent 10,000,000 cold emails, here's what works in 2025", t:'Four-step framework for detecting a burned inbox', b:`Check in this order: (1) Reply rate - no out-of-office replies, no bounces, no negative replies, no leads at all suggests the inbox is burned (though this can also mean bad copy/list); treat under 1% reply rate as a campaign to pause and fix. (2) Bounce codes - "undeliverable/doesn't exist" just means bad list data, but "reported as spam," "message blocked," or a 550 error mean the domain is actually burned; feed unclear codes into an AI tool to interpret them. (3) Inbox reputation/warm-up score from your sending platform - below 100% means treat that inbox as burned, since a bad warm-up-pool score means real sales copy will also land in spam. (4) As a last resort, run open tracking for 2 days: expect roughly 60% open rate if landing in the primary inbox (Apple auto-opens most emails); cut any inbox only getting ~10% opens while keeping healthy ones.`},
{p:'Eric Nowoslawski', cat:'Deliverability & Sending Infrastructure', src:"I sent 10,000,000 cold emails, here's what works in 2025", t:'Sending volume baseline, and a slow-ramp technique for urgent starts', b:`Start around 30 emails per day per inbox as a baseline (others run 15-50 depending on risk tolerance and offer strength) - if a campaign is already converting well (e.g. a 2% response rate), it's reasonably safe to push from 30 to 50/day per inbox while monitoring for any metric drop-off. If you need to start sending immediately and can't wait 2-3 weeks for warm-up, don't blast the full inbox set at once (that's what a spammer does) - instead load up your inboxes but only send a handful per day (e.g. 5/day, roughly one per hour) from a small subset, ramping up gradually, while the rest of the batch warms up on the normal timeline.`},
{p:'Eric Nowoslawski', cat:'Deliverability & Sending Infrastructure', src:"I sent 10,000,000 cold emails, here's what works in 2025", t:'Stagger domain-warmup cohorts, and buy domains cheap to age in advance', b:`Domain aging matters increasingly - keep staggered batches of inboxes warming for different lengths (2 weeks, 4 weeks, 2 months), since inboxes that warm for less time burn out faster; one Fortune-1000-focused client launched after 4 weeks of warm-up and still got poor placement, which only improved once those domains reached about 6 weeks. Since domains are an annual cost but inboxes are monthly, buy domains cheaply during registrar sales well before you need them and let them sit and age for months unused - so when existing domains burn out, already-aged replacements are ready to activate instead of paying full price for brand-new ones. Domain "look" matters less than people assume beyond avoiding an obviously low-quality one - even generic, 30-character-long domains have produced positive replies in test campaigns.`},
{p:'Eric Nowoslawski', cat:'Deliverability & Sending Infrastructure', src:'Focus on Offers Made To Convert Cold Traffic', t:'Keep half your sending capacity in warm-up, and fix missing DMARC', b:`As a standing operational rule, at least 50% of total sending capacity stays in warm-up at any given time, so there's always a reserve of fully-warmed inboxes ready to rotate in. Separately, a domain without an enabled DMARC record tends to have its outgoing emails land straight in spam - turning DMARC on is roughly a five-minute fix, and also a useful "solution-unaware" personalization angle since most prospects don't know they have the problem.`},

{p:'Matt Lucero', cat:'Deliverability & Sending Infrastructure', src:'START HERE / Video 1 & 2 (batch 3)', t:'Reading reply rate as a deliverability diagnostic', b:`If a campaign gets close to zero response of any kind - not even an angry "stop emailing me" or an out-of-office - that's a strong signal the emails aren't reaching inboxes at all, most likely bad domain/account setup or a low-quality sending tool, rather than a messaging problem. As a rule of thumb, across 10,000 emails sent you should see on the order of 100 replies (~1%); a 0.1-0.2% reply rate is a clear deliverability-crisis threshold, where the fix is more accounts and cleaner setup (SPF/DKIM/DMARC, list validation) rather than rewriting copy first. Watch for a reporting trap too: some tools report reply rate as a percentage of opens rather than of emails sent, which can make an actual ~0.15% reply rate look like a less-alarming 0.5%.`},
{p:'Matt Lucero', cat:'Deliverability & Sending Infrastructure', src:'START HERE', t:'Identical templated emails start hard-bouncing at scale', b:`Somewhere around 2,000-4,000 emails/day, sending the same templated email (or near-identical copy) without proper randomization gets picked up by spam filters at companies like Google and Microsoft, causing emails to bounce before they even reach the spam folder - not just land in spam, but fail to deliver at all. The fix is building randomization ("spin tax") into every send, applied consistently across all sending as a baseline practice, not a one-off trick, so no two emails read as identical.`},
{p:'Matt Lucero', cat:'Deliverability & Sending Infrastructure', src:"i sent 600,000 cold emails and learned this", t:'Domain/account structure differs by mailbox type', b:`Best practice differs by infrastructure: for Google-style setups, spread sending across many domains with one email account per domain (his test used 246 domains, 1 account each); for Microsoft/Azure-style setups, use fewer domains with many accounts on each (42 domains with 50-52 accounts apiece). Applying the wrong ratio to the wrong platform type undercuts deliverability. Also spread domain purchases evenly across TLD types (.com, .org, .info) through one registrar rather than concentrating on a single extension, to avoid patterns that could flag the whole batch.`},
{p:'Matt Lucero', cat:'Deliverability & Sending Infrastructure', src:"i sent 600,000 cold emails and learned this", t:'Reading platform test data carefully: hidden buckets, timing artifacts, and stability signals', b:`SmartLead routed a disproportionate number of genuine replies into an "untracked replies" section that doesn't count toward its official reply-rate metric, making its raw numbers look artificially worse than competitors - check whether a platform has a secondary/hidden reply bucket before trusting its built-in stat. Instantly's faster sequencing pace pushed disproportionately more volume into a bad sending window (December holidays) in one test, inflating negative replies and making it look like worse deliverability when it was really a timing artifact - separate send-speed/timing effects from actual list or copy quality when comparing platforms. Disconnect counts (SmartLead ~73, Instantly ~13, PlusVibe 0 in one test) are a stability signal worth watching independent of reply-rate numbers.`},
{p:'Matt Lucero', cat:'Deliverability & Sending Infrastructure', src:"i sent 600,000 cold emails and learned this / How To Generate Leads With Cold Email in 2026 (FULL COURSE)", t:'Tool choice barely matters among reputable platforms - avoid self-hosted and sketchy tools', b:`Any established, name-brand cold email platform or mailbox provider performs similarly once every other variable is controlled, so don't overthink tool selection - the one caveat is that unproven, sketchy tools outside the reputable set can still produce meaningfully worse deliverability. Avoid self-hosted VPS mail servers, since running your own server makes you solely responsible for IP reputation and a degrade can mean a full rebuild from scratch; use Google Workspace or Microsoft 365 instead, since they manage IP reputation on your behalf and blend your activity into the broader pool of legitimate traffic. Use dedicated cold-email sending tools (SmartLead or Instantly, not Mailchimp/HubSpot/ZoomInfo, which prohibit cold outreach or lack rotating-inbox/spintax features), and require a tool with a rotating inbox structure and built-in warm-up with no per-inbox pricing penalty.`},
{p:'Matt Lucero', cat:'Deliverability & Sending Infrastructure', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'Horizontal scaling: many inboxes at low volume beats one at high volume', b:`Deliverability limits work like an invisible, ever-changing speed limit - providers never publish an exact safe daily cap, so the faster (higher volume) you go per inbox, the higher the chance of getting "pulled over" (flagged). Instead of pushing a large volume from a single account, spread the same total volume across many domains and inboxes, each sending a small number per day, to mimic normal human sending behavior. Rule-of-thumb caps: 20-35 cold emails per inbox per day (some go to 50, don't go to ~100), and 1-3 email accounts per domain (some use up to 5). To size infrastructure, divide your target daily volume by ~20-25 emails per account per day (e.g. 10,000/day / 25 = ~400 accounts), then overshoot - provision up to 2x the calculated requirement as a buffer.`},
{p:'Matt Lucero', cat:'Deliverability & Sending Infrastructure', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'Domain/account setup mechanics: naming, DNS, warm-up, aging', b:`Build sending domains as variations of your main domain using prefixes/suffixes (e.g. "getxyzmarketing.com" for "xyzmarketing.com"), vary the sender username across accounts (Joe@, Joseph@), and point sending domains back to your main brand domain so they resolve credibly if a prospect looks one up. Configure SPF, DKIM, DMARC (and MX) records on every sending domain - a baseline deliverability requirement, usually configured via your registrar or walked through automatically by Google/Microsoft. Warm up every account for at least 14 days before sending and never turn warm-up off, even once live, and keep a roughly 1:1 warm-up-to-cold-email ratio per account. Age domains before heavy use - older domains carry more inherent trust. Adding profile pictures to Google-hosted accounts specifically (Google displays them network-wide, Microsoft doesn't) is a soft trust signal worth the effort.`},
{p:'Matt Lucero', cat:'Deliverability & Sending Infrastructure', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'Use spintax to avoid sending identical emails at scale', b:`Spintax lets your sending tool randomly rotate between word/phrase variants so no two sent emails are byte-identical, helping avoid detection as automated bulk sending - a template with just a handful of spintax slots can produce dozens to hundreds of unique variations. Spintax formatting syntax differs between sending tools, so check your specific tool's documentation.`, ex:`"{hi|hello|hey}, I {found|saw|came across} your Instagram account..."`},
{p:'Matt Lucero', cat:'Deliverability & Sending Infrastructure', src:'Video 1 & 2 (batch 3)', t:'Sending volume is an unposted speed limit - and targeting accuracy is a deliverability lever, not a separate problem', b:`Google publishes a 2,000-emails/day cap per account, but nobody should actually approach that - sending obnoxiously high, irrelevant volume gets you "pulled over" (flagged) faster than modest, relevant sending, even with no exact limit posted anywhere. Personal recommended caps: one inbox per domain if possible, two as a firm ceiling (more mailboxes per domain increases problems); roughly 10-20 sends per inbox/day with a sweet spot around 15, flexing higher with a strong offer or lower if it's not resonating. Half of the deliverability problems seen aren't exotic technical failures - they're unvalidated emails, missing DMARC, or janky providers - but the single biggest lever is simply not sending irrelevant emails to the wrong people, since spam complaints (not raw volume) are what actually trigger providers to penalize you; a false claim about the recipient (e.g. "I saw you run an e-commerce store" to someone who doesn't) directly drives the spam reports that hurt reputation.`},
{p:'Matt Lucero', cat:'Deliverability & Sending Infrastructure', src:'Video 2 (batch 3)', t:'Check your warm-up score, keep a backup pool, and diversify providers', b:`Modern sending tools show the percentage of simulated warm-up emails landing in spam - if more than roughly 5% land in spam, real cold emails are very likely landing in spam too, since warm-up emails are designed to be about as deliverability-friendly as possible. If you're running 50 sending accounts, prepare another 50 in reserve so a burned/flagged account can be swapped for an already-warming replacement immediately - active rotation strategies are logistically heavy and not recommended over a simple backup pool. Diversify sending providers instead of going 100% one platform (a mixed 70/30 or 50/50 Google/Microsoft split is reasonable) for risk reduction and to help diagnose provider-specific problems. The deliverability "dos" checklist: reputable ESPs, low volume per account/domain, list validation, proper DNS records, and a full 14+ day (ideally 21+ day) warm-up - older/more-aged accounts consistently perform better.`},
{p:'Matt Lucero', cat:'Deliverability & Sending Infrastructure', src:'Video 2 (batch 3)', t:'Smartlead-specific tactical settings, and treating testing tools as directional', b:`Space sends across the full window (20-30 minute gaps rather than the ~7-minute default) to look less automated; disable "email auto-adjust warmup"; aim for close to a 1:1 cold-to-warmup ratio per account; use spintax in signatures as well as copy; use the platform API for automation; and consider ESP matching (Gmail-to-Gmail, Outlook-to-Outlook sends), which has anecdotally performed better without a rigorous split test. Treat seed-inbox deliverability testing tools ("Smart Delivery"-style) as directional, not gospel - real inboxes can behave very differently (a company's internal IT team can set custom spam-filter rules a seed test won't reflect), so trust live campaign results over a test tool's prediction. If live reply rate is unexpectedly low despite a good deliverability-test score, spin up a batch of brand-new accounts (e.g. 20) and split-test them against existing accounts on the same campaign - if the new accounts perform better, it's an infrastructure/reputation issue; if the same, the problem is copy or list quality. Outlook/Microsoft inboxing is a genuinely moving target not worth over-investing in reverse-engineering - the most consistent lever seen for Outlook specifically is simply shortening the email copy.`},

{p:'Frank Brothers', cat:'Deliverability & Sending Infrastructure', src:'Inbox Engineering', t:'Deliverability rests on two pillars: copy and infrastructure', b:`Replies, forwards, and other positive engagement signals actively build sender reputation over time, while complaints, hard bounces, and a detectable "mass-template footprint" actively damage it - this framing justifies almost every infrastructure and copy rule in the book. Default to plain text only (no images, attachments, or links, the most common deliverability liabilities), but let an A/B test overrule the default: if adding a link or image drops inbox placement ~10% but lifts reply rate ~30%, keep the version with the added element, since net replies is the only real judge, not inbox rate alone. Avoid template fingerprints through true variability - a template with only the first name swapped in creates a detectable footprint even without spam keywords, so lean less on simple spintax and more on AI-generated variants that rewrite each email's wording while preserving the same structure and offer.`},
{p:'Frank Brothers', cat:'Deliverability & Sending Infrastructure', src:'Inbox Engineering', t:'The Active / Reserve / Recovering fleet model', b:`Per client, run two equally sized inbox fleets: "Active" (currently sending) and "Reserve" (fully warmed, ready, not sending) - a third bucket, "Recovering," holds any inbox currently resting and rebuilding its health score. Active and Reserve fleets must never share domains, so a problem in one can't contaminate the backup. Health-score thresholds define the bucket: only inboxes at 95%+ can be Active; Reserve must sit at a full 100% (capped at 0 daily sends); any Active inbox that drops below 95% moves immediately to Recovering (also capped at 0 sends) until it climbs back to 100%. Default to 3 inboxes per registered domain at scale (2 for cautious starts), and pair every Active inbox with a matching warmed Reserve backup, since entire domains or fleets can be throttled without warning. Alert when Reserve capacity falls below 15% of the total fleet, so new domains/inboxes get provisioned before capacity actually runs out.`},
{p:'Frank Brothers', cat:'Deliverability & Sending Infrastructure', src:'Inbox Engineering', t:'Provider split, bounce cap, and volume ramp', b:`Split sending roughly 75% Google-hosted / 25% Microsoft/Outlook, spread across multiple inbox resellers - Outlook tends to underperform Google, so segment toward Google-only for a period if Microsoft sending turns sour. Cap bounce rate below 3% using a two-tool validation stack (one tool for general list validation, a second specifically for catch-all addresses standard validators can't reliably score) - if any sender's bounce rate hits 3%, pause it immediately and re-validate the affected list segment. Hold daily volume at ~20/inbox and only ramp after 60 clean days, and even then only to 25-30/day - never cross 30/inbox/day. Warm every new domain/inbox a minimum of 30 days before real sending, since modern spam filters specifically flag domains younger than 30 days.`},
{p:'Frank Brothers', cat:'Deliverability & Sending Infrastructure', src:'Inbox Engineering', t:'Onboarding sequence, triage playbook, and a daily/weekly/monthly cadence', b:`Standard new-client setup: estimate the daily target volume, build two equal Active/Reserve fleets sized to it, register non-overlapping domains and warm them 30+ days, create inboxes at 2-3 per domain tagged Reserve, configure warm-up and health tracking, then promote enough Reserve inboxes to Active once warm-up completes. When replies/opens suddenly drop, move affected inboxes to Recovering, backfill from Reserve, and re-validate the targeted leads rather than waiting it out; if a warm-up score is stuck below 95%, it was pushed too aggressively - hold it at 0 sends/day longer than usual and reduce the future ramp target back to 20/day once reactivated. Recommended cadence: daily - health scan, move sub-95% inboxes to Recovering, backfill Active from Reserve, confirm Reserve is 15%+; weekly - launch/conclude a copy test, review bounces and refresh the list, review the Google/Microsoft split; monthly - warm new domains, retire tired copy, audit DNS records and reseller performance.`},
{p:'Frank Brothers', cat:'Deliverability & Sending Infrastructure', src:'Inbox or Bust', t:'Domain buying rules: .com only, age 3+ weeks, small staggered batches', b:`Stick exclusively to .com domains - mailbox providers and recipients trust .com far more than newer TLDs like .io or .ai, which are disproportionately abused by spammers. Age a freshly purchased domain a minimum of three weeks before any activity - sending from a brand-new domain immediately is an instant red flag. Buy domains in small batches of 3-5 at a time, staggered across several days, rather than one large bulk purchase that looks like stocking up for mass spam. Redirect every new domain to the main site so it looks like a legitimate, connected part of the business rather than a disposable throwaway.`},
{p:'Frank Brothers', cat:'Deliverability & Sending Infrastructure', src:'Inbox or Bust', t:'Inbox density, provider mixing, and DNS records explained', b:`Cap each domain at 2 inboxes, and cap each inbox at 25-30 emails a day including follow-ups (not on top of it) - exceeding that range meaningfully raises flagging odds. Scale volume linearly, never in a sudden blast, and diversify inbox types (Google, Outlook, SMTP) so one ecosystem's policy change can't take down the whole operation - matching the sending provider to the recipient's provider (Gmail-to-Gmail, Outlook-to-Outlook) also improves deliverability. Delegate DNS setup to your inbox provider if you're non-technical, rather than hand-configuring records without expertise. In plain terms: SPF tells mailbox providers which servers are authorized to send for your domain; DKIM adds a cryptographic signature proving a message wasn't tampered with in transit; DMARC is the policy layer that tells inboxes what to do when SPF/DKIM checks fail (block or quarantine), which is what actually protects a domain from being spoofed. Once a domain is sufficiently aged, adding BIMI lets your logo display next to your emails as a visual trust signal.`},
{p:'Frank Brothers', cat:'Deliverability & Sending Infrastructure', src:'Inbox or Bust', t:'Warm-up mechanics: 30-day minimum, escalating volume, and tool quality checks', b:`Inboxes need a 30-day minimum of automated warm-up activity before genuine outbound campaigns, with daily volume auto-escalating from around 5/day up past 20/day rather than jumping straight to a target - the gradual curve mimics normal usage and avoids the spike behavior that trips spam detection. Getting positive replies flowing to a warming inbox, even simulated ones, signals to Gmail and Outlook that its mail is wanted. Many older warm-up tools stopped working effectively after a Google policy update - if everything's landing in spam, the warm-up tool itself is a likely suspect; only tools that genuinely send and reply between real inboxes build reputation, versus tools that just bait messages into a spam folder for engagement.`},
{p:'Frank Brothers', cat:'Deliverability & Sending Infrastructure', src:'Inbox or Bust', t:'Day-to-day sending hygiene: timing, rotation, and list pruning', b:`Randomize send intervals (every 7 or 13 minutes rather than a clean schedule) and vary the overall daily send time day to day, since perfectly regular timing gets flagged as automated. Rotate each inbox weekly between outreach, warm-up, and rest, rather than concentrating pressure on any single inbox. Clean hard bounces from lists every week. Suppress contacts who haven't opened any email in 60-90 days rather than trying to "re-engage" indefinitely, since continuing to email a low-engagement segment is itself a spam signal to providers. Wire spam complaints to a webhook that automatically strips the complaining contact from future sends in real time.`},
{p:'Frank Brothers', cat:'Deliverability & Sending Infrastructure', src:'Inbox or Bust', t:'Bounce/reply thresholds for pulling an inbox, and the 40% cold-outreach cap', b:`A bounce rate above 5% signals a list-quality problem - run the list through a multi-step "verification waterfall" before it's ever used again. Retire (pull and replace) any single inbox whose bounce rate exceeds 5% or whose reply rate falls under 0.5%. Keep a standing queue of already-aged backup domains ready to deploy, rather than scrambling to buy and age new ones reactively when one gets blacklisted. Keep genuine cold outreach under 40% of an inbox's total daily volume, with the rest made up of warm-up/low-risk sends - their worked example: of 50 total daily emails, 30 should be warm-up traffic and only about 20 actual cold outreach.`},
{p:'Frank Brothers', cat:'Deliverability & Sending Infrastructure', src:'1M Frank eBook', t:'Repetition and over-following-up are deliverability risks, not just tone problems', b:`Reusing the same winning message indefinitely eventually gets it flagged by spam filters - one of two explicit reasons (alongside prospect fatigue) to keep testing and rotating variants even after finding a message that performs well. Sending more than roughly 3 follow-ups per prospect is flagged as a risk to domain and sending reputation specifically, not just a tone issue. Faking a reply/forward thread with "Re:" or "Fwd:" is an instant, unrecoverable trust-breaker once discovered - and this kind of manipulative subject-line pattern is exactly the type of thing spam and trust filters are tuned to catch. When deliverability is genuinely constrained, strip the message to near-zero sales language (the Subject-Line-Message format is the go-to example), since inbox placement systems key off sales-like structure as much as spam-trigger words.`},
{p:'Frank Brothers', cat:'Deliverability & Sending Infrastructure', src:'The Ultimate 3-Step Cold Email Sequence', t:'Force linguistic uniqueness across every AI-generated send', b:`Because each email in a sequence is generated independently at scale, require the AI to vary wording, phrasing, sentence structure, greetings, and transitions on every single output while preserving the same core message, offer, and CTA - specifically to prevent inbox providers from pattern-matching near-identical emails as bulk sends. The generation rules also explicitly forbid em dashes and corporate buzzwords, since these small stylistic markers make bulk-generated or salesy copy easier to spot, both for spam filters and human readers.`},
{p:'Frank Brothers', cat:'Deliverability & Sending Infrastructure', src:'24 Business Learnings in 24 Months', t:'Set up real-time alerts for failures', b:`Building automatic alerts that fire the moment something breaks - rather than discovering it later - catches small problems before they compound. Applied to outbound specifically: monitor sending health (bounce spikes, spam complaints, domain issues) in real time so a campaign can be paused before it damages sender reputation, instead of finding out after the damage is done.`},


// ============ VOLUME, TESTING & METRICS ============

{p:'Eric Nowoslawski', cat:'Volume, Testing & Metrics', src:'Top 10 Cold Email Tips That Give You an Unfair Advantage', t:'Reply-rate benchmark tiers (contacts needed per positive response)', b:`Based on a year of campaign data: Excellent = 150 contacts or fewer per positive response; Above Average = roughly 150-400; Average = roughly 450-800; Below Average = roughly 800-1,200; Poor = over 1,200. These thresholds have risen versus what was considered "good" a couple of years earlier, and should be adjusted further based on your LTV:CAC ratio and TAM size rather than treated as fixed targets.`},
{p:'Eric Nowoslawski', cat:'Volume, Testing & Metrics', src:'Top 10 Cold Email Tips That Give You an Unfair Advantage', t:'Mine your own historical campaign data with AI for insights', b:`A year of campaign results loaded into a database with roughly 30 AI sub-agents run against it to surface patterns - a repeatable technique for auditing your own account's historical performance with AI rather than relying purely on gut feel or small-sample anecdotes.`},
{p:'Eric Nowoslawski', cat:'Volume, Testing & Metrics', src:"I sent 10,000,000 cold emails, here's what works in 2025", t:'Only test sentence-level or bigger changes', b:`A test variant needs to differ by at least a full sentence, and ideally by a meaningful structural change (e.g. pain-based versus benefit-based value proposition), not a minor word swap. Comparing something like "is this worth a chat?" versus "would you be open next week?" is unlikely to show any statistically meaningful difference and isn't worth isolating as its own test.`},
{p:'Eric Nowoslawski', cat:'Volume, Testing & Metrics', src:"I sent 10,000,000 cold emails, here's what works in 2025", t:'Three failure modes, and the leading indicators to track', b:`An outbound campaign can only underperform for three reasons: the copy itself is weak, you're not sending enough volume of "email one" specifically (the first email in a sequence is the top performer across all customer sequences), or your inboxes/domains have gotten burned (rising bounces, spam flags). To catch these early, track a baseline reply-rate threshold that triggers a campaign review if breached, the volume of net-new emails being sent, and automated inbox-reputation tracking so burned inboxes get rotated out quickly - these are the leading indicators to watch instead of waiting for pipeline results to visibly drop.`},
{p:'Eric Nowoslawski', cat:'Volume, Testing & Metrics', src:'Past Mistakes We Made w/ Email Personalizations', t:'Kill a backfiring campaign fast', b:`When a risky joke campaign generated real complaints from recipients who felt insulted, the whole campaign was shut down after just two days rather than waiting to gather a fuller data set, since the negative sentiment from the segment that hated it clearly outweighed the modest positive lift from the segment that liked it.`},

{p:'Matt Lucero', cat:'Volume, Testing & Metrics', src:'START HERE: How to Run Cold Email for Any Business', t:'Rough benchmark: ~3,000 emails per booked meeting, and why', b:`Aggregating data across many verticals, the average figure is around 3,000 emails sent to get one meeting booked - roughly 1,000 unique people once you factor in 3-4 follow-ups each, of which maybe five respond as interested (about one interested reply per ~200 people reached). This tracks with the broader stat that only about 3% of any market is actively in-market to buy at a given time. Frame required volume the way you'd frame any channel - roughly 1 in 5,000 billboard viewers actually remembers it, and it can take 1,000-10,000 Facebook impressions for one click - expecting a handful of emails to reliably produce a meeting is unrealistic. There's huge variance by niche though: some audiences convert off 100 emails to 20 people, others need tens of thousands.`},
{p:'Matt Lucero', cat:'Volume, Testing & Metrics', src:'START HERE: How to Run Cold Email for Any Business', t:'Test a new niche by sending, not predicting - and expect response rates to soften as you scale', b:`There's no reliable way to predict whether an untested niche will work in a vacuum - you either send to it directly or find someone who's already tested something similar recently, since markets change over time. As you push daily volume higher, you eventually exhaust the audience segments most in-market for you and have to expand into broader, less-qualified segments (like ad-audience fatigue on Facebook) - keep testing new audience slices as you scale rather than assuming the same performance holds at 10x volume.`},
{p:'Matt Lucero', cat:'Volume, Testing & Metrics', src:"i sent 600,000 cold emails and learned this", t:'How to run a rigorous internal test - and how to read the results honestly', b:`To fairly compare tools (or any variable), control for: fresh email accounts not mixed with production sending, randomized lead lists, identical email copy, identical warm-up periods, and identical sending windows across every group compared. Don't chase small percentage differences (1-5%) between campaigns or tools - at large scale, even a ~30% variance can fail to be statistically significant and may just reflect random noise, so run a statistical significance calculator before declaring a winner. Build a separate scoring pass to isolate genuine human replies from automated out-of-office replies, since raw reply counts get inflated by the latter. And document a test's flaws (seasonal timing bias, inconsistent warm-up between platforms, a single offer/copy tested) rather than presenting results as a definitive ranking.`},
{p:'Matt Lucero', cat:'Volume, Testing & Metrics', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'Rough funnel conversion ratios, and how a sequence distorts "volume"', b:`General benchmarks: roughly 100-200 emails sent to generate one reply; roughly 1 in 5 replies is genuinely interested; roughly 1 in 5 of those interested replies converts into a booked call. Adding a calling channel to email follow-up can push interested-to-meeting conversion from roughly 20-30% up toward 50%. Remember that "emails sent per day" overstates new outreach in a multi-step sequence - a 5-step sequence sending 500/day may represent only about 100 actual net-new people contacted, since the rest is follow-ups to existing contacts; account for this when sizing your list.`},
{p:'Matt Lucero', cat:'Volume, Testing & Metrics', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'Split-test what moves the needle, and judge winners by meetings and deals', b:`Prioritize testing the CTA, the value proposition, the personalization approach, or the target audience/segment - these produce meaningfully different results. Subject lines, by contrast, have only a small effect and aren't worth the testing effort. Open rates, reply rates, and even raw "interested" counts can be misleading, since a bait-and-switch-style campaign can generate lots of interested replies that never convert into real pipeline - the only metrics that should decide which version of a test "wins" are meetings booked and deals closed. A bare minimum of about 500 emails/day is generally needed to reliably hit 30 booked meetings a month (assuming the rest of the system is dialed in); once you know your specific conversion ratios (e.g. "1 meeting per 500 emails"), you can directly calculate the volume needed for any target, turning the system into a predictable dial.`},
{p:'Matt Lucero', cat:'Volume, Testing & Metrics', src:'Video 1 (batch 3)', t:'Track four core KPIs, calculated the honest way', b:`The exact framework used in customer onboarding: total emails sent, the percentage that reply (calculated off emails sent, not "leads contacted" - many tools calculate against unique leads contacted, which inflates the number when running multiple follow-ups), the percentage of repliers who are actually interested, and the percentage of interested people who book a call. Rough benchmarks: 1-2% reply rate on total sends (can legitimately run under 1% for enterprise outreach); 5-15% of replies reflecting genuine interest; 20-30% (range 15-50%) of interested people converting to booked meetings. These benchmarks are directional, not a hard failure test - missing one isn't proof of a giant problem; look for alignment on at least 2 of the 3 reply-based benchmarks to know where to focus troubleshooting (sending volume is deliberately excluded from this "2 of 3" check since target volume depends on your goals).`},
{p:'Matt Lucero', cat:'Volume, Testing & Metrics', src:'Video 1 (batch 3)', t:'Volume is the single highest-leverage, most disproportionate lever', b:`The most common reason people fail is sending far too few emails (100-500/day) and then wondering why they get no pipeline - to get more than about 5 meetings/month, you likely need to send thousands per day; the recommended baseline for "dipping a toe in" is 1,000 emails/day. Rule-of-thumb math: roughly one scheduled call per 2,000-3,000 total emails sent (varies by sequence length and offer) - useful for simple goal-setting, e.g. wanting 10 calls/month at a 2,000-emails-per-call rate implies sending about 20,000 emails/month, or roughly 1,000/day.`},

{p:'Frank Brothers', cat:'Volume, Testing & Metrics', src:'1M Frank eBook', t:'Benchmark performance figures, and Message Market Fit (MMF)', b:`One stated benchmark for strong performance at scale: around 300k outreach messages per month across 25+ industries (plus another 20-30k for internal testing), converting at roughly 1 lead per 195 messages sent, against a stated industry average of 1 lead per 350. The underlying process - Message Market Fit - means testing a wide variety of templates and angles against a specific audience until one clearly resonates, but never stopping testing even after finding a winner, both because repeated use of one message trains spam filters against it and because the market becomes desensitized to any overused message ("copy fatigue").`},
{p:'Frank Brothers', cat:'Volume, Testing & Metrics', src:'1M Frank eBook', t:'Relentless A/B testing as a standing discipline', b:`Multiple templates explicitly instruct ongoing A/B testing rather than "set and forget," including testing different CTA phrasing, testing different fictional award names by industry for the Acceptance Speech template, and testing whether including a CTA at all outperforms omitting one entirely. For pain-surfacing formats like Poke the Bear, test adding an additional hedge-and-infer line ("I could be wrong, but this could mean...") against the bare question, rather than assuming either version is universally stronger.`},
{p:'Frank Brothers', cat:'Volume, Testing & Metrics', src:'Inbox Engineering', t:'A defined testing plan: opener style, length, CTA, and send windows', b:`Concrete testing variables worth running head-to-head: an opening line built around a timely trigger event versus one built around simply addressing the recipient's role; a short email of roughly 40-70 words versus a longer one of 90-120 words; exact CTA wording (a one-word reply ask versus a softer question-style ask); and which days of the week and local send times produce the best combination of inboxing and replies for a given list.`, ex:`"reply yes" vs "worth a look?"`},
{p:'Frank Brothers', cat:'Volume, Testing & Metrics', src:'Inbox Engineering', t:'Testing methodology, and judging by inboxed replies', b:`Isolate a single variable at a time rather than changing several elements at once, run each variant against leads of comparable quality and similar company size for a fair comparison, and run tests until reaching a statistically meaningful sample size - ideally thousands of sends, or at minimum a full week of consistent sending - before drawing conclusions. Never optimize for open rate alone; the deciding metric is inboxed replies - if a variant technically hurts raw deliverability but produces a larger net gain in replies, that variant is the winner.`},
{p:'Frank Brothers', cat:'Volume, Testing & Metrics', src:'Inbox Engineering', t:'Five core metrics to track continuously', b:`Inbox health / warm-up score (target 95-100% for Active inboxes), bounce rate (target under 3% per sender), complaint rate (as close to zero as possible, with every "report spam" event reviewed), reply rate (tracked separately by provider - Google vs. Microsoft - and by copy variant), and volume stability (whether total daily first-touch sends are matching planned capacity).`},
{p:'Frank Brothers', cat:'Volume, Testing & Metrics', src:'The Cold Outreach Phrasebook', t:'Validate phrasing through high-volume live testing, not guesswork', b:`Back phrase choices with real send volume - 300,000+ messages a month for clients, plus more for internal pipeline - and run 10 new campaigns per new client in the first month specifically to iterate fast and see which phrases resonate versus flop. Don't trust "sounds good to me" for wording - treat phrasing as a testable variable at volume.`},
{p:'Frank Brothers', cat:'Volume, Testing & Metrics', src:'Making Cold Outreach Funny', t:'Score humor campaigns by positive reply rate after 100 sends', b:`A simple threshold after a batch of 100 sends: above 3% positive replies means scale the joke, 1-3% means iterate on it, below 1% means cut it entirely - turning "is this joke working" from a feelings question into a numbers question. When testing humor specifically, A/B test the opening line only rather than changing multiple parts at once, cap jokes at one per email so results are attributable, and track opens, positive replies, and meeting rate - not just opens. Keep a running list of best-performing jokes and rotate them rather than reusing one indefinitely.`},
{p:'Frank Brothers', cat:'Volume, Testing & Metrics', src:'The Secret to Close Outbound Sales Opportunities', t:'Name your test priorities and reporting cadence up front, in writing', b:`The strategy doc built for a serious prospect names which strategies/angles will be tested first and the reasoning behind that prioritization, rather than testing everything simultaneously with no stated order - and commits to weekly measurement targets and a defined way of reporting progress against them, making performance tracking part of the pitch itself rather than something negotiated after signing.`},
{p:'Frank Brothers', cat:'Volume, Testing & Metrics', src:'14 Lessons to $1m ARR / 24 Business Learnings in 24 Months', t:'Prioritize reps over theory, and fixate on real ROI', b:`Mastery isn't reached through reading alone - it requires starting before you feel ready, emphasizing volume of real attempts over polish, and iterating relentlessly, since each flawed attempt is still a step toward proficiency faster than waiting for the "right" moment. Once something is proven to work, write the steps down immediately (an SOP) so anyone on the team can repeat it - but don't build a process for a problem you haven't proven exists yet; test the idea for real first. And fixate on real ROI, not surface-level ROI - vanity metrics look impressive but don't pay bills, so chase the actual money reaching the door rather than numbers that merely look good in a report.`},
{p:'Frank Brothers', cat:'Volume, Testing & Metrics', src:'How to Get a Meeting with Anyone', t:'Test in small batches against your own best-performing version', b:`Treat each new message or creative angle as a challenger to the previous best result (a "control"), testing in small rounds (e.g. batches of ten) and evaluating before scaling further. Success is measured less by raw response volume than by response rate combined with the value of each conversion - a low response rate can still be a huge win if the deals it produces are large enough.`},


// ============ OBJECTION HANDLING & REPLIES ============

{p:'Matt Lucero', cat:'Objection Handling & Replies', src:'START HERE / How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'Diagnose "barely any replies" by which kind of reply is missing, and categorize the rest', b:`If a campaign gets close to zero replies of any kind - not even an angry "stop emailing me" or auto-reply - that points to a deliverability problem, since the emails likely aren't reaching inboxes. If replies are coming in but few are actually interested, the more likely culprits are messaging, targeting/list quality, or simply not enough volume to see signal (100 total emails is too small a sample to conclude "nothing works"). Tag every incoming reply immediately as interested, not interested, out of office, or do-not-contact as soon as it arrives - most sending tools support this, and some auto-categorize using built-in AI, saving significant manual triage time.`},
{p:'Matt Lucero', cat:'Objection Handling & Replies', src:'START HERE / How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'The three-step reply framework: answer, bridge, propose times', b:`When a prospect replies with a question ("what's your price?", "send more info"): (1) actually answer their question directly - ignoring it kills the chance they'll book; (2) bridge that answer into a reason to get on a call (e.g. give a rough price range, then explain a call gets them a custom number); (3) immediately propose two specific call times, ideally in their time zone, so their reply is just a confirmation. Repeat this same loop on each subsequent exchange rather than letting the conversation drift into open-ended back-and-forth - the single biggest mistake in reply handling is failing to actually offer specific times, which leaves the conversation stuck with no natural path to a booked call. Response speed also materially affects booking rate - the faster you reply to an interested lead, the more likely they are to actually book.`},
{p:'Matt Lucero', cat:'Objection Handling & Replies', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'Most replies won’t be interested - don’t waste effort convincing them, but a real objection is worth one more try', b:`The majority of responses to any cold campaign will be negative or neutral - don't spend energy trying to argue skeptical or disinterested people into a meeting, since conversion from "not interested" to booked is rare; focus effort on genuinely positive replies instead. Occasionally, though, a reply marked "not interested" actually contains a specific, answerable objection (e.g. skepticism about a stated result) rather than outright disinterest - in these cases it can be worth directly addressing the objection, agreeing with the reasonable part of their skepticism, and pivoting to a low-commitment next step rather than writing the lead off automatically.`},
{p:'Matt Lucero', cat:'Objection Handling & Replies', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'Keep pricing objections open-ended, and don’t over-rely on templates', b:`When a prospect pushes on price, describe pricing as variable/range-based (since offerings differ in scope) rather than anchoring to one fixed number, keeping the door open to tailor the eventual pitch instead of getting rejected on a number stated too early. Pre-built reply templates are useful for speed, but most real replies have deeper nuance a template alone won't fully address - don't outsource replies to someone who just pastes templates without actually reading and thinking through each specific question.`},
{p:'Matt Lucero', cat:'Objection Handling & Replies', src:'Video 2 (batch 3)', t:'Reread your own email as the recipient and preempt every objection', b:`Go back through your draft pretending you're the person receiving it, list every objection that would come to mind (e.g. "I don't believe this," "I don't trust you can get this result"), and edit the copy to build credibility or address that specific doubt.`, ex:`For a VA-selling business: "do they actually speak English well, can they really do my tasks?"`},
{p:'Matt Lucero', cat:'Objection Handling & Replies', src:'Video 2 (batch 3)', t:'Don’t add qualifying friction inside the email/CTA flow - filter earlier instead', b:`When reply volume is high but full of unqualified leads, avoid adding pre-screening forms or heavy qualifying questions directly in the outreach - it feels like a bait-and-switch, like knocking on someone's door with an offer and then demanding they fill out a 10-page form before you'll honor it. Better fixes: tighten filters earlier at the list-building stage (e.g. use headcount or revenue-per-employee benchmarks instead of unreliable self-reported revenue fields), or pay a dedicated person to do live call screening instead.`},

{p:'Frank Brothers', cat:'Objection Handling & Replies', src:'Frank Collective Outbound Lessons Doc / 55 Cold Email Copywriting Cheat Codes', t:'De-risk the mental lift before an objection can even form', b:`Proactively name and defuse the friction a reader would otherwise raise as an objection - that it's a big change, a big lift, or a big time investment - before they have to raise it themselves. Stating the low cost or effort upfront removes the objection from the conversation entirely rather than requiring you to handle it after the fact.`, ex:`"Not trying to change your stack - this just sits on top of it." / "Literally only takes 2 hours to set up."`},
{p:'Frank Brothers', cat:'Objection Handling & Replies', src:'Frank Collective Outbound Lessons Doc', t:'Never claim past-tense work you haven’t actually done', b:`Saying "I've put together a video for you - can I send it over?" is a provable lie if you haven't actually sent it (if you had, you'd have just sent it). Use conditional, forward-looking phrasing instead ("I can put together...") so the offer stays honest and doesn't collapse in credibility if the prospect calls the bluff by simply asking for it now.`},
{p:'Frank Brothers', cat:'Objection Handling & Replies', src:'Frank Collective Outbound Lessons Doc / 1M Frank eBook', t:'Reverse-psychology framing and a built-in opt-out pre-handle the sales objection', b:`Explicitly stating up front that you're not selling anything and are only looking for candid feedback (or framing the outreach as a short anonymized market-research survey) removes the "you're pitching me" objection before it can even form, since there's no ask to resist. Giving prospects an explicit, friction-free way to disqualify themselves within the message itself ("if you're happy with your current setup, delete this") pre-handles the most common silent objection before it's voiced - anyone who keeps reading past that off-ramp has effectively already answered the "not interested" objection themselves.`},
{p:'Frank Brothers', cat:'Objection Handling & Replies', src:'1M Frank eBook', t:'Turn a firm "no" into a plausible referral ask', b:`When a prospect clearly declines, pivot immediately to asking whether a specific former employer or similar company of theirs might be a better fit, framed with an explicit "no worries either way" - a "no" for themselves doesn't mean a "no" for their network. The alternate company suggested should be genuinely similar in industry or size to the one that declined; a mismatched suggestion makes the referral ask feel random and undermines the goodwill built by the low-pressure framing.`},
