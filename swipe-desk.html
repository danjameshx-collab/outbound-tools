{p:'Christian Bonnier', cat:'Volume, Testing & Metrics', src:'Cold Email Masterclass Presentation', t:'Realistic benchmarks: 1-2% positive reply rate is solid, one client per 1,000 emails is the north star', b:`Open-rate tracking is increasingly unreliable (the tracking pixel itself is a spam signal), so response rate is the metric to watch: a 1-2% positive reply rate per 100 emails sent is a good baseline, one reply per 250 emails is very strong, and one call booked per 250 emails is excellent. The north-star metric across a full campaign is one client signed per 1,000 emails sent - even converting only two calls per 1,000 emails is a strong outcome if your close rate on those calls is roughly 50%.`},
{p:'Christian Bonnier', cat:'Volume, Testing & Metrics', src:'Nuance video', t:'Let existing client feedback tell you which angle to test, not guesswork', b:`Rather than guessing which piece of a multi-part offer to lead with, ask your last several clients directly which part of the deliverable they found most valuable, or run every distinct service as its own parallel test in one campaign. Whichever angle produces disproportionate replies is your validated new front-door offer - the campaign becomes an unbiased feedback loop for the offer itself, not just a lead source.`},
{p:'Christian Bonnier', cat:'Tools & AI', src:'Best CTA of 2025', t:'Cold, hard copywriting with a real CTA beats AI personalization at scale', b:`Describing several of his highest-performing live campaigns, he states directly there's no AI personalization and no scraping/enrichment workflow (e.g. Clay) behind any of them - the results come from plain copywriting and a call to action that earns trust before the call, not from personalizing at the individual-lead level with AI.`},
{p:'Christian Bonnier', cat:'Humor & Tone', src:'Cold Email Masterclass Presentation', t:'One weird detail can outperform more copy', b:`In one tested follow-up email, the entire body copy was a single detective emoji and nothing else - no explanation needed beyond testing it and watching the results, treating it as one more variant to A/B rather than a rule to over-explain.`},
{p:'Christian Bonnier', cat:'Humor & Tone', src:'Cold Email Masterclass Presentation', t:'Sound like a fellow operator, not a vendor', b:`A line like "always enjoy connecting with fellow agency owners - keep crushing it with {{company}}" reads as one operator talking to another, not a stranger pitching a service - that peer-to-peer register is part of what keeps role-based, non-individualized personalization from reading as generic or cold.`},

{p:'Instantly', cat:'Mindset & Strategy', src:'Trust recession / value-first outreach', t:'Lead with value, never a pitch', b:`Consumer trust in institutions and salespeople is at an all-time low (the "trust recession"), so a cold email's job is to offer something - an audit, a resource, a video - rather than close a deal in the message itself. Don't ask for a call in the opener; earn a raised hand first.`},
{p:'Instantly', cat:'Mindset & Strategy', src:'10-year cold email tactics overview', t:'Build a team of specialized roles as volume grows', b:`Rather than one person doing everything, split cold outbound into distinct roles: list builder, non-voice appointment setter, copywriter/campaign setter, and closer - each optimizing their own part of the funnel.`},
{p:'Instantly', cat:'Targeting & List Building', src:'10-year cold email tactics overview', t:'Lists are king - quality beats volume', b:`A smaller, verified, tightly-targeted list consistently beats a huge generic list; blasting everyone makes you "a specialist to no one." Split one big list into micro-niche campaigns (5-10 sub-lists per niche) with copy tailored to each, instead of one blast.`},
{p:'Instantly', cat:'Personalization & Research', src:'"Hidden trust breaker" copywriting video', t:'Pass the them-first rule and the only-them test', b:`A personalized opening line should mention the prospect's situation before your own (the "them-first rule"), and should be specific enough that it couldn't apply to 1,000 other companies (the "only-them test") - if a line passes neither test, rewrite it before sending.`},
{p:'Instantly', cat:'Personalization & Research', src:'2025 trends / trust-breaker audits', t:'Generic mail-merge personalization is now worse than none', b:`AI personalization at scale is baseline, not a differentiator - a fake, generic "{{firstName}}, I saw you work at {{company}}" style personalization reads worse than no personalization at all, because it signals a template rather than real attention.`},
{p:'Instantly', cat:'Subject Lines', src:'Winning campaign framework / copywriting videos', t:'The subject line must not sell', b:`Selling in the subject line is treated as an immediate spam-folder risk. The best-performing subject lines read like something a colleague would send - short, plain, lowercase, sometimes just a word or two ("Thoughts", "Austin", "Q4 forecasting").`},
{p:'Instantly', cat:'Copywriting & Message Structure', src:'10-year cold email tactics overview', t:'Keep it short - most emails never get read', b:`The average CEO gets 120+ emails a day and only about 5% get read in full, so short, simple, to-the-point copy wins over long explanations of how the offer works.`},
{p:'Instantly', cat:'Copywriting & Message Structure', src:'"6-step copywriting structure" video', t:'Under ~80 words, 1-2 sentences per paragraph', b:`Structure the body as: specific opener -> problem awareness -> value-first soft CTA, kept under roughly 80 words with short paragraphs, rather than a long, multi-paragraph pitch.`},
{p:'Instantly', cat:'Offers & Positioning', src:'10-year cold email tactics overview', t:'Reframe deliverables as outcomes', b:`A vanilla, deliverable-based offer ("we edit your videos") underperforms a version reframed around a business outcome ("we'll add 10 new furnace appointments in 30 days"). Always translate what you do into the result it produces.`},
{p:'Instantly', cat:'Calls to Action (CTA)', src:'10-year cold email tactics overview', t:'Ask for a reply, not a booking', b:`Cold email's job is to turn a cold contact into a raised hand (a reply, an interest signal), not to book a call directly - explicit hard asks like "let's book a call" underperform soft, curiosity-driven offers like "does this seem interesting to you?"`},
{p:'Instantly', cat:'Follow-Up Strategy', src:'Multiple videos (follow-up-system, 24-lessons)', t:'Fortune is in the follow-up, but "just checking in" isn\'t one', b:`44% of salespeople quit after one follow-up, yet 95% of converted leads are reached by the sixth attempt, and 80%+ of business reportedly comes from follow-ups rather than the opener. Each follow-up has to add a new angle or piece of value - a bare "bumping this up" adds nothing and is treated as a named failure mode.`},
{p:'Instantly', cat:'Follow-Up Strategy', src:'Value-ladder follow-up system video', t:'Recycle non-responders into new campaigns', b:`A non-responder isn't a dead lead - route them into a new campaign with a fresh angle rather than discarding the contact after a sequence ends.`},
{p:'Instantly', cat:'Sales Calls & Closing', src:'10-year cold email tactics / positive-reply-protocol videos', t:'Speed to lead decides close rate', b:`Respond to any positive reply within minutes, not hours - delayed responses lose interest fast. Follow the reply up with the promised value plus multi-channel touches (call, LinkedIn, Instagram) within the same week.`},
{p:'Instantly', cat:'Deliverability & Sending Infrastructure', src:'2025 setup / spintax videos', t:'Use spintax to avoid spam flags and duplicate-content detection', b:`Vary greetings, CTAs, and sign-offs with spintax syntax ({{random|hi|hello|hey}}) across sends, and keep DNS authentication (SPF/DKIM/DMARC) in place - major providers now actively enforce sender authentication.`},
{p:'Instantly', cat:'Volume, Testing & Metrics', src:'5-years-in-cold-email video', t:'Test one variable at a time', b:`Test subject line, then opener, then CTA as separate, sequential experiments rather than changing several elements in the same test - otherwise you can't tell which change moved the number.`},
{p:'Instantly', cat:'Volume, Testing & Metrics', src:'10-year cold email tactics overview', t:'Reverse-engineer required volume from close-rate math', b:`Work backward from the deals you want: e.g. 10,000 emails -> 1.5-4% reply -> 40% positive -> 25% book -> 25% close. Most people underestimate the volume actually required to hit a revenue target.`},
{p:'Instantly', cat:'Tools & AI', src:'Copywriting framework video', t:'Use AI to extract pain language, not to write the final copy blind', b:`Feed AI a prompt like "I work with [niche] and help them [outcome] using [offer] - give me a list of my client's current situation, pain points, and desired outcomes, speak the language of my clients" to surface real pain language, then write the email using that output rather than asking AI to write generic copy from scratch.`},
{p:'Instantly', cat:'Channel-Specific', src:'2025 trends video', t:'Multi-channel follow-up is required, not optional, on any positive signal', b:`LinkedIn, phone, and SMS orchestrated together with email are now treated as the standard follow-up motion for a positive reply, not an optional extra channel.`},

{p:'Smartlead', cat:'Mindset & Strategy', src:'"4 things that decide if cold email works" video', t:'Give it 3-4 months before judging', b:`Cold email needs 3-4 months of consistent sending before a fair verdict - most people quit around week 8, right before the data starts to pay off. Don't judge a campaign before at least 1,500-2,500 contacts have gone out.`},
{p:'Smartlead', cat:'Targeting & List Building', src:'2026 cold email setup video', t:'The list is the message', b:`Good copy sent to the wrong list fails; average copy sent to the right list succeeds. Define the total addressable market at the company level first (at least ~20,000 addressable prospects), then find the right person inside each qualifying company - not the reverse.`},
{p:'Smartlead', cat:'Targeting & List Building', src:'"What actually works now" video', t:'Location-based segmentation can produce outsized lifts', b:`A cited example showed one positive reply per 10 contacted on a location-matched list versus one per 200 on a broad list - a 20x difference - making geography one of the highest-leverage segmentation axes to test.`},
{p:'Smartlead', cat:'Personalization & Research', src:'Segmentation-tactics videos (recurring thesis)', t:'Segmented personalization replaces per-lead AI personalization', b:`Rather than generating a fake individual first-liner per lead with AI, segment the list on shared axes (sub-industry, company size, geography, customer stage, specific problem solved) and write one email per segment that's genuinely, equally relevant to everyone in it.`},
{p:'Smartlead', cat:'Personalization & Research', src:'2026 cold email setup video', t:'Enrichment separates good senders from average ones', b:`Layering company-level data (tech stack, funding, hiring) and personal-level data (tenure, LinkedIn activity) via a tool like Clay/Smart Prospect is what makes segmented personalization credible at scale.`},
{p:'Smartlead', cat:'Subject Lines', src:'2026 cold email setup video', t:'Subject lines should read like a colleague, not a headline', b:`Keep subject lines short and lowercase so they read like they could have come from a colleague - never headline-style or "compelling"-sounding, which reads as marketing and risks the spam folder.`},
{p:'Smartlead', cat:'Copywriting & Message Structure', src:'2026 cold email setup video', t:'The body is only 3 parts', b:`The entire body should cover: (1) the problem/situation being addressed, (2) what you do about it, (3) why it's relevant to them specifically - nothing more. Email 1 should stay under ~100 words.`},
{p:'Smartlead', cat:'Copywriting & Message Structure', src:'2026 cold email setup video', t:'PS lines are high-read-rate real estate', b:`Almost everyone who opens an email reads the PS line - use it for social proof or an extra personalized touch rather than leaving it blank or repeating the CTA.`},
{p:'Smartlead', cat:'Offers & Positioning', src:'Recurring thesis across at least 3 videos', t:'Offer matters more than copy', b:`Stated repeatedly as the single most emphasized principle: a strong offer with average copy will outperform weak/vague offers with excellent copy. Fix the offer before polishing the writing.`},
{p:'Smartlead', cat:'Offers & Positioning', src:'"What actually works now" video', t:'Prospects Google you before replying', b:`A good email with no findable public presence, case studies, or reviews still fails, because prospects check you out before responding - build the social proof outside the inbox, not just inside it.`},
{p:'Smartlead', cat:'Calls to Action (CTA)', src:'2026 setup / copywriting videos', t:'Match hard vs. soft CTA to offer strength', b:`Use a hard ask ("15-minute call") only when the offer is compelling enough to speak for itself or fully free; otherwise default to a soft CTA ("want me to send over a quick breakdown?") for cold, low-trust prospects.`},
{p:'Smartlead', cat:'Follow-Up Strategy', src:'2026 cold email setup video', t:'3-email max sequence', b:`Email 1 (heavy lift, under 100 words) -> Email 2 (~3 days later, adds new context, doesn't repeat) -> Email 3 (new thread, new subject line, offers something free, no ask). Never send more than 3 - if email 1 isn't converting, the fix is rewriting email 1, not adding more follow-ups.`},
{p:'Smartlead', cat:'Deliverability & Sending Infrastructure', src:'2026 cold email setup video', t:'Never send cold email from your primary domain', b:`Buy secondary domains that resemble the main brand and redirect them to the main site; use 2 mailboxes per secondary domain at roughly 25 emails/day/account, with a minimum 15-day warm-up before the first campaign send, and never fully turn warm-up off once live.`},
{p:'Smartlead', cat:'Deliverability & Sending Infrastructure', src:'2026 cold email setup video', t:'Plain text, consistent volume, Gmail first', b:`Plain-text emails deliver better than HTML; disable open/click tracking. Send Monday-Friday during business hours with consistent daily volume (irregular spikes flag providers), and send to Gmail addresses first since that reputation is harder to earn.`},
{p:'Smartlead', cat:'Volume, Testing & Metrics', src:'2026 cold email setup video', t:'Treat the first 2-3 campaigns as learning campaigns', b:`Don't expect results from the first 2-3 campaigns - their purpose is gathering data on angle, audience, and CTA before you optimize anything.`},
{p:'Smartlead', cat:'Volume, Testing & Metrics', src:'Multiple videos (recurring thesis)', t:'Track positive-reply-rate and revenue, not open rate', b:`Open-rate tracking is actively discouraged because open-tracking pixels can hurt deliverability - the only metrics that matter are how many people were contacted per positive reply, and revenue.`},
{p:'Smartlead', cat:'Channel-Specific', src:'Segmentation-tactics video', t:'Layer a manual call task into the sequence', b:`Add a manual call task alongside the email cadence (e.g. sourcing mobile numbers via Better Contact) - phone touches layered into the same sequence are reported to produce disproportionately better results than email alone.`},

];

{key:'Targeting & List Building', desc:'Building and validating the list before a single word gets written.'},
{key:'Personalization & Research', desc:"Turning research into openers that read as ‘this was written for me.’"},

/* ---------- sequence / draft state ---------- */
// A "sequence" is an array of email slots: {subject, body}. Slot 0 is the
// initial email, slots 1+ are follow-ups. insertToDraft() always targets
// whichever slot the user last focused (activeSlot).
let sequence = loadSequence();
let activeSlot = 0;

function loadSequence(){
  try{
    const s = JSON.parse(localStorage.getItem('swipedesk_sequence'));
    if(Array.isArray(s) && s.length) return s;
  }catch(e){}
  const legacyBody = localStorage.getItem('swipedesk_draft');
  return [{subject:'', body: legacyBody || ''}];
}
function persistSequence(){
  localStorage.setItem('swipedesk_sequence', JSON.stringify(sequence));
  if(window.fbSet) window.fbSet('sequence', sequence);
}
function loadSavedSequences(){ try{ return JSON.parse(localStorage.getItem('swipedesk_saved_sequences'))||[]; }catch(e){ return []; } }
function persistSavedSequences(list){
  localStorage.setItem('swipedesk_saved_sequences', JSON.stringify(list));
  if(window.fbSet) window.fbSet('savedSequences', list);
}
function saveChecks(state){
  localStorage.setItem('swipedesk_checks', JSON.stringify(state));
  if(window.fbSet) window.fbSet('checks', state);
}
function loadChecks(){ try{return JSON.parse(localStorage.getItem('swipedesk_checks')||'{}');}catch(e){return {};} }

/* ---------- Firebase: apply data fetched remotely on load ---------- */
function applyRemoteSequence(val){
  if(Array.isArray(val) && val.length){
    sequence = val;
    localStorage.setItem('swipedesk_sequence', JSON.stringify(sequence));
    activeSlot = 0;
    renderDraftPanel(); updateWc();
  }
}
function applyRemoteSavedSequences(val){
  if(Array.isArray(val)){
    localStorage.setItem('swipedesk_saved_sequences', JSON.stringify(val));
    renderDraftPanel();
  }
}
function applyRemoteChecks(val){

}

function toast(msg){
 const t = document.getElementById('toast');
 t.textContent = msg; t.classList.add('show');
 clearTimeout(window._toastTimer);
 window._toastTimer = setTimeout(()=>t.classList.remove('show'), 1600);
}
const CONFIRM_ICON = '<svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 1.5 15 13.5H1z" stroke-linejoin="round"/><path d="M8 6v3.2M8 11.4h.01" stroke-linecap="round"/></svg>';
function showConfirm(title, opts){
  opts = opts || {};
  return new Promise(resolve=>{
    const overlay = document.getElementById('confirmOverlay');
    const box = document.getElementById('confirmBox');
    box.innerHTML = `
      <span class="confirm-icon">${CONFIRM_ICON}</span>
      <div class="confirm-title">${esc(title)}</div>
      ${opts.detail?`<p class="confirm-detail">${esc(opts.detail)}</p>`:''}
      <div class="confirm-actions">
        <button class="btn ghost" id="confirmCancelBtn">${esc(opts.cancelLabel||'Cancel')}</button>
        <button class="btn ${opts.danger?'danger':'primary'}" id="confirmOkBtn">${esc(opts.confirmLabel||'OK')}</button>
      </div>`;
    overlay.classList.add('open');
    document.getElementById('confirmOkBtn').focus();
    function onKey(e){ if(e.key==='Escape') finish(false); if(e.key==='Enter') finish(true); }
    function onBgClick(e){ if(e.target===overlay) finish(false); }
    function finish(result){
      overlay.classList.remove('open');
      document.removeEventListener('keydown', onKey);
      overlay.removeEventListener('click', onBgClick);
      resolve(result);
    }
    document.addEventListener('keydown', onKey);
    overlay.addEventListener('click', onBgClick);
    document.getElementById('confirmCancelBtn').addEventListener('click', ()=> finish(false));
    document.getElementById('confirmOkBtn').addEventListener('click', ()=> finish(true));
  });
}
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s){ return esc(s).replace(/"/g,'&quot;'); }
function highlightPlaceholders(s){ return esc(s).replace(/\{\{.*?\}\}/g, m=>'<mark>'+m+'</mark>'); }
function copyText(s){
 navigator.clipboard.writeText(s).then(()=>toast('Copied')).catch(()=>toast('Copy failed'));
}
function slotLabel(i){ return i===0 ? 'Email 1' : 'Follow-Up ' + (i+1); }
function insertToDraft(s, target){
  if(activeSlot >= sequence.length) activeSlot = 0;
  if(target === 'subject'){
    sequence[activeSlot].subject = s;
  } else {
    const cur = sequence[activeSlot].body || '';
    const sep = cur.trim().length ? '\n\n' : '';
    sequence[activeSlot].body = cur + sep + s;
  }
  persistSequence();
  renderDraftPanel();
  if(window.innerWidth <= 980){ document.getElementById('rail').classList.add('open'); }
  toast((target === 'subject' ? 'Set subject for ' : 'Added to ') + slotLabel(activeSlot));
}
function fullSequenceText(){
  return sequence.map((e,i)=>{
    const head = sequence.length>1 ? slotLabel(i)+'\n' : '';
    const subj = e.subject.trim() ? 'Subject: '+e.subject.trim()+'\n\n' : '';
    return head + subj + (e.body||'');
  }).join('\n\n-----\n\n');
}
function updateWc(){
  const words = sequence.reduce((a,e)=>{
    const v = (e.body||'').trim();
    return a + (v ? v.split(/\s+/).length : 0);
  }, 0);
  const label = sequence.length>1 ? ' across '+sequence.length+' emails' : '';
  document.getElementById('draftWc').textContent = words + ' word' + (words===1?'':'s') + label;
}

/* ---------- render: draft panel ---------- */
function renderDraftPanel(){
  const body = document.getElementById('dpBody');
  if(activeSlot >= sequence.length) activeSlot = sequence.length - 1;

  let html = sequence.map((e,i)=>`
    <div class="email-slot ${i===activeSlot?'active':''}" data-i="${i}">
      <div class="es-head">
        <span class="es-label">${esc(slotLabel(i))}</span>
        ${sequence.length>1?`<button type="button" class="es-remove" data-i="${i}">Remove</button>`:''}
      </div>
      <input type="text" class="es-subject" data-i="${i}" placeholder="Subject line..." value="${escAttr(e.subject||'')}">
      <textarea class="es-body" data-i="${i}" placeholder="${i===0?'Your email builds here. Click the plus button on any line, template, or phrase to drop it in, then edit freely.':'This follow-up builds here...'}">${esc(e.body||'')}</textarea>
    </div>`).join('');

  html += `<div class="rowbtns">
    <button class="btn ghost small" id="addFollowUpBtn">+ Add Follow-Up Email</button>
    <button class="btn primary small" id="saveSequenceBtn">Save ${sequence.length>1?'Sequence':'Email'}</button>
  </div>`;

  const saved = loadSavedSequences();
  html += `<div class="saved-seq-block">
    <p class="eyebrow" style="margin-bottom:8px;">Saved (${saved.length})</p>`;
  if(!saved.length){
    html += `<p style="font-size:12px;color:var(--ink-faint);">Nothing saved yet - build an email or sequence above, then hit Save.</p>`;
  } else {
    html += saved.slice().reverse().map(item=>`
      <div class="saved-seq-item" data-id="${item.id}">
        <div class="ss-title">${esc(item.name)}</div>
        <div class="ss-meta">${item.emails.length} email${item.emails.length===1?'':'s'} - ${esc(new Date(item.savedAt).toLocaleDateString())}</div>
        <div class="ss-subjects">${item.emails.map((e,i)=>`<div>${esc(slotLabel(i))}: ${esc(e.subject||'(no subject)')}</div>`).join('')}</div>
        <div class="rowbtns">
          <button class="btn ghost small ss-load" data-id="${item.id}">Load</button>
          <button class="btn ghost small ss-delete" data-id="${item.id}">Delete</button>
        </div>
      </div>`).join('');
  }
  html += `</div>`;

  body.innerHTML = html;

  body.querySelectorAll('.es-subject').forEach(inp=>{
    inp.addEventListener('focus', ()=>{ activeSlot = +inp.dataset.i; body.querySelectorAll('.email-slot').forEach(el=> el.classList.toggle('active', +el.dataset.i===activeSlot)); });
    inp.addEventListener('input', ()=>{ sequence[+inp.dataset.i].subject = inp.value; persistSequence(); });
  });
  body.querySelectorAll('.es-body').forEach(ta=>{
    ta.addEventListener('focus', ()=>{ activeSlot = +ta.dataset.i; body.querySelectorAll('.email-slot').forEach(el=> el.classList.toggle('active', +el.dataset.i===activeSlot)); });
    ta.addEventListener('input', ()=>{ sequence[+ta.dataset.i].body = ta.value; persistSequence(); updateWc(); });
  });
  body.querySelectorAll('.es-remove').forEach(b=>{
    b.addEventListener('click', ()=>{
      const i = +b.dataset.i;
      sequence.splice(i,1);
      if(activeSlot >= sequence.length) activeSlot = sequence.length-1;
      persistSequence(); renderDraftPanel(); updateWc();
    });
  });
  const addBtn = document.getElementById('addFollowUpBtn');
  if(addBtn) addBtn.addEventListener('click', ()=>{
    sequence.push({subject:'', body:''});
    activeSlot = sequence.length-1;
    persistSequence(); renderDraftPanel(); updateWc();
    const tas = body.querySelectorAll('.es-body');
    tas[tas.length-1]?.focus();
  });
  const saveBtn = document.getElementById('saveSequenceBtn');
  if(saveBtn) saveBtn.addEventListener('click', ()=>{
    const hasContent = sequence.some(e=> (e.subject||'').trim() || (e.body||'').trim());
    if(!hasContent){ toast('Nothing to save yet'); return; }
    const defaultName = sequence[0].subject.trim() || ('Sequence - ' + new Date().toLocaleDateString());
    const name = prompt('Name this ' + (sequence.length>1?'sequence':'email') + ':', defaultName);
    if(name === null) return;
    const list = loadSavedSequences();
    list.push({ id: 'seq-'+Date.now(), name: name.trim() || defaultName, savedAt: Date.now(), emails: JSON.parse(JSON.stringify(sequence)) });
    persistSavedSequences(list);
    renderDraftPanel();
    toast('Saved');
  });
  body.querySelectorAll('.ss-load').forEach(b=>{
    b.addEventListener('click', ()=>{
      const item = loadSavedSequences().find(x=>x.id===b.dataset.id);
      if(!item) return;
      sequence = JSON.parse(JSON.stringify(item.emails));
      activeSlot = 0;
      persistSequence(); renderDraftPanel(); updateWc();
      toast('Loaded "'+item.name+'"');
    });
  });
  body.querySelectorAll('.ss-delete').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const ok = await showConfirm('Delete this saved item?', {detail:'This can\'t be undone.', confirmLabel:'Delete', danger:true});
      if(!ok) return;
      const list = loadSavedSequences().filter(x=>x.id!==b.dataset.id);
      persistSavedSequences(list);
      renderDraftPanel();
    });
  });
}

/* ---------- render: rail ---------- */
function renderRail(){
  const groups = {};
  TABS.forEach(t=>{ (groups[t.group]=groups[t.group]||[]).push(t); });
  const nav = document.getElementById('navGroups');
  nav.innerHTML = Object.keys(groups).map(g=>`
    <div class="nav-group">
      <div class="nav-group-label">${esc(g)}</div>
      ${groups[g].map(t=>{
        const n = t.hint();
        return `<button class="nav-item ${t.id===activeTab?'active':''}" data-tab="${t.id}">
          ${t.icon}<span>${esc(t.label)}</span>${n!=null?`<span class="count">${n}</span>`:''}
        </button>`;
      }).join('')}
    </div>`).join('');
  nav.querySelectorAll('.nav-item').forEach(b=>b.addEventListener('click', ()=>{
    activeTab=b.dataset.tab;
    const gs = document.getElementById('globalSearch');
    gs.value = searchTerms[activeTab] || '';
    gs.placeholder = TAB_SEARCH_PLACEHOLDER[activeTab] || 'Search...';
    renderAll();
    document.getElementById('rail').classList.remove('open');
  }));
}

function matches(term,...fields){
 if(!term) return true;
 const t = term.toLowerCase();
 return fields.some(f => (f||'').toLowerCase().includes(t));
}

{id:'eric-camp-tapo-1',group:'Tapo (LinkedIn Scheduling Tool)',name:'Email 1',
why:`Problem sniffing, not a pitch - it points out they post inconsistently, then uses a poke-the-bear question to make them evaluate whether they actually have a process. Barely any social proof - the personalization alone carries the email.`,
body:[
`Saw one of your recent LinkedIn posts about {AI summary of their post}.`,
`Seems like the last time you posted was {X} days before that.`,
`If you're trying to build your brand on LinkedIn, have you considered using a scheduling tool?`,
`Our scheduling tool can help write your posts and monitor social trends you can riff on as well.`,
`Let me know if this would be useful and I can send over access.`,
]},
{id:'eric-camp-tapo-2',group:'Tapo (LinkedIn Scheduling Tool)',name:'Follow-Up',
why:`Deliberately references their second most recent post rather than the newest, so the Clay workflow only has to be built once while still feeling like something naturally reminded us to reach out - this is how a human would actually follow up.`,
body:[
`Hey,`,
`I just saw your post about {topic}.`,
`It reminded me to follow up and see if you saw this.`,
]},
{id:'eric-camp-tapo-3',group:'Tapo (LinkedIn Scheduling Tool)',name:'Email 3',

`These were generated automatically and don't even include your own insights yet.`,
`Let me know if I can send you access.`,
]},
{id:'eric-camp-tapo-4',group:'Tapo (LinkedIn Scheduling Tool)',name:'Email 4',

body:[
`Just like Facebook Pages eventually lost their organic reach, LinkedIn probably will too.`,
`I noticed your company page has {500} followers while your personal profile has {5,000}.`,
`As you're building your audience, are you maximizing LinkedIn's organic reach before it becomes saturated?`,

{id:'eric-camp-agency-1',group:'Agency Campaign',name:'Email 1',
why:`The offer isn't the selling point - the research is. Naming exactly who they sell to and referencing their own SDR by name makes the rest of the email believable.`,

`- Idea 1`,
`- Idea 2`,
`- Idea 3`,

`Or is your team still manually researching prospects?`,
`If so, I'd be happy to show you how we automate it.`,

{id:'eric-camp-agency-3',group:'Agency Campaign',name:'Email 3 (Show & Tell)',
why:`Instead of talking about features, it shows exactly what the system already knows about their business - proof over description.`,

`Our system combines over 40 databases into one spreadsheet so reps don't have to manually research accounts.`,

body:[

{id:'eric-camp-clearbit',group:'Clearbit Campaign',name:'Clearbit Campaign',
why:`Built around a single observation: companies already pay for Clearbit but only use a fraction of the enrichment data. Problem (wasted data), then solution (automation) - nothing else.`,

{id:'eric-camp-optivo',group:'Optivo (Intent Data)',name:'Optivo (Intent Data)',
why:`Proves the product before asking for the meeting - hands over a real, working list of companies currently researching the category instead of describing the intent platform.`,
body:[
`I was researching your company and saw you help HR teams with {problem}.`,
`Using our intent platform, I found these companies actively researching HR technology this week:`,

`2. {Company}`,
`3. {Company}`,
`...`,
`10. {Company}`,
`If you'd like, I can send over another thousand companies currently researching this category.`,
`Happy to also show you how we identify them.`,
]},
{id:'eric-camp-creative-ideas-1',group:'AI-Generated Creative Ideas Campaign',name:'Email 1 (Three-Idea Format)',
why:`Eric's top-performing, most-scalable campaign - 85 contacts per opportunity in Instantly's own split test, beating every list-capped campaign (new-hires, competitor-users, technographics, etc.) because it can be sent to anyone in market, not just a narrow trigger-based segment. AI generates 2-3 tailored campaign ideas per prospect from their website content, so the personalization scales infinitely instead of being capped by a finite list of triggers.`,
body:[
`Hey {FirstName}, I had some ideas about how we could target {customer type} together.`,
`Here's what I'm thinking.`,
`Idea one: {AI-generated idea 1}`,
`Idea two: {AI-generated idea 2}`,
`Idea three: {AI-generated idea 3}`,
`{value prop}`,
`{CTA}`,
`Of course, we can do other things too - let me know if you had any other ideas.`,
]},
{id:'eric-camp-creative-ideas-2',group:'AI-Generated Creative Ideas Campaign',name:'Email 2 (Filled-In Example, Pharma Finance)',
why:`Shows the three-idea format actually filled out for a real ICP (finance leaders at US pharma companies) - notice it's longer than Instantly's own stated best practices, but Eric finds people will read a longer email when the ideas themselves are genuinely good.`,
body:[
`Hey {FirstName}, I had some ideas about how we could target finance leaders at US pharma companies together.`,
`Here's what I'm thinking.`,
`Target CFOs that recently took over their role and show them how you can help them reduce expenses in their first 90 days.`,
`Use our website visitor identification to uncover purchasing directors researching your site but who didn't leave their email.`,
`Send campaigns to VPs of Finance asking if their org is currently evaluating cutting software costs given recent NIH cuts.`,
`We built a platform that does all this...`,
]},
{id:'eric-camp-creative-ideas-3',group:'AI-Generated Creative Ideas Campaign',name:'Email 3 (One-Idea, Short Format)',
why:`The scaled-down variant for when a shorter, harder-hitting email fits better - one idea in the body, straight to the point, rather than the full three-bullet layout. Example is Eric's own for Red Bull.`,
body:[
`Hey, we could cold email colleges and universities who don't currently stock your product and make sure it's available for the students.`,
`Let us know if you want us to help.`,
]},
{id:'eric-camp-creative-ideas-4',group:'AI-Generated Creative Ideas Campaign',name:'Email 4 (One Idea in Body + Second Idea in PS)',
why:`Keeps the body of the email short with one idea, then uses the PS to plant a second idea as a fallback in case the first one isn't the current priority - gives the AI-generated ideas two chances to land without lengthening the main body.`,
body:[
`Hey, we can help you reach out to colleges and universities to make sure your product is stocked up for the students.`,
`Let us know if you want us to help.`,
`Signature`,
`PS - if colleges isn't the focus right now, maybe we can help you target co-working spaces to see if founders would use it in the vending machines.`,
]},
];

const MATT_TEMPLATES = [
{id:'matt-3part-framework',group:'Matt Lucero',name:'3-Part Cold Email Framework',desc:'Personalized reason + question, then value/proof, then a no-brainer CTA.',
template:`Hi {{FirstName}},

Came across your {{channel/company}} and noticed {{specific observation/metric}}. Would you be interested if we could {{specific outcome}} in the next {{timeframe}}?

I recently helped {{similar company/competitor}} {{achieve similar result}} and as a result generated them {{proof metric}}. Figuring we might be able to do something similar.

Can I send you {{low-friction offer, e.g. a video breakdown}}?`,
example:`Hi Matt,

Came across your YouTube channel, Matt Lucero, and noticed that you average 1,000 views per day. Would you be interested if we could 3x that in the next 90 days?

I recently helped another cold email YouTuber triple their views in the last 90 days and as a result generated them 40 booked calls last month. Figuring we might be able to do something similar.

Can I send a video breakdown of some ideas I had for you?`,
theory:[`Reason + question hooks attention by calling out something specific and personalized, rather than generic.`,`Proof from a near-identical case study (ideally a competitor) makes the prospect want the same result.`,`Specificity beats vague claims - "helped a random company" gets ignored, "helped someone in your exact niche" gets read.`,`High probability of value - referencing a comparable case study makes saying yes feel low-risk.`,`No-brainer CTA - offering a free asset (not a call) removes friction for busy prospects.`],
when:[`When you can point to a case study in the exact same niche/vertical as the prospect.`,`First-touch cold emails where you need to establish relevance fast.`],
tip:`Run the "last 10 customers" research first (see the Structural Frameworks tab) - it's what makes the observation and proof specific instead of generic.`,
prompt:`Write a cold email using this structure: 1) a personalized observation about the prospect that catches attention, 2) a question tied to a service/outcome relevant to that observation, 3) a proof point from a similar client/competitor with a specific result, 4) a low-friction CTA (not a call). Keep it hyper-specific to the prospect's niche.
My business is: {{describe your business}} / My target customer: {{describe ideal customer}} / A similar client result I can reference: {{describe case study}} / The low-friction offer I can make: {{describe asset, e.g. video, breakdown, audit}}`},

{id:'matt-callout-industry',group:'Matt Lucero',name:'Call-Out Industry',desc:'A one-to-two line pitch that leans entirely on industry-specific language.',
template:`Hi {{FirstName}}, we help {{industry}} companies {{achieve specific result}} using {{your unique mechanism/method}}. Interested?`,
example:`Hi Dana, we help boutique dental practices book 10-15 extra appointments a month using our patient-recall system. Interested?`,
theory:[`Uses the industry's own language so it reads as written for that niche, not a mass blast.`,`Extremely short - the whole pitch fits in one or two lines.`,`Naming a concrete mechanism makes the claim feel more real than a vague benefit.`],
when:[`You have a narrow, well-defined niche and a repeatable result you can quote.`,`Early in a sequence, before you've built up niche-specific case studies.`],
tip:`Swap in the niche's own jargon (e.g. "bids" instead of "sales calls" for tradespeople) so it reads like an insider wrote it.`},

{id:'matt-oneliner',group:'Matt Lucero',name:'One-Liner',desc:'The entire email is a single line - a hard pattern interrupt against longer pitches.',
template:`{{FirstName}} - would you be interested in {{offer/end result}}?`,
example:`Priya - would you be interested in 10 more qualified installs a month?`,
theory:[`A single-line email is a hard pattern interrupt against inboxes full of longer pitches.`,`Forces total clarity - if the offer doesn't fit in one line, it usually isn't clear enough yet.`,`Very low commitment to read, which raises the odds of a reply either way.`],
when:[`Late in a follow-up sequence, or as a deliberate contrast test against a longer email.`,`You already have strong list segmentation, since the line carries no personalization of its own.`],
tip:`This only works if the offer is instantly understandable - test it by reading the line out loud to someone outside your industry.`},

{id:'matt-rhetorical',group:'Matt Lucero',name:'Rhetorical Question',desc:'Lead with a question that doubles as the pain-point callout.',
template:`Hi {{FirstName}}, is {{company}} looking for {{specific result}}? (Or: is {{company}} struggling with {{specific pain point}}?) If so, {{one-line offer}}.`,
example:`Hi Marco, is Ridgeline Roofing looking for more qualified bids this quarter? If so, we place a dedicated rep who books estimates for you.`,
theory:[`The rhetorical question does the work of a pain-point callout without sounding like an accusation.`,`Leads naturally into the offer as the "answer" to the question.`],
when:[`You know a pain point that's near-universal for the segment, so the question reads as obviously relevant rather than generic.`],
tip:`Keep the question narrow enough that "no" is a believable answer - overly broad questions read as filler.`},

{id:'matt-community',group:'Matt Lucero',name:'Community-Focus',desc:'Borrow credibility by referencing a community the prospect is part of.',
template:`Hi {{FirstName}}, noticed you're a member of {{community/group}}. We've worked with a few people there and helped them {{achieve specific result}}. Interested in learning more?`,
example:`Hi Lauren, noticed you're a member of the Female Founders Collective. We've worked with a few members there on their outbound and helped them add 15+ booked calls a month. Interested in learning more?`,
theory:[`Borrowed credibility - referencing a shared community makes a cold email feel closer to a warm intro.`,`Signals real research rather than a mass scrape.`],
when:[`Your prospect is active in a Slack group, mastermind, subreddit, or niche community you can identify from their profile or activity.`],
tip:`Only use this if you can honestly say you've worked with someone from that exact community - it's easy to fact-check and backfires if it's not true.`},

{id:'matt-case-general',group:'Matt Lucero',name:'General Case Study',desc:'Lean on aggregate proof across an industry rather than one client.',
template:`Hi {{FirstName}}, was looking at {{industry}} companies in {{location/context}} and came across {{their company}}. We help {{industry}} companies {{achieve specific result}} in {{timeframe}} - thought we could do the same for {{their company}}. Interested in learning more?`,
example:`Hi Owen, was looking at roofing companies around Tampa and came across Coastal Roofing. We help roofers land a dedicated sales rep within two weeks, guaranteed - thought we could do the same for you. Interested in learning more?`,
theory:[`Leans on aggregate proof ("companies like yours") rather than one single anecdote.`,`A time-bound result makes the claim feel concrete and testable.`],
when:[`You have a repeatable result across multiple clients in the same industry, even without one standout case study.`],
tip:`Pair with a real number and timeframe - "guaranteed in two weeks" earns more trust than "we can help."`},

{id:'matt-case-specific',group:'Matt Lucero',name:'Specific Case Study',desc:'Name one real client instead of an aggregate result.',
template:`Hi {{FirstName}}, we recently helped {{named client}} {{achieve specific result}}. Think we could do the same for {{their company}} - worth exploring further?`,
example:`Hi Grace, we recently helped Summit Plumbing add 22 booked estimates in their first month. Think we could do the same for Coastal Roofing - worth exploring further?`,
theory:[`Naming a real client is stronger proof than an aggregate claim - specific and verifiable.`,`Works even better paired with a linked case study or testimonial.`],
when:[`You have at least one named client willing to be referenced, ideally in the same or an adjacent vertical.`],
tip:`If you can link a one-page case study or short testimonial, this script converts noticeably better than the text alone.`},

{id:'matt-location',group:'Matt Lucero',name:'Location-Based',desc:'Use geography to signal real research, paired with a nearby case study.',
template:`Hi {{FirstName}}, was scrolling through the top {{industry}} companies in {{city}} and came across your website. {{Insert relevant case study or result}}. Interested in learning more?`,
example:`Hi Deshawn, was scrolling through the top HVAC companies in Austin and came across your site. We recently helped a crew two blocks over add 18 booked jobs in a month - interested in learning more?`,
theory:[`Location signals real research and local relevance, which reads as less "spray and pray."`,`Works best paired with a case study from the same city or region.`],
when:[`You're running location-based segments (e.g. Google Maps scrapes) and can pair the location callout with a nearby case study.`],
tip:`A local case study is the multiplier here - the location callout alone is a weak hook without proof to back it up.`},

{id:'matt-revenue-time',group:'Matt Lucero',name:'Revenue vs. Time-Savings Value Framework',desc:'Tie a technical detail to a quantified business outcome, then pre-handle the biggest objection.',
template:`Hi {{FirstName}}, {{personalized observation/pain point}}. We recently helped {{similar company}} {{specific improvement}}, which added {{specific revenue or time result}}. {{One line addressing the biggest objection}}. {{Clear, single CTA}}`,
example:`Hi Theo, noticed your site's average load time is 2.6 seconds. We recently helped another store cut theirs to 0.8 seconds, adding $127K in revenue last month. We've done this for 50+ stores with a 100% completion rate, done in 72 hours. Open to a quick call?`,
theory:[`Ties a technical detail directly to a business outcome (revenue or time saved) instead of just describing the feature.`,`Pre-handles the "will this actually work for me" objection with a specific proof number rather than asserting expertise.`,`One CTA only - resist the urge to offer multiple next steps.`],
when:[`You can quantify the before/after result in either revenue or time saved, and have at least one comparable case study.`],
tip:`Pick one angle (revenue or time savings) per email rather than listing every benefit - a longer benefit list usually reads as a worse email, not a better one.`},
]; // source: Matt Lucero, YouTube - cold email series

const MATT_FRAMEWORKS = [
{id:'matt-fw1',name:'Matt Lucero - 3-Part Cold Email Framework',structure:`Reason for reaching out (personalized observation) + a question tied to your service -> Reason to care (value proposition + proof/case study, ideally from a similar competitor) -> No-brainer call to action (low-friction ask, e.g. "can I send you X").`},
{id:'matt-fw2',name:'Matt Lucero - Last 10 Customers Research Method',structure:`List your last 10 actual customers (not leads) -> note lead source, criteria (job title, location, headcount), and the pain point that made them book -> use the pain points to inform script angles and the criteria to inform list segmentation -> test multiple segments at once and double down on whichever outperforms.`},
{id:'matt-fw3',name:'Matt Lucero - The $1M Cold Email System (4 Pillars)',structure:`Sending infrastructure (many low-volume inboxes across domains, warmed 14+ days, spin tax for micro-variation) -> Targeting (map total addressable market -> ideal client profile -> segments, aiming for roughly 1,000-20,000 leads per segment) -> Copywriting (one-to-one tone, plain text, the 4-part script) -> Funnel (reply -> warm call -> sales call -> close, with fast speed-to-lead and multi-channel follow-up).`},
{id:'matt-fw4',name:'Matt Lucero - Ground Rules for Cold Email Copy',structure:`Write one-to-one, not like an ad -> keep it short, since attention is limited and even shorter for a stranger -> make it valuable to the recipient, not just to you -> sound human, not corporate -> reread it pretending you're the one receiving it before you hit send.`},
{id:'matt-fw5',name:'Matt Lucero - Follow-Up Cadence by Market Size',structure:`If your total addressable market is large relative to your daily sending volume, send fewer follow-ups per lead and put the extra volume toward reaching new people, since reply rates drop off sharply after the first email. If your market is small, send more follow-ups to the same people since you'll run out of new leads quickly.`},
{id:'matt-fw6',name:'Matt Lucero - Interested-Lead Reply Framework',structure:`Answer whatever question they actually asked -> tie that answer to a reason they should get on a call -> propose two specific times in their time zone.`},
{id:'matt-fw7',name:'Matt Lucero - Multi-Channel Squeeze',structure:`The moment a lead replies positively, hit them the same day across three channels - phone (double-dial to get past do-not-disturb), an email reply, and a LinkedIn connection request - then repeat the same three-channel push daily until they book or opt out, prioritizing the newest replies over older ones.`},
{id:'matt-fw8',name:'Matt Lucero - CTA Decision Tree',structure:`If the offer is strong, in-demand, and low-competition, ask for the call directly. If the offer needs more trust or is more complex, lead with a lower-friction ask first - more info, a portfolio, or a free sample/deliverable - then convert that into a call.`},
{id:'matt-fw9',name:'Matt Lucero - Objection-Handling Rewrite Pass',structure:`Draft the email -> reread it as if you were the recipient -> list every objection they'd have (trust, cost, relevance, capability) -> rewrite it to answer only the objections that would actually kill the deal, proving each one with a number, name, or guarantee instead of just asserting it.`},
{id:'matt-fw10',name:'Matt Lucero - Loom Video CTA Structure',structure:`15 seconds - intro yourself and name the specific problem you noticed. 60 seconds - walk through the problem in more depth. 30 seconds - give a quick overview of how you'd fix it. 15 seconds - close with a clear next step.`},
{id:'matt-fw11',name:'Matt Lucero - 5 Copywriting Principles for Scale',structure:`Keep emails short and skimmable -> write at roughly a fifth-grade reading level -> use spin tax to create micro-variations across every sentence, not just the greeting -> split test full variations of the copy, not just subject lines -> feed what you learn from sales calls back into the next round of copy.`},
]; // source: Matt Lucero, YouTube - cold email series

const CHRISTIAN_TEMPLATES = [
{id:'christian-loom-pitch',group:'Christian Bonnier',name:'Two-Sentence Loom Video Pitch',desc:'An observation about the business, then a video CTA - nothing else.',
template:`Hi {{FirstName}},

{{Observation about their business/website/funnel/ads}}. I recorded a video breaking down the causes and how to fix them. Mind if I share the video here?`,
example:`Hi Kurt,

I revamped your welcome flow to optimize it for more revenue. Mind if I share it here so you can see what we do differently?`,
theory:[`The only job of email one is to get a "yes, send me the video" - not to close anything.`,`Once they say yes, you get 3-5 minutes on a Loom to pitch why you're the right person for the job and move them to a call.`,`Keeping it to two sentences means there's no room for the reader to get lost or bored before the ask.`],
when:[`Any service where you can plausibly claim to have looked at their site, ads, funnel, or emails.`,`Early in a sequence, before you've earned the right to a longer pitch.`],
tip:`Don't actually build the deliverable (the rewritten flow, the audit) until they say yes - build it only for people who respond, so you're not wasting hours on unqualified leads.`,
prompt:`Write a two-sentence cold email: sentence one is a specific, plausible observation about the prospect's {{website/funnel/ads/emails}} that implies a problem; sentence two offers a video breaking down the cause and the fix, and asks "mind if I share the video here?" Nothing else - no pitch, no case study, no pricing.
My business is: {{describe your business}} / What I'd plausibly notice about a prospect like this: {{describe the observation}}`},

{id:'christian-trojan-horse',group:'Christian Bonnier',name:'Trojan Horse Opener',desc:'Pose as a consumer or customer of the brand, not a vendor pitching it.',
template:`I was checking out {{company}}'s {{website/email newsletter/ads/social}} and noticed a few things that are likely {{hurting conversions / costing sales / causing a specific problem}}. I recorded a quick video explaining further - mind if I share it here?`,
example:`I was checking out your website and noticed a few things with your landing page that are likely hurting your conversions. Mind if I share a quick video explaining further?`,
theory:[`Reframes you as someone who already engaged with the business as a consumer, not a stranger pitching them.`,`Works for almost any service if you reverse-engineer your offer into a plausible consumer touchpoint - an IT security company can say "noticed a few things likely to cause a cyber attack on your site."`,`If they say yes and their site/funnel/ads are actually already excellent, let it go and move to the next prospect rather than forcing a critique.`],
when:[`Your service maps to something a real customer could plausibly have noticed (website, funnel, ads, social, email list).`,`You want personalization that doesn't require actually researching every single prospect in depth first.`],
tip:`Get creative for less obvious offers - reverse-engineer how a "consumer" of the category would have noticed the problem before you pitch it.`},

{id:'christian-one-two-punch',group:'Christian Bonnier',name:'One-Two Punch (Jab + Right Hook)',desc:'A short vague jab in email one, the full pitch saved for the right hook in email two.',
template:`Email 1 (the jab): Hi {{FirstName}}, as the {{founder/owner}} of {{company}}, I'm sure you're looking for {{desired outcome}}. Curious - are you looking for {{specific outcome}}?

Email 2 (the right hook, sent a few days later): The reason for my email the other day - we can {{specific offer/mechanism}}. We recently did this for {{similar company}} and they {{specific proof result}}. Open to a quick call to learn more?`,
example:`Email 1: Hey Christian, notice you're a co-founder at KnowledgeX. I'm really impressed by what you're building. Curious - are you looking for more qualified sales calls each month?

Email 2: The reason for my email the other day - we can book 10 calls on your calendar each month on a pay-per-call basis with personalized cold emails. We recently did this for Client Ascension and they closed $25,000 in sales in their first month. Open to a quick call to learn more?`,
theory:[`Email one shows no cards - it's a one-sentence, vague feeler aimed purely at getting a reply.`,`Email two takes everything you'd normally cram into email one - hard CTA, case study, guarantee - and saves it for the "right hook" once you've already opened a conversation.`,`Sending all your ammunition in email one shows the prospect your hand before every follow-up, which puts their guard up for the rest of the sequence.`],
when:[`Any first-touch sequence where email one alone hasn't been converting well.`,`When you want to test a softer opener against a harder, case-study-led one.`],
tip:`If email one on its own would already work as a strong pitch, that's fine too - bump it down to become email two, and write something more vague and conversational for email one.`},

{id:'christian-two-things',group:'Christian Bonnier',name:'"Two Things" Template',desc:'Two short numbered offers in one short email - a video and a deliverable, or two separate value props.',
template:`Hi {{FirstName}}, two things quick - I know you're busy.

One, we can {{primary offer/guarantee}}.

Two, I recorded a video going over {{a specific strategy/idea}} I came up with for you. Mind if I share the video here?`,
example:`Hi first name, two things quick. I know you're busy. One, we can bring you 10 extra sales calls per month guaranteed by managing your email flows, copy, design, and funnel process. Two, I recorded a video going over an email marketing strategy I came up with for you. Mind if I share the video here?`,
theory:[`Numbering the points keeps a short email skimmable even while packing in two separate value statements.`,`Naming that you know they're busy pre-empts the "too long" objection before it happens.`,`Every "thing" is still ultimately trying to get them to say yes to a video or a sample - it's not two separate pitches.`],
when:[`You have both a hard offer/guarantee and a soft, low-friction video/sample CTA and want to test them together in one email.`],
tip:`Keep both points to one line each - if either one needs two sentences, it's competing with the other point for attention.`},
]; // source: Christian Bonnier, YouTube - cold email teardowns and strategy videos

const CHRISTIAN_FRAMEWORKS = [
{id:'christian-fw1',name:'Christian Bonnier - The $1M Cold Email Template',structure:`Simple opener (a quick observation about their job title/business) -> a snappy hook that names the specific outcome you can create -> one secondary statement adding proof or a deeper value point -> a single, low-friction video CTA ("mind if I share a quick video going over some ideas I had for you?"). Kept deliberately short - his highest-converting sequences are, in his words, "stupidly simple."`},
{id:'christian-fw2',name:'Christian Bonnier - No-Brainer Offer Framework',structure:`State the benefit in tangible, business-native terms (sales, revenue, booked calls, new clients - never abstract metrics like ROAS or CAC) -> attach a guarantee ("...guaranteed, or you don't pay") -> optionally go one level deeper than competitors' claims in the same inbox (e.g. "booked estimates" instead of "leads" for a plumber).`},
{id:'christian-fw3',name:'Christian Bonnier - Trojan Horse Strategy',structure:`Reverse-engineer your offer into a plausible consumer touchpoint with the brand (their website, funnel, ads, email list, social) -> open by naming that touchpoint and the problem it revealed -> pitch a video/sample as the way to see the fix -> if they reply and turn out to have no real problem, drop it and move to the next lead rather than forcing a critique.`},
{id:'christian-fw4',name:'Christian Bonnier - One-Two Punch Sequence',structure:`Email one: a short, vague, one-sentence "jab" aimed only at getting a reply, with light personalization and no hard pitch. Email two (a few days later): the "right hook" - the full pitch, case study, guarantee, and hard CTA, framed as "the reason for my email the other day was...".`},
{id:'christian-fw5',name:'Christian Bonnier - Loom Video Pitch Structure',structure:`Intro yourself and restate the specific problem you noticed (~15 seconds) -> walk through the problem in more depth (~60 seconds) -> give a quick overview of how you'd fix it, in 2-3 numbered points (~30 seconds) -> close with a clear next step and specific times in the prospect's time zone (~15 seconds). Optionally open by naming the exact ideal-client profile to vet viewers and boost watch-through.`},
{id:'christian-fw6',name:'Christian Bonnier - 5-Step Sequence Structure',structure:`Emails 1A/1B/1C: three variants of the opener, each pairing a different personalized hook with the same underlying offer and a value-driven CTA ("mind if I share..."). Email 2: repeat the same offer/hook rather than switching angles. Email 3: pivot to a video pitch CTA. Email 4: a single-line pattern interrupt (in his example, one emoji and nothing else). Email 5: a plain, direct re-engagement line 2-3 weeks out ("would now be a better time to discuss...").`},
{id:'christian-fw7',name:'Christian Bonnier - Deliverability Setup',structure:`Buy 5-10+ burner/look-alike domains rather than sending from the main business domain -> set up DMARC/DKIM properly on each -> warm up every domain for roughly two weeks before real sending -> cap volume to about 20 emails per inbox per day -> scale total volume horizontally (more domains/inboxes) rather than vertically (more volume per inbox) -> send plain text only, no links, images, or HTML.`},
{id:'christian-fw8',name:'Christian Bonnier - Objection & Pricing Response Framework',structure:`Never state pricing directly over email - answer whatever the reply actually asked, then pivot: "instead of going back and forth over email, I'd be happy to discuss our flexible pricing options on a quick call" -> propose specific times converted into the prospect's own time zone rather than dropping a bare calendar link -> keep following up every 3-5 days until you get a real answer, one way or the other.`},
]; // source: Christian Bonnier, YouTube - cold email teardowns and strategy videos

const INSTANTLY_TEMPLATES = [

when:[`You have at least one real result you can point to and a repeatable process you can name.`]},
{id:'instantly-social-proof-followup',group:'Instantly',name:'Social Proof Follow-Up',desc:'Second touch in the value-ladder sequence - a named client result, offered as a video.',

example:`Noticed a few things on your Google Business Profile that are probably costing you visibility. I fix these for plumbers regularly. Happy to do it for you free. Is that something you'd be interested in?`,

theory:[`Leading with real ideas (not a pitch) demonstrates you've actually thought about their business.`,`Offering to build the first idea free converts curiosity into a concrete next step.`],
when:[`You can generate genuinely relevant, specific ideas from their website/public content rather than generic filler.`]},
]; // source: Instantly.ai, YouTube - cold email strategy and tutorial videos

const INSTANTLY_FRAMEWORKS = [
{id:'instantly-fw1',name:'Instantly - Value-Ladder Follow-Up System',structure:`Opener: direct offer/value prop. Follow-up 1: social proof ("[Named client] went from X to Y using our [mechanism]. Can I shoot you that video?"). Follow-up 2: detailed case study (company, problem, solution, specific result, "Reply yes and I'll shoot over a video"). Follow-up 3: breakup email with multiple-choice options. Reported to have tripled reply rate versus a single repeated ask.`},
{id:'instantly-fw2',name:'Instantly - Workshop Funnel',structure:`1) Build a highly targeted list. 2) Invitation email: case study + new method + invite ("We just helped Michael add $10K... reply 'yes' and I'll send a link to register"), backed by 3 follow-ups on the same angle. 3) Run a live workshop structured as Intro -> 3 points, each following Situation -> Problem -> Implication -> Teach -> Case study. 4) Close with an offer and booking CTA. Reported funnel math: 5,000 emails -> 200 replies -> 100 positive -> 50 attendees -> 10 booked calls -> 3 deals.`},
{id:'instantly-fw3',name:'Instantly - Positive Reply Protocol',structure:`On any positive reply: respond within minutes, send the promised value with a personal touch pulled from their site/socials ("One thing that stood out on your website is..."), then multi-channel follow-up within one week - call, email reply, LinkedIn connect + 3 follow-ups, Instagram follow/comment/DM - tracked through CRM stages (Interested -> Meeting Booked -> Meeting Complete -> Won/Lost).`},
{id:'instantly-fw4',name:'Instantly - 6-Step Copywriting Structure',structure:`Segment the list first -> write a specific, relevant opener that passes the "them-first" and "only-them" tests -> keep the body under ~80 words with 1-2 sentences per paragraph -> use a value-first, soft CTA (not a call ask) -> run 3-5 follow-ups, each adding a new value point or angle rather than repeating the last one.`},
{id:'instantly-fw5',name:'Instantly - Full A-to-Z Cold Email System',structure:`1) Generate leads (ICP + filters, evergreen campaigns off hiring/job-listing signals). 2) Write emails (subject -> first line -> problem -> implication -> offer with a named guarantee -> CTA). 3) Apply spintax + spam-word avoidance + a deliverability checker before sending. 4) Send with DNS/SPF/DKIM/DMARC in place, capped at ~15 messages/inbox/day, one domain per three inboxes. 5) Follow up 3-5 times, spaced 3-5 days apart depending on the prospect's seniority.`},
{id:'instantly-fw6',name:'Instantly - 5 Money-Maker Email Formats',structure:`1) Free-Fix Offer - spot one specific problem, offer to fix the first part free. 2) Intent-Based Signal Email - reach out the moment a buying signal appears (hiring, funding, expansion). 3) Hyper-Personalized Email - lead with a specific, visible mismatch (ad vs. landing page, reviews vs. site messaging). 4) Scarcity Email - only real, logical scarcity (e.g. one agent per market). 5) Three Ideas Email - give 3 relevant ideas, then offer to build the first one free.`},
]; // source: Instantly.ai, YouTube - cold email strategy and tutorial videos

const SMARTLEAD_FRAMEWORKS = [
{id:'smartlead-fw1',name:'Smartlead - 3-Email Max Sequence',structure:`Email 1 (heavy lift, under 100 words, clear and direct) -> Email 2 (~3 days later, adds new context or complements email 1, doesn't repeat it) -> Email 3 (new thread, new subject line, offers something free/valuable with no ask). Never send more than 3 - if email 1 isn't converting, fix email 1 rather than adding more follow-ups.`},
{id:'smartlead-fw2',name:'Smartlead - Segmented Personalization Framework',structure:`Segment the total addressable market on up to 5 axes: sub-industry, company size, geography, customer stage/maturity (bootstrapped vs. VC-backed), and specific problem solved. Match each segment to a persona (e.g. education -> K-12 = principals; higher ed = dean of admissions; corporate L&D = head of HR/chief of staff). Write one email per segment that is equally relevant to everyone in it, instead of writing fake per-person AI personalization.`},
{id:'smartlead-fw3',name:'Smartlead - 4 Things That Decide If Cold Email Works',structure:`List (company-first, at least ~20,000 addressable prospects) -> Offer (must solve a problem they care about right now) -> Deliverability (separate domains, 2 mailboxes per domain, 15-day minimum warm-up, 25 emails/day/inbox cap) -> Timeline (3-4 months minimum before judging results; need 1,500-2,000+ contacts before changing anything; benchmark roughly 1 positive reply per 300 contacted).`},
{id:'smartlead-fw4',name:'Smartlead - 4-Pillar Boring System',structure:`1) Email infrastructure (secondary domains, warmed mailboxes). 2) List building (enrichment via Clay/Smart Prospect). 3) Email copy (AI-assisted within a human-written structure, not fully AI-generated). 4) Campaign setup (sequence/cadence including non-email steps like a manual call task) - framed as a repeatable machine to build once rather than reinvent per campaign.`},
{id:'smartlead-fw5',name:'Smartlead - ABM List-Building Flow',structure:`Define the total addressable market at the company level first (not by job title) -> then find the right person inside each qualifying company. Contrasted explicitly with starting from a job title and searching across all companies.`},
]; // source: Smartlead.ai, YouTube - cold email strategy and tutorial videos

 <div class="card-head" data-toggle>

 <span class="caret">+</span>
 </div>
 <div class="card-body">
 <div class="tpl-block"><div class="label">Template</div><div class="tpl-text">${highlightPlaceholders(t.template)}</div></div>
 ${hasExample?`<div class="tpl-block"><div class="label">Example</div><div class="tpl-text" style="border-left-color:var(--ink-faint)">${esc(t.example)}</div></div>`:''}
 ${t.theory?.length?`<div class="tpl-block"><div class="label">Why it works</div><ul class="bullets">${t.theory.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
 ${t.when?.length?`<div class="tpl-block"><div class="label">When to use it</div><ul class="bullets">${t.when.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
 ${t.tip?`<div class="tip"><b>Pro tip - </b> ${esc(t.tip)}</div>`:''}
 <div class="tpl-block tpl-form" data-template="${encodeURIComponent(t.template)}" ${hasExample?`data-example="${encodeURIComponent(t.example)}"`:''}>
 <div class="label">Fill it in</div>
 <div class="field-grid fields"></div>
 <div class="live-fill"><div class="label">Your draft</div><div class="filled-out tpl-text"></div></div>
 <div class="rowbtns">
 <button class="btn primary use-filled">+ Add Filled Version to Draft</button>
 ${hasExample?'<button class="btn ghost use-example">+ Add Example As-Is</button>':''}
 ${t.prompt?'<button class="btn ghost show-prompt">Show AI Prompt</button>':''}
 </div>
 ${t.prompt?`<div class="prompt-box" style="display:none; margin-top:8px;">${esc(t.prompt)}</div>`:''}
 </div>
 </div>
 </div>`;
}

function wireCardToggles(){
 document.querySelectorAll('[data-toggle]').forEach(h=>{
 h.addEventListener('click', ()=> h.closest('.card').classList.toggle('open'));
 });
 document.querySelectorAll('.use-plain').forEach(b=>{
 b.addEventListener('click', (ev)=>{ ev.stopPropagation(); insertToDraft(decodeURIComponent(b.dataset.text)); });
 });
}

function extractFields(tpl){
 const seen = []; const re = /\{\{(.*?)\}\}/g; let m;
 while((m = re.exec(tpl))){ if(!seen.includes(m[1])) seen.push(m[1]); }
 return seen;
}
function wireTemplateForms(){
 document.querySelectorAll('.tpl-form').forEach(form=>{
 const tpl = decodeURIComponent(form.dataset.template);
 const fields = extractFields(tpl);
 const grid = form.querySelector('.fields');
 grid.innerHTML = fields.map((f,i)=>`<div class="field"><label>{{${esc(f)}}}</label><input data-f="${i}" placeholder="${esc(f)}"></div>`).join('');
 const fillOut = form.querySelector('.filled-out');
 function refresh(){
 let out = tpl;
 grid.querySelectorAll('input').forEach((inp,i)=>{
 const val = inp.value.trim();
 const token = '{{' + fields[i] + '}}';
 out = out.split(token).join(val ? val : token);
 });
 fillOut.innerHTML = highlightPlaceholders(out);
 form._current = out;
 }
 grid.querySelectorAll('input').forEach(inp=> inp.addEventListener('input', refresh));
 refresh();
 form.querySelector('.use-filled').addEventListener('click', (ev)=>{ ev.stopPropagation(); insertToDraft(form._current); });
 const exBtn = form.querySelector('.use-example');
 if(exBtn) exBtn.addEventListener('click', (ev)=>{ ev.stopPropagation(); insertToDraft(decodeURIComponent(form.dataset.example)); });
 const pBtn = form.querySelector('.show-prompt');
 if(pBtn) pBtn.addEventListener('click', (ev)=>{ ev.stopPropagation(); const box = form.querySelector('.prompt-box'); box.style.display = box.style.display==='none' ? 'block' : 'none'; });
 });
}

let modalConfig = null;
let modalFullscreen = false;
function openModal(config){
  modalConfig = Object.assign({sections:null, activeSection:null, searchTerm:'', searchPlaceholder:'Search...', searchable:true}, config);
  if(modalConfig.sections && !modalConfig.activeSection) modalConfig.activeSection = modalConfig.sections[0];
  modalFullscreen = false;
  document.getElementById('modalOverlay').classList.add('open');
  renderModal();
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); modalConfig = null; modalFullscreen = false; }
function toggleModalFullscreen(){ modalFullscreen = !modalFullscreen; renderModal(); }
function renderModal(){
  if(!modalConfig) return;
  const c = modalConfig;
  const hasSections = c.sections && c.sections.length > 1;
  const accent = accentForEyebrow(c.eyebrow);
  const heroIcon = catTypeIcon(c.title);
  const box0 = document.getElementById('modalBox');
  box0.style.setProperty('--accent', accent.color);
  box0.style.setProperty('--accent-tint', accent.tint);
  box0.classList.toggle('fullscreen', modalFullscreen);
  document.getElementById('modalOverlay').classList.toggle('fullscreen', modalFullscreen);
  let html = `<div class="modal-head">
    <div class="modal-head-left">
      ${heroIcon?`<span class="modal-hero-icon">${heroIcon}</span>`:''}
      <div><div class="modal-eyebrow"><span class="modal-accent-dot"></span>${esc(c.eyebrow||'')}</div><h2>${esc(c.title)}</h2></div>
    </div>
    <div class="modal-head-actions">
      <button class="modal-close-btn" id="modalFullscreenBtn" title="${modalFullscreen?'Exit full screen':'Full screen'}" aria-label="${modalFullscreen?'Exit full screen':'Full screen'}">${modalFullscreen?MODAL_COMPRESS_ICON:MODAL_EXPAND_ICON}</button>
      <button class="modal-close-btn" id="modalCloseBtn" title="Close" aria-label="Close">${MODAL_CLOSE_ICON}</button>
    </div>
  </div>`;
  html += `<div class="modal-scroll">`;
  if(hasSections && c.sectionHints){
    html += `<div class="section-cards" style="margin-top:16px;">` + c.sections.map(s=>{
      const active = s===c.activeSection;
      const hint = c.sectionHints[s] || '';
      return `<button class="section-card ${active?'active':''}" data-sec="${escAttr(s)}">
        <div class="sc-title"><span class="sc-check"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3.2L13 4.5"/></svg></span>${esc(s)}</div>
        <div class="sc-desc">${esc(hint)}</div>
      </button>`;
    }).join('') + `</div>`;
  } else if(hasSections){
    html += `<div class="chiprow" style="margin-top:16px;">` + c.sections.map(s=>{
      const dot = c.sectionAccent ? `<span class="chip-dot" style="background:${escAttr(c.sectionAccent(s))};"></span>` : '';
      return `<button class="chip ${s===c.activeSection?'active':''}" data-sec="${escAttr(s)}">${dot}${esc(s)}</button>`;
    }).join('') + `</div>`;
  }
  if(c.searchable){
    html += `<div class="searchbar" style="margin:${hasSections?'0':'16px'} 0 14px;">${SEARCH_ICON}<input id="modalSearch" placeholder="${escAttr(c.searchPlaceholder)}" value="${escAttr(c.searchTerm)}"></div>`;
  }
  html += c.renderBody(c.activeSection, c.searchTerm);
  html += `</div>`;

  const box = document.getElementById('modalBox');
  box.innerHTML = html;
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  document.getElementById('modalFullscreenBtn').addEventListener('click', toggleModalFullscreen);
  const s = document.getElementById('modalSearch');
  if(s){
    s.addEventListener('input', ()=>{
      c.searchTerm = s.value; renderModal();
      const el = document.getElementById('modalSearch');
      if(el){ el.focus(); el.selectionStart = el.selectionEnd = el.value.length; }
    });
  }
  box.querySelectorAll('.chip, .section-card').forEach(ch=> ch.addEventListener('click', ()=>{ c.activeSection = ch.dataset.sec; renderModal(); }));
  if(c.wireBody) c.wireBody(box);
}

function rulesByCategory(cat, term){

function alphaByTitle(items){
  return items.slice().sort((a,b)=> a.t.localeCompare(b.t));
}
function rulesGroupedHtml(items){
  let html = '';

    const pItems = alphaByTitle(items.filter(r=>r.p===person));

    html += personSubheadHtml(person) + ruleItemsHtml(pItems);

  const term = (searchTerms['rules-principles']||'').trim();

/* ---------- automated email checker ---------- */
const AUTO_CHECKS = [
  {label:'No em dashes', run:(subj,body)=>{
    const found = /\u2014/.test(subj) || /\u2014/.test(body);
    return {pass:!found, detail: found ? 'Found an em dash - use a regular dash instead.' : 'No em dashes found.'};
  }},
  {label:'No exclamation marks', run:(subj,body)=>{
    const n = ((subj+' '+body).match(/!/g)||[]).length;
    return {pass:n===0, detail: n===0 ? 'None found.' : `Found ${n} exclamation mark${n===1?'':'s'} - the rule says none.`};
  }},
  {label:'One question mark, max, in the body', run:(subj,body)=>{
    const n = (body.match(/\?/g)||[]).length;
    return {pass:n<=1, detail: `Found ${n} question mark${n===1?'':'s'} in the body${n<=1?' - fine.':' - the rule caps this at one.'}`};
  }},
  {label:'Subject never uses "Re:" or "Fwd:"', run:(subj)=>{
    const found = /\b(re|fwd):/i.test(subj);
    return {pass:!found, detail: found ? 'Subject line uses "Re:" or "Fwd:" - instant loss of trust.' : 'Clean.'};
  }},
  {label:'Subject line is 6 words or fewer', run:(subj)=>{
    if(!subj.trim()) return {pass:false, detail:'No subject line entered yet.'};
    const n = subj.trim().split(/\s+/).length;
    return {pass:n<=6, detail: `${n} word${n===1?'':'s'} - best performance is 6 or fewer.`};
  }},
  {label:'No unfilled placeholders left', run:(subj,body)=>{
    const found = /\{\{.*?\}\}/.test(subj+body);
    return {pass:!found, detail: found ? 'Still contains an unfilled {{placeholder}}.' : 'None left.'};
  }},
  {label:'No banned phrases from the 76 Phrases to Avoid', run:(subj,body)=>{
    const text = (subj+' '+body).toLowerCase();
    const hits = [];
    AVOID_PHRASES.forEach(g=>{
      g.items.forEach(p=>{ if(text.includes(p.toLowerCase())) hits.push(`"${p}" (${g.cat})`); });
    });
    return {pass: hits.length===0, detail: hits.length ? `Found: ${hits.join(', ')}` : 'None of the 76 banned phrases found, across all 9 categories.'};
  }},
  {label:"Doesn't mention your own company or product", run:(subj,body)=>{
    const text = (subj+' '+body).toLowerCase();
    const patterns = ['our company','our product',"we're a",'we are a','our service','our solution'];
    const hits = patterns.filter(p=> text.includes(p));
    return {pass: hits.length===0, detail: hits.length ? `Found: "${hits.join('", "')}" - keep the focus on the recipient.` : 'Focus stays on the recipient.'};
  }},
  {label:'Body stays reasonably short', run:(subj,body)=>{
    const n = body.trim() ? body.trim().split(/\s+/).length : 0;
    return {pass:n>0 && n<=150, detail: n===0 ? 'No body text yet.' : `${n} words${n<=150?' - reads fast.':' - consider trimming; most cold emails work best under ~150 words.'}`};
  }},
  {label:'Paragraphs stay to about two lines', run:(subj,body)=>{
    const paras = body.split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean);
    const long = paras.filter(p=>p.length>220);
    return {pass: long.length===0, detail: long.length ? `${long.length} paragraph${long.length===1?'':'s'} run long - try breaking them up.` : 'All paragraphs are tight.'};
  }},
  {label:'No memes or gifs mentioned', run:(subj,body)=>{
    const found = /\.gif\b|\bmeme\b/i.test(subj+' '+body);
    return {pass:!found, detail: found ? 'Mentions a meme or gif - these read as gimmicky in B2B.' : 'Clean.'};
  }},
  {label:'Never asks "should/do you want me to send it over"', run:(subj,body)=>{
    const found = /(should i send it over|do you want me to send it over)/i.test(body);
    return {pass:!found, detail: found ? 'Found the exact phrasing the rules warn against - try "Would it be okay if I send it over".' : 'Not found.'};
  }},
  {label:'Sounds human, not AI-polished', run:(subj,body)=>{
    const text = body.toLowerCase();
    const markers = ['basically','a bit','kinda','thing','honestly','pretty','stuff','tentatively assuming','grain of salt'];
    const hit = markers.some(m=> text.includes(m));
    return {pass:hit, detail: hit ? 'Found at least one human, informal word.' : 'No casual/human markers found - consider adding one, per the tone rules.'};
  }},
];

}
