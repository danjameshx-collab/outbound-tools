const RULES = [
{title:`13 Rules of Engagement - Penn Frank`,intro:`Use as a checklist - pick the 2-3 that make the most sense for a given message, don't cram in all 13.`,items:[
{h:'1. Relevance',b:`"This is about ME." Weave in specific details: role, time in role, industry, company, colleagues, pain points, goals, tech stack, recent wins. Front-load personalisation into the opening statement to optimise preview text.`},
{h:'2. Curiosity',b:`Humans hate information gaps (the Zeigarnik effect). Drop enough breadcrumbs to create intrigue while still positioning your solution clearly enough to filter out tire-kickers.`},
{h:'3. Social Proof',b:`Cold prospects are automatically skeptical - reference case studies from competitors or adjacent-space companies. No case study? Use awards/certifications subtly, e.g. as a P.S.`},
{h:'4. Authority Bias',b:`If you can articulate the prospect's pain better than they can, they'll assume you have the solution.`},
{h:'5. FOMO / Loss Aversion',b:`Humans value potential losses more than equivalent gains. Create urgency subtly - hint at opportunities competitors are already seizing.`},
{h:'6. Reciprocity',b:`Prospects feel compelled to respond when they sense real effort - personalisation, homework, or offering something valuable in the CTA.`},
{h:'7. Clarity',b:`"Confuse, you lose." Feature-talk and jargon cause disengagement - keep it simple and scannable.`},
{h:'8. Urgency',b:`Tie urgency to real business impact/market movements - active job roles, fundraising rounds, company milestones.`},
{h:'9. Ego',b:`Make them the hero - either subtle relevant flattery, or creative storytelling that paints them as the leader in their space.`},
{h:'10. Pattern Interrupt',b:`The brain ignores what's predictable. Buyers see thousands of messages a week - whether tone, format, or offer, just be different.`},
{h:'11. Simplicity Bias',b:`Keep the ask simple, especially the CTA. The easier it seems, the more likely people engage.`},
{h:'12. Narrative Transportation Bias',b:`Information wrapped in a story lowers people's barriers. A well-crafted narrative stands out and builds connection.`},
{h:'13. Autonomy Bias',b:`Humans need to feel like agents of their own lives. Forced-feeling asks trigger resistance - humbling disclaimers like "I suspect you've got everything under control" convey this.`},
]},
{title:`4 Elements of the Buyer's Brain - Penn Frank`,items:[
{h:'Skepticism = default mode',b:`The buyer starts at a flat "no." Every message is a potential time sink, budget risk, or career threat. Disarm these barriers fast.`},
{h:'Attention economics',b:`Buyers get hundreds of messages weekly and have sophisticated filters for obvious sales messages, excessive length, and generic strategies. A few seconds to break the pattern.`},
{h:'The trust paradox',b:`Modern buyers want to be sold to but hate being sold to - the moment they smell a pitch, walls go up. Be clear about the offer while keeping tone human.`},
{h:'Information processing patterns',b:`The buyer's brain subconsciously asks: who is this, can I trust them? Is this relevant right now? What are they asking, how much effort, what's the risk? Specific personalisation answers the first two; a low-friction offer answers the third.`},
]},
{title:`3 Tactical Concepts - Penn Frank`,items:[
{h:'Message Market Fit (MMF)',b:`Test broadly, hone in on the winner - but never stop testing new angles, to avoid spam-filter pattern detection and copy fatigue.`},
{h:'Sequence momentum',b:`No more "just checking in." Each message should build on the last; the compound effect means several moderate-punch messages together drive action.`},
{h:'Forget the rules',b:`Highest performers deliberately break "best practice": double case studies (body + P.S.), longer messages when justified, WhatsApp-style DM brevity, CTA stacking (a light ask in the body, a softer nudge in the P.S.).`},
]},
{title:`Master Rules - Formatting, Structure & Word Economy`,intro:`Merged from StackOptimise's 55 Cheat Codes and 47 Copywriting Rules.`,items:[
{b:`Never use the long em dash " -." Use a regular dash or short sentences instead.`},
{b:`Paragraphs max two lines - highly digestible, effortless to read on mobile.`},
{b:`Default to short and scannable - every line should justify the next; if a line can be cut without affecting the message, cut it.`},
{b:`One question per email, max - more overwhelms the eye and weakens the close.`},
{b:`Less enthusiastic punctuation - no exclamation marks; use "?" once per email at most.`},
{b:`Launch straight into the first line - skip "Hi John, hope you're well." Start with signal.`},
{b:`Write the subject line last - let the body guide the hook.`},
{b:`Ensure alignment between subject line and body - misalignment evaporates trust.`},
{b:`Make subject lines look internal and unremarkable, or personalise them dynamically - blending into inbox noise increases opens.`},
{b:`Be ruthless with words - cut everything that doesn't add value. Shorter is stronger: "Noticed" instead of "I noticed."`},
{b:`For the tightest results, some formulas cap the body at 80 words - if you're already under 150 and still not landing replies, trim further before touching anything else.`},
]},
{title:`Master Rules - Deliverability & Send Formatting`,intro:`From Inbox Engineering and Inbox or Bust - copy choices that protect inboxing, not just readability.`,items:[
{b:`Go text-only by default - no HTML, images, banners, or buttons. It should read like a message to a colleague, not a newsletter. Only add a link/image if you've tested that the reply lift outweighs the inbox-rate hit (e.g. ~10% fewer inboxed if it costs you ~30% more replies is still worth it - test your own numbers).`},
{b:`Use a one-tap, single-word CTA on the first touch instead of a form or booking link - "Reply 'yes' and I'll send it over" converts and protects deliverability better than a scheduling link this early.`},
{b:`If generating copy with AI, run a second pass that rewrites the same structure with different wording per send - identical templates create a fingerprint that spam filters learn to catch.`},
{b:`Practical pre-send copy check: subject line short, natural, non-clickbait - first line proves relevance via a real trigger/role/event - one low-effort CTA - no heavy formatting - each follow-up shorter than the one before it.`},
{b:`When testing, optimise for inboxed replies, not open rate alone - a high open rate on a domain that's losing inbox placement is a false signal.`},
]},
{title:`Master Rules - Personalization`,items:[
{b:`Case studies must always be relevant - explicitly acknowledge the commonality: "We work with Monzo (also in fintech)."`},
{b:`Personal data points should sound natural: "Hi Penn, saw you head up SO," not "Hi Penn, saw you're the Chief Executive Officer at StackOptimise Ltd."`},
{b:`Front-load personal data points in the opening sentence to optimise preview text and instantly signal relevance.`},
{b:`All phrasing must be uniquely generated per prospect - no reusing generic intros or rigid AI placeholder templates.`},
{b:`Avoid repeating the same descriptor twice (e.g. recipient's industry/role) - repetition reads as templated.`},
{b:`Be specific - humans think in specificities, not generalities. "I spoke to Felix Frank recently (the founder at StackOptimise)" beats "I spoke to a Founder recently."`},
{b:`Get hyper-focused on the prospect's pain, not the company's abstract problem. Pain = "email campaigns aren't generating replies because messaging is off." Problem = "poor sales." The former resonates more.`},
]},
{title:`Master Rules - Tone & Language`,items:[
{b:`Use language a 10-year-old would understand - no corporate or technical jargon.`},
{b:`Keep a neutral tone - minimise praise/flattery. Praise from a stranger reads as insincere and signals AI-generated. Never use "impressive" or "congrats."`},
{b:`Don't over-polish. De-polish by listing two things instead of three, starting sentences with "And"/"But," dropping a rough aside in brackets - but don't overdo it.`},
{b:`Avoid marketing phrases like "cutting-edge," "innovative," "enhance."`},
{b:`Use brackets to inject tone/warmth, but only once per email or it feels forced.`},
{b:`Use relatable metaphors the buyer already thinks in, tailored to their world.`},
{b:`Use human, informal words: "basically," "a bit," "kinda," "thing."`},
{b:`Sparingly de-capitalise job titles/company names for a manual-send feel - more appropriate for startup/SME than enterprise.`},
{b:`Ditch filler phrases entirely: "just reaching out," "wanted to introduce," "touch base."`},
{b:`Use "this" instead of "our product" - "this" sounds like a movement worth exploring; "our product" sounds like a pitch.`},
{b:`Avoid ROI metrics and numbers without context - they hurt trust and can't be substantiated. Tell a story instead.`},
{b:`Don't use memes or gifs - signals automation/gimmickry and kills credibility in high-consideration B2B sales.`},
]},
{title:`Master Rules - Message Focus & Positioning`,items:[
{b:`Make sure the core offer is clear by the end of the message - even without naming the mechanism.`},
{b:`Don't mention your company name - it flips the buyer's brain from "human trying to connect" to "sales rep pitching."`},
{b:`Don't state your specific service/mechanism - focus on impact. No one wants "SEO," they want more traffic/conversions.`},
{b:`Frame value without talking about yourself: "Some teams are switching to..." beats "We help companies..."`},
{b:`De-risk the mental lift: "Not trying to change your stack - this just sits on top of it," or "Literally only takes 2 hours to set up."`},
{b:`Be clear you can help, not that you already have - "can share 3 campaign ideas" beats falsely claiming "already mapped 3 ideas."`},
{b:`Never write "Should I send it over" - it triggers defensiveness. Use "Would it be okay if I send it over" or "Mind if I share it."`},
{b:`Keep the CTA low-commitment but specific - not "let me know if you're interested," but a named, concrete offer: "Mind if I send over a 2-minute video on how [Company] specifically could use this?"`},
{b:`When there's no strong buyer signal to hang the email on, frame it as a side-thought rather than the reason you're writing: "Flagged this after seeing your product launch yesterday" or "This came up in a Slack convo today" - lowers the stakes and reads less like a pitch.`},
{b:`Use negative framing to build intrigue - "most teams haven't cracked X yet" invites curiosity harder than a positive claim does.`},
]},
{title:`Master Rules - Flow, Signals & Triggers`,items:[
{b:`Maintain email cohesion - every line should flow logically from opener to CTA (the "fluency effect").`},
{b:`Lead with immediate engagement - the opening line must scream relevance.`},
{b:`Run the self-interest check before sending: read it as the buyer and ask "would I reply to this?"`},
{b:`Stack signals to build a "why now" narrative - one signal is a reason to reach out, two is a reason to respond.`},
{b:`Avoid cliche lines for saturated triggers ("Congrats on the fundraise") - frame more subtly, e.g. as a side-thought.`},
{b:`Use anti-triggers to disarm: flip a common buyer signal into a reason they're probably too busy to talk, not a reason to talk. Extend the same anti-trigger into the CTA.`},
{b:`Use contrast to highlight change: "Most teams are doing X - a few are trying Y." Sparks curiosity, positions you as in-the-know.`},
{b:`Imply the reader is already behind, without being accusatory: "Others are already switching" - subtle urgency without hype.`},
]},
{title:`Follow-Up Principles`,intro:`Merged from Master Rules, Follow-Up Strategy, and Penn Frank's 3D Follow-Up Formula. See the Cold Email Bank tab for the 9 Creative Follow-Up Angles.`,items:[
{b:`Every follow-up must add a new angle - no bumping, no "just checking in." Share new social proof, a different pain point, or a new trigger. Zero tolerance for pure reminder emails.`},
{b:`Ensure follow-ups flow as a connected narrative, not disconnected fragments - reference earlier emails ("Last time I mentioned X - thought I'd expand").`},
{b:`Be persistent until you get a clear yes or no; be visible across more than one channel; add value every time.`},
{b:`On the breakup (final) email, explicitly acknowledge it's the last one, or risk being marked as spam.`},
{h:'The 3D Formula',b:`Different - introduce something new each time. Disarming - keep the tone light and easy to engage with; self-deprecating humour goes a long way. Direct - cut the fluff, stay concise and actionable.`},
{h:'How many follow-ups?',b:`2-3 is the sweet spot - beyond 3 feels desperate and can harm domain reputation. Small TAM can support longer sequences; large TAM should stay lean (1-2, then move on). Exception: longer, high-value enterprise sales cycles can justify stretching to a ~9-email sequence, provided every message still clears the "adds a new angle" bar above rather than just bumping the thread.`},
]},
{title:`Enterprise Outreach - 5 Principles`,intro:`Enterprise is noisier, higher-stakes, and layered - five principles that consistently cut through.`,items:[
{h:'Lead with goodwill',b:`Enterprise inboxes are flooded and defended; start with something of genuine, no-strings value.`},
{h:'Executive engagement',b:`Once interest sparks, a crisp follow-up from your own CEO or sales leader shows intent and raises perceived importance.`},
{h:'Optimise for forwardability',b:`Multiple stakeholders are involved - write clear, jargon-free messages and suggest who else it might be relevant for.`},
{h:'Stack social proof',b:`Bigger companies carry bigger perceived vendor risk - highlight similar brands worked with and relevant outcomes.`},
{h:'Own your tone',b:`Deferential language ("I know you're busy") signals low status. Enterprise buyers respond to authority, not apologies - speak like a peer.`},
]},
{title:`Humor in Cold Email`,intro:`Formula: Humour + Relevance + Respect = Replies. Think of it like salt - a little lifts the flavour, too much ruins the dish.`,items:[
{h:'Anatomy of a funny email',b:`Subject/opener (short, a tiny smile) -> one-line context (why you wrote, kept human) -> value in 1-2 lines -> soft CTA -> friendly sign-off.`},
{h:'7 Humour Moves',b:`Self-deprecation (make yourself the joke); hyper-earnest honesty (say the quiet part out loud); exaggeration; playful non-threat; brand reference (their tone/slogan, respectfully); oddly specific numbers; reverse CTA (give them control, e.g. "reply 'stop' and I'll go touch grass").`},
{h:'5 Humor Safety Rules',b:`Be kind, not cruel (punch up at your own expense). Keep it clean (no politics/personal jokes). Tie it to something true. Be short (one line is enough). Give them an easy out.`},
{h:'What to avoid',b:`Don't force jokes when the brand is formal. Don't use sarcasm if nuance may be missed. Don't stack jokes - one and done. Don't joke about people, groups, or pain points. Don't use memes or gifs.`},
{h:'Testing & scoring',b:`A/B test the opener only, cap at 1 joke per email, track opens/positive replies/meeting rate. After 100 sends: positive replies over 3% -> scale; 1-3% -> iterate; below 1% -> cut.`},
]},
{title:`Using AI to Draft & Polish Copy`,intro:`The PORT framework for structuring AI prompts.`,items:[
{h:'Perspective',b:`Tell the AI who it is, e.g. "You are an expert sales researcher working for a B2B lead generation agency."`},
{h:'Objective',b:`What it needs to do, tightly stated, e.g. "Find two well-known competitors based on the company summary provided."`},
{h:'Rules',b:`Constraints for consistent output - input handling, formatting, edge cases.`},
{h:'Text',b:`The actual input (company description, job title, etc). Also set Tone, Format, and Focus explicitly.`},
{h:"Segment, don't multitask",b:`Split multi-step asks into sequential prompts rather than one combined instruction - segmented tasks are sharper and more reliable.`},
{h:'Power features',b:`Confidence filtering (only return results the AI is 100% sure of); multi-perspective analysis (simulate 3 researchers discussing what's unique); strict data-source boundaries (only reference the provided domain, no outside hallucination).`},
{h:'Common mistakes',b:`Asking for too much in one prompt. Vague instructions ("write something good" vs. "write a 12-word casual intro"). Ignoring output format. No fallback for edge cases.`},
]},
]; // /*INSERT:RULES*/

const CHECKLISTS = [
{id:'presend',title:'Before You Hit Send',intro:'Merged from the $1M Playbook and the Master Rules cheat sheet.',items:[
{h:'Strip it to its core',b:`Every extra word is friction. If a sentence works without a word, cut it. Forget perfect grammar - clarity wins.`},
{h:'How easy is it to say yes?',b:`Short 1-2 sentence paragraphs. Make the next step effortless and the message scannable.`},
{h:'Does it sound cookie-cutter?',b:`Scan it: does it sound like everything else in their inbox? If yes, rewrite - break the pattern, ditch the corporate speak.`},
{h:'Run the self-interest check',b:`If I were the decision-maker, would I actually respond to this? Step into the buyer's shoes and read it from their side.`},
{h:'Length check',b:`Does every word or line serve a purpose? Remove what doesn't.`},
{h:'Simplicity check',b:`Is the value proposition clearly communicated?`},
{h:'Subject/body alignment',b:`Does the subject line match the body's promise? Misalignment evaporates trust.`},
]},
{id:'humorcheck',title:'Using Humour? Quick Check',intro:'Run this before sending anything with a joke in it.',items:[
{b:`Would I say this in a room with the target company's team?`},
{b:`Does the joke make fun of me, not them?`},
{b:`Is the joke tied to a true fact?`},
{b:`Is it under 15 words?`},
{b:`Is it capped at one joke for the whole email?`},
]},

// Fold every rule/principle section into checkable pre-send items too, so nothing
// in Rules & Angles is reference-only - it all becomes something you can tick off.

  if(!sec.items || !sec.items.length) return;
  const id = 'rule-' + sec.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
  CHECKLISTS.push({id, title: sec.title, intro: sec.intro, items: sec.items});
});

/* ============================================================
 COLD EMAIL RULES & PRINCIPLES - Eric Nowoslawski / Matt Lucero / Frank Brothers
 ============================================================ */
// RULES DATA - consolidated from raw extraction notes. p=person, cat=category, src=source title, t=title, b=body, ex=optional example quote
const RULES_LESSONS = [

// ============ MINDSET & STRATEGY ============

{p:'Eric Nowoslawski', cat:'Mindset & Strategy', src:'Cold Email First Principles Thinking / I Tested 500,000 Cold Email', t:'Test everything, trust nothing labeled "best practice"', b:`Most rules people repeat ("don't send images," "don't send video") aren't first principles, they're borrowed conventions. Run the test yourself: if a video reaches only 30% of inboxes but drives far more replies than a plain-text version reaching 80%, the video wins even though it looks worse on a deliverability scorecard. Once you've run ~20 experiments on a campaign, keep iterating on your current best performer rather than chasing someone else's benchmark numbers or restarting from scratch - reply-rate benchmarks vary hugely by LTV:CAC and market size, so a campaign that looks "poor" by raw numbers can still be a great customer.`},
{p:'Eric Nowoslawski', cat:'Mindset & Strategy', src:'Cold Email First Principles Thinking / Focus on Offers Made To Convert Cold Traffic', t:'The three pillars: deliverability, list, copy', b:`Everything about cold email reduces to three buckets: inbox deliverability (can the message be seen), list building (are you reaching the right people), and copywriting/campaign strategy (is the message valuable to them). Every tactical decision should trace back to improving one of these three - it's the mental model to return to whenever a campaign underperforms, instead of chasing a new trend.`},
{p:'Eric Nowoslawski', cat:'Mindset & Strategy', src:'Cold Email First Principles Thinking', t:'Three requirements for a positive response', b:`Getting a reply requires three things to be true at once: the message actually lands somewhere the prospect will see it, it reaches someone who is genuinely the right fit, and it offers something that person finds valuable. Miss any one of the three - even a perfect message sent to people who don't have the problem you solve - and the campaign fails regardless of how good the other two are.`},
{p:'Eric Nowoslawski', cat:'Mindset & Strategy', src:'Focus on Offers Made To Convert Cold Traffic', t:'Offer and audience quality beat clever automation', b:`The single biggest lever for cold outbound performance is the offer itself and how well the audience is segmented for it - not fancier Clay tables, scraping tricks, or trigger-based workflows. Redirect the effort you'd spend building a new automation hack into designing a better offer and picking who it's for instead.`},
{p:'Eric Nowoslawski', cat:'Mindset & Strategy', src:'Focus on Offers Made To Convert Cold Traffic', t:'"Knowledge arbitrage" as your core hook', b:`Every business holds inside knowledge about its market that prospects wish they had - that gap is what to lead an email with instead of a generic pitch. It doesn't require a big free-work commitment; one well-chosen insight can carry the whole email (e.g. offering to review a prospect's ad account live and point out obvious waste, backed by a past client result).`},
{p:'Eric Nowoslawski', cat:'Mindset & Strategy', src:"I sent 10,000,000 cold emails, here's what works in 2025", t:'"GTM alpha": systemize what a sharp human would do manually', b:`Borrowing Clay's term "GTM alpha" (from the investing idea of beating the market average), frame the goal of every campaign as outperforming the generic baseline reply rate. The method is always the same: figure out what a sharp human would manually research about a prospect in about ten minutes, then build a system (usually in Clay) that does that research and personalization automatically at scale.`},
{p:'Eric Nowoslawski', cat:'Mindset & Strategy', src:'Outbound Copywriting: Chunking Up and Down', t:'Reframe the copy before you touch the list', b:`When a first campaign underperforms, don't jump straight to rebuilding the target list - messaging problems often get misdiagnosed as targeting problems. Test both a "chunked up" and "chunked down" version of the same offer first (see Copywriting & Message Structure), and only look at list changes after that.`},
{p:'Eric Nowoslawski', cat:'Mindset & Strategy', src:'I Tested 500,000 Cold Email, This Is The Best Campaign', t:'Default to a proven structure instead of reinventing copy', b:`One structural campaign format ("creative ideas") stayed the top performer for over two years across very different business types - a bootstrapped SaaS tool, a large brand, a media company, a PR firm. For a new client or offer, start from a validated structural template instead of a blank page.`},
{p:'Eric Nowoslawski', cat:'Mindset & Strategy', src:'This Is The First Strategy I Recommend To Anyone Starting Cold Email', t:'Prefer campaigns that scale by market size, not by a finite trigger list', b:`Compare campaigns by how they're capped: new-hire, competitor-user, look-alike, and technographic campaigns are all capped by a finite, findable list of triggers. The AI-generated creative ideas campaign is capped only by how many people in the target market you can find a valid email for, which is why it outperformed every other campaign type (85 contacts per opportunity vs. 176-341 for the others) in Instantly's own first split test.`},
{p:'Eric Nowoslawski', cat:'Copywriting & Message Structure', src:'This Is The First Strategy I Recommend To Anyone Starting Cold Email', t:'The AI-generated creative ideas campaign structure', b:`Structure: "Hey [FirstName], I had some ideas about how we could target [customer type] together. Here's what I'm thinking. Idea one, idea two, idea three, value prop, CTA," followed by a hedge line ("Of course we can do other things - let me know if you had any other ideas") since prospects will sometimes judge the specific ideas rather than the offer itself. Vary the length: a full three-bullet version, a single hard-hitting one-sentence idea, or one idea in the body plus a second idea in the PS to keep the body short while still surfacing multiple options.`},
{p:'Eric Nowoslawski', cat:'Copywriting & Message Structure', src:'This Is The First Strategy I Recommend To Anyone Starting Cold Email', t:'Longer copy is fine when the content is genuinely good', b:`The filled-out creative ideas example runs noticeably longer than Instantly's own stated best-practice email length - Eric's rule of thumb is that people will read a longer email as long as what's in it (the ideas themselves) is good enough to be worth reading. Don't cut good, specific ideas just to hit a word-count target.`},
{p:'Eric Nowoslawski', cat:'Tools & AI', src:'This Is The First Strategy I Recommend To Anyone Starting Cold Email', t:'Set up the creative ideas prompt in three steps', b:`1) Define the allowed ideas explicitly - state what the AI is not allowed to suggest (e.g. "don't mention accounts receivable or FP&A, only software spend reduction") so ideas stay inside what the business can actually fulfill; without this constraint the AI will generate technically-possible but operationally unrealistic ideas. 2) Hand-write outreach for ~10 real companies first so that manual work becomes training data the prompt can reference for tone and idea quality. 3) Optimize for cached inputs.`},
{p:'Eric Nowoslawski', cat:'Tools & AI', src:'This Is The First Strategy I Recommend To Anyone Starting Cold Email', t:'Structure prompts to exploit LLM input caching', b:`Keep the fixed instructions (role, rules, allowed-ideas constraints, example outputs) at the very top of the prompt and unchanged across every call, and put only the variable part - the specific company's website summary - at the very bottom. OpenAI, Anthropic, and other providers charge less to reprocess an input they've already seen, so this ordering cuts the cost of running the prompt at scale.`},

{p:'Matt Lucero', cat:'Mindset & Strategy', src:'START HERE: How to Run Cold Email for Any Business', t:'Who cold email actually works for', b:`Cold email suits B2B (or at minimum B2C with findable data) offers where the product/service is relatively expensive and the audience can be identified and scraped. In a referenced clip, Alex Hormozi's framing is used: the larger the deal size and the more specific/narrow the target account, the more cold outreach makes sense; the lower the LTV and the broader the target, the better ads and content perform - going after small "minnow" accounts with outbound is like "slinging a harpoon" at them. If you can't source contact data or you're selling low-ticket to broad consumers, lean on ads or content instead.`},
{p:'Matt Lucero', cat:'Mindset & Strategy', src:'START HERE: How to Run Cold Email for Any Business', t:"Don't bolt on a channel just because it exists", b:`If your current channels (ads, referrals) are working and not capped out, adding cold email just introduces new risk without solving a real problem. Only add a new channel once an existing one is maxed out, getting too expensive, or drying up - not as a default "more is better" move. Outsourcing execution only really makes sense once a business is doing roughly $1M+/year; below that, build the system in-house.`},
{p:'Matt Lucero', cat:'Mindset & Strategy', src:'START HERE: How to Run Cold Email for Any Business', t:'Diagnose "not working" before blaming the channel', b:`When someone insists cold email "isn't working," test whether the underlying business/offer is the problem, not the channel - run the same offer through paid ads and content too. If it fails everywhere, it's a market/offer fit issue, not a cold-email issue. Since cold email is comparatively cheap to run, the real cost of continued testing is your time, so push longer before concluding the channel "doesn't work." Also expect normal funnel drop-off: you will never convert 100% of interested replies into booked, attended meetings - that's not evidence something is broken, it's a reason to follow up patiently.`},
{p:'Matt Lucero', cat:'Mindset & Strategy', src:'i sent 600,000 cold emails and learned this', t:"Platform choice isn't the lever that matters", b:`After 650,000 emails split across three sequencers (Instantly, SmartLead, PlusVibe) and three mailbox providers (ZapMail, HyperType, Inbox Kittens), there was no statistically significant winner among reputable, established platforms. Stop agonizing over which tool to use - pick a well-known one and get good at it. Redirect that energy into the five variables that actually determine performance: your list, your offer, your email copy, your infrastructure hygiene (domains/warm-up), and your follow-up speed. A rigorous test campaign can still generate real pipeline - the 600k-email test, run purely for report data, still booked meetings and closed several five-figure deals.`},
{p:'Matt Lucero', cat:'Mindset & Strategy', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'Cold email is fundamentally a numbers game', b:`At any given time only about 3% of a market is actively in-market to buy, so even a highly targeted, well-crafted campaign will get mostly disinterest. Generating a meaningful number of meetings requires getting in front of large numbers of people consistently, not expecting a high hit-rate from a small list.`},
{p:'Matt Lucero', cat:'Mindset & Strategy', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'The "bridge" model: every plank has to hold', b:`A working cold email system is a bridge made of planks: offer, lead list, copy, deliverability, and response handling. If a single plank is missing or broken (e.g. deliverability is bad and everything lands in spam), you don't get a partial result - you get close to zero meetings, because the failure compounds across the whole chain.`},
{p:'Matt Lucero', cat:'Mindset & Strategy', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'Build a marketing thesis before writing any copy', b:`Before touching subject lines or scripts, do real market research: define exactly who you're targeting, their pain points and desires, what to offer them, and how to frame it - like writing a thesis before an essay. Skipping this step is why most people's conversion rates stay low no matter how much volume they send.`},
{p:'Matt Lucero', cat:'Mindset & Strategy', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'The meetings-booked formula: offer resonance dwarfs copywriting', b:`Rough formula: leads contacted x offer resonance x 0.05 = meetings booked, where offer resonance is a 0.01-1 score for how well the offer fits the specific audience. A weak offer might yield one meeting per 5,000 contacted, an average offer one per 500, a very strong offer-audience fit one per 20 - meaning offer/audience match can change results by multiple orders of magnitude, far more than any copywriting tweak. Resonance is relative, not absolute: a strong offer to the wrong audience won't resonate, and the right audience with the wrong offer won't convert either - treat targeting and offer design as inseparable, not sequential.`},
{p:'Matt Lucero', cat:'Mindset & Strategy', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'Mine your existing client base to define the ICP', b:`Rather than guessing who wants your service, survey people who already bought - they're proof of product-market fit. Ask past clients what they tried before you, what their end goal was, what would have made buying a no-brainer, and what would improve the service, then use the answers to refine targeting and offer framing.`},
{p:'Matt Lucero', cat:'Mindset & Strategy', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE) / Video 1', t:'Scale volume to validation, not by default', b:`Start at a lower daily send volume (100-1,000/day) rather than jumping straight to 10,000/day, and only scale once a specific market segment shows good response with relevant, well-targeted messaging - scaling an unproven or poorly targeted campaign just produces spam complaints faster. The "send thousands/day" guidance is a baseline for people who haven't yet proven their offer; one customer sent only 500 emails/day but still landed ~20 sales calls/month because the offer was already validated. Once you know your ratios (X emails to 1 reply, Y replies to 1 meeting, Z meetings to 1 closed deal), reverse-engineer exactly how many emails/day you need from a revenue goal, turning lead gen into a predictable system instead of guesswork.`},
{p:'Matt Lucero', cat:'Mindset & Strategy', src:'Video 1 (batch 3)', t:'A good list beats a good script', b:`Who you target matters more than how well you write - pitching to an audience that doesn't want your product fails no matter the copy, while an audience that badly needs it converts even on a sloppy pitch. Assuming your script isn't actively terrible, fixing your targeting produces bigger gains than polishing copy.`},
{p:'Matt Lucero', cat:'Mindset & Strategy', src:'Video 2 (batch 3)', t:'The #1 root-cause mistake: skipping fundamentals for advanced tactics', b:`The single biggest category of failure is people diving into advanced plays (Clay AI personalization, hyper-scraping) while never nailing three basics: reasonable deliverability setup, actually-accurate targeting, and clearly stating what they sell. Nail just those three, assuming product-market fit exists, and you'll get results. Relatedly, don't hyper-fixate on one inbox provider's shifting spam-filter algorithm (e.g. "cracking" Outlook) - the rules can change overnight, so split-test and adapt generally instead of obsessing over one platform.`},

{p:'Frank Brothers', cat:'Mindset & Strategy', src:'1M Frank eBook', t:'Standing out is the new baseline, not a bonus', b:`AI and automation have multiplied the volume of outreach every buyer receives, so the buyer's brain now filters out anything resembling the norm. Following "best-practice" templates guarantees a message blends into an "ocean of sameness" and gets ignored - deliberate pattern-breaking (tone, format, or offer) is now a baseline requirement, and the brain automatically tunes out anything that looks like the thousands of other messages a buyer sees weekly.`},
{p:'Frank Brothers', cat:'Mindset & Strategy', src:'1M Frank eBook', t:"The buyer's brain: skepticism, attention economics, and the trust paradox", b:`Every cold email lands against a brain hardwired to protect time, budget, and reputation - the buyer's starting position is a flat "no," not a neutral maybe. Buyers are bombarded with hundreds of messages weekly and have built automatic filters for obvious pitches, overlong messages, and generic strategies - you have only a few seconds to break through. And buyers genuinely want useful information but the instant they detect a pitch, walls go up (the "trust paradox") - stay clear about the offer while keeping the tone human. On reading any cold message, a buyer subconsciously runs through three questions in order: who is this and can I trust them, is this relevant to me right now, and what exactly are they asking plus what's the risk/effort - sharp personalization answers the first two, a simple low-friction CTA answers the third.`},
{p:'Frank Brothers', cat:'Mindset & Strategy', src:'1M Frank eBook', t:"Don't stack every trigger into one message", b:`Apply only 2-3 relevant psychological triggers per message rather than cramming in every principle at once. Over-engineering a message with too many angles makes it feel try-hard and dilutes the impact of each individual trigger.`},
{p:'Frank Brothers', cat:'Mindset & Strategy', src:'1M Frank eBook', t:'Forget the rules when the content earns it', b:`Deliberately violate conventional cold-email dogma (under 50 words, one CTA only, no P.S., always short) when the situation justifies it - top performers double up case studies (one in the body, one in the P.S.) to reinforce credibility through repetition, write longer messages when the content earns the extra read time, and use WhatsApp-style short, informal DM copy even inside a formal email channel.`},
{p:'Frank Brothers', cat:'Mindset & Strategy', src:'Unlocking Enterprise', t:"Cold email opens the door, it doesn't close the deal", b:`Cold email alone won't win an enterprise contract - its job is only to get the conversation started. Set expectations for the channel accordingly: a reply or meeting is the win, not the signed deal itself. Enterprise inboxes are also noisier, spam filters tighter, stakeholders more layered, and buyers more resistant to vendors by default - enterprise needs distinct principles and execution, not just a scaled-up version of normal cold email.`},
{p:'Frank Brothers', cat:'Mindset & Strategy', src:'55 Cold Email Copywriting Cheat Codes', t:'Run the self-interest check before sending', b:`Before hitting send, reread the email as if you were the recipient and ask "would I actually reply to this?" If the message reads like it's serving your agenda - your product, your pitch - rather than the buyer's world and priorities, rewrite it. Treat this as the final gut-check filter that catches self-serving copy that slipped through every earlier editing pass.`},
{p:'Frank Brothers', cat:'Mindset & Strategy', src:'Frank Collective Outbound Lessons Doc', t:'Stay a human, not a pitch', b:`Never mention your own company's name in the outreach copy. The moment a prospect's brain registers a company name, it reclassifies the email from "a person reaching out" to "a sales rep pitching," which triggers resistance - keep every sentence focused on the recipient and their situation instead of on who you are or what you sell.`},
{p:'Frank Brothers', cat:'Mindset & Strategy', src:'Frank Collective Outbound Lessons Doc', t:'Describe the problem, let them infer the fix', b:`Don't open by explaining who you are or what your product does. Instead, describe the painful status quo the prospect is likely living in, then briefly gesture at the shift other companies are making - let the prospect connect the dots to the solution themselves rather than being told directly.`, ex:`"Some teams are switching to..." rather than "We help companies..."`},
{p:'Frank Brothers', cat:'Mindset & Strategy', src:'Frank Collective Outbound Lessons Doc', t:'Anti-trigger framing', b:`Rather than using a trigger (funding round, new hire) as the reason someone should talk to you, flip it: use the trigger as a reason they're probably too busy to. That distance paradoxically creates intrigue instead of pressure. Carry the same low-pressure logic into the CTA so the whole email stays consistent - explicitly saying no response is expected removes the obligation to engage, which ironically makes replying easier.`, ex:`"Saw you just closed your Series B and are likely deep in hiring... so I'm not asking for a call, just happy to send something over."`},
{p:'Frank Brothers', cat:'Mindset & Strategy', src:'How to Get a Meeting with Anyone', t:'Human touch is the differentiator, not the liability', b:`As automated, AI-generated outreach floods every channel, uniquely human, creative, and personal gestures stand out more than ever, not less. The more impersonal and templated average outreach becomes, the higher the payoff for something that visibly took real thought and effort - which argues for investing scarce creative energy on a small number of high-value targets rather than spreading it thin.`},
{p:'Frank Brothers', cat:'Mindset & Strategy', src:'How to Get a Meeting with Anyone', t:'Lead with value to their mission, not a pitch', b:`Reframe your role from "salesperson asking for time" to "outside contributor helping the target hit their own goals." Messages that open with insight, an unfair advantage, or a solution to a problem the recipient already has land far better than anything that reads as self-interested selling.`},


// ============ TARGETING & LIST BUILDING ============

{p:'Eric Nowoslawski', cat:'Targeting & List Building', src:'Top 10 Cold Email Tips That Give You an Unfair Advantage', t:'Don’t copy an "industry list" blindly - offer strength confounds it', b:`Data showed schools, restaurants, real estate brokerages, e-commerce, and SaaS as the best-responding industries - but this is skewed: the schools campaign had an unusually compelling angle (a mandatory government program schools needed help fulfilling) and the restaurant campaign had an unusually strong free offer. An "industry list" only performed because the offer for that niche happened to be exceptional, not because the industry itself is inherently responsive.`},
{p:'Eric Nowoslawski', cat:'Targeting & List Building', src:'Cold Email First Principles Thinking', t:'The 10-minute research rule for list fit', b:`Guiding question when building a list: if I personally had 10 minutes to research a company, what would I check to know they're a good fit, and what would I learn that tells me what to say to them? Good list-building systems are just automated versions of that manual 10-minute check - the design process starts with figuring out exactly what a human would look for. Avoid broad platform filters like "financial services and banking" that mix in unrelated fits (banks, wealth managers, fintechs, recruiters) - pull the closest self-reported categories, then run a cheap AI check against each company's actual description to confirm fit before including them.`},
{p:'Eric Nowoslawski', cat:'Targeting & List Building', src:'Cold Email First Principles Thinking', t:'Three ways to build a list: forward, backward, circular', b:`"Forward" means picking filters you assume are right (industry, title) and pulling/cleaning a list from a database like Apollo or Clay. "Backward" means starting from a company's own closed-won customers, enriching those accounts in Clay, and having AI extract the common industries, keywords, headcount, and location patterns so filters are based on real data instead of guesses - this is the preferred default, since it grounds targeting in real won-deal data. "Circular" means starting from a small seed list of confirmed good-fit companies, using a lookalike engine (Clay's lookalike builder, ocean.io/Disco, or Exa) plus a cheap reasoning model via OpenRouter to repeatedly find and validate similar companies in batches, stopping automatically once 10 batches in a row produce under 15% good fits.`},
{p:'Eric Nowoslawski', cat:'Targeting & List Building', src:"I sent 10,000,000 cold emails, here's what works in 2025", t:'Golden ICP layering (credit: Nikolai at Clay)', b:`Instead of one flat ICP definition, stack multiple qualifying layers and write conditional messaging for each combination in Clay - e.g. for an accounting offer: founders of small businesses, narrowed to those who never raised money, narrowed to those founded under 2 years ago, split by whether they've been a CEO before. Each layer combination gets its own message (message A when 4 criteria match, message B when 3 match, a generic fallback when only an email is confirmed) - this kind of nested conditional enrichment is really only practical inside Clay.`},
{p:'Eric Nowoslawski', cat:'Targeting & List Building', src:"I sent 10,000,000 cold emails, here's what works in 2025", t:'Triangulating employee headcount across sources', b:`LinkedIn gives two headcount signals: "associated members" (people who joined the company page, accurate for LinkedIn-heavy SaaS staff) and the self-reported size bracket (often stale, set once at page creation). For industries with weak LinkedIn presence (e.g. e-commerce), cross-check against another actively-maintained source like Glassdoor and use a Clay agent to reconcile the different numbers into a more reliable estimate.`},
{p:'Eric Nowoslawski', cat:'Targeting & List Building', src:"I sent 10,000,000 cold emails, here's what works in 2025", t:'Sourcing local leads and competitor footprints without LinkedIn', b:`For local businesses with little LinkedIn presence, use Clay's Google Maps scraper to pull businesses by keyword/geography, run a Clay agent to find the owner's name, then verify their email with a standard finder. To find a competitor's customers or tool usage, use footprint-detection tools: BuiltWith.com identifies installed technologies, and Clay's job-posting data source surfaces companies whose listings mention a specific tool by name (revealing tech-stack usage invisible on the public site).`},
{p:'Eric Nowoslawski', cat:'Targeting & List Building', src:'Focus on Offers Made To Convert Cold Traffic', t:'Stack low-level signals to find the "in-between" prospect', b:`Rather than targeting on a single attribute, combine two lower-level signals to find a precise segment - e.g. companies missing a DMARC record (a technical deliverability weakness) plus having SDRs on staff (proof they already run outbound). The overlap surfaces prospects actively sending cold email who likely don't realize their own setup is undermining it.`},
{p:'Eric Nowoslawski', cat:'Targeting & List Building', src:'Focus on Offers Made To Convert Cold Traffic', t:'Double-verify every lead as a standing rule', b:`Every lead gets double-verified before sending, as a standing rule rather than a one-off step, since weak data undermines both deliverability and the credibility of any personalization layered on top of it.`},
{p:'Eric Nowoslawski', cat:'Targeting & List Building', src:'Past Mistakes We Made w/ Email Personalizations', t:'Use raw scraped stats as filters, not as copy', b:`Scraped employee headcount growth (e.g. a team growing by a specific percentage over six months) sounded unnatural and got no lift when stated directly in an email. The fix: keep the growth percentage purely as a backend filter for building the list, and instead name the specific people or roles who actually joined recently in the copy itself.`},

{p:'Matt Lucero', cat:'Targeting & List Building', src:'START HERE: How to Run Cold Email for Any Business', t:'Find a new market by mirroring who already pays you', b:`The go-to method for entering an unfamiliar market: look at the demographic/vertical makeup of customers who have already paid you - e.g. if 80% of an ads agency's clients turn out to be e-commerce brands, target e-commerce brands rather than inventing a target. Picking an arbitrary, unvalidated niche (randomly deciding to target "dentists or chiropractors") stacks the risk of an unproven audience on top of the risk of a new channel. With zero customer history, use AI or study who competitors sell to, then test your top three candidate demographics as separate mini-campaigns.`},
{p:'Matt Lucero', cat:'Targeting & List Building', src:'START HERE: How to Run Cold Email for Any Business', t:'Two-step list validation: email exists, AND matches your criteria', b:`First, run the list through an email-validation tool to confirm addresses actually exist, including hard-to-validate "catch-all" domains. Second - separately - validate that the leads actually match your targeting criteria, since purchased/scraped lists are frequently miscategorized (e.g. buying a "dentist" list where only ~30% turn out to actually be dentists), which can quietly wreck a campaign's performance. Always randomize a purchased list before splitting it into segments or test groups - providers like Apollo front-load "better" leads at the top of an export, so an unshuffled split biases the comparison.`},
{p:'Matt Lucero', cat:'Targeting & List Building', src:'START HERE: How to Run Cold Email for Any Business', t:'"Small perfect" vs. "big sloppy" is a false binary', b:`A small, ultra-high-value list justifies a full account-based-marketing push - hit those few accounts hard across email, calls, and even gifts. But for a broad addressable market, a large list validated to roughly 98% accuracy ("big semi-perfect") lets you run quality and quantity simultaneously and typically performs well - you don't have to choose between the two extremes. At higher volume, lead sourcing itself becomes the bottleneck alongside deliverability, so diversify across multiple databases and scraping tools rather than relying on one list source.`},
{p:'Matt Lucero', cat:'Targeting & List Building', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'Sending 1,000/day doesn’t require 1,000 new people/day', b:`Because most campaigns run multi-email follow-up sequences, daily volume is spread across new and existing prospects. Rule of thumb: with a 4-email sequence sending 1,000/day, you only need about 250 net-new prospects per day (roughly 5,000/month) - the rest comes from follow-ups to people already in the pipeline.`},
{p:'Matt Lucero', cat:'Targeting & List Building', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'The core Apollo filter stack', b:`Filters used in nearly every list build: email status (verified + guest), job titles combined with a management/seniority filter (to layer in "director and above" without listing every title), location (contact HQ vs. account HQ, plus zip-radius for local campaigns), employee headcount, and industry + keyword combinations. Use quotes for exact-match terms (Apollo treats "CEO" as equivalent to "chief executive officer" automatically) and explicit exclusions (e.g. excluding "VP"/"Vice") to control precision. If you already know your ideal-fit companies, paste that list directly into the company filter rather than recreating the targeting through generic filters.`},
{p:'Matt Lucero', cat:'Targeting & List Building', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'Build lookalikes by reverse-engineering keywords from known-good accounts', b:`Start from a handful of companies you know are a great fit, check what industry/keyword tags the platform assigns them, then plug those same keywords into the Companies search to find similar accounts - a "guess and check" loop of narrowing or broadening keywords and checking the resulting list before pulling contacts. Don't trust one or two obvious keywords to define a niche (e.g. "managed IT" and "help desk" misses "cybersecurity," "compliance," "telecom") - build a longer list of related keywords from real examples in the niche first.`},
{p:'Matt Lucero', cat:'Targeting & List Building', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'Headcount beats revenue as a size-targeting proxy', b:`Revenue figures for private companies on data platforms are largely estimates and unreliable; employee headcount is sourced more reliably (mostly from LinkedIn self-reported data) and is a better proxy for company size - except in blue-collar industries where workers are less likely to be on LinkedIn at all.`},
{p:'Matt Lucero', cat:'Targeting & List Building', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:"Build your own intent signals instead of trusting a platform's score", b:`Native "buying intent" scoring on data platforms isn't worth paying for in his experience - source your own intent signals manually instead: whether a prospect follows a competitor, how many blog posts a company has published (SEO awareness proxy), job-posting filters for staffing-style offers, and funding filters for recently-funded companies with fresh budget. Always validate scraped emails before sending regardless of a platform's "verified" label - roughly 5-10% of "verified" emails still turn out invalid, so run every export through a dedicated validator (Million Verifier, NeverBounce, ZeroBounce) before uploading to a sender.`},
{p:'Matt Lucero', cat:'Targeting & List Building', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'Size your list to your volume, with room to recycle', b:`For a sustainable ~30 meetings/month cadence, aim for a minimum of about 10,000 contacts and ideally 30,000+, so there's enough runway to keep sending without exhausting the market and enough time separation before re-contacting the same leads. Let your addressable market size dictate follow-up sequence length: a large TAM favors one touch to more new people over many follow-ups to fewer (follow-ups show diminishing returns); a small TAM favors more follow-ups per person since you'll otherwise burn through the list too fast.`},
{p:'Matt Lucero', cat:'Targeting & List Building', src:'Video 1 (batch 3)', t:'Broad targeting is like using the same bait for every fish', b:`Grouping very different buyer personas under one filter and sending everyone the same generic message suppresses replies because the message can't resonate with all of them at once. A "CEO" at a 10-person company is hands-on and tactical, while a CEO at a 500-person company thinks in high-level strategy - same title, completely different pain points. "Healthcare" isn't one audience either: hospitals, clinics, optometrists, chiropractors, and dentists need fundamentally different messaging despite sharing an industry label. Segment tightly enough that each message is written for one coherent persona.`},
{p:'Matt Lucero', cat:'Targeting & List Building', src:'Video 1 & 2 (batch 3)', t:'The "10-lead gut check" exercise', b:`Pull up 10 random leads from your scraped list, read the exact email you're about to send, and honestly ask whether that specific person would reply to it. A concrete failure mode this catches: reaching out to a list you believe is "10,000 e-commerce stores" when roughly 30% actually aren't - which both kills relevance and triggers spam complaints from the mismatched leads.`},
{p:'Matt Lucero', cat:'Targeting & List Building', src:'Video 2 (batch 3)', t:'Build your persona from your last 5-10 closed deals, not guesses', b:`List the last 5-10 customers who actually paid you (not just people you talked to), and if you have recorded sales calls, listen back to why they bought and what objections came up - more reliable than assuming a persona abstractly, since founders often lose touch with the customer's perspective over time. Different buyers of the same offer often buy for different underlying reasons (e.g. predictable revenue, dissatisfaction with a past agency, deliverability frustration, time savings) - identify which reason actually dominates in your closed-deal history and let that data decide which vertical/segment to prioritize, rather than spreading messaging evenly across assumed segments.`},
{p:'Matt Lucero', cat:'Targeting & List Building', src:'Video 2 (batch 3)', t:'Segmented smaller lists can beat broad ones - there’s no fixed "right" size', b:`Campaigns of 200-500 highly segmented leads can outperform (on positive reply rate) campaigns of 5,000 generic leads, but a 50,000-lead single broad campaign can also hit 20-30% positive reply rate when the offer resonates widely. Rough rule of thumb if you need one number: 1,000-2,000 leads per campaign batch, but several small hyper-segmented campaigns beat one giant generic one if you have the time to run them.`},
{p:'Matt Lucero', cat:'Targeting & List Building', src:'Video 2 (batch 3)', t:'When the decision-maker is ambiguous, target multiple people and ask directly', b:`For roles where the "true" buyer varies company to company (e.g. is it the CTO or the team lead who owns the pain?), you can't know with certainty without inside information - plan to reach multiple likely titles at the same company, and it's fine to directly ask in the email whether the recipient is the right person to talk to.`, ex:`"wasn't sure if you're the right person to talk to about this"`},
{p:'Matt Lucero', cat:'Targeting & List Building', src:'Video 2 (batch 3)', t:'Niche and blue-collar sourcing needs different tools than standard B2B data', b:`Standard providers (Apollo, ZoomInfo, ListKit) scrape primarily from LinkedIn, which underrepresents blue-collar businesses like construction - use Google Maps-centric scraping tools instead (e.g. Outscraper, Clay's native Google Maps scraper) since local businesses are far more likely to have a Google Business listing than a LinkedIn presence. For unreliable niche roles, replicate Clay's "find people" function manually via Sales Navigator plus a dedicated LinkedIn scraper; for open-role hiring triggers, dedicated scrapers (e.g. "Lead Magic") find companies actively hiring a given title.`},

{p:'Frank Brothers', cat:'Targeting & List Building', src:'Frank Collective Outbound Lessons Doc', t:'Multi-thread openly, don’t hide it', b:`When you're unsure of the right contact, don't just guess quietly - explicitly tell the prospect you've also messaged one or two other named people at the account in parallel, and ask them to redirect you if they're not the right owner. This normalizes multi-threading instead of making it feel sneaky, and increases the odds someone in the thread responds.`},
{p:'Frank Brothers', cat:'Targeting & List Building', src:'Frank Collective Outbound Lessons Doc / 1M Frank eBook', t:'Trigger-based targeting: five categories of buying signals', b:`Build lists off specific behavioral/firmographic triggers rather than blanket-targeting a job title - each trigger doubles as both the reason the account made the list and the personalization hook in the message. Stack more than one signal per account rather than relying on just one. Five categories worth tracking: (1) Growth & funding - headcount growth, new funding, international expansion (via Sales Navigator, Clay, Keyplay, Crunchbase, PredictLeads, Pitchbook); (2) Technology & digital change - transformation initiatives, public complaints about legacy tools, site overhauls, AI/ML strategy announcements (via BuiltWith, Wayback Machine, G2, Trustpilot, Google Alerts); (3) Leadership & structural change - new C-suite hires (especially CTO/CIO), M&A, rebrands, new product lines, new partnerships, which reset incumbent vendor loyalty (via LinkedIn, PredictLeads, Crunchbase); (4) Risk & compliance - new regulation, a security incident, a bad earnings report, each forcing urgent reassessment (via LexisNexis/Thomson Reuters, security news, earnings transcripts); (5) Sentiment & competitive - negative reviews of a competitor, conference attendance/sponsorship, a visible marketing-strategy shift (via G2, Capterra, event sites).`},
{p:'Frank Brothers', cat:'Targeting & List Building', src:'Frank Collective Outbound Lessons Doc / 1M Frank eBook', t:'Mine job postings for pain points and hiring signals, not just headcount', b:`Rather than treating a job posting only as a "they're hiring" signal, scrape the actual job description text to extract specific pains and requirements - concrete, quotable language for outreach copy instead of a generic "noticed you're hiring" line. A conspicuously missing role on an otherwise built-out team (e.g. no SDRs on a sales team) is itself a genuine account-selection filter, not just a detail to mention - and scraping live postings for a role tied to your solution is one of the warmest possible intent signals, since it implies active budget and urgency around the exact problem you solve.`},
{p:'Frank Brothers', cat:'Targeting & List Building', src:'Frank Collective Outbound Lessons Doc', t:'Build lists from people already adjacent to the problem', b:`Scrape a competitor's LinkedIn followers (people who already know the category exists), scrape who is liking/commenting on posts relevant to your space, scrape which prospects a competitor's own SDRs are engaging with in the comments, and scrape attendee lists from relevant industry webinars/events. All four tactics build a list of people pre-warmed on the problem space before you ever contact them.`},
{p:'Frank Brothers', cat:'Targeting & List Building', src:'Frank Collective Outbound Lessons Doc', t:'Track job changes as a high-intent trigger', b:`Monitor when a champion, decision-maker, or end-user from an existing customer moves to a new company - that person already knows and likes your product, making them one of the highest-conversion re-engagement opportunities available, effectively a warm lead disguised as a cold one. Similarly, use lookalike-modeling tools to find companies structurally similar to your best existing customers, then pitch them referencing the matching case study directly - the similarity itself becomes the personalization hook.`},
{p:'Frank Brothers', cat:'Targeting & List Building', src:'1M Frank eBook', t:'Segment list strategy by company size band', b:`Different headcount bands call for different psychological approaches and template families: seed/Series A companies respond to agile, unconventional pitches; 100+ employee companies allow cross-departmental discussion; 200+ have defined direct-report structures worth referencing; 500+ enterprise calls for C-suite-appropriate plays. Decide which template family to use based on the size band a prospect falls into, not a one-size-fits-all script.`},
{p:'Frank Brothers', cat:'Targeting & List Building', src:'Unlocking Enterprise / The Secret to Close Outbound Sales Opportunities', t:'Target the role that owns the pain, not just a senior title', b:`Aim outreach at the specific function actually tied to the offer - HR/L&D leaders for apprenticeship funding, marketing directors for brand-building events, a public policy lead for regulatory-tracking software - rather than defaulting to the most senior title available. Role-to-offer fit matters more than seniority alone when choosing who to target inside a large org. For serious prospects, put a real ICP/data-sourcing plan into the sales proof itself (which accounts, sourced how) - it doubles as proof of operational rigor to the buyer, not just an internal targeting exercise.`},
{p:'Frank Brothers', cat:'Targeting & List Building', src:'Ultimate Guide to Clay / Whatsapp Outreach', t:'Use Clay to filter, score, and continuously monitor your list', b:`Filter raw prospect/company lists down using real firmographic and technographic data (industry, size, tech stack) so the list matches your ICP before any outreach is written - narrow to the right people first, then spend enrichment budget on them rather than enriching a broad unfiltered list. Score leads with enrichment signals (recent job changes, newly installed tools, keyword-based intent) to prioritize who's actually sales-ready right now, build lookalike/ABM lists from your existing customers as seed data, and monitor triggers (funding, job changes, tool installs, competitor/PR activity) continuously rather than only evaluating a list once at build time.`},
{p:'Frank Brothers', cat:'Targeting & List Building', src:'How to Get a Meeting with Anyone', t:'Work a small, curated "dream prospect" list, not a mass list', b:`Rather than blasting a broad audience, identify a short, deliberately capped list (a "Top 100") of accounts or individuals whose conversion would be disproportionately valuable, and invest outsized research and creative effort per contact. Treat the list as a living roster - prospects graduate off it once converted or deprioritized, and new high-value targets rotate in.`},


// ============ PERSONALIZATION & RESEARCH ============

{p:'Eric Nowoslawski', cat:'Personalization & Research', src:'Top 10 Cold Email Tips That Give You an Unfair Advantage', t:'Generic AI personalization now hurts more than it helps', b:`Formulaic AI-personalized openers like "I saw you sell to fitness coaches and wanted to reach out" were a staple in 2024-2025, but mid-2025 data showed campaigns using this generic pattern got 143% fewer replies than the rest of the campaign set. Surface-level "I noticed what you do" personalization has become a negative signal, not a positive one - personalization needs to go deeper.`},
{p:'Eric Nowoslawski', cat:'Personalization & Research', src:'I Tested 500,000 Cold Email, This Is The Best Campaign', t:'Have AI diagnose the prospect before writing any copy', b:`Before generating outreach copy, prompt AI to read the target company's own description/website and infer who their likely customers are and what they need - research first, copy generation second. The transferable mental model: imagine you spent 10 minutes actually researching a prospect, then ask what you'd learn and how that should change your specific message and offer angle. That mental model is what generalizes to any business, not any specific bullet-point format.`},
{p:'Eric Nowoslawski', cat:'Personalization & Research', src:'Cold Email First Principles Thinking', t:'The "creative ideas" campaign - effort signal beats wow factor', b:`Best-performing campaign format (run for ~3.5 years): AI generates three custom bullet points describing specific ways your offer could help the exact company you're emailing, using guardrails/templates for what each bullet should cover. It works less because it "wows" any single prospect and more because, relative to the flood of generic emails they receive, it visibly signals extra effort - a small application of reciprocity that nudges a reply.`},
{p:'Eric Nowoslawski', cat:'Personalization & Research', src:"I sent 10,000,000 cold emails, here's what works in 2025", t:'Layered research compounds response rate - with data', b:`For an e-commerce sustainability plugin: a fully generic blast got 1 positive reply per 650 contacts. Adding one personalized line referencing the specific sustainability goals published on the company's own website (found via Clay agent) improved it to 1 per 250. Attaching an actual screenshot of the page where those goals were found - visible proof the research was real - improved it again to 1 per 120. An embedded screenshot can ding deliverability slightly, but the reply-rate gain made it clearly worth it, since a domain getting flagged as spam is the real risk, not a marginally lower open rate.`},
{p:'Eric Nowoslawski', cat:'Personalization & Research', src:"I sent 10,000,000 cold emails, here's what works in 2025 / Focus on Offers Made To Convert Cold Traffic", t:'Reference a real, on-site case study, then pitch the improvement', b:`Use an AI agent to find a specific case study published on the target's own website, open by referencing that named case study and the result it produced, then pitch using a lookalike feature to find more customers matching the ones profiled in it. When this kind of factual, specific personalization lands, prospects respond with visible appreciation - thanking you for looking into their business or asking how you found it - and it consistently outperforms vaguer or invented detail.`, ex:`"saw that work you did with [case study] and wanted to connect"`},
{p:'Eric Nowoslawski', cat:'Personalization & Research', src:"I sent 10,000,000 cold emails, here's what works in 2025", t:'Deep, vertical-specific research beats broad signal-chasing', b:`Testing many signal-based angles for a product over a year and a half (large sales teams, founder-led sales, a new VP of sales, missing DMARC), the single best and most durable performer was simpler: analyze what the specific company does, generate three concrete ideas for how they could use the product right away, and ask if they want to try it. For a sales-tax compliance product, the highest-performing angle required researching exactly which of the ~47-48 tax-collecting states each prospect operated in, then either flagging missing states with an offer to fix the gap or complimenting full compliance and offering to take the ongoing burden off their plate.`},
{p:'Eric Nowoslawski', cat:'Personalization & Research', src:'Past Mistakes We Made w/ Email Personalizations', t:'Not all personalization has equal ROI - retire what doesn’t land', b:`An AI-generated company analogy added as a P.S. line, expected to add clarity or charm, never produced a measurable lift in positive replies - and no prospect ever commented on it, unlike real case-study references that regularly get called out by name. Rule of thumb: if a personalization tactic shows no reply-rate lift and no one ever mentions it, retire it, no matter how clever it feels to produce.`},
{p:'Eric Nowoslawski', cat:'Personalization & Research', src:'Past Mistakes We Made w/ Email Personalizations', t:'Cite your data source and add the math', b:`Early campaigns stated scraped or estimated numbers (e.g. a site-traffic figure) as flat fact with no attribution, which read as unnatural and looked bad whenever the estimate was off, since these tools are only directionally accurate. Naming the source explicitly shifts the risk of being wrong onto the tool rather than the sender, and pairing the number with a quick value calculation (what converting even a small percentage of that traffic would be worth per month) turns a raw data point into a value pitch instead of surveillance.`},
{p:'Eric Nowoslawski', cat:'Personalization & Research', src:'Past Mistakes We Made w/ Email Personalizations', t:'Test personalization mechanisms per niche - they don’t transfer automatically', b:`An automated Google-rank-tracking mechanism (checking whether a prospect ranked top 10/top 3 for relevant search terms) was built as a hook for SEO agencies and never worked, despite seeming clever - yet the identical "check their online presence" mechanism performed well when aimed at real estate agents instead. A personalization mechanism has to be validated per vertical, not assumed to transfer.`},

{p:'Matt Lucero', cat:'Personalization & Research', src:'START HERE: How to Run Cold Email for Any Business', t:'Treat "warm" opt-in leads like near-strangers by default', b:`For leads who filled out a form, downloaded a lead magnet, or signed up for a webinar, the safe default is to write as if they're closer to a cold stranger than a warm contact - plenty of people genuinely don't remember opting in and will say "I never did that." You can make the tone a little more casual than pure cold outreach, but don't lean on assumed familiarity. With older or blue-collar audiences who won't get on a Zoom call, the approach stays the same but the ask simplifies - often a plain "are you interested?" is enough, and many will just reply with their phone number for you to call.`},
{p:'Matt Lucero', cat:'Personalization & Research', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'Decide your personalization variables by hand before automating with AI', b:`Before building any AI enrichment, manually decide exactly what you'd personalize if writing the email yourself (someone's job function, their company name, a product they sell) and write out example "ideal outputs." Only after that should you build the AI workflow - automating personalization without a clear target output tends to produce inconsistent or off-brand results. Test any new AI enrichment prompt on roughly 10 rows first and review quality before triggering it across a full list of thousands, and stay skeptical of fully AI-written first lines or entire emails - in his experience the output isn't yet strong enough to match a well-considered manual value proposition.`},
{p:'Matt Lucero', cat:'Personalization & Research', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'Constrain AI enrichment tightly - narrow tasks, examples, explicit output-only', b:`Prefer narrowly-scoped AI tasks ("just output the cleaned-up job function") slotted into a fixed template you control, rather than letting AI freely write an entire personalized sentence. Give few-shot input to output examples (e.g. "Internal Revenue Service" to "IRS", "Josh's Roofing LLC" to "Josh's Roofing") rather than a vague instruction - more examples reliably improve consistency. Always add "only output X, nothing else" to enrichment prompts, since without it models add extra commentary that breaks a merge-field insert into a template.`},
{p:'Matt Lucero', cat:'Personalization & Research', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'Use AI to build branching, condition-based value propositions', b:`In one example (an offshore-staffing offer), AI detected three distinct account states - no offshore staff, offshore staff outside Eastern Europe, offshore staff already in Eastern Europe - and wrote a different opening line and sales angle for each: introducing a new idea, suggesting a better approach, or offering to build on what they're already doing. This produces far more relevant messaging than one generic template applied to everyone.`},
{p:'Matt Lucero', cat:'Personalization & Research', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'Pull real product/site data to personalize e-commerce outreach', b:`Feed a company's domain through a Google Shopping lookup to pull actual product names and prices, then use AI to turn a raw scraped title (e.g. "Barbell Apparel Large Athletic Fit Jeans") into a natural merge-field phrase ("athletic denim") for a line like the example below. For data with no ready-made lookup (a mission statement, an executive's name), an AI web-research agent can visit the site and fall back to a Google search to extract the answer.`, ex:`"I noticed you sell athletic denim - are you looking to sell more heading into Black Friday?"`},
{p:'Matt Lucero', cat:'Personalization & Research', src:'How To Generate Leads With Cold Email in 2026 (FULL COURSE)', t:'Validate niche fit with AI, and enrich at the company level first', b:`For narrow B2B niches a data platform can't filter precisely (e.g. "companies that implement HubSpot" vs. just companies mentioning it), run scraped companies through an AI classification step that visits the website and returns true/false on the actual criteria, filtering false matches before a list goes live. If a list has multiple contacts per company, run company-level lookups (like a mission-statement scrape) once at the company level rather than once per contact, to avoid paying to re-run the same lookup for every person at that company.`},
{p:'Matt Lucero', cat:'Personalization & Research', src:'Video 2 (batch 3)', t:'Prioritize "relevancy" over generic personalization', b:`The real 2026 buzzword is relevancy, not personalization - the strongest hooks are things like a prospect following a direct competitor, using a specific complementary/competing technology, or belonging to a vertical with a known specific pain point. Generic personalization (tenure at a company, a nearby restaurant) is comparatively weak. There's no universal personalization template - the best angle is always derived from what's actually specific to what you sell (a cold-email vendor should find people missing a DMARC record; a "lead-less" software vendor should find people using rival lead-less tools), not a copy-paste tactic that works for any product.`, ex:`"hey I saw you don't have a DMARC record, do you know what you're doing on outbound?"`},
{p:'Matt Lucero', cat:'Personalization & Research', src:'Video 2 (batch 3)', t:'Don’t force personalization tokens where a human wouldn’t naturally say them', b:`Inserting a company name unnaturally (e.g. "your team over at [Company] LLC") reads worse than the more natural human phrasing without it. His team has actually removed personalization fields from live campaigns because they sounded too forced - forced tokens also create more room for embarrassing merge-field errors.`},

{p:'Frank Brothers', cat:'Personalization & Research', src:'Frank Collective Outbound Lessons Doc / 55 Cold Email Copywriting Cheat Codes', t:'Make personalization sound like a human wrote it, not a dossier readout', b:`A casual, slightly imprecise reference to someone's role reads as more genuine than a fully correct formal title pulled straight from LinkedIn - phrase what you found the way a colleague would mention it in conversation, not the way a CRM field would render it. An overly formal, full-title reference reads like a mail-merge tag and instantly signals automated outreach.`, ex:`"Hi Penn, saw you head up SO" rather than "Hi Penn, saw you're the Chief Executive Officer at StackOptimise Ltd"`},
{p:'Frank Brothers', cat:'Personalization & Research', src:'Frank Collective Outbound Lessons Doc / 55 Cold Email Copywriting Cheat Codes', t:'Never repeat a personalization point, and never reuse phrasing across accounts', b:`Repetition is the single biggest tell that an email is templated - mentioning the recipient's company name more than once, or restating the same personalized detail in different words, breaks the illusion of a one-to-one message. Every email's surrounding phrasing must also be uniquely generated per prospect - don't reuse generic intros or boilerplate connective tissue across accounts, since templated phrasing is exactly what an experienced reader pattern-matches as "mass email," even when the personalization token itself is accurate.`},
{p:'Frank Brothers', cat:'Personalization & Research', src:'Frank Collective Outbound Lessons Doc', t:'Use a metaphor drawn from their own business', b:`Build the value-proposition metaphor out of something specific to the prospect's own company or industry rather than a generic analogy - it signals you actually looked at what they do and makes the pitch feel custom-built for them.`, ex:`"Our buyer journeys flow as naturally as your recommendation engine" (when targeting Netflix)`},
{p:'Frank Brothers', cat:'Personalization & Research', src:'Frank Collective Outbound Lessons Doc / 55 Cold Email Copywriting Cheat Codes', t:'Target the felt pain, not the abstract problem', b:`Get specific about the prospect's personally-felt, day-to-day pain rather than the company-level abstraction a case study would cite. The pain is what they experience directly and therefore what resonates; the "problem" is a boardroom-level statistic that feels distant.`, ex:`Pain: "our outbound isn't generating positive replies because our messaging isn't landing." Problem: "poor sales."`},
{p:'Frank Brothers', cat:'Personalization & Research', src:'Frank Collective Outbound Lessons Doc', t:'Downplay saturated triggers instead of announcing them', b:`Common triggers like a fundraise or an SDR job posting are now so overused that calling them out directly ("Congrats on the fundraise!") reads as generic and try-hard. Frame the same trigger as an offhand, secondary observation instead of the headline of the email.`, ex:`"Flagged this after seeing your product launch yesterday"`},
{p:'Frank Brothers', cat:'Personalization & Research', src:'Frank Collective Outbound Lessons Doc', t:'Show your specific, tailored idea, not just intent to help', b:`Rather than vaguely offering to help, do a small piece of visible, prospect-specific research and present it as a concrete idea - e.g. using an AI research agent to visit the prospect's actual website and name three specific things you'd improve. This proves the personalization is real rather than templated. Two more research-driven openers in the same spirit: name the prospect's actual top two competitors and ask if they're thinking about differentiation, or quote a specific glowing customer review by name and ask if they're focused on keeping reviews like that coming - both use publicly visible, verifiable detail rather than a generic compliment.`},
