<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creative Outbound</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
  :root{
    --paper:#FFFFFF; --paper-raised:#FFFFFF;
    --ink:#14181B; --ink-soft:#5B6560; --ink-faint:#8A938D;
    --stamp:#1E6B45; --stamp-ink:#FFFFFF;
    --mimeo:#2F8F5B; --mimeo-ink:#E6F4EC;
    --line:#E4E9E6; --line-strong:#CCD5D0;
    --warn:#B4691A;
    --shadow: 0 1px 0 rgba(20,24,27,.03), 0 8px 20px -12px rgba(20,24,27,.14);
    --radius: 8px;
    --topbar:#231F2E;
    --font-display: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);}
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--mimeo); color:var(--mimeo-ink);}
  .topbar-accent{height:4px; background:var(--topbar);}

  /* ---------- launcher ---------- */
  #sprintLauncher{
    min-height:calc(100vh - 4px); display:flex; flex-direction:column; align-items:center;
    padding:56px 24px 80px;
  }
  .launcher-inner{width:100%; max-width:980px;}
  .launcher-header{text-align:center; margin-bottom:40px;}
  .launcher-header .back-link{
    display:inline-flex; align-items:center; gap:6px; color:var(--ink-soft); font-size:13px; font-weight:600;
    text-decoration:none; margin-bottom:22px; transition:color .15s ease;
  }
  .launcher-header .back-link:hover{color:var(--stamp);}
  .launcher-title{
    font-family:var(--font-display); font-weight:700; font-size:32px; letter-spacing:-.01em;
    margin:0 0 10px; color:var(--ink); display:flex; align-items:center; justify-content:center; gap:12px;
  }
  .launcher-title .logo-mark{
    display:flex; align-items:center; justify-content:center; width:38px; height:38px;
    font-family:var(--font-display); font-weight:700; font-size:14px;
  }
  .launcher-title .logo-mark img{width:100%; height:100%; object-fit:contain; display:block;}
  .launcher-subhead{font-size:15px; color:var(--ink-soft); margin:0;}
  .launcher-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; margin-top:32px;
  }
  .launcher-card{
    position:relative; background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:20px 18px; cursor:pointer; text-align:left;
    transition:box-shadow .18s ease, border-color .18s ease, transform .18s ease;
    display:flex; flex-direction:column; min-height:132px;
  }
  .launcher-card:hover{border-color:var(--stamp); box-shadow:var(--shadow); transform:translateY(-2px);}
  .launcher-card.new{
    align-items:center; justify-content:center; text-align:center; border-style:dashed; border-color:var(--line-strong);
    background:var(--mimeo-ink); gap:10px;
  }
  .launcher-card.new:hover{border-color:var(--stamp);}
  .launcher-card.new .plus{
    width:38px; height:38px; border-radius:50%; background:var(--stamp); color:var(--stamp-ink);
    display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:700; line-height:1;
  }
  .launcher-card.new .label{font-family:var(--font-display); font-weight:700; font-size:14px; color:var(--ink);}
  .launcher-card .lc-name{
    font-family:var(--font-display); font-weight:700; font-size:15px; color:var(--ink); margin:0 0 4px;
    padding-right:56px; overflow-wrap:break-word;
  }
  .launcher-card .lc-meta{font-size:12px; color:var(--ink-faint); margin:0 0 12px;}
  .launcher-card .lc-actions{position:absolute; top:10px; right:10px; display:flex; gap:4px;}
  .launcher-card .lc-icon-btn{
    width:24px; height:24px; border-radius:6px; border:none;
    background:transparent; color:var(--ink-faint); cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:background-color .15s ease, color .15s ease;
  }
  .launcher-card .lc-icon-btn:hover{background:var(--mimeo-ink); color:var(--stamp);}
  .launcher-card .lc-delete:hover{background:#FBEEE0; color:var(--warn);}
  .launcher-card .lc-icon-btn svg{width:14px; height:14px;}
  .launcher-empty{
    grid-column:1/-1; text-align:center; padding:32px 16px; color:var(--ink-faint); font-size:13px;
  }

  /* ---------- confirm / prompt dialog ---------- */
  .confirm-overlay{
    display:none; position:fixed; inset:0; background:rgba(20,24,27,.5); z-index:300;
    align-items:center; justify-content:center; padding:26px;
  }
  .confirm-overlay.open{display:flex;}
  .confirm-box{
    --accent: var(--warn);
    background:var(--paper-raised); border-radius:14px; width:100%; max-width:400px;
    box-shadow:0 24px 60px -20px rgba(0,0,0,.45); border-top:4px solid var(--accent);
    padding:22px 24px 20px; animation:confirmIn .15s ease;
  }
  @keyframes confirmIn{ from{opacity:0; transform:translateY(6px) scale(.98);} to{opacity:1; transform:none;} }
  .confirm-icon{
    width:38px; height:38px; border-radius:10px; margin-bottom:12px;
    background:#FBEEE1; color:var(--accent); display:flex; align-items:center; justify-content:center;
  }
  .confirm-icon.prompt-icon{background:var(--mimeo-ink); color:var(--stamp);}
  .confirm-icon svg{width:16px; height:16px;}
  .confirm-title{font-family:var(--font-display); font-weight:800; font-size:16.5px; color:var(--ink); margin:0 0 6px;}
  .confirm-detail{font-size:13px; line-height:1.5; color:var(--ink-soft); margin:0;}
  .confirm-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:20px;}
  .btn{
    font-family:var(--font-display); font-weight:700; letter-spacing:0;
    font-size:12.5px; padding:8px 14px; border-radius:999px; cursor:pointer; border:1px solid var(--line);
    background:var(--paper-raised); color:var(--ink);
  }
  .btn:hover{border-color:var(--line-strong);}
  .btn.primary{background:var(--stamp); color:var(--stamp-ink); border-color:var(--stamp);}
  .btn.primary:hover{filter:brightness(1.06);}
  .btn.danger{background:var(--warn); color:#fff; border-color:var(--warn);}
  .btn.danger:hover{filter:brightness(1.06);}
  .btn.ghost{background:transparent;}
  .prompt-field-label{
    display:block; font-family:var(--font-display); font-weight:700; text-transform:uppercase;
    letter-spacing:.05em; font-size:10.5px; color:var(--ink-faint); margin:14px 0 7px;
  }
  .prompt-input{
    width:100%; box-sizing:border-box; border:1.5px solid var(--line-strong); border-radius:9px;
    background:var(--paper); color:var(--ink); font-family:var(--font-body); font-size:14px;
    padding:10px 12px; transition:border-color .15s ease, box-shadow .15s ease, background-color .15s ease;
  }
  .prompt-input:focus{outline:none; border-color:var(--mimeo); background:var(--paper-raised); box-shadow:0 0 0 3px rgba(47,143,91,.15);}
</style>
</head>
<body>
<div class="topbar-accent"></div>

<div id="sprintLauncher">
  <div class="launcher-inner">
    <div class="launcher-header">
      <h1 class="launcher-title"><span class="logo-mark"><img src="brand-logo.png" alt="Lincko"></span>Creative Outbound</h1>
      <p class="launcher-subhead">Start a Creative Outbound Sprint</p>
    </div>
    <div class="launcher-grid" id="sprintGrid"></div>
  </div>
</div>

<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box" id="confirmBox"></div>
</div>

<div class="confirm-overlay" id="promptOverlay" role="dialog" aria-modal="true" aria-labelledby="promptTitle">
  <form class="confirm-box" id="promptForm" novalidate>
    <div class="confirm-icon prompt-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
    </div>
    <h3 class="confirm-title" id="promptTitle">Name This Sprint</h3>
    <p class="confirm-detail" id="promptMessage"></p>
    <label class="prompt-field-label" for="promptInput" id="promptFieldLabel">Sprint name</label>
    <input type="text" class="prompt-input" id="promptInput" placeholder="e.g. Q1 Whale Push" autocomplete="off" maxlength="60">
    <div class="confirm-actions">
      <button type="button" class="btn ghost" id="promptCancelBtn">Cancel</button>
      <button type="submit" class="btn primary" id="promptOkBtn">Create</button>
    </div>
  </form>
</div>

<script>
const STORAGE_KEY = 'lincko_sprints';
function loadSprints(){ try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }catch(e){ return []; } }
function persistSprints(list){ localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDate(ts){ try{ return new Date(ts).toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'}); }catch(e){ return ''; } }
function uid(){ return 'sprint_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }

const TRASH_ICON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>';
const PENCIL_ICON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>';

let sprints = loadSprints();

function goToSprint(id){
  localStorage.setItem('lincko_active_sprint', id);
  window.location.href = 'index.html?sprint=' + encodeURIComponent(id);
}

function renderGrid(){
  const grid = document.getElementById('sprintGrid');
  const sorted = sprints.slice().sort((a,b)=> (b.updatedAt||0) - (a.updatedAt||0));
  let html = '<button type="button" class="launcher-card new" id="createSprintBtn"><span class="plus">+</span><span class="label">Create New Sprint</span></button>';
  if(!sorted.length){
    html += '<div class="launcher-empty">No sprints yet - create your first one to get started.</div>';
  } else {
    sorted.forEach(rec=>{
      html += '<div class="launcher-card" data-sprint-id="' + rec.id + '">' +
        '<div class="lc-actions">' +
          '<button type="button" class="lc-icon-btn lc-rename" data-rename-id="' + rec.id + '" title="Rename this sprint" aria-label="Rename">' + PENCIL_ICON_SVG + '</button>' +
          '<button type="button" class="lc-icon-btn lc-delete" data-delete-id="' + rec.id + '" title="Delete this sprint" aria-label="Delete">' + TRASH_ICON_SVG + '</button>' +
        '</div>' +
        '<h3 class="lc-name">' + esc(rec.name) + '</h3>' +
        '<p class="lc-meta">Updated ' + fmtDate(rec.updatedAt) + '</p>' +
        '</div>';
    });
  }
  grid.innerHTML = html;

  document.getElementById('createSprintBtn').addEventListener('click', async ()=>{
    const name = await showPrompt({
      title:'Name This Sprint',
      message:'What should we call this creative outbound sprint? You can rename it later.',
      fieldLabel:'Sprint name',
      placeholder:'e.g. Q1 Whale Push',
      confirmLabel:'Create',
    });
    if(name === null) return;
    const rec = { id: uid(), name: name.trim() || 'Untitled Sprint', createdAt: Date.now(), updatedAt: Date.now() };
    sprints.push(rec);
    persistSprints(sprints);
    goToSprint(rec.id);
  });

  grid.querySelectorAll('.launcher-card[data-sprint-id]').forEach(card=>{
    card.addEventListener('click', (e)=>{
      if(e.target.closest('.lc-icon-btn')) return;
      goToSprint(card.getAttribute('data-sprint-id'));
    });
  });
  grid.querySelectorAll('.lc-delete').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); deleteSprint(btn.getAttribute('data-delete-id')); });
  });
  grid.querySelectorAll('.lc-rename').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); renameSprint(btn.getAttribute('data-rename-id')); });
  });
}

async function deleteSprint(id){
  const rec = sprints.find(s=> s.id === id);
  if(!rec) return;
  const ok = await showConfirm('Delete this sprint?', {
    detail:'"' + rec.name + '" will be permanently deleted. This cannot be undone.',
    confirmLabel:'Delete', danger:true,
  });
  if(!ok) return;
  sprints = sprints.filter(s=> s.id !== id);
  persistSprints(sprints);
  renderGrid();
}

async function renameSprint(id){
  const rec = sprints.find(s=> s.id === id);
  if(!rec) return;
  const name = await showPrompt({
    title:'Rename Sprint',
    fieldLabel:'Sprint name',
    placeholder:'e.g. Q1 Whale Push',
    confirmLabel:'Save',
    value: rec.name || '',
  });
  if(name === null) return;
  rec.name = name.trim() || rec.name;
  rec.updatedAt = Date.now();
  persistSprints(sprints);
  renderGrid();
}

/* ---------- confirm dialog ---------- */
const CONFIRM_ICON = '<svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 1.5 15 13.5H1z" stroke-linejoin="round"/><path d="M8 6v3.2M8 11.4h.01" stroke-linecap="round"/></svg>';
function showConfirm(title, opts){
  opts = opts || {};
  return new Promise(resolve=>{
    const overlay = document.getElementById('confirmOverlay');
    const box = document.getElementById('confirmBox');
    box.innerHTML = `
      <span class="confirm-icon">${CONFIRM_ICON}</span>
      <div class="confirm-title">${esc(title)}</div>
      ${opts.detail?`<p class="confirm-detail">${esc(opts.detail)}</p>`:''}
      <div class="confirm-actions">
        <button class="btn ghost" id="confirmCancelBtn">${esc(opts.cancelLabel||'Cancel')}</button>
        <button class="btn ${opts.danger?'danger':'primary'}" id="confirmOkBtn">${esc(opts.confirmLabel||'OK')}</button>
      </div>`;
    overlay.classList.add('open');
    document.getElementById('confirmOkBtn').focus();
    function onKey(e){ if(e.key==='Escape') finish(false); if(e.key==='Enter') finish(true); }
    function onBgClick(e){ if(e.target===overlay) finish(false); }
    function finish(result){
      overlay.classList.remove('open');
      document.removeEventListener('keydown', onKey);
      overlay.removeEventListener('click', onBgClick);
      resolve(result);
    }
    document.addEventListener('keydown', onKey);
    overlay.addEventListener('click', onBgClick);
    document.getElementById('confirmCancelBtn').addEventListener('click', ()=> finish(false));
    document.getElementById('confirmOkBtn').addEventListener('click', ()=> finish(true));
  });
}

/* ---------- prompt dialog ---------- */
let _promptResolve = null;
function showPrompt({title='Add New Item', message='', fieldLabel='Name', placeholder='', confirmLabel='Add', cancelLabel='Cancel', value=''} = {}){
  return new Promise((resolve)=>{
    _promptResolve = resolve;
    document.getElementById('promptTitle').textContent = title;
    document.getElementById('promptMessage').textContent = message;
    document.getElementById('promptMessage').style.display = message ? '' : 'none';
    document.getElementById('promptFieldLabel').textContent = fieldLabel;
    document.getElementById('promptOkBtn').textContent = confirmLabel;
    document.getElementById('promptCancelBtn').textContent = cancelLabel;
    const input = document.getElementById('promptInput');
    input.placeholder = placeholder;
    input.value = value;
    document.getElementById('promptOverlay').classList.add('open');
    requestAnimationFrame(()=>{ input.focus(); input.select(); });
  });
}
function closePrompt(result){
  const overlay = document.getElementById('promptOverlay');
  if(!overlay.classList.contains('open')) return;
  overlay.classList.remove('open');
  if(_promptResolve){ _promptResolve(result); _promptResolve = null; }
}
document.getElementById('promptForm').addEventListener('submit', (e)=>{
  e.preventDefault();
  closePrompt(document.getElementById('promptInput').value);
});
document.getElementById('promptCancelBtn').addEventListener('click', ()=> closePrompt(null));
document.getElementById('promptOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'promptOverlay') closePrompt(null);
});

renderGrid();
</script>
</body>
</html>
